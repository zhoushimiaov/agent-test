<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
/* ============================================================
 * SHT-TMD · Part 1 · 参数 / 物理 / 风荷载 / 时间线
 * 2-DOF: 塔一阶模态 q1 + TMD 绝对位移 x2, RK4 定步长 1/240 s
 * ============================================================ */
'use strict';

const CFG = {
  H: 632,             // 塔总高 m
  hallFloor: 583,     // 阻尼器大厅楼面标高 m
  hallR: 17.5,        // 大厅半径 (Ø35 m)
  hallH: 23,          // 大厅净高 m
  strokeLim: 2.0,     // 质量块行程极限 ±2 m
  Lcable: 21.5,       // 锚环到质量块顶面 visual
  DT: 1 / 240,
};

/* ---------------- 参数表（面板可直接改写） ---------------- */
const P = {
  // 风荷载
  Famp: 1.5e6,        // N  简谐风力幅值（塔顶等效）
  fwind: 0.150,       // Hz 风频率
  lockF: true,        // 风频锁定塔楼基频
  gustOn: false,
  gustInt: 0.35,      // 阵流强度 0-1
  // 塔楼
  m1: 9.85e7,         // kg 一阶模态质量
  f1: 0.150,          // Hz 基频
  z1: 0.020,          // 结构阻尼比（含非结构与附加阻尼贡献）
  // 阻尼器
  mu: 0.010,          // 质量比 m2/m1
  f2r: 1.000,         // 调谐比 f2/f1
  z2: 0.062,          // 电涡流阻尼比
  lockMass: false,    // 锁定质量块（失效模拟）
  // 剖面
  sectionOn: false,
  sectionAz: 210,     // deg 剖切方位角
  sectionOf: 0,       // m 剖切偏移
  sectionPin: false,  // 用户手动固定剖切状态
  // 显示
  ampV: 160,          // 位移视觉放大倍数
  timeScale: 1.0,
  trailOn: true,
  camMode: 'AUTO',    // AUTO|A|B|C|D
  artOn: true,        // 艺术陈设（慧眼+底座）
  frameOn: true,      // 金色门架
};

/* ---------------- 时间线：30 s 五阶段循环 ---------------- */
const TL = { T: 30 };
function timeline(t) {
  // 返回 {env, vWind, detune, phase}
  const u = t % TL.T;
  let env = 1, vw = 25, detune = 1, phase = 1;
  if      (u < 4)  { phase = 1; const k = u / 4;        env = 0.02 + 0.30 * k * k;      vw = 6 + 12 * k; }
  else if (u < 10) { phase = 2; const k = (u - 4) / 6;  env = 0.30 + 0.70 * k;          vw = 18 + 10 * k; }
  else if (u < 16) { phase = 3; const k = (u - 10) / 6; env = 1.00 + 0.15 * k;          vw = 28 + 4 * k; }
  else if (u < 24) { phase = 4; const k = (u - 16) / 8; env = 1.15 + 0.60 * k;          vw = 32 + 10 * k; }
  else             { phase = 5; const k = (u - 24) / 6; env = 1.75 - 0.35 * k;          vw = 42 - 4 * k; detune = 1 - 0.15 * k; }
  return { env, vWind: vw, detune, phase };
}

/* ---------------- 风荷载 ---------------- */
const Wind = {
  phase: 0,          // 涡脱/简谐相位 — 预积分，风速波动不跳变
  gust: 0, detune: 1, env: 0, vWind: 0,
  F: 0,              // 当前风力 N
  update(dt, t) {
    const tl = timeline(t);
    const f = P.lockF ? P.f1 : P.fwind;
    this.phase += 2 * Math.PI * f * dt;              // ∫2πf dτ
    let F = P.Famp * tl.env * Math.sin(this.phase);
    if (P.gustOn) {                                   // OU 阵风
      const tau = 2.0, s = P.gustInt * 0.5;
      this.gust += (-this.gust / tau) * dt + s * Math.sqrt(dt) * (Math.random() * 2 - 1) * 3;
      F += P.Famp * tl.env * this.gust;
    }
    this.F = F; this.env = tl.env; this.vWind = tl.vWind; this.detune = tl.detune; this.phase5 = tl.phase;
    return F;
  },
  reset() { this.phase = 0; this.gust = 0; }
};

/* ---------------- 2-DOF 物理 ---------------- */
const Phy = {
  s:  new Float64Array(4),   // [q1, dq1, x2, dx2]（x2 为绝对位移）
  s0: new Float64Array(4),   // 无 TMD 对照
  t: 0, hitFlash: 0,
  rmsQ: [], rmsQ0: [],        // 滚动窗 (t, q, q0)

  derivs(st, F) {
    const m1 = P.m1, om1 = 2 * Math.PI * P.f1;
    const k1 = m1 * om1 * om1, c1 = 2 * P.z1 * m1 * om1;
    const m2 = P.m1 * P.mu, om2 = 2 * Math.PI * P.f1 * P.f2r * (Wind.detune || 1);
    const k2 = m2 * om2 * om2, c2 = 2 * P.z2 * m2 * om2;
    const q1 = st[0], dq1 = st[1], x2 = st[2], dx2 = st[3];
    // 锁定质量块 = 刚性并入塔身: 单自由度 (m1+m2), 物理上 TMD 失效
    if (P.lockMass) {
      const a = (F - c1 * dq1 - k1 * q1) / (m1 + m2);
      return [dq1, a, dq1, a];
    }
    const d2 = [dq1, 0, dx2, 0];
    d2[1] = (F + c2 * (dx2 - dq1) + k2 * (x2 - q1) - c1 * dq1 - k1 * q1) / m1;
    d2[3] = (-c2 * (dx2 - dq1) - k2 * (x2 - q1)) / m2;
    return d2;
  },
  derivs0(st, F) {
    const m1 = P.m1, om1 = 2 * Math.PI * P.f1;
    const k1 = m1 * om1 * om1, c1 = 2 * P.z1 * m1 * om1;
    return [st[1], (F - c1 * st[1] - k1 * st[0]) / m1];
  },

  step(dtSim) {
    let n = Math.round(dtSim / CFG.DT);
    for (let i = 0; i < n; i++) {
      const F = Wind.update(CFG.DT, this.t);
      // --- RK4 主系统 ---
      const s = this.s;
      const a1 = this.derivs(s, F);
      const t2 = s.map((v, j) => v + a1[j] * CFG.DT / 2);
      const a2 = this.derivs(t2, F);
      const t3 = s.map((v, j) => v + a2[j] * CFG.DT / 2);
      const a3 = this.derivs(t3, F);
      const t4 = s.map((v, j) => v + a3[j] * CFG.DT);
      const a4 = this.derivs(t4, F);
      for (let j = 0; j < 4; j++) s[j] += CFG.DT / 6 * (a1[j] + 2 * a2[j] + 2 * a3[j] + a4[j]);
      // --- 行程限位 ±2 m：物理止挡 + 回弹 ---
      const sm = s[2] - s[0];
      if (Math.abs(sm) > CFG.strokeLim) {
        const sgn = Math.sign(sm);
        s[2] = s[0] + sgn * CFG.strokeLim;
        const rel = s[3] - s[1];
        s[3] = s[1] - 0.30 * rel;                    // 限位缓冲器回弹
        this.hitFlash = 1;
      }
      // --- 锁定质量块（失效模拟）---
      if (P.lockMass) { s[2] = s[0]; s[3] = s[1]; }
      // --- 无 TMD 对照 RK4 ---
      const r = this.s0;
      const b1 = this.derivs0(r, F);
      const r2 = [r[0] + b1[0] * CFG.DT / 2, r[1] + b1[1] * CFG.DT / 2];
      const b2 = this.derivs0(r2, F);
      const r3 = [r[0] + b2[0] * CFG.DT / 2, r[1] + b2[1] * CFG.DT / 2];
      const b3 = this.derivs0(r3, F);
      const r4 = [r[0] + b3[0] * CFG.DT, r[1] + b3[1] * CFG.DT];
      const b4 = this.derivs0(r4, F);
      r[0] += CFG.DT / 6 * (b1[0] + 2 * b2[0] + 2 * b3[0] + b4[0]);
      r[1] += CFG.DT / 6 * (b1[1] + 2 * b2[1] + 2 * b3[1] + b4[1]);
      this.t += CFG.DT;
    }
    // 滚动 RMS 窗（6 s）
    this.rmsQ.push([this.t, this.s[0], this.s0[0]]);
    while (this.rmsQ.length && this.rmsQ[0][0] < this.t - 6) this.rmsQ.shift();
  },

  reduction() {
    let a = 0, b = 0, n = 0;
    for (const it of this.rmsQ) { a += it[1] * it[1]; b += it[2] * it[2]; n++; }
    if (n < 60 || b < 1e-9) return null;
    return (1 - Math.sqrt(a / b)) * 100;
  },
  eddyPower() {  // kW
    const om2 = 2 * Math.PI * P.f1 * P.f2r;
    const c2 = 2 * P.z2 * P.m1 * P.mu * om2;
    const v = Math.abs(this.s[3] - this.s[1]);
    return c2 * v * v / 1000;
  },
};

/* __PART1_END__ */

/* ============================================================
 * SHT-TMD · Part 2 · 场景 / 几何 / 城市 / 阻尼器舱
 * 坐标: X=东, Y=高, Z=南; 塔立于原点, 黄浦江在 -X 侧环抱
 * ============================================================ */

const V3 = (x,y,z)=>new THREE.Vector3(x,y,z);
const COL = {
  bg:0xf2f3f5, ground:0xeceeef, water:0xb9d9ec, road:0xd8dbdd, roadMain:0xd0d4d7,
  skin:0xe4eef2, core:0xdadcd8, band:0xf7f8f9, plaza:0xe9eaeb, green:0xcfe3c8,
  gold:0xd4af37, copper:0xb0793f, bronze:0x8a5a2b, jade:0xd9e7dc,
  red:0xc23b2e, redDark:0x8f2418, purple:0x6a4fb0, blue:0x2c4a7c, greyBeam:0x9aa0a6,
};

let renderer, scene, camera;
const BEND = { value: 0 };          // 塔身弯曲量(视觉 m) = q1·amp
const clipPlane = new THREE.Plane(V3(0,0,0), 0);   // 零法线 = 不剖切(保留全部); 避免阴影通道读 null.length
const clipMats = [];

/* ---------- 小工具 ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function mergeGeoms(geoms){
  let pos=[], nor=[], uv=[];
  for(const g of geoms){
    const ng = g.index ? g.toNonIndexed() : g;
    const p=ng.attributes.position, n=ng.attributes.normal, u=ng.attributes.uv;
    for(let i=0;i<p.count*3;i++) pos.push(p.array[i]);
    if(n) for(let i=0;i<n.count*3;i++) nor.push(n.array[i]); else for(let i=0;i<p.count*3;i++) nor.push(0,1,0);
    if(u) for(let i=0;i<u.count*2;i++) uv.push(u.array[i]); else for(let i=0;i<p.count;i++) uv.push(0,0);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  return g;
}
function bendMat(m, opt={}){
  m.onBeforeCompile = (sh)=>{
    sh.uniforms.uBend = BEND;
    sh.vertexShader = 'uniform float uBend;\n' + sh.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\n transformed.x += uBend * pow( max(position.y,0.0)/632.0, 1.7 );');
  };
  if(opt.clip){ m.clippingPlanes=[clipPlane]; m.clipShadows=true; clipMats.push(m); }
  return m;
}
function setClip(on){
  // r128 阴影通道会读 clippingPlanes.length, 数组必须常驻; 用零法线平面表示"全保留"
  if(on){
    const az = P.sectionAz * Math.PI/180;
    clipPlane.normal.set(-Math.cos(az), 0, -Math.sin(az));
    clipPlane.constant = P.sectionOf;
  }else{
    clipPlane.normal.set(0,0,0);
    clipPlane.constant = 0;
  }
}

/* ---------- 塔身参数化截面 ----------
 * 圆角三角: 超椭圆 n≈2.55; a(z) 随高度收分; twist(z)=120°·z/H */
const SECT_N = 2.55;
function aOf(z){  // 半宽 m
  const t = Math.min(Math.max(z/632,0),1);
  return 42 - 20*Math.pow(t, 0.85);   // 42 → 22
}
function twistOf(z){ return 120 * (z/632) * Math.PI/180; }
function secPt(u, z, scale, out){
  const a = aOf(z)*scale;
  const c=Math.cos(u), s=Math.sin(u);
  const px = Math.sign(c)*Math.pow(Math.abs(c), 2/SECT_N)*a;
  const pz = Math.sign(s)*Math.pow(Math.abs(s), 2/SECT_N)*a*0.92;
  const tw = twistOf(z), ct=Math.cos(tw), st=Math.sin(tw);
  out.x = px*ct - pz*st; out.z = px*st + pz*ct;
  out.y = z; return out;
}
function skinGeo(z0, z1, nH, nR, scale, closeTop){
  const pos=[], idx=[], uv=[]; const tmp={x:0,y:0,z:0};
  for(let i=0;i<=nH;i++){
    const z = z0 + (z1-z0)*i/nH;
    for(let j=0;j<=nR;j++){
      const u = j/nR*Math.PI*2;
      secPt(u, z, scale, tmp); pos.push(tmp.x, tmp.y, tmp.z); uv.push(j/nR*8, i/nH*30);
    }
  }
  for(let i=0;i<nH;i++) for(let j=0;j<nR;j++){
    const a=i*(nR+1)+j, b=a+nR+1;
    idx.push(a,b,a+1, b,b+1,a+1);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
function ringPts(z, scale, nR){
  const arr=[]; const tmp={x:0,y:0,z:0};
  for(let j=0;j<=nR;j++){ secPt(j/nR*Math.PI*2, z, scale, tmp); arr.push(V3(tmp.x,tmp.y,tmp.z)); }
  return arr;
}

/* ---------- 场景基座 ---------- */
const world = { tower:null, hall:null, pend:null, machine:null, art:null, trail:null, windPts:null, dustPts:null, glow:null, dampers:[], cables:[], city:{}, waterMesh:null };

/* ---------- 地面 / 江 / 路 / 绿地 ---------- */
const riverPath = [
  [-560,-2100],[-660,-1300],[-700,-750],[-680,-320],[-600,60],[-520,520],[-460,1200],[-430,2100]
];
const RIVER_W = 440;
function distToRiver(x,z){
  let d=1e9;
  for(let i=0;i<riverPath.length-1;i++){
    const [x1,z1]=riverPath[i],[x2,z2]=riverPath[i+1];
    const dx=x2-x1,dz=z2-z1, L2=dx*dx+dz*dz;
    let t=((x-x1)*dx+(z-z1)*dz)/L2; t=Math.max(0,Math.min(1,t));
    const px=x1+t*dx-x, pz=z1+t*dz-z; d=Math.min(d, Math.hypot(px,pz));
  }
  return d - RIVER_W/2;   // >0 在岸上
}
const roads = [
  {pts:[[-470,148],[1500,148]], w:74, c:COL.roadMain},          // 世纪大道
  {pts:[[-300,-260],[220,-260],[320,-160],[320,180],[220,290],[-300,290],[-400,180],[-400,-160],[-300,-260]], w:44, c:COL.road}, // 陆家嘴环路
  {pts:[[-180,-140],[-180,660]], w:36, c:COL.road},               // 滨江支路(示意)
];
function distToRoads(x,z){
  let d=1e9;
  for(const r of roads){
    for(let i=0;i<r.pts.length-1;i++){
      const [x1,z1]=r.pts[i],[x2,z2]=r.pts[i+1];
      const dx=x2-x1,dz=z2-z1,L2=dx*dx+dz*dz;
      let t=((x-x1)*dx+(z-z1)*dz)/L2; t=Math.max(0,Math.min(1,t));
      const px=x1+t*dx-x, pz=z1+t*dz-z; d=Math.min(d, Math.hypot(px,pz)-r.w/2);
    }
  }
  return d;
}

function initGround(){
  const g = new THREE.Mesh(new THREE.PlaneGeometry(9000,9000),
    new THREE.MeshLambertMaterial({color:COL.ground}));
  g.rotation.x=-Math.PI/2; g.receiveShadow=true; scene.add(g);

  // 黄浦江 — 平滑中心线 + 定宽条带
  const ctr=[]; for(const p of riverPath) ctr.push(V3(p[0],0,p[1]));
  const curve = new THREE.CatmullRomCurve3(ctr);
  const NS=140, pos=[], idx=[];
  for(let i=0;i<=NS;i++){
    const t=i/NS, p=curve.getPoint(t), tg=curve.getTangent(t);
    const nx=-tg.z, nz=tg.x, L=Math.hypot(nx,nz);
    pos.push(p.x+nx/L*RIVER_W/2, 0.22, p.z+nz/L*RIVER_W/2);
    pos.push(p.x-nx/L*RIVER_W/2, 0.22, p.z-nz/L*RIVER_W/2);
  }
  for(let i=0;i<NS;i++){ const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  const wg=new THREE.BufferGeometry();
  wg.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  wg.setIndex(idx); wg.computeVertexNormals();
  const water = new THREE.Mesh(wg, new THREE.MeshBasicMaterial({color:COL.water, polygonOffset:true, polygonOffsetFactor:-2}));
  scene.add(water); world.waterMesh=water;

  // 道路条带
  for(const r of roads){
    const pos2=[], idx2=[];
    for(let i=0;i<r.pts.length-1;i++){
      const [x1,z1]=r.pts[i],[x2,z2]=r.pts[i+1];
      const dx=x2-x1,dz=z2-z1,L=Math.hypot(dx,dz), nx=-dz/L,nz=dx/L;
      pos2.push(x1+nx*r.w/2,0.14,z1+nz*r.w/2, x1-nx*r.w/2,0.14,z1-nz*r.w/2,
                x2+nx*r.w/2,0.14,z2+nz*r.w/2, x2-nx*r.w/2,0.14,z2-nz*r.w/2);
      const b=pos2.length/3-4; idx2.push(b,b+2,b+1, b+1,b+2,b+3);
    }
    const rg=new THREE.BufferGeometry();
    rg.setAttribute('position', new THREE.Float32BufferAttribute(pos2,3));
    rg.setIndex(idx2); rg.computeVertexNormals();
    const rm=new THREE.Mesh(rg,new THREE.MeshLambertMaterial({color:r.c, polygonOffset:true, polygonOffsetFactor:-1}));
    rm.receiveShadow=true; scene.add(rm);
  }

  // 陆家嘴绿地
  const gr = new THREE.Mesh(new THREE.CircleGeometry(1,48), new THREE.MeshLambertMaterial({color:COL.green}));
  gr.scale.set(170,1,120); gr.rotation.x=-Math.PI/2; gr.position.set(-30,0.1,30); gr.receiveShadow=true; scene.add(gr);

  // 塔前小广场
  const pl = new THREE.Mesh(new THREE.CircleGeometry(105,64), new THREE.MeshLambertMaterial({color:COL.plaza}));
  pl.rotation.x=-Math.PI/2; pl.position.y=0.12; pl.receiveShadow=true; scene.add(pl);
}

    set.forEach((b,i)=>{ M.makeScale(b.w,b.h,b.d); M.setPosition(b.x,b.h/2,b.z); im.setMatrixAt(i,M); });
    im.castShadow=im.receiveShadow=true; scene.add(im);
  }
  world.city.blocks=blocks; world.city.puxi=puxi;
}
/* SWFC 辅助: 收分棱台 */
function skinFrustrum(w0,d0,w1,d1,h){
  const pos=[],idx=[]; const lv=[[w0/2,d0/2],[w1/2,d1/2]];
  for(let i=0;i<2;i++) for(const sx of[-1,1]) for(const sz of[-1,1]) pos.push(sx*lv[i][0], i*h, sz*lv[i][1]);
  idx.push(0,1,2, 2,1,3, 4,6,5, 5,6,7, 0,4,1, 1,4,5, 2,3,6, 3,7,6, 0,2,4, 2,6,4, 1,5,3, 3,5,7);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals(); return g;
}
/* SWFC 上段侧壁: 带内缘斜切(梯形洞)与外肩削角 */
function chamferSlab(w0,d0,w1,d1, depth, y0,y1, side){
  // 侧壁矩形截面: x∈[side·(outer0→1)], 内缘随高度外倾成梯形洞
  const pos=[], g=new THREE.BufferGeometry();
  const t0=w0/2, t1=w1/2, in0=t0-13, in1=t1-6;  // 内缘(洞边)
  function quad(a,b,c,d){ pos.push(...a,...b,...c, ...a,...c,...d); }
  const s=side;
  quad([s*t0,y0,-d0/2],[s*t0,y0,d0/2],[s*t0,y1,d1/2],[s*t0,y1,-d1/2]);   // 外面
  quad([s*in0,y0,-d0/2+3],[s*in0,y0,d0/2-3],[s*in1,y1,d1/2-2],[s*in1,y1,-d1/2+2]); // 洞面
  quad([s*t0,y0,-d0/2],[s*in0,y0,-d0/2+3],[s*in1,y1,-d1/2+2],[s*t0,y1,-d1/2]); // 侧面
  quad([s*in0,y0,d0/2-3],[s*t0,y0,d0/2],[s*t0,y1,d1/2],[s*in1,y1,d1/2-2]);   // 侧面
  quad([s*t0,y0,-d0/2],[s*t0,y0,d0/2],[s*in0,y0,-d0/2+3],[s*in0,y0,d0/2-3]); // 底
  quad([s*t0,y1,-d1/2],[s*in1,y1,-d1/2+2],[s*in1,y1,d1/2-2],[s*t0,y1,d1/2]); // 顶(削肩)
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:0xdfe3e6})); m.castShadow=true; return m;
}

 * 塔楼 / 塔冠 / 阻尼器大厅 / 装置

function initTower(){
  world.tower = new THREE.Group(); scene.add(world.tower);
  const T = world.tower;

  /* -- 外表皮 0..632 玻璃半透 -- */
  const skinMat = bendMat(new THREE.MeshPhongMaterial({
    color:COL.skin, transparent:true, opacity:0.40, shininess:70, specular:0x99aabb,
    side:THREE.DoubleSide, depthWrite:false }), {clip:true});
  const skin = new THREE.Mesh(skinGeo(0, 632, 150, 96, 1.0), skinMat);
  skin.renderOrder=3; skin.castShadow=true; T.add(skin);

  /* -- 内层核心筒 圆柱 -- */
  const coreMat = bendMat(new THREE.MeshLambertMaterial({color:COL.core}));
  const core = new THREE.Mesh(new THREE.CylinderGeometry(12.5, 16.5, 576, 48, 1, true), coreMat);
  core.position.y=288; core.castShadow=true; T.add(core);

  /* -- 楼层板(可见内部楼层) -- */
  const fl=[];
  for(let f=1; f<=19; f++){
    const z=f*30;
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(1,1,1.6,3), new THREE.MeshLambertMaterial({color:0xe4e6e3}));
    // 超椭圆截面拉伸省略 — 用三棱柱近似: 顶点直接取截面
    fl.push(triPrism(z, 0.94));
  }
  const floors = new THREE.Mesh(mergeGeoms(fl), bendMat(new THREE.MeshLambertMaterial({color:0xe6e8e5})));
  floors.castShadow=true; T.add(floors);

  /* -- 层间带 每~14层 -- */
  const bands=[];
  for(let z=52; z<560; z+=52){
    bands.push(skinGeo(z, z+4.5, 1, 96, 1.012));
  }
  const bandMesh = new THREE.Mesh(mergeGeoms(bands), bendMat(new THREE.MeshLambertMaterial({color:COL.band, side:THREE.DoubleSide})));
  bandMesh.castShadow=true; T.add(bandMesh);

  /* -- 塔冠格栅 576..632: 同一截面公式, ~6 道竖向分格 + 环向带, 0.93 内缩不越出表皮 -- */
  const fins=[];
  for(let k=0;k<6;k++){
    // 每道竖向分格由 3 根细杆组成一组, 共 6 组
    for(let sub=-1; sub<=1; sub++){
      const u=(k/6 + sub*0.012)*Math.PI*2;
      const pts=[]; const tmp={x:0,y:0,z:0};
      for(let i=0;i<=16;i++){
        const z=576+ (626-576)*i/16;
        secPt(u, z, 0.93, tmp); pts.push(V3(tmp.x,tmp.y,tmp.z));
      }
      fins.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, 0.38, 4, false));
    }
  }
  const finMesh = new THREE.Mesh(mergeGeoms(fins), bendMat(new THREE.MeshLambertMaterial({color:0xe8eaec})));
  finMesh.castShadow=true; T.add(finMesh);

  const crownRings=[];
  for(let z=580; z<=626; z+=7.5) crownRings.push(contourTube(z, 0.93, 0.20));
  const crMesh = new THREE.Mesh(mergeGeoms(crownRings), bendMat(new THREE.MeshLambertMaterial({color:0xedeef0})));
  T.add(crMesh);

  /* 顶部收口 — 金色三角曲线环 */
  const topRing = new THREE.Mesh(contourTube(630.5, 1.0, 0.55), bendMat(new THREE.MeshStandardMaterial({color:COL.gold, metalness:1, roughness:0.3, emissive:0x2a1f05})));
  T.add(topRing);

  /* 塔冠内锥(收尖) */
  const apex = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 9, 54, 24), bendMat(new THREE.MeshLambertMaterial({color:0xdfe2e4})));
  apex.position.y=576+27; T.add(apex);
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.9,20,10), bendMat(new THREE.MeshLambertMaterial({color:0xc9cdd0})));
  mast.position.y=626; T.add(mast);
}
function triPrism(z, scale){
  const pos=[], idx=[]; const tmp={x:0,y:0,z:0};
  for(let j=0;j<=96;j++){ secPt(j/96*Math.PI*2, z, scale, tmp); pos.push(tmp.x, z, tmp.z); pos.push(tmp.x, z+1.8, tmp.z); }
  for(let j=0;j<96;j++){ const a=j*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals(); return g;
}
function contourTube(z, scale, r){
  const pts = ringPts(z, scale, 128);
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true), 220, r, 5, true);
}

/* ---------- 阻尼器大厅 + 穹顶 + 内部 ---------- */
function initHall(){
  const T=world.tower;
  const y0=583, H=23, R=17.5;

  /* 壳体(可剖切) */
  const shellMat = bendMat(new THREE.MeshPhongMaterial({color:0xf0f2f4, transparent:true, opacity:0.5, side:THREE.DoubleSide, depthWrite:false}), {clip:true});
  const shell = new THREE.Mesh(new THREE.CylinderGeometry(R,R,H,72,1,true), shellMat);
  shell.position.y=y0+H/2; shell.renderOrder=4; T.add(shell);

  /* 楼板: 黑大理石环形(中孔Ø13) */
  const floorG = new THREE.RingGeometry(6.5, R, 96);
  const floorM = bendMat(new THREE.MeshStandardMaterial({color:0x17181a, metalness:0.35, roughness:0.18}), {clip:true});
  const floor = new THREE.Mesh(floorG, floorM);
  floor.rotation.x=-Math.PI/2; floor.position.y=y0+0.06; T.add(floor);

  /* 同心金环 */
  const goldR=[];
  for(let r=8; r<=17; r+=1.8){
    const t=new THREE.TorusGeometry(r, 0.05, 4, 96); t.rotateX(Math.PI/2); t.translate(0,y0+0.09,0); goldR.push(t);
  }
  const goldRingM = new THREE.Mesh(mergeGeoms(goldR), bendMat(new THREE.MeshStandardMaterial({color:COL.gold, metalness:1, roughness:0.35})));
  T.add(goldRingM);

  /* 井筒内壁(楼板下 10 m) */
  const pit = new THREE.Mesh(new THREE.CylinderGeometry(6.6,6.6,10.4,48,1,true), bendMat(new THREE.MeshLambertMaterial({color:0x2a2c2e, side:THREE.BackSide})));
  pit.position.y=y0-5.1; T.add(pit);

  /* 穹顶: 64 圈铜环带 + 3 道螺旋铜条 */
  const domeR=[];
  for(let k=1;k<=64;k++){
    const h=H*Math.pow(k/64, 1.12);
    const r=2 + 15.5*Math.pow(1-Math.pow(h/H,1.35), 1.1);
    const t=new THREE.TorusGeometry(r, 0.10, 5, 110); t.rotateX(Math.PI/2); t.translate(0,y0+h,0); domeR.push(t);
  }
  for(let s=0;s<3;s++){
    const pts=[];
    for(let i=0;i<=200;i++){
      const h=H*i/200, r=2+15.5*Math.pow(1-Math.pow(h/H,1.35),1.1);
      const a=s*Math.PI*2/3 + h/H*Math.PI*2*4.5;
      pts.push(V3(Math.cos(a)*r, y0+h, Math.sin(a)*r));
    }
    domeR.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 240, 0.14, 4, false));
  }
  const dome = new THREE.Mesh(mergeGeoms(domeR), bendMat(new THREE.MeshStandardMaterial({color:COL.copper, metalness:0.92, roughness:0.38, emissive:0x33200d}), {clip:true}));
  dome.castShadow=false; T.add(dome);

  /* 天窗环(金) + 井壁 */
  const oculus = new THREE.Mesh(new THREE.TorusGeometry(2.05,0.18,6,48), bendMat(new THREE.MeshStandardMaterial({color:COL.gold, metalness:1, roughness:0.3})));
  oculus.rotation.x=Math.PI/2; oculus.position.y=y0+H+0.15; T.add(oculus);

  /* 4 根古铜斜弯柱 */
  for(let k=0;k<4;k++){
    const a=k*Math.PI/2 + Math.PI/4;
    const p0=V3(Math.cos(a)*15.8, y0, Math.sin(a)*15.8);
    const p1=V3(Math.cos(a)*13.5, y0+8.5, Math.sin(a)*13.5);
    const p2=V3(Math.cos(a)*8.2, y0+14.5, Math.sin(a)*8.2);
    const col=new THREE.Mesh(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(p0,p1,p2), 24, 0.55, 8), bendMat(new THREE.MeshStandardMaterial({color:COL.bronze, metalness:0.85, roughness:0.45}), {clip:true}));
    col.castShadow=true; T.add(col);
  }

  /* 光柱 + 悬浮光尘 */
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(2.3,5.2,H-2,36,1,true),
    new THREE.MeshBasicMaterial({color:0xfff4dc, transparent:true, opacity:0.10, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
  beam.position.y=y0+H/2; T.add(beam); world.lightBeam=beam;
  const dustN=90, dp=new Float32Array(dustN*3);
  for(let i=0;i<dustN;i++){ const r=Math.sqrt(Math.random())*4.6, a=Math.random()*Math.PI*2;
    dp[i*3]=Math.cos(a)*r; dp[i*3+1]=y0+2+Math.random()*(H-4); dp[i*3+2]=Math.sin(a)*r; }
  const dg=new THREE.BufferGeometry(); dg.setAttribute('position', new THREE.BufferAttribute(dp,3));
  world.dustPts=new THREE.Points(dg, new THREE.PointsMaterial({color:0xffe9c4, size:0.5, transparent:true, opacity:0.85, blending:THREE.AdditiveBlending, depthWrite:false}));
  T.add(world.dustPts);
}

/* ---------- 摆式装置: 质量块 + 钢索 + 门架 + 斜撑(机械组)
 *            慧眼雕塑 + 鎏金底座(艺术组) ---------- */
function initPendulum(){
  world.pend = new THREE.Group(); world.tower.add(world.pend);
  const MK=new THREE.Group(), ART=new THREE.Group();      // 机械 / 艺术
  world.pend.add(MK); world.pend.add(ART); world.machine=MK; world.art=ART;
  const yBlockTop=590.5, yBlockBot=yBlockTop-8.1, yAnchor=615.5; /* 25 m cables from crown anchor */

  /* 质量块(红) + 竖向肋 */
  const blk=[];
  blk.push(new THREE.BoxGeometry(5.2,8.1,3.6));
  for(let k=0;k<4;k++){
    const x=-1.95+k*1.3;
    blk.push(new THREE.BoxGeometry(0.22,8.0,0.14).translate(x,0,1.86));
    blk.push(new THREE.BoxGeometry(0.22,8.0,0.14).translate(x,0,-1.86));
  }
  const block=new THREE.Mesh(mergeGeoms(blk), new THREE.MeshStandardMaterial({color:COL.red, metalness:0.35, roughness:0.5}));
  block.position.y=(yBlockTop+yBlockBot)/2; block.castShadow=true; MK.add(block);
  world.blockRef=block;

  /* 12 根钢索: 锚环(r=5.2, y=606) → 块顶(r=2.5) */
  const cableG=new THREE.CylinderGeometry(0.055,0.055,1,6);
  const cableM=new THREE.MeshStandardMaterial({color:0xb8bcc2, metalness:0.9, roughness:0.35});
  const CG=new THREE.Group(); world.pend.add(CG); world.cableG=CG;   // 钢索常显(艺术模式下亦可见)
  world.cables=[]; world.yAnchor=yAnchor; world.yBlockTop=yBlockTop;
  for(let k=0;k<12;k++){
    const a=k/12*Math.PI*2;
    const c=new THREE.Mesh(cableG,cableM);
    world.cables.push({m:c, a0:a, r0:5.2, r1:2.5}); CG.add(c);
  }

  /* 顶部双主梁(灰, 固定于塔体 → 放 tower 而非 pend) */
  const beamM=bendMat(new THREE.MeshStandardMaterial({color:COL.greyBeam, metalness:0.7, roughness:0.4}));
  for(const off of [-2.6,2.6]){
    const b=new THREE.Mesh(new THREE.BoxGeometry(30,1.5,1.2), beamM);
    b.position.set(0,614.7,off); b.castShadow=true; world.tower.add(b);
  }
  /* 锚环 */
  const anchor=new THREE.Mesh(new THREE.TorusGeometry(5.2,0.16,6,48), beamM);
  anchor.rotation.x=Math.PI/2; anchor.position.y=yAnchor-0.3; world.tower.add(anchor);

  /* 金色梯形门架(可隐藏) */
  const gate=new THREE.Group();
  const gM=new THREE.MeshStandardMaterial({color:COL.gold, metalness:1, roughness:0.32});
  for(const sx of[-1,1]) for(const sz of[-1,1]){
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.30,17,8), gM);
    leg.position.set(sx*5.0, 592.5, sz*3.4);
    leg.rotation.z=-sx*0.16; leg.rotation.x=sz*0.14;
    leg.castShadow=true; gate.add(leg);
  }
  const ring1=new THREE.Mesh(new THREE.TorusGeometry(5.6,0.2,6,4), gM); ring1.rotation.x=Math.PI/2; ring1.rotation.z=Math.PI/4; ring1.position.y=601.0; gate.add(ring1);
  world.gate=gate; MK.add(gate);

  /* 底部 4 斜撑阻尼器(紫/深蓝): 块底四角 → 楼面锚点 */
  world.dampers=[];
  const cylOut=new THREE.CylinderGeometry(0.30,0.30,1,10), cylIn=new THREE.CylinderGeometry(0.16,0.16,1,8);
  const mo=new THREE.MeshStandardMaterial({color:COL.purple, metalness:0.5, roughness:0.4});
  const mi=new THREE.MeshStandardMaterial({color:COL.blue, metalness:0.6, roughness:0.3});
  for(const sx of[-1,1]) for(const sz of[-1,1]){
    const o=new THREE.Mesh(cylOut,mo), inn=new THREE.Mesh(cylIn,mi);
    MK.add(o); MK.add(inn);
    world.dampers.push({o,inn, a:V3(sx*2.2,yBlockBot+0.5,sz*1.6), b:V3(sx*5.6,y0Floor(),sz*4.2)});
  }
  /* 楼面锚固件 + 永磁体阵列(固定于塔) */
  const magMat=new THREE.MeshStandardMaterial({color:0x4a4f66, metalness:0.8, roughness:0.3});
  const mags=[];
  for(let k=0;k<24;k++){
    const a=k/24*Math.PI*2, r=5.4+ (k%2)*0.9;
    mags.push(new THREE.CylinderGeometry(0.42,0.42,1.1,10).translate(Math.cos(a)*r, 573.6, Math.sin(a)*r));
  }
  const magM=new THREE.Mesh(mergeGeoms(mags), bendMat(magMat)); world.tower.add(magM);
  /* 随摆铜板 + 涡流辉光(常显: 能耗机制不随展示模式隐藏) */
  const EG=new THREE.Group(); world.pend.add(EG); world.eddyG=EG;
  const plate=new THREE.Mesh(new THREE.CylinderGeometry(3.3,3.3,0.25,32), new THREE.MeshStandardMaterial({color:COL.copper, metalness:0.95, roughness:0.3}));
  plate.position.y=574.4; EG.add(plate);
  const glowTex = makeGlowTex();
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex, color:0xffb347, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false}));
  glow.scale.set(16,10,1); glow.position.y=574.2; EG.add(glow); world.glow=glow;

  /* ---- 艺术组: 鎏金水波纹底座 + 叠片玉眼 ---- */
  /* Ø9.1 m 纯铜鎏金水波纹底座 */
  const pedG=new THREE.CylinderGeometry(4.55,4.75,1.15,96,6,false);
  {
    const p=pedG.attributes.position;
    for(let i=0;i<p.count;i++){
      const x=p.getX(i), z=p.getZ(i), r=Math.hypot(x,z), y=p.getY(i);
      if(y>0.05) p.setY(i, y + 0.11*Math.sin(r*6.2-1.4)*(1-r/4.85)*Math.max(0,y/0.6));
    }
    pedG.computeVertexNormals();
  }
  const ped=new THREE.Mesh(pedG, new THREE.MeshStandardMaterial({color:COL.gold, metalness:1, roughness:0.22, emissive:0x2a1a04, emissiveIntensity:0.15}));
  ped.position.y=581.2; ped.castShadow=true; ART.add(ped);
  // 底座同心金环嵌缝
  for(let rr of [1.6,2.6,3.6]){
    const tg=new THREE.TorusGeometry(rr,0.035,4,64); tg.rotateX(Math.PI/2);
    const tr=new THREE.Mesh(tg, new THREE.MeshStandardMaterial({color:0xc9a227, metalness:1, roughness:0.3}));
    tr.position.y=581.8; ART.add(tr);
  }

  /* 上海慧眼: 三面对称 · 7 片同心渐变眼眶沿纵深叠成隧道状玉眼
   * 温润半透琉璃玉 + 珍珠母贝虹彩; 绝非瞳孔眼球/发光球/旋转三面体 */
  const eyeRoot = new THREE.Group(); eyeRoot.position.set(0, 585.4, 0); ART.add(eyeRoot);
  const jadeTints=[0xdcebe0,0xd8e6df,0xe0e8e4,0xd6e2dc,0xe4ebe6,0xd9e4de,0xe2eae5];
  const sz=[1.00,0.92,0.82,0.70,0.56,0.40,0.24];
  for(let face=0; face<3; face++){
    const faceG = new THREE.Group();
    faceG.rotation.y = face * Math.PI * 2 / 3;
    for(let k=0;k<7;k++){
      const w=1.945*sz[k], h=3.85*sz[k];
      const shape=eyeShape(w,h);
      const hole=eyeShape(w*0.55,h*0.55); shape.holes.push(hole);
      const g=new THREE.ExtrudeGeometry(shape,{depth:0.14,bevelEnabled:true,bevelThickness:0.04,bevelSize:0.04,bevelSegments:3});
      // 折皱肌理 + 玉片拼缝: 轻微顶点扰动
      const pa=g.attributes.position;
      for(let i=0;i<pa.count;i++){
        const x=pa.getX(i), y=pa.getY(i);
        pa.setX(i, x + 0.012*Math.sin(y*4.2+face)*Math.cos(x*3.1));
        pa.setY(i, y + 0.010*Math.sin(x*5.1+k));
      }
      g.computeVertexNormals();
      const m=new THREE.MeshPhysicalMaterial({
        color:jadeTints[k], metalness:0.08, roughness:0.28,
        transparent:true, opacity:0.78 - k*0.04,
        transmission:0.18, thickness:0.6,
        clearcoat:0.55, clearcoatRoughness:0.25,
        sheen:0.6, sheenColor:new THREE.Color(0xf0e8d8), sheenRoughness:0.4,
        emissive:0x152018, emissiveIntensity:0.35,
        side:THREE.DoubleSide,
      });
      const mesh=new THREE.Mesh(g,m); mesh.castShadow=true;
      mesh.position.set(0, 0, 0.35 + k*0.52);   // 纵深叠片隧道
      faceG.add(mesh);
    }
    eyeRoot.add(faceG);
  }
  world.artRot=eyeRoot;  // 仅随质量块摆动, 不自旋

  /* 轨迹 */
  const tg=new THREE.BufferGeometry();
  tg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(300*3),3));
  world.trail=new THREE.Line(tg, new THREE.LineBasicMaterial({color:0x8fd0ff, transparent:true, opacity:0.7}));
  world.trail.frustumCulled=false; world.tower.add(world.trail);
  world.trailPts=0; world.strokePeak=0;
}
function y0Floor(){ return 573.0; }
function eyeShape(w,h){
  const s=new THREE.Shape();
  s.moveTo(-w,0);
  s.bezierCurveTo(-w*0.55, h, w*0.55, h, w, 0);
  s.bezierCurveTo(w*0.55,-h, -w*0.55,-h, -w, 0);
  return s;
}
function makeGlowTex(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d'); const gr=g.createRadialGradient(64,64,4,64,64,62);
  gr.addColorStop(0,'rgba(255,200,120,0.9)'); gr.addColorStop(0.4,'rgba(255,170,80,0.35)'); gr.addColorStop(1,'rgba(255,150,60,0)');
  g.fillStyle=gr; g.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c); return t;
}

/* ---------- HUD ---------- */
const $ = id=>document.getElementById(id);
const histQ = [];      // [t, q1, q0] 每 0.1 s
function fmt(n,d){ return n.toFixed(d); }
let hudAcc=0;
function updateHUD(dt){
  hudAcc+=dt; if(hudAcc<0.1) return; hudAcc=0;
  const q1=Phy.s[0], s=Phy.s[2]-Phy.s[0];
  $('vTop').textContent = fmt(Math.abs(q1*1000),1);
  let pk=0; for(const it of Phy.rmsQ){ pk=Math.max(pk, Math.abs(it[1]-0)); }
  // 摆幅: 行程 3 s 峰值
  let sw=0; const tNow=Phy.t;
  for(let i=Phy.rmsQ.length-1;i>=0;i--){ if(tNow-Phy.rmsQ[i][0]>3) break; sw=Math.max(sw, Math.abs(Phy.rmsQ[i][1])); }
  // 注: rmsQ 存 q1; 行程峰另算
  sw = world.strokePeak||0;
  $('vAmp').textContent = fmt(sw,2);
  const rd=Phy.reduction();
  $('vRed').textContent = rd===null?'—':fmt(rd,1);
  $('vWnd').textContent = fmt(Wind.vWind,1);
  $('vPwr').textContent = fmt(Phy.eddyPower(),0);
  $('vStr').textContent = (s>=0?'+':'')+fmt(s,2);
  const f = $('strokeFill');
  const pct = Math.max(-50, Math.min(50, s/CFG.strokeLim*50));
  if(pct>=0){ f.style.left='50%'; f.style.width=pct+'%'; }
  else { f.style.left=(50+pct)+'%'; f.style.width=(-pct)+'%'; }
  drawChart(); drawAttitude();
}
function drawChart(){
  const cv=$('chartT'), g=cv.getContext('2d');
  g.clearRect(0,0,cv.width,cv.height);
  const t1=Phy.t, t0=t1-22;
  const arr=histQ.filter(it=>it[0]>=t0);
  if(arr.length<4) return;
  let mx=0.05; for(const it of arr) mx=Math.max(mx, Math.abs(it[1]), Math.abs(it[2]));
  const X=t=>(t-t0)/22*(cv.width-8)+4, Y=v=>cv.height/2 - v/mx*(cv.height/2-6);
  g.strokeStyle='rgba(255,255,255,0.22)'; g.beginPath(); g.moveTo(4,cv.height/2); g.lineTo(cv.width-4,cv.height/2); g.stroke();
  g.lineWidth=1.2; g.strokeStyle='rgba(255,140,120,0.75)'; g.beginPath();
  arr.forEach((it,i)=>{ const x=X(it[0]),y=Y(it[2]); i?g.lineTo(x,y):g.moveTo(x,y); }); g.stroke();
  g.strokeStyle='#7cc8ff'; g.beginPath();
  arr.forEach((it,i)=>{ const x=X(it[0]),y=Y(it[1]); i?g.lineTo(x,y):g.moveTo(x,y); }); g.stroke();
  g.fillStyle='rgba(255,255,255,0.45)'; g.font='9px Consolas';
  g.fillText('±'+mx.toFixed(2)+' m', 6, 10);
}
function drawAttitude(){
  const cv=$('attCv'), g=cv.getContext('2d');
  g.clearRect(0,0,cv.width,cv.height);
  const q1=Phy.s[0], s=Phy.s[2]-Phy.s[0], A=P.ampV;
  g.strokeStyle='rgba(60,70,80,0.9)'; g.lineWidth=2;
  g.beginPath();
  for(let i=0;i<=20;i++){
    const y=176-i*8, x=48 + Math.pow(i/20,1.7)*q1*A*0.09;   // 0.09: 面板内比例
    i?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.stroke();
  const tipX = 48 + q1*A*0.09, mX = tipX + s*0.09*Math.pow(1,1);
  const mY=176-20*8*0.925;
  g.fillStyle='#7cc8ff'; g.beginPath(); g.arc(48+Math.pow(0.925,1.7)*q1*A*0.09 + s*0.09, mY, 4, 0, Math.PI*2); g.fill();
  g.fillStyle='rgba(60,70,80,0.65)'; g.fillRect(30,176,36,2);
}

  {key:'m1', lb:'一阶模态质量', min:5e7, max:2e8, step:5e6, fmt:v=>(v/1e6).toFixed(0)+'e6',
   tip:'<b>一阶模态质量</b>：塔楼第一振型广义质量（kg），上海中心约 9.9×10⁷ kg。改变它会同时改变 TMD 质量块（μ·m₁）。<em>敏感性：中</em>。'},
  {key:'f1', lb:'基频 f₁', min:0.10, max:0.20, step:0.001, fmt:v=>v.toFixed(3)+' Hz',
   tip:'<b>基频 f₁</b>：塔楼一阶自振频率，实测约 0.15 Hz（周期 6.7 s）。632 m 超高层的一阶振动周期远长于常规结构。'},
  {key:'z1', lb:'结构阻尼比', min:0.005, max:0.05, step:0.001, fmt:v=>v.toFixed(3),
   tip:'<b>结构阻尼比 ζ₁</b>：塔楼固有阻尼。超高层一阶实测约 0.01~0.02（含非结构与附加阻尼贡献）。ζ₁ 越小共振放大越剧烈、无阻尼器对照越夸张。'},
  {grp:'阻尼器 TMD'},
  {key:'mu', lb:'质量比 μ', min:0.002, max:0.02, step:0.001, fmt:v=>(v*100).toFixed(1)+'%',
   tip:'<b>质量比 μ=m₂/m₁</b>：质量块与塔楼模态质量之比。上海中心 μ≈1%（1000 t / 9.85×10⁷ kg）。μ 越大减振率越高、TMD 频带越宽，但占用空间与成本增加。<em>敏感性：高</em>。'},
  {key:'f2r', lb:'调谐比 f₂/f₁', min:0.80, max:1.20, step:0.005, fmt:v=>v.toFixed(3),
   tip:'<b>调谐比 f₂/f₁</b>：摆式阻尼器固有频率与塔楼基频之比。<em>TMD 最敏感的参数</em>——最优值≈1/√(1+μ)；偏离 10~15% 减振率即从 40%+ 跌至 15% 以下。阶段五将自动演示 1.00→0.85 的失谐劣化。'},
  {key:'z2', lb:'电涡流阻尼比 ζ₂', min:0, max:0.15, step:0.002, fmt:v=>v.toFixed(3),
   tip:'<b>电涡流阻尼比 ζ₂</b>：铜板-永磁体阵列提供的电磁阻尼。最优值≈√(3μ/8)≈0.06（μ=1% 时）。ζ₂ 过小摆幅超行程，过大则质量块被“锁死”随塔运动、失去相位差。<em>敏感性：高</em>。'},
  {key:'lockMass', lb:'锁定质量块', sw:true,
   tip:'<b>锁定质量块（失效模拟）</b>：将质量块与塔楼刚性连接，TMD 完全失效，退化为无阻尼器结构——用于对照验证减振率跌至 0。'},
  {grp:'剖面 SECTION'},
  {key:'sectionOn', lb:'剖切大厅', sw:true,
   tip:'<b>剖切大厅</b>：用剖切平面剖开塔冠表皮与大厅壳体，露出内部装置。机位 B（塔冠剖面）时会自动开启。'},
  {key:'sectionAz', lb:'剖切方位角', min:0, max:360, step:5, fmt:v=>v.toFixed(0)+'°',
   tip:'<b>剖切方位角</b>：被剖开一侧的方位（0°=东，逆时针）。调整以从任意角度观察内部。'},
  {key:'sectionOf', lb:'剖切偏移', min:-8, max:8, step:0.5, fmt:v=>v.toFixed(1)+' m',
   tip:'<b>剖切偏移</b>：剖切平面沿法向的平移量。负值多剖、正值少剖。'},
  {grp:'显示 VIEW'},
  {key:'ampV', lb:'位移视觉放大', min:20, max:400, step:10, fmt:v=>'×'+v.toFixed(0),
   tip:'<b>位移视觉放大倍数</b>：实际塔顶位移仅 0.1~0.5 m，视觉上放大以便观察振型。物理量（HUD 读数、时程曲线）始终为真实值；塔底位移恒为零，质量块相对大厅的行程不随放大倍数改变。'},
  {key:'timeScale', lb:'时间加速', min:0.25, max:3, step:0.05, fmt:v=>'×'+v.toFixed(2),
   tip:'<b>时间加速</b>：物理积分与动画时间流速的比例。30 s 演示循环的节奏随之变化。'},
  {key:'trailOn', lb:'质量块轨迹', sw:true,
   tip:'<b>质量块轨迹</b>：绘制质量块水平位移的时间轨迹带（横向为时间、纵向为位移）。'},
  {key:'frameOn', lb:'金色门架', sw:true,
   tip:'<b>金色梯形门架</b>：四腿外撇的装饰性构架，不参与承力（吊索直接连接顶部锚环与质量块），可整体隐藏以看清传力路径。'},
  {key:'artOn', lb:'艺术陈设', sw:true,
   tip:'<b>艺术陈设</b>：「上海慧眼」叠片玉眼雕塑与鎏金底座。开启剖切（机械模式）时自动隐藏，二者互斥展示。'},
  {key:'camMode', lb:'机位', seg:['AUTO','A','B','C','D'],
   tip:'<b>机位</b>：A 大厅特写 / B 塔冠剖面 / C 整塔侧视 / D 高空鸟瞰。AUTO 按时间线脚本运镜。'},
];
function buildPanel(){
  const body=$('panelBody'); const tip=$('tip');
  let tipOn=false;
  function showTip(html, e){ tip.innerHTML=html; tip.style.opacity=1; tipOn=true; moveTip(e); }
  function moveTip(e){
    const x=Math.min(e.clientX-270, innerWidth-300), y=Math.min(e.clientY+14, innerHeight-160);
    tip.style.left=Math.max(8,x)+'px'; tip.style.top=y+'px';
  }
  function hideTip(){ tip.style.opacity=0; tipOn=false; }

  for(const def of PANEL_DEF){
    if(def.grp){ const d=document.createElement('div'); d.className='grp'; d.innerHTML=`<div class="gt">${def.grp}</div>`; body.appendChild(d); continue; }
    const wrap=document.createElement('div'); wrap.className='ctl';
    if(def.sw){
      wrap.className='sw'+(P[def.key]?' on':'');
      wrap.innerHTML=`<div class="lb"><b>${def.lb}</b></div><div class="tg"></div>`;
      wrap.onclick=()=>{ P[def.key]=!P[def.key]; wrap.classList.toggle('on',P[def.key]); onParam(def.key); };
    } else if(def.seg){
      wrap.innerHTML=`<div class="lb"><b>${def.lb}</b></div>`;
      const seg=document.createElement('div'); seg.className='seg';
      def.seg.forEach(op=>{
        const d=document.createElement('div'); d.textContent=op; if(P[def.key]===op)d.classList.add('on');
        d.onclick=()=>{ P[def.key]=op; [...seg.children].forEach(c=>c.classList.remove('on')); d.classList.add('on'); onParam(def.key); };
        seg.appendChild(d);
      });
      wrap.appendChild(seg);
    } else {
      wrap.innerHTML=`<div class="lb"><b>${def.lb}</b><span>${def.fmt(P[def.key])}</span></div>`;
      const r=document.createElement('input'); r.type='range'; r.min=def.min; r.max=def.max; r.step=def.step; r.value=P[def.key];
      r.oninput=()=>{ P[def.key]=parseFloat(r.value); wrap.querySelector('span').textContent=def.fmt(P[def.key]); onParam(def.key); };
      wrap.appendChild(r);
    }
    wrap.onmouseenter=e=>showTip(def.tip,e); wrap.onmousemove=e=>{if(tipOn)moveTip(e)}; wrap.onmouseleave=hideTip;
    body.appendChild(wrap);
  }
  $('panelTab').onclick=()=>$('panel').classList.add('open');
  $('panel').addEventListener('mouseleave',()=>$('panel').classList.remove('open'));
}
function onParam(key){
  if(key==='sectionOn'||key==='sectionAz'||key==='sectionOf') applySection();
  if(key==='camMode'){}
  if(key==='lockMass'&&P.lockMass){}
}
function applySection(){
  const on=P.sectionOn;
  setClip(on);
  if(world.machine){ world.machine.visible=on; world.art.visible=!on&&P.artOn; }
  world.lightBeam.visible = true;
}

/* ---------- 每帧驱动 ---------- */
function phiY(y){ return Math.pow(Math.max(y,0)/632, 1.7); }
let strokePeakT=0;
function applyState(dt){
  const q1=Phy.s[0], s=Phy.s[2]-Phy.s[0], dq1=Phy.s[1], ds=Phy.s[3]-Phy.s[1];
  const B=q1*P.ampV;
  BEND.value=B;

  // 摆体总成: 塔架带动 + 行程(不放大)
  const px = phiY(585)*B + s;
  world.pend.position.set(px,0,0);
  // 行程峰值(3 s 窗)
  if(Phy.t-strokePeakT>3){ strokePeakT=Phy.t; world.strokePeak=Math.abs(s); }
  else world.strokePeak=Math.max(world.strokePeak, Math.abs(s));

  // 12 钢索: 顶端系于锚环(随塔弯曲), 末端系于块顶
  const dpx = (phiY(world.yAnchor)-phiY(585))*B - s;
  for(const c of world.cables){
    const x0=dpx + c.r0*Math.cos(c.a0), z0=c.r0*Math.sin(c.a0), y0=world.yAnchor;
    const x1=c.r1*Math.cos(c.a0), z1=c.r1*Math.sin(c.a0), y1=world.yBlockTop;
    const dx=x1-x0, dy=y1-y0, dz=z1-z0, L=Math.hypot(dx,dy,dz);
    c.m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
    c.m.scale.set(1,L,1);
    c.m.quaternion.setFromUnitVectors(V3(0,1,0), V3(dx/L,dy/L,dz/L));
  }

  // 4 斜撑: 块底角(世界) → 楼面锚(随塔)
  for(const d of world.dampers){
    const ax=px + d.a.x, az=d.a.z;
    const bx=phiY(573)*B + d.b.x, bz=d.b.z;
    const dx=bx-ax, dy=d.b.y-d.a.y, dz=bz-az, L=Math.hypot(dx,dy,dz);
    d.o.position.set((ax+bx)/2,(d.a.y+d.b.y)/2,(az+bz)/2);
    d.o.scale.set(1,L*0.62,1);
    d.o.quaternion.setFromUnitVectors(V3(0,1,0), V3(dx/L,dy/L,dz/L));
    d.inn.position.copy(d.o.position);
    d.inn.scale.set(1,L*0.85,1);
    d.inn.quaternion.copy(d.o.quaternion);
    d.o.visible=d.inn.visible = world.machine.visible;
  }

  // 涡流辉光 ∝ 相对速度
  const g=Math.min(1, Math.abs(ds)*0.9);
  world.glow.material.opacity=g*0.85;
  world.glow.scale.set(14+g*8, 8+g*5, 1);

  // 艺术雕塑不自旋 — 仅随质量块摆动 (禁止旋转三面实体观感)

  // 轨迹: z=时间轴, x=质量块水平位置
  world.trail.visible=P.trailOn;
  if(P.trailOn){
    const attr=world.trail.geometry.attributes.position;
    if(world.trailPts<300) world.trailPts++;
    for(let i=world.trailPts-1;i>0;i--) attr.copyAt(i, attr, i-1);
    for(let i=0;i<world.trailPts;i++) attr.setZ(i, attr.getZ(i)-dt*P.timeScale*1.4);
    attr.setXYZ(0, px, 585.6, 60);
    for(let i=0;i<world.trailPts;i++) if(attr.getZ(i)<8) attr.setZ(i, attr.getZ(i)+52);
    attr.needsUpdate=true;
    world.trail.geometry.setDrawRange(0, world.trailPts);
  }

  // 风粒子
  {
    const p=world.windPts.geometry.attributes.position, v=world.windVel;
    const spd=12+Wind.env*85;
    for(let i=0;i<v.length;i++){
      let x=p.getX(i)+spd*v[i]*dt*P.timeScale;
      if(x>560){ x=-1500; p.setY(i, 12+Math.random()*640); p.setZ(i, -280+Math.random()*560); }
      p.setX(i,x);
    }
    p.needsUpdate=true;
    world.windPts.material.opacity=0.12+0.3*Wind.env;
  }
  // 光尘
  {
    const p=world.dustPts.geometry.attributes.position;
    for(let i=0;i<p.count;i++){
      let y=p.getY(i)+dt*0.5;
      if(y>605) y=584;
      p.setY(i,y);
    }
    p.needsUpdate=true;
  }
}

/* ---------- 主循环 ---------- */
let lastT=performance.now(), histAcc=0;
function frame(){
  requestAnimationFrame(frame);
  const now=performance.now();
  let dt=Math.min((now-lastT)/1000, 0.1); lastT=now;
  const dtS=dt*P.timeScale;

  Phy.step(dtS);
  histAcc+=dtS;
  if(histAcc>0.1){ histAcc=0; histQ.push([Phy.t, Phy.s[0], Phy.s0[0]]); if(histQ.length>400) histQ.shift(); }

  // 机位
  const want = P.camMode==='AUTO' ? autoCam() : P.camMode;
  if(want!==camState.cur){
    camState.cur=want;
    if(want==='B'&&!P.sectionPin){ P.sectionOn=true; syncSw('sectionOn',true); applySection(); }
    if(want!=='B'&&!P.sectionPin){ P.sectionOn=false; syncSw('sectionOn',false); applySection(); }
  }
  const pose=rigPose(camState.cur, Phy.t);
  const k=1-Math.exp(-dt*1.1);
  camState.pos.lerp(pose.pos,k); camState.tgt.lerp(pose.tgt,k);
  camState.fov+= (pose.fov-camState.fov)*k;
  camera.position.copy(camState.pos); camera.lookAt(camState.tgt);
  camera.fov=camState.fov; camera.updateProjectionMatrix();

  applyState(dt);
  updateHUD(dt);
  renderer.render(scene,camera);
}
function syncSw(key,val){
  document.querySelectorAll('#panelBody .sw').forEach(el=>{
    if(el.querySelector('b').textContent===LABEL_OF[key]) el.classList.toggle('on',val);
  });
}
const LABEL_OF={sectionOn:'剖切大厅',lockMass:'锁定质量块',trailOn:'质量块轨迹',gustOn:'随机阵风',lockF:'风频锁定基频',frameOn:'金色门架',artOn:'艺术陈设'};

/* ---------- 调试句柄(验收用) ---------- */
const __debug = {
  get params(){return P;},
  get state(){
    const s=Phy.s;
    return {t:Phy.t, phase:(Phy.t%30>=24?5:Phy.t%30>=16?4:Phy.t%30>=10?3:Phy.t%30>=4?2:1),
      q1:s[0], dq1:s[1], x2:s[2], dx2:s[3], stroke:s[2]-s[0], q0:Phy.s0[0],
      reduction:Phy.reduction(), wind:Wind.vWind, cam:camState.cur};
  },
  set(key,val){ P[key]=val; onParam(key); return P[key]; },
  cam(name){ P.camMode=name; },
  step(frames=1,dtF=1/60){   // 手动推进(内置浏览器 rAF 停摆时驱动)
    for(let i=0;i<frames;i++){
      const dtS=dtF*P.timeScale;
      Phy.step(dtS);
      applyState(dtF);
    }
    const want=P.camMode==='AUTO'?autoCam():P.camMode;
    const pose=rigPose(want,Phy.t);
    camera.position.copy(pose.pos); camera.lookAt(pose.tgt);
    camera.fov=pose.fov; camera.updateProjectionMatrix();
    camState.cur=want;
    renderer.render(scene,camera);
    return this.state;
  },
  seek(t2){ const n=Math.max(0,Math.round((t2-Phy.t)/CFG.DT)); for(let i=0;i<n;i++)Phy.step(CFG.DT); return this.state; },
  section(on,az,of){ P.sectionOn=on; if(az!==undefined)P.sectionAz=az; if(of!==undefined)P.sectionOf=of; P.sectionPin=true; applySection(); },
  render(){ renderer.render(scene,camera); return 'ok'; }
};
window.__debug=__debug;

/* ---------- 启动 ---------- */
function boot(){
  initRenderer(); initGround(); initCity(); initTower(); initHall(); initPendulum(); initWind();
  // 阻尼器移到 scene(两端各随塔/摆)
  for(const d of world.dampers){ world.pend.remove(d.o); world.pend.remove(d.inn); scene.add(d.o); scene.add(d.inn); }
  buildPanel(); applySection();
  // 预热 300 s(10 个循环) 进入稳态 — 打开即呈现规格量级(共振建立 τ≈106 s)
  for(let i=0;i<300*240;i++) Phy.step(CFG.DT);
  window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
  frame();
}
try{ boot(); }catch(e){ console.error('BOOT FAIL', e.stack||e); window.__bootError=(e&&e.stack)||String(e); }

/* __APP_END__ */


</script>
