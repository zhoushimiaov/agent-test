<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Test · 智能体能力测试</title>
<style>
  :root{
    --bg:#0b1020; --panel:#141b32; --panel2:#1b2444;
    --text:#e8ecf7; --muted:#9aa6c7; --accent:#5b8cff; --accent2:#7cf0d2;
    --border:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%,#1a2550 0%,transparent 55%),
               radial-gradient(1000px 500px at 100% 0%,#143040 0%,transparent 50%),
               var(--bg);
    color:var(--text);min-height:100vh;line-height:1.6;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:64px 24px 80px}
  header{margin-bottom:48px}
  .eyebrow{color:var(--accent2);font-size:14px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
  h1{font-size:clamp(32px,5vw,52px);font-weight:800;margin:10px 0 14px;
     background:linear-gradient(90deg,#fff,#9ab6ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{color:var(--muted);font-size:17px;max-width:620px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:12px}
  .card{
    display:block;text-decoration:none;color:inherit;
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--border);border-radius:18px;padding:26px;
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;position:relative;overflow:hidden;
  }
  .card:hover{transform:translateY(-4px);border-color:rgba(91,140,255,.5);box-shadow:0 18px 40px -20px rgba(91,140,255,.6)}
  .card.soon{opacity:.55;pointer-events:none}
  .emoji{font-size:40px;line-height:1}
  .card h3{font-size:22px;margin:16px 0 6px;font-weight:700}
  .card p{color:var(--muted);font-size:14.5px}
  .meta{margin-top:16px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--accent)}
  .pill{font-size:11px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:999px;
        background:rgba(124,240,210,.14);color:var(--accent2);border:1px solid rgba(124,240,210,.25)}
  .pill.gray{background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--border)}
  footer{margin-top:56px;color:var(--muted);font-size:13px;border-top:1px solid var(--border);padding-top:22px}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Agent Test</div>
    <h1>智能体能力测试合集</h1>
    <p class="sub">用一组经典、直观的任务，横向对比不同大模型 / Agent 的实际输出效果。每个大类下按模型版本归档，点进去即可查看在线效果。</p>
  </header>

  <div class="grid">
    <a class="card" href="pelican-bicycle/">
      <div class="emoji">🦩🚲</div>
      <h3>鹈鹕骑车</h3>
      <p>经典 LLM 创意测试：让模型画 / 做一只骑自行车的鹈鹕，考验空间想象与前端实现。</p>
      <div class="meta"><span class="pill">1 个版本</span><span>查看栏目 →</span></div>
    </a>

    <div class="card soon">
      <div class="emoji">🧩</div>
      <h3>更多大类</h3>
      <p>后续陆续加入更多测试栏目（如代码重构、数据可视化、游戏实现等）。</p>
      <div class="meta"><span class="pill gray">敬请期待</span></div>
    </div>
  </div>

  <footer>
    托管于 GitHub Pages · <a href="https://github.com/zhoushimiaov/agent-test">源码仓库</a>
  </footer>
</div>
</body>
</html>
