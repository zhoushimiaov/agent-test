<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>钢丝上的大象 · MiMo-V2.6-Flash</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#070810;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
"use strict";
const cv=document.getElementById("stage"),ctx=cv.getContext("2d");
const TAU=Math.PI*2,LOOP=12;
let W=0,H=0,S=1,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;S=H/900;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+"px";cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);resize();

const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const lerp=(a,b,t)=>a+(b-a)*t;
const fract=x=>x-Math.floor(x);
function hash(i){return fract(Math.sin(i*127.1+311.7)*43758.5453);}
const wave=(t,k,ph)=>Math.sin(TAU*t*k/LOOP+(ph||0));
// 阵风包络:整周期谐波叠加,保证 12s 无缝循环
function gust(t){
  const g=Math.pow(0.5+0.5*wave(t,1,0),4);
  const g2=Math.pow(0.5+0.5*wave(t,2,1.3),3);
  return clamp(g*0.8+g2*0.45,0,1);
}
// 摄影机:轻微呼吸变焦 + 漂移
function camera(t){
  const z=1+0.02*wave(t,1,0.7);
  const px=9*wave(t,2,0.2),py=6*wave(t,3,1.1);
  ctx.translate(W/2+px,H/2+py);ctx.scale(z,z);ctx.translate(-W/2,-H/2);
}
// 钢丝几何:二次贝塞尔悬垂弧,可受阵风横向摆动
function ropeGeom(t){
  const g=gust(t);
  const x0=W*0.075,x1=W*0.925,yA=H*0.40;
  const sag=H*0.07*(1+0.10*wave(t,2,0)*(0.4+g));
  const cx=W*0.5+10*wave(t,1,0.4)*(0.4+g);
  const cy=yA+2*sag;
  return{x0:x0,x1:x1,yA:yA,cx:cx,cy:cy};
}
function ropePt(G,u){
  const v=1-u;
  return{
    x:v*v*G.x0+2*v*u*G.cx+u*u*G.x1,
    y:v*v*G.yA+2*v*u*G.cy+u*u*G.yA
  };
}
function ropeTangent(G,u){
  const dx=2*(1-u)*(G.cx-G.x0)+2*u*(G.x1-G.cx);
  const dy=2*(1-u)*(G.cy-G.yA)+2*u*(G.yA-G.cy);
  return Math.atan2(dy,dx);
}
// 已知 x 求参数 u(取 [0,1] 内的根)
function ropeUAtX(G,x){
  const a=G.x0-2*G.cx+G.x1,b=2*(G.cx-G.x0),c=G.x0-x;
  if(Math.abs(a)<1e-6)return clamp(c/(-b||1e-6),0,1);
  const d=b*b-4*a*c;if(d<0)return 0.5;
  const s=Math.sqrt(d),u1=(-b+s)/(2*a),u2=(-b-s)/(2*a);
  const in1=u1>=0&&u1<=1,in2=u2>=0&&u2<=1;
  if(in1&&in2)return Math.abs(u1-0.5)<Math.abs(u2-0.5)?u1:u2;
  return in1?u1:(in2?u2:0.5);
}
// 平衡状态:杆角滞后于倾角,形成持续的"纠偏"
function state(t){
  const g=gust(t);
  const lean=(4.1*wave(t,1,0)+2.2*wave(t,3,2.2)+1.1*wave(t,5,0.9))*(1+0.9*g);
  const pole=-0.78*lean+3.5*wave(t,2,0.6);
  const bob=Math.sin(TAU*t*4/LOOP);
  const jump=0.001;
  return{g:g,lean:lean,pole:pole,bob:bob,x:0,y:0};
}
// 追光:椭圆聚光沿顶棚与钢丝缓慢扫动
function lightA(t){return 0.16+0.95*fract(t/LOOP+0.18);}
function drawSpot(t,ax,ay,tx,ty,r,hue,alpha){
  const ang=Math.atan2(ty-ay,tx-ax),len=Math.hypot(tx-ax,ty-ay);
  ctx.save();ctx.globalCompositeOperation="lighter";
  const gr=ctx.createRadialGradient(tx,ty,0,tx,ty,r);
  gr.addColorStop(0,`hsla(${hue},80%,70%,${0.55*alpha})`);
  gr.addColorStop(0.5,`hsla(${hue},90%,60%,${0.22*alpha})`);
  gr.addColorStop(1,`hsla(${hue},90%,60%,0)`);
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(tx,ty,r,0,TAU);ctx.fill();
  ctx.translate(ax,ay);ctx.rotate(ang);
  const cg=ctx.createLinearGradient(0,0,len,0);
  cg.addColorStop(0,`hsla(${hue},70%,70%,${0.16*alpha})`);
  cg.addColorStop(1,`hsla(${hue},70%,70%,0)`);
  ctx.fillStyle=cg;ctx.beginPath();
  ctx.moveTo(0,0);ctx.lineTo(len,-r*0.55);ctx.lineTo(len,r*0.55);ctx.closePath();ctx.fill();
  ctx.restore();
}
//———— 背景 ————
function drawSky(t){
  const gr=ctx.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,"#04050c");gr.addColorStop(0.45,"#0a0d22");
  gr.addColorStop(0.72,"#131834");gr.addColorStop(1,"#1a1430");
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  const n=Math.round(W*H/9000);
  for(let i=0;i<n;i++){
    const x=hash(i)*W,y=hash(i+7)*H*0.62;
    const a=(0.2+0.75*hash(i+3))*Math.pow(0.5+0.5*wave(t,3,i),3);
    ctx.fillStyle=`rgba(220,230,255,${a.toFixed(3)})`;
    ctx.fillRect(x,y,1.6,1.6);
  }
  const mr=H*0.045;
  ctx.fillStyle="rgba(232,238,255,0.10)";
  ctx.beginPath();ctx.arc(W*0.79,H*0.16,mr,0,TAU);ctx.fill();
  const mg=ctx.createRadialGradient(W*0.79,H*0.16,0,W*0.79,H*0.16,mr*1.9);
  mg.addColorStop(0,"rgba(210,225,255,0.28)");mg.addColorStop(1,"rgba(210,225,255,0)");
  ctx.fillStyle=mg;ctx.beginPath();ctx.arc(W*0.79,H*0.16,mr*1.9,0,TAU);ctx.fill();
}
function drawHills(){
  ctx.fillStyle="#070a18";
  ctx.beginPath();ctx.moveTo(0,H*0.60);
  for(let x=0;x<=W;x+=40)ctx.lineTo(x,H*0.60-H*0.03*Math.abs(Math.sin(x*0.004+1)));
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  ctx.fillStyle="#050711";
  ctx.beginPath();ctx.moveTo(0,H*0.63);
  for(let x=0;x<=W;x+=40)ctx.lineTo(x,H*0.63-H*0.04*Math.abs(Math.sin(x*0.006+4)));
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
}
function drawTent(t){
  const yA=H*0.40,apex=H*0.06,base=yA+H*0.05;
  ctx.fillStyle="#141a33";
  ctx.beginPath();ctx.moveTo(W*0.5,apex);ctx.lineTo(W*0.015,base);ctx.lineTo(W*0.985,base);ctx.closePath();ctx.fill();
  ctx.fillStyle="rgba(178,64,84,0.30)";
  const band=(x0,x1)=>{ctx.beginPath();ctx.moveTo(W*0.5,apex);
    ctx.lineTo(W*0.5+(W*0.015-W*0.5)*(x0),apex+(base-apex)*x0);
    ctx.lineTo(W*0.5+(W*0.015-W*0.5)*(x1),apex+(base-apex)*x1);ctx.closePath();ctx.fill();};
  band(0.14,0.30);band(0.58,0.74);
  ctx.beginPath();ctx.moveTo(W*0.5,apex);ctx.lineTo(W*0.985,base);
  ctx.lineTo(W*0.985,base);ctx.lineTo(W*0.5,apex);ctx.closePath();
  ctx.fillStyle="rgba(178,64,84,0.30)";
  ctx.beginPath();ctx.moveTo(W*0.5,apex);
  ctx.lineTo(W*0.5+(W*0.985-W*0.5)*0.14,apex+(base-apex)*0.14);
  ctx.lineTo(W*0.5+(W*0.985-W*0.5)*0.30,apex+(base-apex)*0.30);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(W*0.5,apex);
  ctx.lineTo(W*0.5+(W*0.985-W*0.5)*0.58,apex+(base-apex)*0.58);
  ctx.lineTo(W*0.5+(W*0.985-W*0.5)*0.74,apex+(base-apex)*0.74);ctx.closePath();ctx.fill();
  ctx.strokeStyle="#1d2547";ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(W*0.015,base);ctx.lineTo(W*0.5,apex);ctx.lineTo(W*0.985,base);ctx.stroke();
  const fy=apex+Math.sin(t*2.1)*6,fx=W*0.5+Math.sin(t*1.3)*4;
  ctx.strokeStyle="#8892b8";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(W*0.5,apex);ctx.lineTo(W*0.5,apex-26);ctx.stroke();
  ctx.fillStyle="#e2566b";
  ctx.beginPath();ctx.moveTo(W*0.5,apex-26);
  ctx.quadraticCurveTo(fx+26,apex-22+Math.sin(t*3)*3,fx+40,apex-14+Math.sin(t*3.7)*4);
  ctx.lineTo(W*0.5,apex-8);ctx.closePath();ctx.fill();
}
function drawAudience(t){
  const y=H*0.845;
  ctx.fillStyle="#0a0d1e";ctx.fillRect(0,y,W,H-y);
  for(let i=0;i<Math.ceil(W/46)+1;i++){
    const x=i*46+8,h1=hash(i)*14+26;
    ctx.fillStyle="#04060f";
    ctx.beginPath();ctx.ellipse(x,y+6,20,h1,0,0,TAU);ctx.fill();
    const sd=(0.5+0.5*wave(t,3,i*1.7))*0.35;
    ctx.fillStyle=`rgba(96,116,190,${sd.toFixed(3)})`;
    ctx.beginPath();ctx.arc(x,y+6-h1*0.6,4.5,0,TAU);ctx.fill();
    if(hash(i+11)>0.6){
      const fa=Math.max(0,Math.sin(TAU*t/LOOP*3+i*2.1));
      if(fa>0.86){
        const gx=x+14,gy=y-10;
        ctx.save();ctx.globalCompositeOperation="lighter";
        const fg=ctx.createRadialGradient(gx,gy,0,gx,gy,18);
        fg.addColorStop(0,`rgba(255,255,255,${(0.9*(fa-0.86)/0.14).toFixed(3)})`);
        fg.addColorStop(1,"rgba(255,255,255,0)");
        ctx.fillStyle=fg;ctx.beginPath();ctx.arc(gx,gy,18,0,TAU);ctx.fill();
        ctx.restore();
      }
    }
  }
}
//———— 钢丝与索具 ————
function rigAnchors(G){
  const ax=W*0.048,ay=H*0.17,bx=W*0.952;
  return{ax:ax,ay:ay,bx:bx,by:ay};
}
function drawCableAndWire(t,G){
  const A=rigAnchors(G);
  // 承重索(带弧度,微微随风)
  ctx.strokeStyle="rgba(150,165,215,0.35)";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(A.ax,A.ay);
  ctx.quadraticCurveTo((A.ax+G.x0)/2,(A.ay+G.yA)/2+14+6*wave(t,2,0),G.x0,G.yA);
  ctx.moveTo(A.bx,A.by);
  ctx.quadraticCurveTo((A.bx+G.x1)/2,(A.by+G.yA)/2+14+6*wave(t,2,1),G.x1,G.yA);
  ctx.stroke();
  // 主钢丝:亮顶线 + 暗底线
  ctx.strokeStyle="#0b0d16";ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(G.x0,G.yA);ctx.quadraticCurveTo(G.cx,G.cy,G.x1,G.yA);ctx.stroke();
  ctx.strokeStyle="#b9c6e8";ctx.lineWidth=2.4;
  ctx.beginPath();ctx.moveTo(G.x0,G.yA);ctx.quadraticCurveTo(G.cx,G.cy,G.x1,G.yA);ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,0.5)";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(G.x0,G.yA-1.5);ctx.quadraticCurveTo(G.cx,G.cy-1.5,G.x1,G.yA-1.5);ctx.stroke();
  // 桅杆
  const mast=(x,base,top)=>{
    ctx.strokeStyle="#232c52";ctx.lineWidth=9;
    ctx.beginPath();ctx.moveTo(x,base);ctx.lineTo(x,top);ctx.stroke();
    ctx.strokeStyle="#33406e";ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(x-1,top);ctx.lineTo(x-1,base);ctx.stroke();
    ctx.fillStyle="#e8b64c";
    ctx.beginPath();ctx.arc(x,top,7,0,TAU);ctx.fill();
    ctx.fillStyle="rgba(255,240,200,0.9)";
    ctx.beginPath();ctx.arc(x-2,top-2,2.4,0,TAU);ctx.fill();
  };
  mast(A.ax,H*0.80,A.ay);mast(A.bx,H*0.80,A.by);
  // 中央垂坠小旗(随风摆动)
  const droop=8+3*wave(t,2,0);
  ctx.strokeStyle="rgba(150,165,215,0.5)";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(G.x0,G.yA);
  ctx.quadraticCurveTo(W*0.5,G.yA+H*0.16+droop,G.x1,G.yA);ctx.stroke();
  const fx=W*0.5+3*wave(t,3,0.5),fy=G.yA+H*0.16+droop;
  ctx.fillStyle="#e8b64c";
  ctx.beginPath();ctx.moveTo(fx,fy);
  ctx.lineTo(fx-16+2*wave(t,4,0),fy+7);
  ctx.lineTo(fx,fy+14);ctx.lineTo(fx+16+2*wave(t,4,1),fy+7);
  ctx.closePath();ctx.fill();
  // 横幅
  const bx=W*0.5,bby=H*0.335+2*wave(t,2,2);
  ctx.strokeStyle="rgba(150,165,215,0.4)";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(W*0.36,H*0.26);ctx.lineTo(W*0.36,bby-16);
  ctx.moveTo(W*0.64,H*0.26);ctx.lineTo(W*0.64,bby-16);ctx.stroke();
  ctx.fillStyle="#5d1f2e";
  ctx.beginPath();
  ctx.moveTo(W*0.36,bby-16);
  ctx.quadraticCurveTo(bx,bby-6,W*0.64,bby-16);
  ctx.lineTo(W*0.64,bby+18);
  ctx.quadraticCurveTo(bx,bby+28,W*0.36,bby+18);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle="#e8b64c";ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle="#f3d78e";
  ctx.font="700 20px Georgia,serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("THE HIGH WIRE",bx,bby+1);
}
//———— 大象 ————
// 局部坐标:原点=四足中点(接触钢丝处),y 向上为负
function drawElephant(t,G,st){
  const u=ropeUAtX(G,W*0.5);
  const P=ropePt(G,u),th=ropeTangent(G,u);
  ctx.save();
  ctx.translate(P.x,P.y);ctx.rotate(th);           // 贴合钢丝坡度
  ctx.translate(0,-2);
  const leanR=st.lean*Math.PI/180;
  ctx.translate(0,-40);ctx.rotate(-leanR);ctx.translate(0,40); // 以足尖为支点倾斜

  const bob=st.bob*3;
  const walk=Math.sin(TAU*t*4/LOOP);               // 步态(4步/循环)
  const s=H/760;                                   // 大象缩放
  ctx.scale(s,s);

  // —— 平衡杆(在象身之后)——
  const pa=st.pole*Math.PI/180;
  ctx.save();
  ctx.translate(-6,-96+bob);ctx.rotate(-pa);
  const PL=250;
  const grd=ctx.createLinearGradient(-PL,0,PL,0);
  grd.addColorStop(0,"#7a4a24");grd.addColorStop(0.5,"#b07538");grd.addColorStop(1,"#7a4a24");
  ctx.fillStyle=grd;
  ctx.beginPath();
  ctx.moveTo(-PL,-4);ctx.quadraticCurveTo(0,-7,PL,-4);
  ctx.lineTo(PL,4);ctx.quadraticCurveTo(0,7,-PL,4);ctx.closePath();ctx.fill();
  ctx.fillStyle="#3a2412";
  ctx.beginPath();ctx.arc(-PL,0,7,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(PL,0,7,0,TAU);ctx.fill();
  ctx.strokeStyle="rgba(255,235,190,0.35)";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(-PL+10,-3);ctx.quadraticCurveTo(0,-5.5,PL-10,-3);ctx.stroke();
  ctx.restore();

  // —— 四肢 ————
  const leg=(lx,ph,far)=>{
    const sw=Math.sin(TAU*t*4/LOOP+ph);
    const lift=Math.max(0,Math.cos(TAU*t*4/LOOP+ph))*7;
    const kx=lx+sw*7, ky=-lift;
    ctx.fillStyle=far?"#1f2436":"#2b3145";
    ctx.beginPath();
    ctx.moveTo(lx-13,-52);
    ctx.quadraticCurveTo(lx-15,-26,kx-11,ky-14);
    ctx.lineTo(kx+11,ky-14);
    ctx.quadraticCurveTo(lx+15,-26,lx+13,-52);
    ctx.closePath();ctx.fill();
    // 脚
    ctx.fillStyle=far?"#171b28":"#232939";
    ctx.beginPath();ctx.ellipse(kx,ky-6,13,8,0,0,TAU);ctx.fill();
    ctx.fillStyle=far?"#12151f":"#3a415a";
    for(let i=-1;i<=1;i++){
      ctx.beginPath();ctx.ellipse(kx+i*7,ky-10,3.4,2.6,0,0,TAU);ctx.fill();
    }
    return{kx:kx,ky:ky};
  };
  const legs=[leg(-34,0,true),leg(22,Math.PI,true),leg(-26,Math.PI,false),leg(30,0,false)];

  // —— 躯干 ————
  const bx=0,by=-92+bob;
  ctx.fillStyle="#2b3145";
  ctx.beginPath();
  ctx.moveTo(-62,by+4);
  ctx.bezierCurveTo(-70,by-30,-46,by-52,-8,by-54);
  ctx.bezierCurveTo(34,by-56,64,by-40,66,by-8);
  ctx.bezierCurveTo(68,by+16,50,by+30,16,by+30);
  ctx.bezierCurveTo(-26,by+30,-58,by+26,-62,by+4);
  ctx.closePath();ctx.fill();
  // 高光
  ctx.fillStyle="#343b55";
  ctx.beginPath();
  ctx.moveTo(-52,by-6);
  ctx.bezierCurveTo(-56,by-32,-34,by-48,-2,by-50);
  ctx.bezierCurveTo(30,by-50,54,by-38,58,by-16);
  ctx.bezierCurveTo(30,by-30,-20,by-34,-52,by-6);
  ctx.closePath();ctx.fill();
  // 皮肤褶皱
  ctx.strokeStyle="rgba(20,24,38,0.5)";ctx.lineWidth=2;ctx.fill();
  ctx.beginPath();ctx.moveTo(-40,by+10);ctx.quadraticCurveTo(-30,by+16,-18,by+12);ctx.stroke();
  ctx.beginPath();ctx.moveTo(24,by+14);ctx.quadraticCurveTo(36,by+18,48,by+12);ctx.stroke();

  // —— 尾巴 ————
  const tw=Math.sin(TAU*t*2/LOOP)*10;
  ctx.strokeStyle="#232939";ctx.lineWidth=5;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(-60,by-16);
  ctx.quadraticCurveTo(-76,by-6+tw*0.4,-80,by+14+tw);ctx.stroke();
  ctx.fillStyle="#171b28";
  ctx.beginPath();ctx.ellipse(-81,by+16+tw,5,7,0.3,0,TAU);ctx.fill();

  // —— 毯衣(表演毯)——
  const bl=ctx.createLinearGradient(0,by-56,0,by+10);
  bl.addColorStop(0,"#7d1f33");bl.addColorStop(1,"#541626");
  ctx.fillStyle=bl;
  ctx.beginPath();
  ctx.moveTo(-52,by-34);
  ctx.quadraticCurveTo(-6,by-60,48,by-40);
  ctx.lineTo(52,by+4);
  ctx.quadraticCurveTo(0,by+22,-54,by+2);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle="#e8b64c";ctx.lineWidth=3;ctx.stroke();
  ctx.strokeStyle="rgba(243,215,142,0.75)";ctx.lineWidth=1.6;
  ctx.setLineDash([6,7]);
  ctx.beginPath();
  ctx.moveTo(-48,by-26);ctx.quadraticCurveTo(-4,by-50,44,by-32);
  ctx.moveTo(-50,by-6);ctx.quadraticCurveTo(-4,by+10,48,by-8);
  ctx.stroke();ctx.setLineDash([]);
  // 流苏
  ctx.strokeStyle="#e8b64c";ctx.lineWidth=2;
  for(let i=0;i<7;i++){
    const fx=-46+i*16, fy=by+4+Math.sin(TAU*t*4/LOOP+i)*1.5;
    ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx,fy+8);ctx.stroke();
  }

  // —— 头 ————
  const hx=76,hy=-104+bob+Math.sin(TAU*t*2/LOOP)*2;
  const hr=-0.12+Math.sin(TAU*t*2/LOOP+1)*0.05;
  ctx.save();ctx.translate(hx,hy);ctx.rotate(hr);
  ctx.fillStyle="#2b3145";
  ctx.beginPath();ctx.ellipse(6,4,32,30,0,0,TAU);ctx.fill();
  ctx.fillStyle="#343b55";
  ctx.beginPath();ctx.ellipse(10,-4,24,20,0,0,TAU);ctx.fill();
  // 耳朵
  const fl=Math.sin(TAU*t*3/LOOP)*0.18;
  ctx.save();ctx.translate(-14,-2);ctx.rotate(-0.3+fl);
  ctx.fillStyle="#3d4460";
  ctx.beginPath();ctx.ellipse(-16,4,22,30,0,0,TAU);ctx.fill();
  ctx.fillStyle="rgba(140,90,110,0.5)";
  ctx.beginPath();ctx.ellipse(-16,6,13,20,0,0,TAU);ctx.fill();
  ctx.restore();
  // 眼
  ctx.fillStyle="#f5f0e6";
  ctx.beginPath();ctx.ellipse(18,-2,7.5,6,0,0,TAU);ctx.fill();
  ctx.fillStyle="#171b28";
  ctx.beginPath();ctx.arc(20,-1.5,3.4,0,TAU);ctx.fill();
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.arc(21,-3,1.2,0,TAU);ctx.fill();
  ctx.strokeStyle="#171b28";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(11,-9);ctx.quadraticCurveTo(18,-13,25,-9);ctx.stroke();
  // 象牙
  ctx.fillStyle="#e8e2cf";
  ctx.beginPath();ctx.moveTo(24,14);
  ctx.quadraticCurveTo(40,20,46,8);
  ctx.quadraticCurveTo(38,14,25,9);ctx.closePath();ctx.fill();
  // 鼻子(下垂微卷,末端卷着小球保持趣味)
  const tr=Math.sin(TAU*t*4/LOOP+0.6)*0.16;
  ctx.save();ctx.translate(28,10);ctx.rotate(0.5+tr);
  ctx.fillStyle="#2b3145";
  ctx.beginPath();
  ctx.moveTo(0,-8);
  ctx.quadraticCurveTo(16,6,14,30);
  ctx.quadraticCurveTo(13,44,22,52);
  ctx.quadraticCurveTo(30,58,34,52);
  ctx.quadraticCurveTo(36,60,26,62);
  ctx.quadraticCurveTo(14,62,8,50);
  ctx.quadraticCurveTo(4,34,6,16);
  ctx.quadraticCurveTo(4,4,-2,2);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle="rgba(20,24,38,0.55)";ctx.lineWidth=1.6;
  for(let i=0;i<4;i++){
    ctx.beginPath();ctx.moveTo(5,10+i*7);ctx.lineTo(14,12+i*7);ctx.stroke();
  }
  ctx.restore();
  // 小帽(带亮片)
  ctx.fillStyle="#e8b64c";
  ctx.beginPath();
  ctx.moveTo(-8,-24);ctx.lineTo(28,-24);ctx.lineTo(24,-40);ctx.lineTo(-4,-40);
  ctx.closePath();ctx.fill();
  ctx.fillStyle="#7d1f33";
  ctx.fillRect(-8,-27,36,5);
  ctx.fillStyle="#f3d78e";
  ctx.beginPath();ctx.arc(10,-44,5,0,TAU);ctx.fill();
  ctx.fillStyle="rgba(255,255,255,0.9)";
  ctx.beginPath();ctx.arc(-1,-32,1.6,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(16,-32,1.6,0,TAU);ctx.fill();
  ctx.restore();

  ctx.restore();
  return{legs:legs};
}
// 局部坐标 → 屏幕坐标(与 drawElephant 内部变换一致)
function eleScreen(P,th,st,lx,ly){
  const s=H/760,a=-st.lean*Math.PI/180;
  // T(0,40)·R(a)·T(0,-40)·T(0,-2)·R(th)·T(P);bob 已并入 ly
  let x1=lx*s, y1=40+ly*s;
  const ca=Math.cos(a),sa=Math.sin(a);
  let x2=x1*ca-y1*sa, y2=x1*sa+y1*ca;
  y2+=-40; y2+=-2;
  const ct=Math.cos(th),stt=Math.sin(th);
  return{x:P.x+x2*ct-y2*stt, y:P.y+x2*stt+y2*ct};
}
//———— 风痕与尘埃 ————
function drawWind(t){
  const g=gust(t);if(g<0.03)return;
  ctx.save();ctx.globalCompositeOperation="lighter";
  ctx.lineCap="round";
  for(let i=0;i<4;i++){
    const ph=fract(t/LOOP*(1+i*0.15)+i*0.31);
    const x=-160+ph*(W+320),y=H*(0.10+0.11*i)+Math.sin(i*2.3)*30;
    const len=90+70*hash(i+40);
    const a=g*(0.10+0.10*hash(i+3));
    const gr=ctx.createLinearGradient(x,y,x+len,y+10);
    gr.addColorStop(0,"rgba(255,255,255,0)");
    gr.addColorStop(0.5,`rgba(255,255,255,${a.toFixed(3)})`);
    gr.addColorStop(1,"rgba(255,255,255,0)");
    ctx.strokeStyle=gr;ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+len,y+12);ctx.stroke();
  }
  // 慢漂浮尘埃
  for(let i=0;i<22;i++){
    const px=fract(hash(i+60)+t/LOOP*(0.15+0.3*hash(i+20)))*W;
    const py=hash(i+80)*H*0.72+8*Math.sin(TAU*t*2/LOOP+i);
    const a=0.06+0.10*hash(i+13);
    ctx.fillStyle=`rgba(255,240,210,${a.toFixed(3)})`;
    ctx.fillRect(px,py,1.8,1.8);
  }
  ctx.restore();
}
// 平衡杆端头:金属反光 + 偶发星芒
function drawSparks(t,G,st){
  const u=ropeUAtX(G,W*0.5),P=ropePt(G,u),th=ropeTangent(G,u);
  const pa=st.pole*Math.PI/180,bob=st.bob*3;
  const tips=[[-6-250*Math.cos(pa),-96+bob+250*Math.sin(pa)],[-6+250*Math.cos(pa),-96+bob-250*Math.sin(pa)]];
  ctx.save();ctx.globalCompositeOperation="lighter";
  for(let i=0;i<2;i++){
    const sp=eleScreen(P,th,st,tips[i][0],tips[i][1]);
    const gl=0.5+0.5*Math.sin(TAU*t*2/LOOP+i*2.4);
    ctx.fillStyle=`rgba(255,245,210,${(0.35+0.45*gl).toFixed(3)})`;
    ctx.beginPath();ctx.arc(sp.x,sp.y,3.2,0,TAU);ctx.fill();
    const fl=Math.sin(TAU*t*5/LOOP+i*Math.PI);
    if(fl>0.975){
      const k=(fl-0.975)/0.025;
      const r=16*k;
      const g2=ctx.createRadialGradient(sp.x,sp.y,0,sp.x,sp.y,r);
      g2.addColorStop(0,`rgba(255,255,240,${(0.9*k).toFixed(3)})`);
      g2.addColorStop(1,"rgba(255,255,240,0)");
      ctx.fillStyle=g2;ctx.beginPath();ctx.arc(sp.x,sp.y,r,0,TAU);ctx.fill();
      ctx.strokeStyle=`rgba(255,255,255,${(0.8*k).toFixed(3)})`;ctx.lineWidth=1.2;
      ctx.beginPath();
      ctx.moveTo(sp.x-r*1.4,sp.y);ctx.lineTo(sp.x+r*1.4,sp.y);
      ctx.moveTo(sp.x,sp.y-r*1.4);ctx.lineTo(sp.x,sp.y+r*1.4);
      ctx.stroke();
    }
  }
  ctx.restore();
}
//———— 颗粒噪点(胶片感) ————
const grainCv=document.createElement("canvas");
grainCv.width=grainCv.height=140;
(function(){
  const gc=grainCv.getContext("2d"),id=gc.createImageData(140,140);
  for(let i=0;i<id.data.length;i+=4){
    const v=200+Math.random()*55|0;
    id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=26;
  }
  gc.putImageData(id,0,0);
})();
const grainPat=ctx.createPattern(grainCv,"repeat");
//———— 叠加:追光 / 晕影 / 颗粒 ————
function drawOverlay(t,G){
  const aA=0.5+0.5*Math.sin(TAU*t/LOOP);
  const aB=0.5+0.5*Math.sin(TAU*t/LOOP+Math.PI);
  // 舞台中央暖光池
  drawSpot(t,W*0.5,H*0.03,W*0.5,G.yA+H*0.10,H*0.26,44,0.42);
  //双追光交叉扫动
  drawSpot(t,W*0.048,H*0.17,W*(0.18+0.5*aA),H*0.55,H*0.30,46,0.50);
  drawSpot(t,W*0.952,H*0.17,W*(0.82-0.5*aB),H*0.55,H*0.30,205,0.36);
  // 晕影
  const vg=ctx.createRadialGradient(W*0.5,H*0.44,Math.min(W,H)*0.30,W*0.5,H*0.5,Math.max(W,H)*0.78);
  vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,0.62)");
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  // 胶片颗粒
  ctx.save();
  const f=Math.floor(t*60);
  ctx.translate(hash(f)*140,hash(f+1)*140);
  ctx.globalAlpha=0.06;
  ctx.fillStyle=grainPat;
  ctx.fillRect(-160,-160,W+320,H+320);
  ctx.restore();
}
//———— 主循环(12s 无缝循环) ————
function render(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  camera(t);
  drawSky(t);
  drawHills();
  drawTent(t);
  const G=ropeGeom(t),st=state(t);
  // 象身后暖晕(轮廓分离)
  const u=ropeUAtX(G,W*0.5),P=ropePt(G,u);
  ctx.save();ctx.globalCompositeOperation="lighter";
  const hg=ctx.createRadialGradient(P.x,P.y-90,0,P.x,P.y-90,H*0.24);
  hg.addColorStop(0,"rgba(255,190,110,0.16)");
  hg.addColorStop(1,"rgba(255,190,110,0)");
  ctx.fillStyle=hg;ctx.beginPath();ctx.arc(P.x,P.y-90,H*0.24,0,TAU);ctx.fill();
  ctx.restore();
  drawCableAndWire(t,G);
  drawAudience(t);
  drawElephant(t,G,st);
  drawWind(t);
  drawSparks(t,G,st);
  drawOverlay(t,G);
  ctx.restore();
}
let t0=performance.now();
(function frame(now){
  const t=((now-t0)/1000)%LOOP;
  render(t);
  requestAnimationFrame(frame);
})(performance.now());
</script>
