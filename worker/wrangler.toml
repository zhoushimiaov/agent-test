#:schema node_modules/wrangler/config-schema.json
# Zoo Test — Jev scoring Worker config.
# Deploy:  cd worker && npm install && npx wrangler deploy
# Secrets (NEVER put these in this file — set them with wrangler secret put):
#   npx wrangler secret put TYPESAFE_API_KEY     # our Jev key (ROTATE first!)
#   npx wrangler secret put VISION_API_KEY        # only if USE_SCREENSHOT=1

name = "zoo-jev"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
FREE_LIMIT = "3"
# Browser origins allowed to call this Worker (comma-separated, no trailing slash):
ALLOWED_ORIGINS = "https://agentest.shimiao.work,http://localhost:8080,http://127.0.0.1:8080"
# "1" = render the HTML to a screenshot and caption it (方案 b). Needs the
# [browser] binding below (Workers Paid) AND a VISION_* model configured.
# "0" = code-only scoring (方案 c), works on the free plan with no extras.
USE_SCREENSHOT = "0"
# Vision captioning model (OpenAI-compatible, only used when USE_SCREENSHOT=1):
VISION_BASE_URL = "https://api.openai.com/v1"
VISION_MODEL = "gpt-4o-mini"

# Per-visitor free-quota counter. Create it once, then paste the id here:
#   npx wrangler kv namespace create QUOTA
[[kv_namespaces]]
binding = "QUOTA"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Cloudflare Browser Rendering (needed only when USE_SCREENSHOT=1; Workers Paid).
# Leave commented for a free, code-only deploy.
# [browser]
# binding = "BROWSER"
