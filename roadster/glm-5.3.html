/* ================================================================

================================================================ */
const RAMP = (()=>{
  const TH_E = 86*D2R, TOP_Y = 16.5, BX = -30, BY = 0.02, N = 720;
  const simp=(f)=>{let s=0;for(let i=0;i<=200;i++){const w=i/200;s+=f(w)*(i==0||i==200?1:(i%2?4:2));}return s/600;};
  const I1 = simp(w=>Math.sin(TH_E*w*w));
  const L  = (TOP_Y-BY)/I1;
  const th=new Float32Array(N+1), xs=new Float32Array(N+1), ys=new Float32Array(N+1);
  for(let i=1;i<=N;i++){ const u0=(i-1)/N,u1=i/N,um=(u0+u1)/2;
    th[i]=TH_E*u1*u1;
    xs[i]=xs[i-1]+(L/N)*Math.cos(TH_E*um*um);
    ys[i]=ys[i-1]+(L/N)*Math.sin(TH_E*um*um); }
  const P = u=>{ u=clamp(u,0,1); const f=u*N, i=Math.min(N-1,f|0), r=f-i;
    return {x:BX+lerp(xs[i],xs[i+1],r), y:BY+lerp(ys[i],ys[i+1],r), th:lerp(th[i],th[i+1],r)}; };
  const xExit=P(1).x, vExit=Math.sqrt(2*G0*(67.5/FT-TOP_Y)), v0=Math.sqrt(vExit*vExit+2*G0*(TOP_Y-BY));
  // 爬升 s→t 表（能量法 v(s)=√(v0²-2g·y(s))）
  const ds=.02, S=[],T=[]; let s=0,t=0; S.push(0);T.push(0);
  while(s<L-1e-6){ const y=P(s/L).y, v=Math.max(2,Math.sqrt(Math.max(v0*v0-2*G0*(y-BY),4)));
    const v2=Math.max(2,Math.sqrt(Math.max(v0*v0-2*G0*(P(Math.min(1,(s+ds)/L)).y-BY),4)));
    t+=2*ds/(v+v2); s+=ds; S.push(s); T.push(t); }
  const sAt=tt=>{ tt=clamp(tt,0,T[T.length-1]); let lo=0,hi=T.length-1;
    while(lo<hi){const m=(lo+hi)>>1; if(T[m]<tt)lo=m+1;else hi=m;} 
    const i=Math.max(1,lo); const u=(tt-T[i-1])/(T[i]-T[i-1]||1);
    return {s:lerp(S[i-1],S[i],u), v:Math.max(2,Math.sqrt(Math.max(v0*v0-2*G0*(P(lerp(S[i-1],S[i],u)/L).y-BY),4)))}; };

class Puffs{
  constructor(n,tex,tint,blend){
    this.n=n; this.cur=0;
    this.pos=new Float32Array(n*3); this.vel=new Float32Array(n*3);
    this.age=new Float32Array(n).fill(1e4); this.life=new Float32Array(n).fill(1);
    this.sz0=new Float32Array(n); this.grow=new Float32Array(n); this.al0=new Float32Array(n);
    this.seed=new Float32Array(n);
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(this.pos,3).setUsage(THREE.DynamicDrawUsage));
    this.aS=new THREE.BufferAttribute(new Float32Array(n),1).setUsage(THREE.DynamicDrawUsage);
    this.aA=new THREE.BufferAttribute(new Float32Array(n),1).setUsage(THREE.DynamicDrawUsage);
    geo.setAttribute('aSize',this.aS); geo.setAttribute('aAlpha',this.aA);
    const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:blend,
      uniforms:{uTex:{value:tex},uScale:GU.uScale},
      vertexShader:`attribute float aSize;attribute float aAlpha;uniform float uScale;varying float vA;
        void main(){vA=aAlpha;vec4 mv=modelViewMatrix*vec4(position,1.);
        gl_PointSize=aSize*uScale/max(1.,-mv.z);gl_Position=projectionMatrix*mv;}`,
      fragmentShader:`uniform sampler2D uTex;uniform vec3 uTint;varying float vA;
        void main(){vec4 t=texture2D(uTex,gl_PointCoord);gl_FragColor=vec4(uTint*t.rgb,t.a*vA);
        if(gl_FragColor.a<.012)discard;}`});
    mat.uniforms.uTint={value:new THREE.Color(tint)};
    this.pts=new THREE.Points(geo,mat); this.pts.frustumCulled=false; scene.add(this.pts);
    for(let i=0;i<n;i++) this.pos[i*3+1]=-500;
  }
  spawn(x,y,z,vx,vy,vz,size,grow,life,alpha){
    const i=this.cur; this.cur=(this.cur+1)%this.n;
    this.pos[i*3]=x;this.pos[i*3+1]=y;this.pos[i*3+2]=z;
    this.vel[i*3]=vx;this.vel[i*3+1]=vy;this.vel[i*3+2]=vz;
    this.age[i]=0;this.life[i]=life;this.sz0[i]=size;this.grow[i]=grow;this.al0[i]=alpha;
    this.seed[i]=Math.random()*10;
  }
  step(dt,t){
    const p=this.pos,v=this.vel;
    for(let i=0;i<this.n;i++){
      if(this.age[i]>=this.life[i]){ this.aA.array[i]=0; this.pos[i*3+1]=-500; continue; }
      this.age[i]+=dt; const a=this.age[i]/this.life[i];
      const s=this.seed[i];
      v[i*3]   += dt*( Math.sin(t*.9+s*3.1)*.7 + .55 );          // 微风 + 翻滚扰动
      v[i*3+1] += dt*( Math.sin(t*1.3+s)*0.45 + .55 );           // 浮升
      v[i*3+2] += dt*( Math.cos(t*1.1+s*2.3)*.7 );
      const dr=Math.pow(.35,dt); v[i*3]*=1-(1-dr)*.9; v[i*3+2]*=1-(1-dr)*.9;
      p[i*3]+=v[i*3]*dt; p[i*3+1]+=v[i*3+1]*dt; p[i*3+2]+=v[i*3+2]*dt;
      if(p[i*3+1]<.05){p[i*3+1]=.05; v[i*3+1]*=-.12;}
      this.aS.array[i]=this.sz0[i]+this.grow[i]*this.age[i];
      this.aA.array[i]=this.al0[i]*Math.min(1,this.age[i]*3.2)*(1-sstep((a-.5)/.5));
    }
    this.aS.needsUpdate=this.aA.needsUpdate=true;
    this.pts.geometry.attributes.position.needsUpdate=true;
  }
}

  if(t<=keys[0][0])return keys[0][1];
  const last=keys.length-1; if(t>=keys[last][0])return keys[last][1];
  let lo=0,hi=last; while(hi-lo>1){const m=(lo+hi)>>1; if(keys[m][0]<t)lo=m;else hi=m;}
  const [t0,p0,m0]=keys[lo],[t1,p1,m1]=keys[hi],dt=t1-t0,u=(t-t0)/dt,u2=u*u,u3=u2*u;
  return (2*u3-3*u2+1)*p0 + (u3-2*u2+u)*m0*dt + (-2*u3+3*u2)*p1 + (u3-u2)*m1*dt;
}

const shakeOf=t=>{ const tp=t>T_TOUCH?Math.exp(-7*(t-T_TOUCH)):0;
  const st=env(THR_ENV,t)*clamp(1-carKin(t).y/9,0,1);
  const a=.34*tp+.05*st; return {x:a*Math.sin(37*t+1.7)+.4*a*Math.sin(59*t),
  y:a*Math.sin(47*t+.6)+.4*a*Math.sin(29*t)}; };

function applyState(t,dt,wall){
  const c=carKin(t), pitch=c.pitch*D2R, cosP=Math.cos(pitch);
  const roll=(t>K)? (1.6*Math.sin(3.5*(t-K))*Math.exp(-1.1*(t-K))
    + (t>T_TOUCH?1.1*Math.exp(-4*(t-T_TOUCH))*Math.sin(12*(t-T_TOUCH)):0)) : 0;
  let px=c.x, py=c.y, pz=0, yaw=0;
  if(c.ramp){ const p=RAMP.P(RAMP.sAt(t-T_BASE).s/RAMP.L), nx=-Math.sin(p.th), ny=Math.cos(p.th);
    px=p.x+nx*CAR_LIFT; py=p.y+ny*CAR_LIFT; }   // 吸地：贴坡面法向抬升
  car.position.set(px,py,pz);
  car.rotation.set(0,0,0); car.rotateY(yaw); car.rotateZ(pitch); car.rotateX(roll*D2R);
  // 车轮（累计滚动角）
  if(isNaN(DBG_T)&&dt>0) wheelAng-=groundSpeed(t)/.34*dt;
  for(const w of wheels) w.rotation.z=wheelAng;
  // 推进器
  const thr=env(THR_ENV,t), rcs=env(RCS_ENV,t);
  const foot=Math.max(.2,py-.30*cosP-.18), flick=.86+.14*Math.sin(wall*43)+.06*Math.sin(wall*97);
  for(const u of U_THR){
    const len=clamp(Math.min(1.1+6.4*thr, foot+.7),0.9,7.6);
    u.outer.scale.set((.72+.5*thr)*flick,len,(.72+.5*thr)*flick);
    u.core.scale.set(flick,len*.92,flick);
    u.outer.material.opacity=.52*thr*flick; u.core.material.opacity=.85*thr;
    u.glow.material.opacity=.8*thr; u.glow.scale.setScalar(1.0+1.6*thr);
  }
  underL.intensity=380*thr; underL.position.set(px,Math.max(.5,py-1.4),pz);
  pool.material.opacity=.5*thr*clamp(1-py/12,0,1); pool.position.set(px,.12,pz);
  pool.scale.set(10+6*thr,6+4*thr,1);
  for(const f of footGlow){ const vis=thr*clamp(1-py/10,0,1);
    f.s.material.opacity=.75*vis; f.s.position.set(px+f.ox*.9,.14,pz+f.oz*.9);
    f.s.scale.set(3+3.5*vis,2+2.4*vis,1); }
  for(const r of RCS_J){ const fl=rcs*(.8+.2*Math.sin(wall*61+r.ph));
    r.j.scale.set(1,1.3+1.1*fl,1); rcsMat.opacity=.85*fl; }
  // 跟拍灯
  trackA.position.set(px-11,17,15); trackA.target.position.set(px,py,pz);
  trackB.position.set(px+13,15,-13); trackB.target.position.set(px,py,pz);
  // 烟雾发生
  if(dt>0){
    const near=clamp(1.4-py/8,0,1);
    let rate=(t<T_SET+2)? thr*near*150 + (t>T_TOUCH? 130*Math.exp(-2.4*(t-T_TOUCH)) : 0) : 0;
    if(t>T_IG-.5&&t<T_IG-.1) rate=40;                     // 预冷小喷气
    smoke.acc=(smoke.acc||0)+rate*dt;
    while(smoke.acc>=1){ smoke.acc-=1;
      const u=U_THR[(Math.random()*4)|0], ang=Math.random()*6.283,
        sp=2.6+5.5*Math.random()*near, up=.7+2.4*Math.random();
      smoke.spawn(px+u.ox*.9+.05*Math.sin(ang), .07, pz+u.oz*.9+.05*Math.cos(ang),
        Math.cos(ang)*sp+1.1, up, Math.sin(ang)*sp,
        .8+1.5*Math.random()+near, 2.0+1.6*Math.random(), 2.6+1.8*Math.random(),
        (.34+.3*near)*clamp(thr+.35,0,1)); }
    if(t>T_TOUCH&&t<T_TOUCH+.25&&!(smoke.burst)){ smoke.burst=1;   // 触地炸开环形烟
      for(let i=0;i<170;i++){ const a=i/170*6.283, sp=5.5+7.5*Math.random();
        smoke.spawn(px+1.2*Math.cos(a),.12,pz+1.2*Math.sin(a),
          Math.cos(a)*sp,1.1+2.6*Math.random(),Math.sin(a)*sp,
          1.1+1.3*Math.random(),3.2,3.6+1.9*Math.random(),.5); } }
    if(t<T_TOUCH) smoke.burst=0;
  }
  return {c,thr,rcs,py,px,pitch:c.pitch};
}
function stepParticles(dt,wall){ smoke.step(dt,wall); dust.step(dt*.4,wall);
  runwayLamps.material.uniforms.uT.value=wall; rampLamps.material.uniforms.uT.value=wall;
  for(const tw of towers){ const pan=Math.sin(wall*.13+tw.ph)*.10;
    const dir=tw.aim.clone().sub(tw.base).normalize().applyAxisAngle(new THREE.Vector3(0,1,0),pan);
    tw.beam.position.copy(tw.base).addScaledVector(dir,31);
    tw.beam.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().negate());
    tw.bc.material.opacity=.4+.6*Math.abs(Math.sin(wall*2.2+tw.ph)); } }

/* ================================================================
   10. 多机位
================================================================ */
const XL=XE+4.0;
/* 七机位：A 车尾近景 → B 侧面全景追踪 → C 飞行/压平 → D 反推着陆(抖动) →
   E 穿烟驶出 → F 高空俯视巡航 → G 坡顶俯拍 */
const SHOTS=[
  t=>{ const u=sstep(t/(T_LAUNCH+.45));
    return {p:[X0-7.6+1.6*u,1.15,3.2-1.1*u], l:[X0+3,.8,0], f:36}; },
  t=>{ const c=carKin(t), b=(t>T_BASE-.7)?sstep((t-(T_BASE-.7))/1.3):0;
    return {p:[lerp(c.x+6,c.x-7,b),lerp(7.5,13.5,b),lerp(38,41,b)],
            l:[lerp(c.x+2,c.x+1.5,b),lerp(2.2,Math.min(11,c.y+3.5),b),0], f:lerp(40,44,b)}; },
  t=>{ const c=carKin(t);
    return {p:[-4,15.5,33], l:[c.x*.8+1,c.y*.85+2.2,0], f:40}; },
  t=>{ const c=carKin(t), s=shakeOf(t);
    return {p:[-9.5+s.x,5.6+s.y,23.5], l:[4.6,Math.max(2.2,c.y*.75+.8),0], f:33}; },
  t=>{ const c=carKin(t);
    return {p:[XL+15.5,1.6,7.8], l:[c.x+1,1.0,0], f:42}; },
  t=>{ const c=carKin(t);
    return {p:[c.x*.32+26,88,30], l:[c.x*.55+20,0,0], f:38}; },
  t=>{ const c=carKin(t);
    return {p:[XE+1.4,RAMP.TOP_Y+2.2,4.6], l:[c.x*.4+18,1.2,0], f:45}; },
];
const CUTS=[[T_LAUNCH+.45,0],[K+.9,1],[T_IG+1.8,1],[T_TOUCH+1.75,1],[T_TOUCH+6.6,0],[T_TOUCH+10.4,0]];
function cameraAt(t){
  t=clamp(t,0,LOOP-.001);
  let i=0; for(let k=0;k<CUTS.length;k++) if(t>=CUTS[k][0]) i=k+1;
  i=Math.min(i,SHOTS.length-1);
  const cur=SHOTS[i](t), bnd=CUTS[i];
  if(bnd&&bnd[1]&&t>bnd[0]-.45){                     // 切换前 0.45s 平滑混叠
    const w=sstep((t-(bnd[0]-.45))/.45), n=SHOTS[Math.min(i+1,SHOTS.length-1)](t);
    return {p:[lerp(cur.p[0],n.p[0],w),lerp(cur.p[1],n.p[1],w),lerp(cur.p[2],n.p[2],w)],
            l:[lerp(cur.l[0],n.l[0],w),lerp(cur.l[1],n.l[1],w),lerp(cur.l[2],n.l[2],w)],
            f:lerp(cur.f,n.f,w)}; }
  return cur;
}
function setCam(t){
  const {p,l,f}=cameraAt(t);
  camera.position.set(p[0],p[1],p[2]); camera.lookAt(l[0],l[1],l[2]);
  if(Math.abs(camera.fov-f)>.01){ camera.fov=f; camera.updateProjectionMatrix(); updScale(); }
}

/* ================================================================
   11. HUD
================================================================ */
const $=id=>document.getElementById(id);
const el={g:$('gVal'),gb:$('gBar'),pv:$('pVal'),ah:$('attHor'),ac:$('attCar'),
  av:$('altVal'),ab:$('altBar'),vs:$('vsVal'),md:$('mdVal'),rcs:$('rcsSt'),thr:$('thrSt')};
function hudUpd(t,S){
  el.g.textContent=gForce(t).toFixed(2);
  el.gb.style.width=((gForce(t)-.4)/1*100).toFixed(1)+'%';
  el.pv.textContent=(S.c.pitch>=0?'+':'−')+Math.abs(S.c.pitch).toFixed(1).padStart(5,'0')+'°';
  el.ah.setAttribute('transform',`rotate(${-S.c.pitch} 52 52)`);
  el.ac.setAttribute('transform',`rotate(${-S.c.pitch*.35} 52 52)`);
  const alt=S.c.y*FT; el.av.textContent=alt.toFixed(1);
  el.ab.style.height=clamp(alt/67.5*100,0,100)+'%';
  const vs=vsFpm(t); el.vs.textContent=(vs>=0?'+':'−')+String(Math.abs(Math.round(vs))).padStart(4,'0');
  el.md.textContent=S.c.mode; el.rcs.textContent=S.rcs>.05?'FIRE':'STANDBY';
  el.thr.textContent=S.thr>.05?'FULL':'IDLE';
}

/* ================================================================
   12. 调试：#sim 数值验证 / #probe 像素统计
================================================================ */
function runSim(dur){
  const rows=[]; let maxG=0,minG=9,maxAlt=0,maxPitch=-99,minPitch=99,monotone=true,lastX=-1e9,ok=true;
  for(let t=0;t<=dur;t+=1/120){
    const c=carKin(t),g=gForce(t),alt=c.y*FT;
    maxG=Math.max(maxG,g);minG=Math.min(minG,g);maxAlt=Math.max(maxAlt,alt);
    maxPitch=Math.max(maxPitch,c.pitch);minPitch=Math.min(minPitch,c.pitch);
    if(t>T_LAUNCH&&c.x<lastX-1e-3)monotone=false; lastX=Math.max(lastX,t<T_LAUNCH?-1e9:c.x);
    if(c.y<-0.02)ok=false;
    if(Math.abs(t-Math.round(t))<1/240)
      rows.push([t.toFixed(1),c.mode,c.x.toFixed(1),(alt).toFixed(1),c.pitch.toFixed(1),g.toFixed(2)].join('\t'));
  }
  console.log('SIM_ROWS\nt\tx\taltFT\tpitch\tG\n'+rows.join('\n'));
  const chk=[[maxAlt>67.3&&maxAlt<67.8,'peak '+maxAlt.toFixed(2)+'ft≠67.5'],
    [maxG<=1.401,'Gmax '+maxG.toFixed(3)],[minG>=.399,'Gmin '+minG.toFixed(3)],
    [maxPitch<96,'pitchMax '+maxPitch.toFixed(1)],[minPitch>-8,'pitchMin '+minPitch.toFixed(1)],
    [monotone,'x non-monotonic'],[ok,'y<0']];
  const bad=chk.filter(c=>!c[0]);
  console.log(`SIM_LOOP=${LOOP.toFixed(2)}s T_EXIT=${T_EXIT.toFixed(2)} T_TOUCH=${T_TOUCH.toFixed(2)} `+
    `G[${minG.toFixed(2)},${maxG.toFixed(2)}] ALTMAX=${maxAlt.toFixed(2)}ft PITCH[${minPitch.toFixed(1)},${maxPitch.toFixed(1)}]`);
  console.log(bad.length?('SIM_FAIL '+bad.map(b=>b[1]).join(' | ')):'SIM_OK');
}
function runProbe(list){
  const W=1280,H=720; renderer.setPixelRatio(1); renderer.setSize(W,H,false);
  camera.aspect=W/H; camera.updateProjectionMatrix(); updScale();
    const gl=renderer.getContext(), buf=new Uint8Array(W*H*4);
    for(const t of list){
    const S=applyState(t,1/60,t); setCam(t); hudUpd(t,S); renderer.render(scene,camera);
    gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,buf);
    const lum=(x0,y0,x1,y1)=>{ let s=0,n=0;
      for(let y=y0;y<y1;y+=4)for(let x=x0;x<x1;x+=4){ const i=(y*W+x)*4;
        s+=(buf[i]*.2126+buf[i+1]*.7152+buf[i+2]*.0722); n++; } return s/n/255; };
    let br=0,tot=0; for(let i=0;i<W*H;i+=16){ const j=i*4;
      if(buf[j]*.2126+buf[j+1]*.7152+buf[j+2]*.0722>102)br++; tot++; }
    console.log('PROBE '+JSON.stringify({t, sky:lum(0,Math.floor(H*.72),W,H).toFixed(3),
      mid:lum(Math.floor(W*.25),Math.floor(H*.35),Math.floor(W*.75),Math.floor(H*.7)).toFixed(3),
      ground:lum(Math.floor(W*.3),Math.floor(H*.08),Math.floor(W*.7),Math.floor(H*.3)).toFixed(3),
      ctr:lum(Math.floor(W*.42),Math.floor(H*.35),Math.floor(W*.58),Math.floor(H*.65)).toFixed(3),
      all:lum(0,0,W,H).toFixed(3), brightPct:(br/tot*100).toFixed(2),
      hud:'G='+document.getElementById('gVal').textContent+' ALT='+document.getElementById('altVal').textContent}));
    }
}

/* ================================================================
   13. 主循环
================================================================ */
let tPrev=performance.now()/1000, tSim=0, wall0=performance.now()/1000;
if(!isNaN(DBG_T)) tSim=clamp(DBG_T,0,LOOP-.001);
if(DBG_SIM) runSim(DBG_SIM);
if(DBG_PRB){ runProbe(DBG_PRB.split(',').map(Number).filter(v=>!isNaN(v))); }
else
requestAnimationFrame(function frame(){
  const now=performance.now()/1000, dt=clamp(now-tPrev,0,.05); tPrev=now;
  if(isNaN(DBG_T)) tSim=(tSim+dt)%LOOP;
  const wall=now-wall0;
  const S=applyState(tSim,dt,wall);
  setCam(tSim); hudUpd(tSim,S); stepParticles(dt,wall);
  renderer.render(scene,camera);
  if(!window._boot){window._boot=1;console.log(`BOOT_OK loop=${LOOP.toFixed(2)}s exit=${RAMP.xExit.toFixed(2)}m climbT=${RAMP.climbT.toFixed(2)}s`);}
  requestAnimationFrame(frame);
});
addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); updScale(); });
</script>
