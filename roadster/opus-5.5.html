<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elon Musk's Tesla Roadster - Spaceflight</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #000;
    }

    #canvas-container {
      width: 100vw;
      height: 100dvh;
    }
  </style>
</head>

<body>
  <div id="canvas-container"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>

  <script type="module">
    import * as THREE from 'three';

    // Scene setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000814, 0.0008);

    // Camera
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 20000);
    camera.position.set(40, 15, 60);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // Lighting
    const sunLight = new THREE.DirectionalLight(0xfff5e6, 4);
    sunLight.position.set(500, 200, 300);
    scene.add(sunLight);

    const ambientLight = new THREE.AmbientLight(0x1a3d5c, 0.8);
    scene.add(ambientLight);

    const earthGlow = new THREE.PointLight(0x4d9bff, 2, 200);
    earthGlow.position.set(-100, -50, -150);
    scene.add(earthGlow);

    // Stars
    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = 8000;
    const positions = new Float32Array(starsCount * 3);
    for (let i = 0; i < starsCount; i++) {
      const i3 = i * 3;
      const radius = 4000 + Math.random() * 6000;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      positions[i3] = radius * Math.sin(phi) * Math.cos(theta);
      positions[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
      positions[i3 + 2] = radius * Math.cos(phi);
    }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const starsMaterial = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 2,
      sizeAttenuation: true,
      transparent: true
    });
    const stars = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(stars);

    // Earth
    const earthGroup = new THREE.Group();
    earthGroup.position.set(-200, -120, -400);
    scene.add(earthGroup);

    const earthGeometry = new THREE.SphereGeometry(80, 64, 64);
    const earthMaterial = new THREE.MeshPhongMaterial({
      color: 0x1e4d8c,
      emissive: 0x0a1f3d,
      emissiveIntensity: 0.3,
      shininess: 10
    });
    const earth = new THREE.Mesh(earthGeometry, earthMaterial);
    earthGroup.add(earth);

    const atmosphereGeometry = new THREE.SphereGeometry(84, 64, 64);
    const atmosphereMaterial = new THREE.MeshBasicMaterial({
      color: 0x4d9bff,
      transparent: true,
      opacity: 0.15,
      side: THREE.BackSide
    });
    const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
    earthGroup.add(atmosphere);

    const cloudGeometry = new THREE.SphereGeometry(81, 48, 48);
    const cloudMaterial = new THREE.MeshPhongMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.08,
      shininess: 0
    });
    const clouds = new THREE.Mesh(cloudGeometry, cloudMaterial);
    earthGroup.add(clouds);

    // Road trajectory (ground -> curved ascent -> space)
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(10, 0.5, -30),
      new THREE.Vector3(25, 2, -70),
      new THREE.Vector3(40, 6, -110),
      new THREE.Vector3(55, 12, -150),
      new THREE.Vector3(70, 22, -190),
      new THREE.Vector3(80, 38, -230),
      new THREE.Vector3(85, 60, -270),
      new THREE.Vector3(88, 90, -310),
      new THREE.Vector3(90, 130, -350),
      new THREE.Vector3(92, 180, -390),
      new THREE.Vector3(95, 250, -430),
      new THREE.Vector3(100, 340, -470),
      new THREE.Vector3(110, 460, -510),
      new THREE.Vector3(130, 620, -550),
      new THREE.Vector3(160, 820, -590),
      new THREE.Vector3(200, 1080, -630)
    ]);
    curve.tension = 0.4;

    // Road
    const roadGroup = new THREE.Group();
    scene.add(roadGroup);

    const tubeGeometry = new THREE.TubeGeometry(curve, 200, 4.5, 12, false);
    const roadMaterial = new THREE.MeshPhongMaterial({
      color: 0x151515,
      emissive: 0x050505,
      shininess: 5
    });
    const road = new THREE.Mesh(tubeGeometry, roadMaterial);
    roadGroup.add(road);

    const centerLineGeometry = new THREE.TubeGeometry(curve, 200, 0.15, 4, false);
    const centerLineMaterial = new THREE.MeshBasicMaterial({
      color: 0xffff00,
      transparent: true,
      opacity: 0.8
    });
    const centerLine = new THREE.Mesh(centerLineGeometry, centerLineMaterial);
    roadGroup.add(centerLine);

    // Road markers
    for (let i = 0; i < 40; i++) {
      const t = i / 40;
      const point = curve.getPoint(t);
      const tangent = curve.getTangent(t);
      const marker = new THREE.Mesh(
        new THREE.PlaneGeometry(2, 0.3),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 })
      );
      marker.position.copy(point).add(new THREE.Vector3(0, 0.1, 0));
      marker.lookAt(point.clone().add(tangent));
      marker.rotateX(Math.PI / 2);
      roadGroup.add(marker);
    }

    // Tesla Roadster (simplified)
    const car = new THREE.Group();

    // Body
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(4.2, 0.8, 9),
      new THREE.MeshPhongMaterial({ color: 0xff1e00, shininess: 80 })
    );
    body.position.y = 0.6;
    car.add(body);

    const cabin = new THREE.Mesh(
      new THREE.BoxGeometry(3.8, 0.6, 4),
      new THREE.MeshPhongMaterial({ color: 0x111111, shininess: 60 })
    );
    cabin.position.set(0, 1.2, -1);
    car.add(cabin);

    const windshield = new THREE.Mesh(
      new THREE.PlaneGeometry(3.6, 0.5),
      new THREE.MeshBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.4 })
    );
    windshield.position.set(0, 1.25, 1.01);
    windshield.rotation.x = -Math.PI / 6;
    car.add(windshield);

    // Wheels
    const wheelGeometry = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 24);
    const wheelMaterial = new THREE.MeshPhongMaterial({ color: 0x0a0a0a, shininess: 10 });
    const wheelPositions = [
      [-1.9, 0.5, 3],
      [1.9, 0.5, 3],
      [-1.9, 0.5, -2.5],
      [1.9, 0.5, -2.5]
    ];
    const wheels = [];
    wheelPositions.forEach(pos => {
      const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(...pos);
      car.add(wheel);
      wheels.push(wheel);
    });

    // Starman (simplified figure)
    const starman = new THREE.Group();
    const helmet = new THREE.Mesh(
      new THREE.SphereGeometry(0.25, 16, 16),
      new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 90 })
    );
    helmet.position.set(0, 1.6, -1);
    starman.add(helmet);

    const visor = new THREE.Mesh(
      new THREE.SphereGeometry(0.26, 16, 16, 0, Math.PI),
      new THREE.MeshBasicMaterial({ color: 0x222222, transparent: true, opacity: 0.7 })
    );
    visor.position.set(0, 1.6, -0.75);
    visor.rotation.x = Math.PI / 2;
    starman.add(visor);

    const suit = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 0.5, 0.3),
      new THREE.MeshPhongMaterial({ color: 0xffffff })
    );
    suit.position.set(0, 1.25, -1);
    starman.add(suit);

    car.add(starman);
    scene.add(car);

    // Exhaust trail
    const trailGeometry = new THREE.BufferGeometry();
    const trailCount = 150;
    const trailPositions = new Float32Array(trailCount * 3);
    trailGeometry.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
    const trailMaterial = new THREE.PointsMaterial({
      color: 0xff6600,
      size: 1.5,
      transparent: true,
      opacity: 0.6,
      blending: THREE.AdditiveBlending
    });
    const trail = new THREE.Points(trailGeometry, trailMaterial);
    scene.add(trail);
    const trailPoints = [];

    // Animation progress
    let progress = 0;
    const duration = 16;

    // Camera target
    const cameraTarget = new THREE.Object3D();
    scene.add(cameraTarget);

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);

      progress += 1 / (duration * 60);
      if (progress > 1) progress = 0;

      const t = progress;
      const point = curve.getPoint(t);
      const tangent = curve.getTangent(t).normalize();
      const nextPoint = curve.getPoint(Math.min(t + 0.01, 1));

      // Position car
      car.position.copy(point);
      car.lookAt(nextPoint);
      car.position.y += 2.5;

      // Wheel rotation based on speed
      const speed = 0.15;
      wheels.forEach(wheel => {
        wheel.rotation.x += speed;
      });

      // Trail
      trailPoints.push(car.position.clone().add(new THREE.Vector3(0, -0.5, 2)));
      if (trailPoints.length > trailCount) trailPoints.shift();
      const trailPos = trailGeometry.attributes.position.array;
      for (let i = 0; i < trailPoints.length; i++) {
        trailPos[i * 3] = trailPoints[i].x;
        trailPos[i * 3 + 1] = trailPoints[i].y;
        trailPos[i * 3 + 2] = trailPoints[i].z;
        trailMaterial.opacity = (i / trailPoints.length) * (t > 0.3 ? 0.6 : 0.3);
      }
      trailGeometry.attributes.position.needsUpdate = true;

      // Earth rotation
      earth.rotation.y += 0.0005;
      clouds.rotation.y += 0.0007;

      // Stars subtle rotation
      stars.rotation.y += 0.0001;

      // Camera movement - follow, orbit, pull back
      if (t < 0.25) {
        // Low angle follow
        const offset = new THREE.Vector3(-15, 8, 25).applyQuaternion(car.quaternion);
        camera.position.lerp(car.position.clone().add(offset), 0.08);
        camera.lookAt(car.position.clone().add(new THREE.Vector3(0, 2, -10)));
      } else if (t < 0.6) {
        // Tilted orbit
        const angle = (t - 0.25) / 0.35 * Math.PI * 0.5;
        const offset = new THREE.Vector3(-25 * Math.cos(angle), 12 + angle * 5, 15 * Math.sin(angle)).applyQuaternion(car.quaternion);
        camera.position.lerp(car.position.clone().add(offset), 0.06);
        camera.lookAt(car.position.clone().add(new THREE.Vector3(0, 3, -5)));
      } else if (t < 0.85) {
        // Wide angle
        const offset = new THREE.Vector3(-40, 25, 10).applyQuaternion(car.quaternion);
        camera.position.lerp(car.position.clone().add(offset), 0.05);
        camera.lookAt(car.position.clone().add(new THREE.Vector3(0, 5, -20)));
      } else {
        // Distant view of Earth
        camera.position.lerp(new THREE.Vector3(150, 200, 50), 0.04);
        camera.lookAt(earthGroup.position);
      }

      // Fade road in space
      if (t > 0.7) {
        roadMaterial.opacity = Math.max(0, 1 - (t - 0.7) / 0.3);
        roadMaterial.transparent = true;
        centerLineMaterial.opacity = Math.max(0, 0.8 - (t - 0.7) / 0.3);
        centerLineMaterial.transparent = true;
      }

      // Adjust fog for space
      if (t > 0.65) {
        scene.fog.density = Math.max(0.0001, 0.0008 * (1 - (t - 0.65) / 0.35));
      }

      renderer.render(scene, camera);
    }

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>

</body>

</html>
