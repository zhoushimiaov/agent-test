<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Starman · Roadster Flight</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden}
  canvas#c{display:block;width:100vw;height:100vh}
  #vig{position:fixed;inset:0;pointer-events:none;
       background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 42%,rgba(0,0,0,.62) 100%)}
  #grain{position:fixed;inset:-60%;pointer-events:none;opacity:.045;
       background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
       animation:gr .9s steps(3) infinite}
  @keyframes gr{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}100%{transform:translate(0,0)}}
  #flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}
  #fade{position:fixed;inset:0;pointer-events:none;background:#000;opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="grain"></div>
<div id="flash"></div>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if(!window.THREE){document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');}</script>
<script>
(function(){
'use strict';

/* ══════════════════════════════════════════════════════════════
   Starman · Roadster Flight  —  single-file cinematic loop
   0.0 – 5.6   荒漠黄昏 · 低机位追车
   5.6 – 9.2   抬头 · 点火 · 离地
   9.2 –12.9   冲出大气 · 天空由暮色转为太空
   13.3        闪白剪切
   13.3–21.0   近地轨道 · Starman 与地球同框
   21.0–24.3   拉远 · 车变成一颗小点
   ══════════════════════════════════════════════════════════════ */

var clamp=function(v,a,b){return v<a?a:(v>b?b:v)};
var lerp=function(a,b,t){return a+(b-a)*t};
var smooth=function(t){t=clamp(t,0,1);return t*t*(3-2*t)};
var C=function(h){return new THREE.Color(h).convertSRGBToLinear()};

var SEEK=/[?&]t=([\d.]+)/.exec(location.search);
var START=SEEK?parseFloat(SEEK[1]):0;

/* ── renderer / scene ───────────────────────────────────────── */
var canvas=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.06;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var MAXANISO=renderer.capabilities.getMaxAnisotropy();

var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(40,window.innerWidth/window.innerHeight,0.45,26000);

var SUNDIR=new THREE.Vector3(-0.55,0.275,0.79).normalize();

/* ── canvas texture helpers ─────────────────────────────────── */
function cv(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c}
function tx(c,rx,ry){
  var t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(rx||1,ry||1);
  t.anisotropy=MAXANISO;
  t.encoding=THREE.sRGBEncoding;
  return t;
}
function rnd(a,b){return a+Math.random()*(b-a)}

/* soft radial glow */
function glowCanvas(hard){
  var s=256,c=cv(s,s),x=c.getContext('2d');
  var g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(hard?0.06:0.10,'rgba(255,248,232,'+(hard?0.98:0.86)+')');
  g.addColorStop(hard?0.16:0.26,'rgba(255,205,140,'+(hard?0.55:0.34)+')');
  g.addColorStop(0.52,'rgba(255,150,80,0.09)');
  g.addColorStop(1,'rgba(255,120,60,0)');
  x.fillStyle=g;x.fillRect(0,0,s,s);
  return c;
}
var TEX_GLOW=new THREE.CanvasTexture(glowCanvas(false));
var TEX_CORE=new THREE.CanvasTexture(glowCanvas(true));

/* horizontal anamorphic streak */
function streakCanvas(){
  var w=1024,h=64,c=cv(w,h),x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,w,0);
  g.addColorStop(0,'rgba(255,180,120,0)');
  g.addColorStop(0.34,'rgba(255,210,170,.22)');
  g.addColorStop(0.5,'rgba(255,255,255,.95)');
  g.addColorStop(0.66,'rgba(255,210,170,.22)');
  g.addColorStop(1,'rgba(255,180,120,0)');
  x.fillStyle=g;x.fillRect(0,0,w,h);
  var vg=x.createLinearGradient(0,0,0,h);
  vg.addColorStop(0,'rgba(0,0,0,1)');vg.addColorStop(.5,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,1)');
  x.globalCompositeOperation='destination-out';x.fillStyle=vg;x.fillRect(0,0,w,h);
  return c;
}
var TEX_STREAK=new THREE.CanvasTexture(streakCanvas());

/* ═══════════ SKY ═══════════ */
var skyUni={
  uSpace:{value:0},
  uSun:{value:new THREE.Vector3().copy(SUNDIR)}
};
var skyMat=new THREE.ShaderMaterial({
  uniforms:skyUni,
  side:THREE.BackSide,
  depthWrite:false,
  fog:false,
  vertexShader:[
    'varying vec3 vDir;',
    'void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }'
  ].join('\n'),
  fragmentShader:[
    'uniform float uSpace; uniform vec3 uSun; varying vec3 vDir;',
    'void main(){',
    '  vec3 d=normalize(vDir);',
    '  float y=d.y;',
    '  vec3 top=vec3(0.025,0.040,0.095);',
    '  vec3 mid=vec3(0.115,0.105,0.215);',
    '  vec3 hor=vec3(0.62,0.255,0.115);',
    '  vec3 dusk=mix(mid,top,smoothstep(0.02,0.62,y));',
    '  float band=pow(clamp(1.0-abs(y)*3.4,0.0,1.0),2.2);',
    '  dusk=mix(dusk,hor,band);',
    '  float sa=max(dot(d,uSun),0.0);',
    '  dusk+=vec3(1.0,0.46,0.16)*pow(sa,7.0)*0.55;',
    '  dusk+=vec3(1.0,0.62,0.28)*pow(sa,120.0)*0.9;',
    '  dusk+=vec3(0.30,0.20,0.16)*pow(clamp(1.0-abs(y)*1.2,0.0,1.0),6.0)*0.55;',
    '  vec3 space=vec3(0.012,0.017,0.032);',
    '  space+=vec3(0.55,0.66,1.0)*pow(sa,320.0)*1.2;',
    '  space+=vec3(0.18,0.24,0.45)*pow(sa,14.0)*0.10;',
    '  vec3 col=mix(dusk,space,clamp(uSpace,0.0,1.0));',
    '  gl_FragColor=vec4(col,1.0);',
    '}'
  ].join('\n')
});
var sky=new THREE.Mesh(new THREE.SphereGeometry(9000,40,24),skyMat);
sky.material.toneMapped=false;
sky.renderOrder=-10;
scene.add(sky);

/* ═══════════ STARS ═══════════ */
function makeStars(count,radius,size,opacity){
  var g=new THREE.BufferGeometry();
  var pos=new Float32Array(count*3),col=new Float32Array(count*3);
  for(var i=0;i<count;i++){
    var u=Math.random()*2-1, a=Math.random()*Math.PI*2;
    var r=Math.sqrt(1-u*u);
    var R=radius*(0.92+Math.random()*0.16);
    pos[i*3]=Math.cos(a)*r*R; pos[i*3+1]=u*R; pos[i*3+2]=Math.sin(a)*r*R;
    var b=Math.pow(Math.random(),2.1);
    var t=Math.random();
    var cr=lerp(0.72,1.0,t), cg=lerp(0.80,0.96,t), cb=lerp(1.0,0.90,t);
    col[i*3]=cr*(0.22+b*1.5); col[i*3+1]=cg*(0.22+b*1.5); col[i*3+2]=cb*(0.22+b*1.5);
  }
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  var m=new THREE.PointsMaterial({size:size,sizeAttenuation:false,vertexColors:true,
    transparent:true,opacity:opacity,depthWrite:false,blending:THREE.AdditiveBlending,map:makeDot(),fog:false});
  m.toneMapped=false;
  return new THREE.Points(g,m);
}
function makeDot(){
  var s=32,c=cv(s,s),x=c.getContext('2d');
  var g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.35,'rgba(255,255,255,.55)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(c);
}
var starsFar=makeStars(2600,4200,1.35,0);
var starsNear=makeStars(520,4200,2.7,0);
scene.add(starsFar); scene.add(starsNear);

/* sun sprites */
var sunGroup=new THREE.Group();
var sunGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_GLOW,color:0xffffff,transparent:true,
  opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false,fog:false}));
sunGlow.scale.set(760,760,1);
sunGlow.material.toneMapped=false;
var sunCore=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_CORE,color:0xffffff,transparent:true,
  opacity:1,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false,fog:false}));
sunCore.scale.set(120,120,1);
sunCore.material.toneMapped=false;
var sunStreak=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_STREAK,color:0xffe0b8,transparent:true,
  opacity:0.55,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false,fog:false}));
sunStreak.scale.set(2200,110,1);
sunStreak.material.toneMapped=false;
sunGroup.add(sunGlow); sunGroup.add(sunStreak); sunGroup.add(sunCore);
sunGroup.renderOrder=1;
scene.add(sunGroup);

/* ═══════════ LIGHTS ═══════════ */
var sun=new THREE.DirectionalLight(0xffcf9e,3.9);
sun.position.copy(SUNDIR).multiplyScalar(60);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-7; sun.shadow.camera.right=7;
sun.shadow.camera.top=7; sun.shadow.camera.bottom=-7;
sun.shadow.camera.near=1; sun.shadow.camera.far=140;
sun.shadow.bias=-0.0005;
sun.shadow.normalBias=0.035;
sun.shadow.radius=2.2;
scene.add(sun); scene.add(sun.target);

var fill=new THREE.HemisphereLight(0x3d5a86,0x2b1c10,1.25);
scene.add(fill);
var rim=new THREE.DirectionalLight(0x7fa0dd,0.55);
rim.position.set(0.6,0.9,0.8);
scene.add(rim);
var bounce=new THREE.DirectionalLight(0xff9a55,0.35);
bounce.position.set(1.0,-0.2,-0.4);
scene.add(bounce);

/* ═══════════ ENVIRONMENT MAP (for car paint) ═══════════ */
(function buildEnv(){
  var w=1024,h=512,c=cv(w,h),x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,0,h);
  g.addColorStop(0.00,'#0a1024');
  g.addColorStop(0.30,'#1b2740');
  g.addColorStop(0.42,'#3d4a63');
  g.addColorStop(0.48,'#8a6a4a');
  g.addColorStop(0.53,'#5a4436');
  g.addColorStop(0.62,'#2a2028');
  g.addColorStop(1.00,'#07070a');
  x.fillStyle=g;x.fillRect(0,0,w,h);
  // sun hot spot
  var sx=w*0.19, sy=h*0.5;
  var rg=x.createRadialGradient(sx,sy,0,sx,sy,h*0.5);
  rg.addColorStop(0,'rgba(255,246,226,1)');
  rg.addColorStop(0.08,'rgba(255,220,170,.85)');
  rg.addColorStop(0.3,'rgba(255,170,110,.20)');
  rg.addColorStop(1,'rgba(255,150,90,0)');
  x.fillStyle=rg;x.fillRect(0,0,w,h);
  // horizon haze
  var hg=x.createLinearGradient(0,h*0.42,0,h*0.62);
  hg.addColorStop(0,'rgba(255,190,130,0)');
  hg.addColorStop(0.5,'rgba(255,190,130,.22)');
  hg.addColorStop(1,'rgba(255,190,130,0)');
  x.fillStyle=hg;x.fillRect(0,h*0.42,w,h*0.2);
  var t=new THREE.CanvasTexture(c);
  t.mapping=THREE.EquirectangularReflectionMapping;
  t.encoding=THREE.sRGBEncoding;
  try{
    var pmrem=new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    var rt=pmrem.fromEquirectangular(t);
    scene.environment=rt.texture;
    pmrem.dispose();
  }catch(e){}
  t.dispose();
})();

/* ═══════════ GROUND + ROAD ═══════════ */
var WARM=new THREE.Color('#6b3f22').convertSRGBToLinear();
scene.fog=new THREE.Fog(WARM.getHex(),140,1500);
scene.fog.color.copy(WARM);

function groundTex(){
  var s=512,c=cv(s,s),x=c.getContext('2d');
  x.fillStyle='#6a5138';x.fillRect(0,0,s,s);
  for(var i=0;i<16000;i++){
    var a=Math.random()*0.14;
    var v=Math.random();
    x.fillStyle='rgba('+(150+v*80|0)+','+(118+v*66|0)+','+(88+v*50|0)+','+a+')';
    x.fillRect(Math.random()*s,Math.random()*s,Math.random()*3.4,Math.random()*3.4);
  }
  for(var k=0;k<90;k++){
    var gx=Math.random()*s, gy=Math.random()*s, r=rnd(18,80);
    var g=x.createRadialGradient(gx,gy,0,gx,gy,r);
    var dark=Math.random()>0.45;
    g.addColorStop(0,dark?'rgba(58,42,28,.26)':'rgba(168,136,98,.20)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g;x.beginPath();x.arc(gx,gy,r,0,7);x.fill();
  }
  return c;
}
var gTex=tx(groundTex(),150,150);
var ground=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000,1,1),
  new THREE.MeshStandardMaterial({map:gTex,color:C('#b08a62'),roughness:1,metalness:0}));
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-0.14,-1200);
ground.receiveShadow=true;
scene.add(ground);

function roadTex(){
  var s=512,c=cv(s,s),x=c.getContext('2d');
  x.fillStyle='#17171b';x.fillRect(0,0,s,s);
  for(var i=0;i<26000;i++){
    var v=Math.random();
    x.fillStyle='rgba('+(60+v*90|0)+','+(58+v*88|0)+','+(56+v*82|0)+','+(Math.random()*0.22)+')';
    x.fillRect(Math.random()*s,Math.random()*s,Math.random()*2.6,Math.random()*2.6);
  }
  // centre dashes: tile = 12m, dash 3m
  x.fillStyle='rgba(228,222,205,.80)';
  x.fillRect(s/2-4,s*0.06,8,s*0.30);
  // edge lines
  x.fillStyle='rgba(220,214,196,.42)';
  x.fillRect(s*0.075,0,4,s);
  x.fillRect(s*0.925-4,0,4,s);
  return c;
}
var rTex=tx(roadTex(),1,150);
var road=new THREE.Mesh(new THREE.PlaneGeometry(11,3600),
  new THREE.MeshStandardMaterial({map:rTex,roughness:0.88,metalness:0.0,color:C('#9a958e')}));
road.rotation.x=-Math.PI/2;
road.position.set(0,0.030,-900);
road.receiveShadow=true;
scene.add(road);

/* gravel shoulders */
var shTex=tx(groundTex(),2,300);
function shoulder(z){
  var m=new THREE.Mesh(new THREE.PlaneGeometry(3.4,3600),
    new THREE.MeshStandardMaterial({map:shTex,color:C('#8e7350'),roughness:1}));
  m.rotation.x=-Math.PI/2;
  m.position.set(0,0.045,-900);
  return m;
}
var shL=shoulder(); shL.position.x=-7.2; scene.add(shL);
var shR=shoulder(); shR.position.x=7.2; scene.add(shR);
var shoulders=[shL,shR];

/* roadside marker posts */
var postMat=new THREE.MeshStandardMaterial({color:C('#0d0d10'),roughness:0.9});
var postTopMat=new THREE.MeshStandardMaterial({color:C('#ff3b2f'),emissive:C('#ff2a1a'),emissiveIntensity:1.4,roughness:0.6});
var posts=new THREE.Group();
for(var pi=0;pi<26;pi++){
  var side=pi%2?1:-1;
  var pz=-40-Math.floor(pi/2)*46;
  var g1=new THREE.Mesh(new THREE.BoxGeometry(0.13,1.05,0.13),postMat);
  g1.position.set(side*7.4,0.52,pz);
  g1.castShadow=true;
  posts.add(g1);
  var g2=new THREE.Mesh(new THREE.BoxGeometry(0.155,0.10,0.155),postTopMat);
  g2.position.set(side*7.4,0.98,pz);
  posts.add(g2);
}
scene.add(posts);

/* distant mesas */
var mesaMat=new THREE.MeshStandardMaterial({color:C('#281c17'),roughness:1,metalness:0,flatShading:true});
var mesas=new THREE.Group();
for(var mi=0;mi<15;mi++){
  var ang=Math.PI*(0.05+Math.random()*1.15);
  var dist=rnd(620,1750);
  var hgt=rnd(16,52);
  var m=new THREE.Mesh(new THREE.CylinderGeometry(rnd(90,260),rnd(150,380),hgt,rnd(5,7)|0,1),mesaMat);
  m.position.set(Math.cos(ang)*dist*0.95,hgt/2-9,-Math.sin(ang)*dist-260);
  m.rotation.y=Math.random()*3;
  m.scale.y=rnd(0.55,1.3);
  mesas.add(m);
}
scene.add(mesas);

/* roadside scrub + rocks */
var bushMat=new THREE.MeshStandardMaterial({color:C('#2a1f16'),roughness:1,metalness:0,flatShading:true});
var bushes=new THREE.Group();
for(var bi2=0;bi2<70;bi2++){
  var bz=-18-Math.random()*430;
  var bside=Math.random()>0.5?1:-1;
  var bx=bside*rnd(13,42);
  var bs=rnd(0.30,1.05);
  var bm=new THREE.Mesh(new THREE.IcosahedronGeometry(1,0),bushMat);
  bm.position.set(bx,bs*0.42,bz);
  bm.scale.set(bs*rnd(0.8,1.6),bs*rnd(0.45,1.0),bs*rnd(0.8,1.6));
  bm.rotation.y=Math.random()*3;
  bm.castShadow=true;
  bushes.add(bm);
}
scene.add(bushes);

/* ═══════════ CAR ═══════════ */
var carRoot=new THREE.Group();      // holds car, oriented forward = -Z
var carBody=new THREE.Group();      // model space: +X forward
carRoot.add(carBody);
carBody.rotation.y=Math.PI/2;
scene.add(carRoot);

var paint=new THREE.MeshStandardMaterial({
  color:C('#a01221'), metalness:0.55, roughness:0.30, envMapIntensity:0.95
});
var paintDim=new THREE.MeshStandardMaterial({color:C('#6a0c16'),metalness:0.55,roughness:0.40,envMapIntensity:1.1});
var glass=new THREE.MeshStandardMaterial({color:C('#a8cfe6'),metalness:0.92,roughness:0.03,
  transparent:true,opacity:0.55,envMapIntensity:3.4,side:THREE.DoubleSide});
var blackMat=new THREE.MeshStandardMaterial({color:C('#111215'),roughness:0.72,metalness:0.2});
var innerMat=new THREE.MeshStandardMaterial({color:C('#0c0d10'),roughness:0.94,metalness:0.04});
var matte=new THREE.MeshStandardMaterial({color:C('#2a2b2f'),roughness:0.66,metalness:0.3});
var chrome=new THREE.MeshStandardMaterial({color:C('#b8bec7'),metalness:1.0,roughness:0.20,envMapIntensity:1.5});
var lightMat=new THREE.MeshStandardMaterial({color:C('#fff8e8'),emissive:C('#ffeec8'),emissiveIntensity:2.0,roughness:0.25});
var tailMat=new THREE.MeshStandardMaterial({color:C('#8f0d12'),emissive:C('#ff1a10'),emissiveIntensity:1.5,roughness:0.45});

/* ── side silhouette with real wheel arches, extruded across the width ── */
var WHEEL_R=0.335, WHEEL_XF=1.245, WHEEL_XR=-1.245, WHEEL_Z=0.715;
var shape=new THREE.Shape();
function arcTo(sh,cx,cy,r,a0,a1,steps){
  for(var i=0;i<=steps;i++){
    var a=lerp(a0,a1,i/steps);
    var px=cx+Math.cos(a)*r, py=cy+Math.sin(a)*r;
    if(i===0&&sh.__started) sh.lineTo(px,py); else if(i===0) sh.moveTo(px,py);
    else sh.lineTo(px,py);
  }
}
shape.moveTo(1.945,0.505);
shape.lineTo(1.925,0.655);
shape.lineTo(1.830,0.700);
shape.lineTo(1.560,0.742);
shape.lineTo(1.180,0.790);
shape.lineTo(0.820,0.838);
shape.lineTo(0.640,0.852);
/* dash wall down into the open cockpit */
shape.lineTo(0.560,0.845);
shape.lineTo(0.370,0.700);
shape.lineTo(0.300,0.640);
shape.lineTo(0.180,0.612);
/* cockpit floor */
shape.lineTo(-0.520,0.606);
shape.lineTo(-0.640,0.660);
shape.lineTo(-0.720,0.760);
shape.lineTo(-0.790,0.898);
/* rear deck */
shape.lineTo(-1.180,0.930);
shape.lineTo(-1.520,0.944);
shape.lineTo(-1.760,0.918);
shape.lineTo(-1.905,0.862);
shape.lineTo(-1.975,0.700);
shape.lineTo(-1.960,0.470);
shape.lineTo(-1.930,0.330);

function wheelTex(){
  var s=256,c=cv(s,s),x=c.getContext('2d');
  var cx=s/2;
  x.clearRect(0,0,s,s);
  x.fillStyle='#0d0e11';x.beginPath();x.arc(cx,cx,cx,0,7);x.fill();
  var g=x.createRadialGradient(cx,cx,cx*0.52,cx,cx,cx);
  g.addColorStop(0,'rgba(48,48,54,.5)');g.addColorStop(1,'rgba(6,6,8,.85)');
  x.fillStyle=g;x.beginPath();x.arc(cx,cx,cx,0,7);x.fill();
  /* tyre inner wall */
  x.fillStyle='#16171b';x.beginPath();x.arc(cx,cx,cx*0.80,0,7);x.fill();
  /* rim */
  var rg=x.createRadialGradient(cx-cx*0.2,cx-cx*0.2,cx*0.05,cx,cx,cx*0.62);
  rg.addColorStop(0,'#d8dde4');rg.addColorStop(0.6,'#9aa1aa');rg.addColorStop(1,'#5d646c');
  x.fillStyle=rg;x.beginPath();x.arc(cx,cx,cx*0.62,0,7);x.fill();
  x.fillStyle='#3a3f47';x.beginPath();x.arc(cx,cx,cx*0.585,0,7);x.fill();
  /* spokes */
  x.strokeStyle='#aab1ba';x.lineWidth=cx*0.10;x.lineCap='round';
  for(var i=0;i<5;i++){
    var a=i/5*Math.PI*2+0.3;
    x.beginPath();
    x.moveTo(cx+Math.cos(a)*cx*0.12,cx+Math.sin(a)*cx*0.12);
    x.lineTo(cx+Math.cos(a)*cx*0.55,cx+Math.sin(a)*cx*0.55);
    x.stroke();
  }
  /* hub */
  x.fillStyle='#2b2f35';x.beginPath();x.arc(cx,cx,cx*0.15,0,7);x.fill();
  x.fillStyle='#c2c8d0';x.beginPath();x.arc(cx,cx,cx*0.07,0,7);x.fill();
  /* brake caliper hint */
  x.fillStyle='#7a1b1b';
  x.beginPath();x.arc(cx,cx,cx*0.50,Math.PI*0.15,Math.PI*0.42);x.arc(cx,cx,cx*0.40,Math.PI*0.42,Math.PI*0.15,true);x.fill();
  return c;
}

/* — windshield — */
function buildShield(){
  var cols=7, rows=3, W=0.66, H=0.40;
  var pos=[],uv=[],idx=[];
  for(var r=0;r<=rows;r++){
    for(var c=0;c<=cols;c++){
      var u=c/cols, v=r/rows;
      var halfW=W*(1-0.06*v)+0.05;
      var x=lerp(0.615,0.285,v);
      var y=lerp(0.855,0.855+H,v);
      var z=lerp(-halfW,halfW,u);
      /* crown + rake */
      x-=Math.pow(Math.abs(z)/halfW,2)*0.075;
      z*=1-0.05*v;
      pos.push(x,y,z);
      uv.push(u,v);
    }
  }
  for(var r2=0;r2<rows;r2++){
    for(var c2=0;c2<cols;c2++){
      var a=r2*(cols+1)+c2,b=a+1,cc=a+cols+2,d=a+cols+1;
      idx.push(a,b,cc,a,cc,d);
    }
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

  x.fillStyle=og;x.fillRect(0,0,W,H);
  for(var i=0;i<1500;i++){
    var ox=Math.random()*W, oy=Math.random()*H, orr=rnd(20,140);
    var dark=Math.random()>0.5;
    var gg=x.createRadialGradient(ox,oy,0,ox,oy,orr);
    gg.addColorStop(0,dark?'rgba(3,14,28,.20)':'rgba(40,104,150,.13)');
    gg.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=gg;x.beginPath();x.arc(ox,oy,orr,0,7);x.fill();
  }

  /* ── land polygons ── */
  var P=function(lon,lat){return [(lon+180)/360*W,(90-lat)/180*H];};
  var POLYS=[
    /* africa */
    [[-17,15],[-16,21],[-6,26],[9,32],[20,32],[32,31],[35,22],[43,12],[51,11],[42,-2],[40,-12],[35,-22],[32,-28],[25,-34],[18,-34],[12,-18],[9,-1],[3,6],[-8,5],[-14,10]],
    /* eurasia */
    [[-9,36],[0,44],[-5,49],[2,51],[5,58],[11,58],[20,70],[30,70],[45,68],[60,70],[75,73],[90,75],[105,76],[120,73],[135,70],[160,70],[180,66],[180,58],[160,56],[140,50],[130,43],[126,38],[122,31],[110,20],[100,10],[95,6],[90,22],[80,10],[72,20],[60,25],[50,28],[45,37],[35,36],[30,40],[26,40],[20,42],[12,45],[3,43]],
    /* india */
    [[68,22],[72,20],[80,15],[87,20],[90,24],[80,30],[70,28]],
    /* n america */
    [[-168,65],[-160,70],[-140,70],[-120,70],[-95,68],[-80,70],[-60,60],[-55,50],[-70,45],[-70,30],[-82,25],[-97,26],[-105,20],[-112,30],[-125,40],[-125,49],[-135,58],[-150,60]],
    /* s america */
    [[-80,10],[-70,12],[-60,10],[-50,0],[-35,-6],[-38,-22],[-48,-25],[-58,-35],[-63,-42],[-68,-52],[-75,-50],[-72,-40],[-70,-20],[-78,-5]],
    /* australia */
    [[113,-22],[115,-33],[130,-32],[145,-38],[150,-35],[153,-25],[145,-15],[135,-12],[125,-14]],
    /* greenland */
    [[-45,60],[-20,70],[-20,82],[-45,84],[-60,78],[-55,68]],
    /* japan / nz / madagascar specks */
    [[130,33],[136,36],[141,42],[143,44],[139,38],[133,34]],
    [[166,-46],[172,-43],[175,-38],[173,-35],[168,-42]],
    [[43,-13],[49,-15],[50,-22],[47,-25],[44,-20]]
  ];
  function tracePoly(ctx,pp){
    ctx.beginPath();
    for(var i=0;i<pp.length;i++){
      var q=P(pp[i][0],pp[i][1]);
      if(i===0)ctx.moveTo(q[0],q[1]); else ctx.lineTo(q[0],q[1]);
    }
    ctx.closePath();
  }

  /* land mask */
  var lm=cv(W,H), lx=lm.getContext('2d');
  lx.fillStyle='#fff';
  for(var pi2=0;pi2<POLYS.length;pi2++){ tracePoly(lx,POLYS[pi2]); lx.fill(); }

  /* land colour with biomes */
  var lc=cv(W,H), lcx=lc.getContext('2d');
  lcx.fillStyle='#2c452b';lcx.fillRect(0,0,W,H);
  var BIOME=[
    {c:'#3e6134',n:1200},   // forest
    {c:'#2b4430',n:900},    // jungle
    {c:'#6d5c3c',n:900},    // desert
    {c:'#6a6350',n:700},    // steppe
    {c:'#55544a',n:600},    // mountain
    {c:'#7a6a48',n:500},    // arid
    {c:'#87a08a',n:260},    // tundra
    {c:'#41603a',n:800}     // grass
  ];
  for(var bi=0;bi<BIOME.length;bi++){
    var B=BIOME[bi];
    lcx.fillStyle=B.c;
    for(var bn=0;bn<B.n;bn++){
      var bx=Math.random()*W, by=Math.random()*H, br=rnd(9,64);
      /* deserts favour ±20-32 deg */
      if(B.c==='#7d6c46'||B.c==='#8a7a55'){
        var latB=Math.random();
        by=(latB<0.5?0.36+Math.random()*0.10:0.55+Math.random()*0.10)*H;
      }
      lcx.globalAlpha=rnd(0.10,0.42);
      lcx.beginPath();
      lcx.ellipse(bx,by,br,br*rnd(0.5,1.4),Math.random()*3,0,7);
      lcx.fill();
    }
    lcx.globalAlpha=1;
  }
  /* coastline sand */
  lcx.globalCompositeOperation='destination-over';
  lcx.fillStyle='#8f8055';lcx.fillRect(0,0,W,H);
  lcx.globalCompositeOperation='destination-in';
  lcx.drawImage(lm,0,0);
  x.drawImage(lc,0,0);

  /* coastline definition */
  x.lineJoin='round';
  for(var pi3=0;pi3<POLYS.length;pi3++){
    tracePoly(x,POLYS[pi3]);
    x.strokeStyle='rgba(176,206,196,.34)';x.lineWidth=3.5;x.stroke();
  }

  /* ── ice caps ── */
  var ag=x.createLinearGradient(0,0,0,H*0.115);
  ag.addColorStop(0,'rgba(240,248,252,1)');
  ag.addColorStop(1,'rgba(240,248,252,0)');
  x.fillStyle=ag;x.fillRect(0,0,W,H*0.115);
  var ag2=x.createLinearGradient(0,H,0,H*0.885);
  ag2.addColorStop(0,'rgba(242,249,253,1)');
  ag2.addColorStop(1,'rgba(242,249,253,0)');
  x.fillStyle=ag2;x.fillRect(0,H*0.885,W,H*0.115);

  /* ── clouds ── */
  var cl=cv(W,H), cx2=cl.getContext('2d');
  for(var ci=0;ci<1500;ci++){
    var cxp=Math.random()*W;
    var lat3=Math.random();
    /* banded structure */
    var band=0.30+0.70*Math.abs(Math.sin(lat3*Math.PI*2.4+0.4));
    var cyp=lat3*H;
    var cr=rnd(16,120);
    var al=rnd(0.10,0.46)*band;
    var cg2=cx2.createRadialGradient(cxp,cyp,0,cxp,cyp,cr);
    cg2.addColorStop(0,'rgba(255,255,255,'+al+')');
    cg2.addColorStop(0.55,'rgba(255,255,255,'+(al*0.35)+')');
    cg2.addColorStop(1,'rgba(255,255,255,0)');
    cx2.fillStyle=cg2;
    cx2.save();cx2.translate(cxp,cyp);cx2.scale(rnd(1.1,3.6),1);
    cx2.beginPath();cx2.arc(0,0,cr,0,7);cx2.fill();cx2.restore();
  }
  /* cyclonic swirls */
  for(var sw=0;sw<16;sw++){
    var sxp=Math.random()*W, syp=rnd(0.1,0.9)*H;
    for(var sp2=0;sp2<90;sp2++){
      var t2=sp2/90, ang2=(Math.random()-0.5)*0.6;
      var rr2=t2*rnd(60,170);
      var px2=sxp+Math.cos(ang2+t2*7)*rr2;
      var py2=syp+Math.sin(ang2+t2*7)*rr2*0.55;
      var al2=0.26*(1-t2);
      var sg=cx2.createRadialGradient(px2,py2,0,px2,py2,rnd(6,20));
      sg.addColorStop(0,'rgba(255,255,255,'+al2+')');
      sg.addColorStop(1,'rgba(255,255,255,0)');
      cx2.fillStyle=sg;cx2.beginPath();cx2.arc(px2,py2,18,0,7);cx2.fill();
    }
  }
  x.globalAlpha=0.95;
  x.drawImage(cl,0,0);
  for(var ci2=0;ci2<420;ci2++){
    var cxp2=Math.random()*W, cyp2=Math.random()*H;
    var cr2=rnd(26,150);
    var al3=rnd(0.18,0.55);
    var cg3=x.createRadialGradient(cxp2,cyp2,0,cxp2,cyp2,cr2);
    cg3.addColorStop(0,'rgba(255,255,255,'+al3+')');
    cg3.addColorStop(0.5,'rgba(255,255,255,'+(al3*0.4)+')');
    cg3.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=cg3;
    x.save();x.translate(cxp2,cyp2);x.scale(rnd(1.4,3.0),1);
    x.beginPath();x.arc(0,0,cr2,0,7);x.fill();x.restore();
  }
  x.globalAlpha=1;

  return c;
}

var CUT=13.35;
var ORBIT_POS=new THREE.Vector3(0,1240,-330);
var EARTH_OFFSET=new THREE.Vector3(0,-1250,-5300);

function carPosAt(t){
  if(t>=CUT) return ORBIT_POS.clone();
  var x=0;
  // forward travel
  var z=-26*t;
  if(t>5.6){
    var a=5.6,b=9.2,k=(26-7)/(b-a);
    var tt=Math.min(t,b), dt=tt-a;
    z=-26*5.6-(26*dt-0.5*k*dt*dt);
    if(t>b) z+= -7*Math.min(t-b,1.6);
  }
  // vertical
  var y=0;
  if(t<=5.6){ y=0.0+Math.sin(t*7.4)*0.006; }
  else if(t<=9.2){
    var u=(t-5.6)/3.6;
    y=3.45*smooth(u); y+=Math.sin(t*9.0)*0.012;
  } else {
    var u2=(t-9.2)/(CUT-9.2);
    y=3.45+760*Math.pow(smooth(u2),1.55);
  }
  return new THREE.Vector3(x,y,z);
}

function carRotAt(t){
  // pitch up during liftoff
  var pitch=0;
  if(t>5.2&&t<10) pitch=-0.30*smooth((t-5.2)/3.0);
  if(t>=10) pitch=-0.30;
  if(t>=CUT){
    var u=(t-CUT);
    return new THREE.Euler(
      -0.18+Math.sin(u*0.42)*0.085,
      1.34+u*0.075,
      0.085*Math.sin(u*0.33+1.1)
    );
  }
  return new THREE.Euler(pitch,0,Math.sin(t*3.1)*0.004);
}

/* azimuth: 0 = +X (right side), 90 = +Z (behind), 180 = -X, 270 = -Z (front) */
var KEYS=[
  // t,    r,   az,   h,    tgtY, fov
  [0.0,   8.2, 150,  0.72, 0.86, 38],
  [2.4,   6.7, 161,  0.80, 0.88, 35],
  [4.4,   7.2, 181,  1.00, 0.90, 36],
  [5.6,   8.6, 199,  1.55, 0.94, 38],
  [7.4,  11.0, 216,  2.60, 1.00, 40],
  [9.2,  13.2, 233,  2.30, 1.05, 43],
  [11.2, 11.2, 246, -1.30, 1.00, 47],
  [12.9,  9.2, 257, -3.80, 0.98, 52],
  // orbit
  [13.35, 7.1,  84,  1.05, 0.92, 42],
  [16.40, 8.1,  90,  2.30, 0.96, 40],
  [19.60, 8.7,  95,  0.15, 0.96, 41],
  [21.00, 9.8,  99, -0.55, 0.96, 42],
  [24.30,25.0, 102, -0.30, 0.96, 40],
  [26.00,33.0, 104,  0.90, 0.96, 38]
];

function sampleCam(t){
  var i=0;
  while(i<KEYS.length-2 && t>KEYS[i+1][0]) i++;
  var a=KEYS[i], b=KEYS[i+1];
  var span=Math.max(0.0001,b[0]-a[0]);
  var u=smooth(clamp((t-a[0])/span,0,1));
  var r=lerp(a[1],b[1],u);
  var az=lerp(a[2],b[2],u);
  var h=lerp(a[3],b[3],u);
  var ty=lerp(a[4],b[4],u);
  var fov=lerp(a[5],b[5],u);
  return {r:r,az:az*Math.PI/180,h:h,ty:ty,fov:fov};
}

function updateCamera(t,carPos){
  var s=sampleCam(t);
  var shake=0;
  if(t>5.6&&t<CUT) shake=(t<9.2?0.012:0.045)*smooth((t-5.6)/2.0);
  var sx=Math.sin(t*13.7)*shake+Math.sin(t*29.3)*shake*0.5;
  var sy=Math.cos(t*11.1)*shake+Math.sin(t*23.7)*shake*0.4;
  var cx=carPos.x+Math.cos(s.az)*s.r;
  var cz=carPos.z+Math.sin(s.az)*s.r;
  /* how much of the car's climb the camera follows */
  var f;
  if(t<5.6) f=0.55;
  else if(t<9.2) f=lerp(0.55,0.32,smooth((t-5.6)/3.6));
  else f=lerp(0.32,1.0,smooth((t-9.2)/0.85));
  if(t>=CUT) f=1.0;
  var cy=carPos.y*f+s.h;
  camera.position.set(cx+sx,cy+sy,cz+sx*0.6);
  camera.lookAt(carPos.x,carPos.y*f+s.ty,carPos.z+0.15);
  if(Math.abs(camera.fov-s.fov)>0.01){
    camera.fov=s.fov; camera.updateProjectionMatrix();
  }
  // slight dutch roll for orbit
  if(t>=CUT){
    var u2=(t-CUT);
    camera.rotation.z+=Math.sin(u2*0.29)*0.028;
  }
}

/* ═══════════ LOOP ═══════════ */
var fadeEl=document.getElementById('fade');
var flashEl=document.getElementById('flash');
var T=26.0;
var clock=new THREE.Clock();
var elapsed=START;

function updateOverlays(t){
  var black=0;
  if(t<1.0) black=1-smooth(t/1.0);
  if(t>24.2) black=smooth((t-24.2)/1.8);
  fadeEl.style.opacity=black.toFixed(3);
  var fl=0;
  if(t>12.82&&t<14.0){
    fl=t<CUT?smooth((t-12.82)/0.53):1-smooth((t-CUT)/0.62);
  }
  flashEl.style.opacity=fl.toFixed(3);
}

function frame(){
  var dt=Math.min(clock.getDelta(),0.05);
  elapsed+=dt;
  if(elapsed>T) elapsed-=T;
  var t=elapsed;

  /* ── car transform ── */
  var cp=carPosAt(t);
  var cr=carRotAt(t);
  carRoot.position.copy(cp);
  carRoot.rotation.set(cr.x,cr.y,cr.z);

  /* wheels */
  var spin=Math.min(t,9.0)*3.6;
  for(var i=0;i<wheels.length;i++) wheels[i].rotation.z=-spin;

  /* Starman wave */
  var wave=(t<CUT)?Math.sin(t*1.9)*0.05:Math.sin(t*1.25)*0.085;
  waveArm.rotation.z=wave;
  waveArm.rotation.x=wave*0.4;

  /* ── phases ── */
  var spaceAmt;
  if(t<8.4) spaceAmt=0;
  else spaceAmt=Math.pow(smooth((t-8.4)/4.6),0.85);
  if(t>=CUT) spaceAmt=1;
  skyUni.uSpace.value=spaceAmt;

  /* stars */
  var starA=t<8.0?0:smooth((t-8.0)/4.6);
  if(t>=CUT) starA=1;
  starsFar.material.opacity=starA*0.85;
  starsNear.material.opacity=starA*0.95;
  starsFar.position.copy(camera.position);
  starsNear.position.copy(camera.position);

  /* sky follows camera */
  sky.position.copy(camera.position);

  /* sun */
  var sunPos=new THREE.Vector3().copy(SUNDIR).multiplyScalar(5200).add(camera.position);
  sunGroup.position.copy(sunPos);
  sunGlow.material.opacity=0.55+0.45*spaceAmt;
  sunStreak.material.opacity=0.10+0.45*spaceAmt;
  sunCore.scale.setScalar(lerp(90,150,spaceAmt));

  /* ground fade during ascent */
  var gOp=1;
  if(t>9.2) gOp=1-smooth((t-9.2)/2.6);
  if(t>=CUT) gOp=0;
  var gOn=(gOp>0.004&&t<CUT);
  ground.visible=road.visible=posts.visible=mesas.visible=bushes.visible=gOn;
  shL.visible=shR.visible=gOn;
  ground.material.opacity=gOp; ground.material.transparent=gOp<1;
  road.material.opacity=gOp; road.material.transparent=gOp<1;
  if(t<CUT){
    ground.position.y=-0.14-1400*Math.pow(smooth((t-9.2)/3.7),1.4)*(t>9.2?1:0);
    road.position.y=0.030-1400*Math.pow(smooth((t-9.2)/3.7),1.4)*(t>9.2?1:0);
    shL.position.y=shR.position.y=0.045-1400*Math.pow(smooth((t-9.2)/3.7),1.4)*(t>9.2?1:0);
    posts.position.y=ground.position.y+0.02;
    bushes.position.y=ground.position.y+0.14;
    mesas.position.y=ground.position.y*0.9;
  }
  /* contact shadow */
  if(t<CUT){
    var lift=Math.max(0,cp.y-0.02);
    aoMesh.position.set(cp.x,0.055,cp.z);
    aoMesh.material.opacity=0.62*Math.max(0,1-lift/3.2);
    var asz=1+lift*0.30;
    aoMesh.scale.set(asz,asz,1);
    aoMesh.visible=true;
  } else aoMesh.visible=false;

  /* road scroll */
  if(t<CUT) rTex.offset.y=(t*26)/12;

  /* fog by phase */
  scene.fog.color.copy(WARM);
  scene.fog.near=lerp(140,600,spaceAmt);
  scene.fog.far=lerp(1500,3000,spaceAmt);

  /* sun light */
  sun.intensity=lerp(3.4,2.6,spaceAmt);
  fill.intensity=lerp(0.55,0.16,spaceAmt);
  rim.intensity=lerp(0.35,0.30,spaceAmt);

  /* ── thruster ── */
  var th=0;
  if(t>5.2&&t<9.6) th=smooth((t-5.2)/1.1);
  else if(t>=9.6&&t<CUT) th=1;
  else if(t>=CUT) th=0;
  var flick=0.88+Math.sin(t*33)*0.08+Math.sin(t*19.7)*0.05;
  for(var pi=0;pi<plume.length;pi++){
    var pp=plume[pi], fz2=pp.userData.f;
    pp.material.opacity=th*Math.pow(1-fz2,1.25)*0.85*flick;
    var ps=lerp(1.85,0.55,Math.pow(fz2,0.65))*(0.80+th*0.5)*flick;
    pp.scale.set(ps,ps,1);
    pp.position.x=-1.80-fz2*3.4*(0.55+th*0.7);
    pp.position.y=0.62-fz2*1.30*(0.55+th*0.7);
  }
  tLight.intensity=th*10.0*flick;

  /* dust */
  for(var d=0;d<dust.children.length;d++){
    var sp=dust.children[d], ud=sp.userData;
    var life=th;
    sp.material.opacity=life*0.32*(0.6+0.4*Math.sin(t*ud.sp*3+ud.ph));
    var rr=ud.r*(1+th*2.1);
    sp.position.set(Math.cos(ud.a+t*0.4)*rr,0.10+th*0.7,Math.sin(ud.a+t*0.4)*rr);
    var ss=(1.4+th*3.2);
    sp.scale.set(ss*1.5,ss*0.7,1);
  }

  /* ascent streaks */
  var sAmt=(t>10.4&&t<CUT)?smooth((t-10.4)/1.8):0;
  for(var k=0;k<streaks.children.length;k++){
    var s2=streaks.children[k], ud2=s2.userData;
    s2.material.opacity=sAmt*0.32;
    ud2.z+=ud2.sp*dt*3.2;
    if(ud2.z>40){ ud2.z=-70; ud2.x=rnd(-26,26); ud2.y=rnd(-26,26); }
    s2.position.set(ud2.x,ud2.y,ud2.z);
    s2.scale.set(0.5,ud2.len*(1+sAmt*2.4),1);
  }
  streaks.visible=sAmt>0.001;

  /* ── earth ── */
  var earthOn=t>=CUT;
  earth.visible=earthOn;
  if(earthOn){
    earth.position.copy(ORBIT_POS).add(EARTH_OFFSET);
    earth.rotation.y=(t-CUT)*0.006;
  }

  earthMat.uniforms.uCam.value.copy(camera.position);
  atmo.material.uniforms.uSun.value.copy(SUNDIR);
  updateCamera(t,cp);
  updateOverlays(t);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

window.addEventListener('resize',function(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

/* warm up shaders then start */
earth.visible=true; atmo.visible=true;
earth.position.copy(ORBIT_POS).add(EARTH_OFFSET);
renderer.compile(scene,camera);
earth.visible=false;

requestAnimationFrame(frame);
})();
</script>
