const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

/* ================= canvas textures ================= */
function radialTexture(stops,size){
  size=size||128;
  const c=document.createElement('canvas'); c.width=c.height=size;
  const g=c.getContext('2d');
  const grd=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  for(const s of stops) grd.addColorStop(s[0],s[1]);
  g.fillStyle=grd; g.fillRect(0,0,size,size);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
const flameTex=radialTexture([[0,'rgba(255,255,255,1)'],[0.22,'rgba(255,228,190,0.95)'],[0.55,'rgba(255,150,70,0.4)'],[1,'rgba(255,110,40,0)']]);

/* ================= GPU point-sprite factory ================= */
function makePoints(count,texture,blending){
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(count*3);
  const col=new Float32Array(count*3);
  const siz=new Float32Array(count);
  const alp=new Float32Array(count);
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aColor',new THREE.BufferAttribute(col,3));
  geo.setAttribute('aSize',new THREE.BufferAttribute(siz,1));
  geo.setAttribute('aAlpha',new THREE.BufferAttribute(alp,1));
  const mat=new THREE.ShaderMaterial({
    uniforms:{ uTex:{value:texture}, uScale:{value:Math.min(window.devicePixelRatio||1,2)} },
    vertexShader:[
      'attribute vec3 aColor;','attribute float aSize;','attribute float aAlpha;',
      'uniform float uScale;','varying vec3 vColor;','varying float vAlpha;',
      'void main(){',
      '  vColor=aColor; vAlpha=aAlpha;',
      '  vec4 mv=modelViewMatrix*vec4(position,1.0);',
      '  gl_PointSize=aSize*uScale*(240.0/max(0.1,-mv.z));',
      '  gl_Position=projectionMatrix*mv;',
      '}'
    ].join('\n'),
    fragmentShader:[
      'uniform sampler2D uTex;','varying vec3 vColor;','varying float vAlpha;',
      'void main(){',
      '  vec4 t=texture2D(uTex,gl_PointCoord);',
      '  vec3 rgb=vColor*vAlpha*t.rgb;',
      '  float a=t.a*vAlpha;',
      '  if(a<0.004 && dot(rgb,rgb)<0.004) discard;',
      '  gl_FragColor=vec4(rgb,a);',
      '}'
    ].join('\n'),
    transparent:true, depthWrite:false, blending:blending
  });
  const points=new THREE.Points(geo,mat);
  points.frustumCulled=false;
  return {points:points,geo:geo,pos:pos,col:col,siz:siz,alp:alp};
}
const allPointSystems=[];

/* ================= flame particles (ring-local) ================= */
class Flames{
  constructor(parent){
    this.N=240;
    this.sys=makePoints(this.N,flameTex,THREE.AdditiveBlending);
    allPointSystems.push(this.sys);
    this.parts=[];
    for(let i=0;i<this.N;i++){ const p={}; this.reset(p,true); this.parts.push(p); }
    this.surge=0;
    parent.add(this.sys.points);
  }
  reset(p,randomLife){
    p.ang=rand(0,Math.PI*2);
    p.rad=rand(-0.05,0.10);
    p.max=rand(0.5,1.15);
    p.life=randomLife?rand(0,p.max):0;
    p.spd=rand(0.4,1.3);
    p.wob=rand(0,Math.PI*2);
    p.drift=rand(0.4,1.2);
    p.z=rand(-0.14,0.14);
    p.size=rand(0.35,0.75);
  }
  update(dt,t){
    this.surge=Math.max(0,this.surge-dt*0.7);
    const inten=1+this.surge*0.9;
    const pos=this.sys.pos,col=this.sys.col,siz=this.sys.siz,alp=this.sys.alp;
    for(let i=0;i<this.N;i++){
      const p=this.parts[i];
      p.life+=dt;
      if(p.life>=p.max) this.reset(p,false);
      const u=p.life/p.max;
      p.ang+=dt*p.spd*0.7;
      const wob=Math.sin(p.wob+t*3.1)*0.06;
      const r=ringR+p.rad+u*0.5*p.drift*inten;
      pos[i*3]  =Math.cos(p.ang)*r+wob;
      pos[i*3+1]=Math.sin(p.ang)*r+u*0.8*p.drift*inten+wob*0.6;
      pos[i*3+2]=p.z+u*0.1;
      const heat=Math.pow(1-u,0.75);
      const fl=0.85+0.15*Math.sin(t*11+p.wob*7);
      col[i*3]  =heat*fl*inten;
      col[i*3+1]=lerp(0.9,0.12,u)*heat*fl;
      col[i*3+2]=lerp(0.5,0.02,u)*heat;
      siz[i]=p.size*(0.45+0.55*heat)*(0.7+0.5*this.surge)*inten;
      alp[i]=heat;
    }
    this.sys.geo.attributes.position.needsUpdate=true;
    this.sys.geo.attributes.aColor.needsUpdate=true;
    this.sys.geo.attributes.aSize.needsUpdate=true;
    this.sys.geo.attributes.aAlpha.needsUpdate=true;
  }
}

/* ================= rising embers (ring-local) ================= */
class Embers{
  constructor(parent){
    this.N=42;
    this.sys=makePoints(this.N,flameTex,THREE.AdditiveBlending);
    allPointSystems.push(this.sys);
    this.parts=[];
    for(let i=0;i<this.N;i++){ const p={}; this.reset(p,true); this.parts.push(p); }
    parent.add(this.sys.points);
  }
  reset(p,randomLife){
    const a=rand(0,Math.PI*2);
    p.x=Math.cos(a)*ringR*rand(0.7,1.1);
    p.y=Math.sin(a)*ringR*rand(0.7,1.1);
    p.z=rand(-0.2,0.2);
    p.vx=rand(-0.15,0.15); p.vy=rand(0.7,1.5); p.vz=rand(-0.1,0.1);
    p.max=rand(1.6,3.4);
    p.life=randomLife?rand(0,p.max):0;
    p.sway=rand(0,Math.PI*2);
    p.size=rand(0.08,0.2);
  }
  update(dt,t){
    const pos=this.sys.pos,col=this.sys.col,siz=this.sys.siz,alp=this.sys.alp;
    for(let i=0;i<this.N;i++){
      const p=this.parts[i];
      p.life+=dt;
      if(p.life>=p.max) this.reset(p,false);
      const u=p.life/p.max;
      p.x+=(p.vx+Math.sin(t*1.8+p.sway)*0.25)*dt;
      p.y+=p.vy*dt;
      p.z+=(p.vz+Math.cos(t*1.5+p.sway)*0.2)*dt;
      p.vy*=(1-0.12*dt);
      pos[i*3]=p.x; pos[i*3+1]=p.y; pos[i*3+2]=p.z;
      const f=1-u;
      col[i*3]=f; col[i*3+1]=0.42*f; col[i*3+2]=0.08*f;
      siz[i]=p.size*(1-u*0.5);
      alp[i]=f*0.85;
    }
    this.sys.geo.attributes.position.needsUpdate=true;
    this.sys.geo.attributes.aColor.needsUpdate=true;
    this.sys.geo.attributes.aSize.needsUpdate=true;
    this.sys.geo.attributes.aAlpha.needsUpdate=true;
  }
}

/* ================= dust (world space) ================= */
class Dust{
  constructor(parent){
    this.N=110;
    this.sys=makePoints(this.N,dustTex,THREE.NormalBlending);
    allPointSystems.push(this.sys);
    this.parts=[];
    for(let i=0;i<this.N;i++) this.parts.push({life:1,max:1,x:0,y:-10,z:0,vx:0,vy:0,vz:0,size:0});
    this.cursor=0;
    parent.add(this.sys.points);
  }
  spawn(x,y,z,vx,vy,vz,life,size){
    const p=this.parts[this.cursor];
    this.cursor=(this.cursor+1)%this.N;
    p.x=x; p.y=y; p.z=z; p.vx=vx; p.vy=vy; p.vz=vz; p.life=0; p.max=life; p.size=size;
  }
  burst(x,z,n,power){
    for(let i=0;i<n;i++){
      const a=rand(0,Math.PI*2), r=rand(0.1,0.5)*power;
      this.spawn(x+Math.cos(a)*0.3*rand(0,1), rand(0.02,0.15), z+Math.sin(a)*0.3*rand(0,1),
        Math.cos(a)*r*rand(0.5,1.5), rand(0.5,1.4)*power*0.6, Math.sin(a)*r*rand(0.5,1.5),
        rand(0.5,1.1), rand(0.5,1.1)*power*0.5);
    }
  }
  update(dt){
    const pos=this.sys.pos,col=this.sys.col,siz=this.sys.siz,alp=this.sys.alp;
    for(let i=0;i<this.N;i++){
      const p=this.parts[i];
      p.life+=dt;
      if(p.life<p.max){
        p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
        p.vy-=0.6*dt; p.vx*=(1-1.8*dt); p.vz*=(1-1.8*dt);
        if(p.y<0.02){ p.y=0.02; p.vy=0; }
        const u=p.life/p.max;
        pos[i*3]=p.x; pos[i*3+1]=p.y; pos[i*3+2]=p.z;
        const c=0.62*(1-u*0.7);
        col[i*3]=c; col[i*3+1]=c*0.88; col[i*3+2]=c*0.7;
        siz[i]=p.size*(0.6+u*1.6);
        alp[i]=(1-u)*0.55;
      } else {
        alp[i]=0; siz[i]=0; pos[i*3+1]=-10;
      }
    }
    this.sys.geo.attributes.position.needsUpdate=true;
    this.sys.geo.attributes.aColor.needsUpdate=true;
    this.sys.geo.attributes.aSize.needsUpdate=true;
    this.sys.geo.attributes.aAlpha.needsUpdate=true;
  }
}

/* ================= procedural lion ================= */
function buildLion(){
  const L={phase:0};
  const root=new THREE.Group();
  const body=new THREE.Group();
  body.position.y=1.09;
  root.add(body);

  const M={
    fur:  new THREE.MeshStandardMaterial({color:0xd9943a,roughness:0.85,flatShading:true}),
    light:new THREE.MeshStandardMaterial({color:0xecc07a,roughness:0.9, flatShading:true}),
    mane: new THREE.MeshStandardMaterial({color:0xa34d12,roughness:0.9, flatShading:true}),
    maneD:new THREE.MeshStandardMaterial({color:0x7c340a,roughness:0.95,flatShading:true}),
    dark: new THREE.MeshStandardMaterial({color:0x2a180c,roughness:0.9})
  };

  const torso=new THREE.Mesh(new THREE.CapsuleGeometry(0.55,1.0,6,12),M.fur);
  torso.rotation.z=Math.PI/2;
  torso.scale.set(0.92,1,0.85);
  body.add(torso);

  const chest=new THREE.Mesh(new THREE.SphereGeometry(0.60,10,8),M.fur);
  chest.position.set(0.55,-0.05,0);
  chest.scale.set(1,0.95,0.88);
  body.add(chest);

  const hips=new THREE.Mesh(new THREE.SphereGeometry(0.56,10,8),M.fur);
  hips.position.set(-0.58,-0.02,0);
  hips.scale.set(1,0.92,0.85);
  body.add(hips);

  const neck=new THREE.Mesh(new THREE.CapsuleGeometry(0.32,0.42,4,8),M.fur);
  neck.position.set(0.98,0.26,0);
  neck.rotation.z=-0.7;
  body.add(neck);

  /* head */
  const head=new THREE.Group();
  head.position.set(1.30,0.44,0);
  body.add(head);

  const skull=new THREE.Mesh(new THREE.SphereGeometry(0.46,12,10),M.fur);
  skull.position.set(0.10,0,0);
  skull.scale.set(1.05,0.95,0.9);
  head.add(skull);

  const mane=new THREE.Group();
  head.add(mane);
  const petalGeo=new THREE.ConeGeometry(0.30,0.85,5);
  for(let i=0;i<16;i++){
    const a=i/16*Math.PI*2;
    const pt=new THREE.Mesh(petalGeo,i%2?M.mane:M.maneD);
    pt.position.set(Math.cos(a)*0.60,Math.sin(a)*0.60,-0.10);
    pt.rotation.z=a-Math.PI/2;
    pt.rotation.x=0.12*Math.sin(a);
    pt.scale.set(1,1,0.5);
    mane.add(pt);
  }
  const petal2Geo=new THREE.ConeGeometry(0.22,0.60,5);
  for(let i=0;i<10;i++){
    const a=i/10*Math.PI*2+0.31;
    const pt=new THREE.Mesh(petal2Geo,M.mane);
    pt.position.set(Math.cos(a)*0.42,Math.sin(a)*0.42,-0.16);
    pt.rotation.z=a-Math.PI/2;
    pt.scale.set(1,1,0.5);
    mane.add(pt);
  }

  const muzzle=new THREE.Mesh(new THREE.CapsuleGeometry(0.19,0.28,4,8),M.light);
  muzzle.rotation.z=Math.PI/2;
  muzzle.position.set(0.52,-0.12,0);
  head.add(muzzle);

  const nose=new THREE.Mesh(new THREE.SphereGeometry(0.10,8,6),M.dark);
  nose.position.set(0.80,-0.06,0);
  head.add(nose);

  const jaw=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.13,0.30),M.light);
  jaw.position.set(0.48,-0.30,0);
  head.add(jaw);

  const earGeo=new THREE.ConeGeometry(0.13,0.26,4);
  const earL=new THREE.Mesh(earGeo,M.fur);
  earL.position.set(0.02,0.46,0.24);
  earL.rotation.x=0.25;
  head.add(earL);
  const earR=new THREE.Mesh(earGeo,M.fur);
  earR.position.set(0.02,0.46,-0.24);
  earR.rotation.x=-0.25;
  head.add(earR);

  const eyeGeo=new THREE.SphereGeometry(0.075,8,6);
  const eyeL=new THREE.Mesh(eyeGeo,M.dark);
  eyeL.position.set(0.33,0.13,0.37);
  head.add(eyeL);
  const eyeR=new THREE.Mesh(eyeGeo,M.dark);
  eyeR.position.set(0.33,0.13,-0.37);
  head.add(eyeR);

  /* legs */
  function makeLeg(fx,fz){
    const hip=new THREE.Group();
    hip.position.set(fx,-0.12,fz);
    body.add(hip);
    const upper=new THREE.Mesh(new THREE.CapsuleGeometry(0.16,0.30,4,8),M.fur);
    upper.position.y=-0.24;
    hip.add(upper);
    const knee=new THREE.Group();
    knee.position.y=-0.46;
    hip.add(knee);
    const lower=new THREE.Mesh(new THREE.CapsuleGeometry(0.11,0.30,4,8),M.fur);
    lower.position.y=-0.20;
    knee.add(lower);
    const paw=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.14,0.26),M.light);
    paw.position.set(0.03,-0.44,0);
    knee.add(paw);
    return {hip:hip,knee:knee};
  }
  L.FL=makeLeg(0.62,0.30);
  L.FR=makeLeg(0.62,-0.30);
  L.HL=makeLeg(-0.62,0.30);
  L.HR=makeLeg(-0.62,-0.30);

  /* tail */
  const tail=new THREE.Group();
  tail.position.set(-0.98,0.20,0);
  body.add(tail);
  const tseg1=new THREE.Mesh(new THREE.CapsuleGeometry(0.085,0.42,4,6),M.fur);
  tseg1.position.set(-0.26,0.06,0);
  tseg1.rotation.z=1.15;
  tail.add(tseg1);
  const tseg2=new THREE.Group();
  tseg2.position.set(-0.58,0.40,0);
  tail.add(tseg2);
  const tseg2m=new THREE.Mesh(new THREE.CapsuleGeometry(0.07,0.34,4,6),M.fur);
  tseg2m.position.set(-0.12,0.14,0);
  tseg2m.rotation.z=0.9;
  tseg2.add(tseg2m);
  const tuft=new THREE.Mesh(new THREE.ConeGeometry(0.13,0.34,5),M.maneD);
  tuft.position.set(-0.26,0.32,0);
  tuft.rotation.z=1.0;
  tseg2.add(tuft);

  root.traverse(function(o){ if(o.isMesh) o.castShadow=true; });

  L.root=root; L.body=body; L.head=head; L.mane=mane;
  L.tail=tail; L.tseg2=tseg2; L.earL=earL; L.earR=earR;
  return L;
}

const lion=buildLion();
scene.add(lion.root);

/* ================= animation ================= */
const T=13;                 // one full loop, seconds
let lionClock=0;            // time-scaled clock (slow-mo during the leap)
let shake=0;
let dustTimer=0;
let prevT=0;

function poseLion(t,lt,dt,ts){
  let x=-9.5, rootY=0, s=0, crouch=0, absorb=0, idle=0, flightU=0;
  if(t<0.4){ x=-9.5; }
  else if(t<4.4){ const tt=(t-0.4)/4; x=-9.5+7.2*Math.pow(tt,1.25); s=Math.pow(tt,0.25); }   // run-in
  else if(t<4.9){ x=-2.3; crouch=smooth(4.4,4.65,t)*(1-smooth(4.82,4.94,t)); }                 // anticipation
  else if(t<6.9){ const u=(t-4.9)/2; flightU=u; x=lerp(-2.3,2.7,u); rootY=4*2.0*u*(1-u); }     // the leap
  else if(t<9.3){ const tt=(t-6.9)/2.4; x=2.7+2.9*easeOutQuad(tt); s=Math.max(0,1-tt);         // landing run-out
                  absorb=smooth(6.9,7.1,t)*(1-smooth(7.35,7.8,t)); }
  else { x=5.6; idle=smooth(9.3,9.8,t); }                                                        // proud idle

  const flightW=smooth(4.88,5.02,t)*(1-smooth(6.72,6.9,t));

  if(s>0.001) lion.phase+=dt*ts*s*7.5;
  const p=lion.phase;

  /* trot gait (diagonal pairs) */
  let fl=Math.sin(p)*0.72*s,          fr=Math.sin(p+Math.PI)*0.72*s;
  let hl=Math.sin(p+Math.PI)*0.62*s,  hr=Math.sin(p)*0.62*s;
  let flk=-Math.max(0,Math.sin(p+0.5))*0.95*s,        frk=-Math.max(0,Math.sin(p+0.5+Math.PI))*0.95*s;
  let hlk= Math.max(0,Math.sin(p+0.5+Math.PI))*0.9*s, hrk= Math.max(0,Math.sin(p+0.5))*0.9*s;
  let bob=Math.abs(Math.sin(p))*0.045*s;
  let pitch=-0.06*s+Math.sin(p*2)*0.035*s;
  let roll=Math.sin(p)*0.035*s;

  /* crouch: coil down */
  fl-=0.15*crouch; fr-=0.15*crouch; hl+=0.22*crouch; hr+=0.22*crouch;
  flk-=0.55*crouch; frk-=0.55*crouch; hlk+=0.6*crouch; hrk+=0.6*crouch;
  pitch-=0.10*crouch;

  /* flight pose: tuck then stretch for landing */
  const e=smooth(0.45,0.95,flightU);
  const ffl=lerp(-1.05,0.30,e),  fhl=lerp(0.95,-0.30,e);
  const fflk=lerp(-1.25,-0.15,e), fhlk=lerp(1.15,0.20,e);
  const fPitch=flightU<0.5 ? lerp(0.30,-0.08,flightU*2) : lerp(-0.08,-0.40,(flightU-0.5)*2);
  const arc=Math.sin(flightU*Math.PI);

  fl=lerp(fl,ffl,flightW);  fr=lerp(fr,ffl,flightW);
  hl=lerp(hl,fhl,flightW);  hr=lerp(hr,fhl,flightW);
  flk=lerp(flk,fflk,flightW); frk=lerp(frk,fflk,flightW);
  hlk=lerp(hlk,fhlk,flightW); hrk=lerp(hrk,fhlk,flightW);
  pitch=lerp(pitch,fPitch,flightW);
  bob*=(1-flightW);

  /* landing absorb */
  flk-=0.35*absorb; frk-=0.35*absorb;
  pitch+=0.07*absorb;

  lion.FL.hip.rotation.z=fl;  lion.FL.knee.rotation.z=flk;
  lion.FR.hip.rotation.z=fr;  lion.FR.knee.rotation.z=frk;
  lion.HL.hip.rotation.z=hl;  lion.HL.knee.rotation.z=hlk;
  lion.HR.hip.rotation.z=hr;  lion.HR.knee.rotation.z=hrk;

  lion.root.position.set(x,rootY,0);
  lion.body.position.y=1.09+bob-0.14*crouch-0.09*absorb;
  lion.body.rotation.z=pitch;
  lion.body.rotation.x=roll*(1-flightW);
  lion.body.scale.set(1,(1+0.07*arc*flightW)*(1+0.018*idle*Math.sin(lt*2.3)),1);

  /* head */
  let headZ=-pitch*0.55, headY=0;
  if(idle>0){
    headY=-0.5*idle*(0.55+0.45*Math.sin(lt*0.35));
    headZ+=0.10*Math.sin(lt*0.9)*idle+0.16*smooth(10.8,11.3,t)*idle;
  } else if(s>0.02){
    headZ+=Math.sin(p)*0.05*s;
  }
  lion.head.rotation.z=headZ;
  lion.head.rotation.y=headY;

  /* mane flare + tail */
  lion.mane.scale.setScalar(1+0.10*arc*flightW+0.015*idle*Math.sin(lt*2.3));
  lion.tail.rotation.z=0.15+0.16*Math.sin(lt*2.2)*(0.3+s)+flightW*(0.75+0.12*Math.sin(lt*3.1));
  lion.tseg2.rotation.z=0.35+0.3*Math.sin(lt*2.2-0.9)+flightW*0.35;

  /* ear twitch */
  const tw=Math.pow(Math.max(0,Math.sin(lt*1.13)*Math.sin(lt*0.41)),3);
  lion.earL.rotation.z=0.3*tw*idle;

  return {x:x,s:s,rootY:rootY};
}

/* ================= camera ================= */
const camPos=new THREE.Vector3(-4.28,2.8,9.7);
const camTgt=new THREE.Vector3(-6.65,1.45,0);

function updateCamera(t,rt,dt,lionX){
  const f=smooth(4.85,5.15,t)*(1-smooth(6.55,6.9,t));   // flight dolly-in
  let px,py,pz,tx,ty,tz;
  if(t>=9.3){
    px=2.4+0.35*Math.sin(rt*0.22); py=2.9; pz=8.6;
    tx=5.5; ty=1.5; tz=0;
  } else {
    px=lionX*0.45; py=2.8; pz=9.7;
    tx=lionX*0.7; ty=1.45; tz=0;
  }
  px=lerp(px,lionX*0.22,f); py=lerp(py,3.35,f); pz=lerp(pz,8.0,f);
  tx=lerp(tx,0,f);          ty=lerp(ty,2.2,f);
  /* handheld sway */
  px+=0.05*Math.sin(rt*1.7)+0.03*Math.sin(rt*3.1+2);
  py+=0.04*Math.sin(rt*2.3+1)+0.02*Math.sin(rt*4.1);
  /* landing shake */
  px+=0.12*shake*Math.sin(rt*47);
  py+=0.10*shake*Math.sin(rt*39+2);
  const k=1-Math.exp(-dt*3.2);
  camPos.x+=(px-camPos.x)*k; camPos.y+=(py-camPos.y)*k; camPos.z+=(pz-camPos.z)*k;
  camTgt.x+=(tx-camTgt.x)*k; camTgt.y+=(ty-camTgt.y)*k; camTgt.z+=(tz-camTgt.z)*k;
  camera.position.copy(camPos);
  camera.lookAt(camTgt);
  const fov=lerp(42,37.5,f);
  if(Math.abs(camera.fov-fov)>0.01){ camera.fov=fov; camera.updateProjectionMatrix(); }
}

/* ================= main loop ================= */
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const rt=clock.elapsedTime;
  const t=rt%T;

  /* slow-mo while airborne */
  const ts=1-0.55*smooth(4.7,5.0,t)*(1-smooth(6.7,6.95,t));
  lionClock+=dt*ts;

  /* one-shot triggers */
  if(prevT<5.75&&t>=5.75) flames.surge=1;                                  // roar of flame as the lion passes through
  if(prevT<6.9&&t>=6.9){ dust.burst(2.7,0,30,2.2); shake=1; }              // touchdown
  prevT=t;

  const st=poseLion(t,lionClock,dt,ts);

  /* hoof-dust while running */
  if(st.s>0.25&&st.rootY<0.01){
    dustTimer+=dt;
    if(dustTimer>0.13){
      dustTimer=0;
      dust.spawn(st.x-0.55+rand(-0.15,0.15),0.06,rand(-0.35,0.35),
        -rand(0.4,0.9),rand(0.25,0.6),rand(-0.3,0.3),rand(0.4,0.7),rand(0.35,0.6));
    }
  }

  flames.update(dt*ts,rt);
  embers.update(dt*ts,rt);
  dust.update(dt);

  /* fire flicker + surge */
  const fl=0.85+0.12*Math.sin(rt*12.7)+0.08*Math.sin(rt*31.7)+flames.surge*0.55;
  ringMat.emissiveIntensity=2.0*fl;
  fireLight.intensity=95*fl;
  glow.material.opacity=0.30*fl+0.08*flames.surge;
  pool.material.opacity=0.12*fl+0.06*flames.surge;
  ringGroup.scale.setScalar(1+0.015*Math.sin(rt*9)+0.045*flames.surge);

  updateCamera(t,rt,dt,st.x);
  shake*=Math.exp(-dt*3.2);

  /* loop fade */
  let fade=0;
  if(t>11.7) fade=smooth(11.7,12.4,t);
  else if(t<0.5) fade=1-smooth(0,0.5,t);
  fadeEl.style.opacity=fade.toFixed(3);

  renderer.render(scene,camera);
}
animate();

/* ================= resize ================= */
window.addEventListener('resize',function(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  const pr=Math.min(window.devicePixelRatio||1,2);
  renderer.setPixelRatio(pr);
  for(const sys of allPointSystems) sys.points.material.uniforms.uScale.value=pr;
});

window.__booted=true;
</script>
