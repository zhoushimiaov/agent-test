<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>安全预览 · Agent Test</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Noto Sans SC",sans-serif;background:#f5f5f5;color:#171717}
header{height:54px;display:flex;align-items:center;gap:16px;padding:0 20px;background:white;border-bottom:1px solid #e5e5e5}
header b{font-weight:600}
header span{font-size:12px;color:#666}
header a{margin-left:auto;color:#171717;text-decoration:none;border:1px solid #ddd;border-radius:8px;padding:6px 12px}
main{padding:12px;height:calc(100dvh - 54px)}
iframe{width:100%;height:100%;border:1px solid #ddd;border-radius:10px;background:white}
</style>
</head>
<body>
<header><b>Agent Test · 安全预览</b><span>模型代码在独立沙箱中运行，不共享网站凭据</span><a href="./">返回测试</a></header>
<main><iframe id="preview" title="模型输出安全预览" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe></main>
<script>
"use strict";
const frame = document.getElementById("preview");
window.addEventListener("message", (event) => {
  if (event.origin !== location.origin || event.source !== window.opener) return;
  if (event.data?.type !== "agent-test-preview" || typeof event.data.html !== "string") return;
  if (event.data.html.length > 2000000) return;
  frame.srcdoc = event.data.html;
});
if (window.opener) window.opener.postMessage({ type: "agent-test-preview-ready" }, location.origin);
</script>
</body>
</html>
