/* ================= 跳台曲线(三次 Hermite) ================= */
const RAMP_P0 = {x:-30, y:7.00}, RAMP_T0 = {x:30, y:-1.5};
const RAMP_P1 = {x:  0, y:1.62}, RAMP_T1 = {x:30, y:15.0};
function hermite(P0,T0,P1,T1,t){
  const t2 = t*t, t3 = t2*t;
  const h00 = 2*t3-3*t2+1, h10 = t3-2*t2+t, h01 = -2*t3+3*t2, h11 = t3-t2;
  return {
    x :  h00*P0.x + h10*T0.x + h01*P1.x + h11*T1.x,
    y :  h00*P0.y + h10*T0.y + h01*P1.y + h11*T1.y,
    dx: (6*t2-6*t)*P0.x + (3*t2-4*t+1)*T0.x + (-6*t2+6*t)*P1.x + (3*t2-2*t)*T1.x,
    dy: (6*t2-6*t)*P0.y + (3*t2-4*t+1)*T0.y + (-6*t2+6*t)*P1.y + (3*t2-2*t)*T1.y
  };
}
function rampAt(t){ return hermite(RAMP_P0, RAMP_T0, RAMP_P1, RAMP_T1, t); }

/* 跳台剖面采样(供按 x 查高) */
const PROFILE_N = 400, profX = [], profY = [];
for(let i=0;i<=PROFILE_N;i++){ const r = rampAt(i/PROFILE_N); profX.push(r.x); profY.push(r.y); }
function rampYatX(x){
  if(x <= profX[0]) return profY[0];
  if(x >= profX[PROFILE_N]) return profY[PROFILE_N];
  let lo = 0, hi = PROFILE_N;
  while(lo < hi){ const mid = (lo+hi)>>1; if(profX[mid] < x) lo = mid+1; else hi = mid; }
  const i = Math.max(1, lo);
  const f = (x - profX[i-1]) / (profX[i] - profX[i-1]);
  return profY[i-1] + (profY[i] - profY[i-1]) * f;
}

/* ================= 着陆坡剖面 ================= */
function landingY(x){
  if(x <= 26) return 0.55 - 0.42*(x - 2.5);
  const u = Math.min(1, (x-26)/20);
  const y26 = 0.55 - 0.42*23.5;                 // = -9.32
  if(u >= 1) return y26 - 0.42*20 + 3.9 - 0.03*(x-46);
  const ss = u*u*(3 - 2*u);
  return y26 - 0.42*(x-26) + 7.8*(u*u*u - 0.5*u*u*u*u);
}
function landingSlope(x){
  if(x <= 26) return -0.42;
  const u = Math.min(1, (x-26)/20);
  if(u >= 1) return -0.03;
  return -0.42 + 0.39*(u*u*(3 - 2*u));
}

function buildExtrudedProfile(points, width, bottomY){
  const shape = new THREE.Shape();
  shape.moveTo(points[0].x, points[0].y);
  for(let i=1;i<points.length;i++) shape.lineTo(points[i].x, points[i].y);
  shape.lineTo(points[points.length-1].x, bottomY);
  shape.lineTo(points[0].x, bottomY);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth:width, bevelEnabled:false });
  geo.translate(0, 0, -width/2);
  return new THREE.Mesh(geo, [MAT.snowWall, MAT.snow]);
}

}

/* 围巾飘带(顶点动画) */
const scarfGeo = new THREE.PlaneGeometry(0.95, 0.30, 12, 2);
scarfGeo.translate(-0.475, 0, 0);
const scarf = new THREE.Mesh(scarfGeo,
  new THREE.MeshStandardMaterial({ color:0xe23b3b, roughness:0.6, side:THREE.DoubleSide }));
scarf.position.set(0, 1.30, -0.03);
scarf.castShadow = true;
penguin.add(scarf);
const scarfBase = scarfGeo.attributes.position.array.slice();

/* ================= 飘雪 ================= */
const FLAKE_N = 700;
const flakePos = new Float32Array(FLAKE_N*3);
const flakeSpd = new Float32Array(FLAKE_N);
const flakePh  = new Float32Array(FLAKE_N);
for(let i=0;i<FLAKE_N;i++){
  flakePos[i*3]   = -75 + srand()*150;
  flakePos[i*3+1] = -14 + srand()*46;
  flakePos[i*3+2] = -25 + srand()*40;
  flakeSpd[i] = 0.7 + srand()*1.1;
  flakePh[i]  = srand()*Math.PI*2;
}
const flakeGeo = new THREE.BufferGeometry();
flakeGeo.setAttribute('position', new THREE.BufferAttribute(flakePos, 3));
const flakes = new THREE.Points(flakeGeo,
  new THREE.PointsMaterial({ color:0xffffff, size:0.16, transparent:true, opacity:0.9, depthWrite:false }));
flakes.frustumCulled = false;
scene.add(flakes);

/* ================= 雪雾粒子 ================= */
const SPRAY_N = 500;
const spPos  = new Float32Array(SPRAY_N*3);
const spVel  = new Float32Array(SPRAY_N*3);
const spLife = new Float32Array(SPRAY_N);
let spHead = 0;
for(let i=0;i<SPRAY_N;i++) spPos[i*3+1] = -9999;
const spGeo = new THREE.BufferGeometry();
spGeo.setAttribute('position', new THREE.BufferAttribute(spPos, 3));
const sprayPts = new THREE.Points(spGeo,
  new THREE.PointsMaterial({ color:0xffffff, size:0.17, transparent:true, opacity:0.95, depthWrite:false }));
sprayPts.frustumCulled = false;
scene.add(sprayPts);
function spawnSpray(x, y, z, vx, vy, vz, life){
  const i = spHead; spHead = (spHead + 1) % SPRAY_N;
  spPos[i*3] = x; spPos[i*3+1] = y; spPos[i*3+2] = z;
  spVel[i*3] = vx; spVel[i*3+1] = vy; spVel[i*3+2] = vz;
  spLife[i] = life;
}
function updateSpray(dt){
  for(let i=0;i<SPRAY_N;i++){
    if(spLife[i] > 0){
      spLife[i] -= dt;
      if(spLife[i] <= 0){ spPos[i*3+1] = -9999; continue; }
      spVel[i*3+1] -= 6.5*dt;
      spPos[i*3]   += spVel[i*3]*dt;
      spPos[i*3+1] += spVel[i*3+1]*dt;
      spPos[i*3+2] += spVel[i*3+2]*dt;
    }
  }
  spGeo.attributes.position.needsUpdate = true;
}

/* ================= 相机状态 ================= */
const CAM_START  = new THREE.Vector3(-29.0, 8.62, 8.2);
const TGT_START  = new THREE.Vector3(-30, 7.5, 0);
const OFF_DEFAULT = new THREE.Vector3(1.0, 1.6, 8.2);
const OFF_FLIGHT  = new THREE.Vector3(2.2, 0.9, 11.8);
const curOff = OFF_DEFAULT.clone();
const camPos = CAM_START.clone();
const camTgt = TGT_START.clone();

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
const fadeEl = document.getElementById('fade');
let smoothRotZ = 0, smoothSpread = 0.1, smoothYaw = Math.PI/2 - 1.1;
let shakeT = 0, phase = 'idle';

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.getElapsedTime();
  const t = time % LOOP;

  /* ---------- 阶段解算:位置 / 姿态 ---------- */
  let px = 0, py = 0, targetRotZ = 0, targetSpread = 0.1,
      targetYaw = Math.PI/2, crouch = 0, speed = 0;

  if(t >= T_TELEPORT || t < T_IDLE){
    /* 起点待命 */
    const r = rampAt(0);
    px = r.x; py = r.y + 0.02;
    targetRotZ = Math.atan2(r.dy, r.dx);
    targetYaw = Math.PI/2 - 1.1 + Math.sin(time*0.8)*0.18;
    targetSpread = 0.08 + Math.sin(time*3)*0.03;
    crouch = 0.05 + 0.035*Math.sin(time*5.2);
    speed = 0.5;
  } else if(t < T_FLIGHT_START){
    /* 滑降(加速) */
    const tau = t - T_IDLE;
    const u = Math.pow(tau/T_SLIDE, 1.5);
    const r = rampAt(u);
    px = r.x; py = r.y + 0.02;
    targetRotZ = Math.atan2(r.dy, r.dx);
    targetSpread = 0.15;
    crouch = 0.03;
    speed = 2 + 13*u;
    for(let k=0;k<2;k++){
      spawnSpray(px - 0.5 + (srand()-0.5)*0.4, py + 0.04, (srand()-0.5)*0.7,
        -1.5 - srand()*2.5, 1.2 + srand()*2.6, (srand()-0.5)*2.4, 0.35 + srand()*0.3);
    }
  } else if(t < T_GLIDE_START){
    /* 腾空(抛物线) */
    const tau = t - T_FLIGHT_START;
    const vy = LAUNCH.vy - GRAV*tau;
    px = LAUNCH.x + LAUNCH.vx*tau;
    py = LAUNCH.y + LAUNCH.vy*tau - 0.5*GRAV*tau*tau;
    targetRotZ = Math.atan2(vy, LAUNCH.vx);
    targetSpread = Math.min(1, tau*3.2) * (1 + Math.sin(time*7)*0.07);
    speed = Math.hypot(LAUNCH.vx, vy);
  } else if(t < T_HOLD_START){
    /* 落地滑行(减速) */
    const tau = t - T_GLIDE_START;
    const stopped = tau >= GLIDE_STOP_T;
    const dist = stopped ? GLIDE_STOP_D : LAUNCH.vx*tau - 0.5*GLIDE_DECEL*tau*tau;
    px = LAND_X + dist;
    let bounce = 0;
    if(tau < 0.9) bounce = Math.abs(Math.sin(tau*16))*0.30*Math.exp(-tau*3.5);
    py = landingY(px) + 0.02 + bounce;
    targetRotZ = Math.atan(landingSlope(px)) + bounce*0.5*Math.sin(tau*16 + 0.6);
    targetSpread = 0.45;
    targetYaw = Math.PI/2;
    crouch = tau < 0.28 ? 0.13*(1 - tau/0.28) : 0;
    speed = stopped ? 0 : LAUNCH.vx - GLIDE_DECEL*tau;
    if(!stopped && srand() < 0.5){
      spawnSpray(px - 0.6, py + 0.04, (srand()-0.5)*0.6,
        -2 - srand()*2, 1 + srand()*1.8, (srand()-0.5)*1.8, 0.3 + srand()*0.25);
    }
  } else {
    /* 终点停顿 */
    px = STOP_X; py = landingY(STOP_X) + 0.02;
    targetRotZ = Math.atan(landingSlope(STOP_X));
    targetYaw = Math.PI/2 - 1.1 + Math.sin(time*0.9)*0.2;
    targetSpread = 0.15;
    crouch = 0.04 + 0.03*Math.sin(time*4.6);
    speed = 0.3;
  }

  /* ---------- 阶段事件(喷雪 / 震动) ---------- */
  const newPhase = (t >= T_TELEPORT || t < T_IDLE) ? 'idle'
    : t < T_FLIGHT_START ? 'slide'
    : t < T_GLIDE_START  ? 'flight'
    : t < T_HOLD_START   ? 'glide' : 'hold';
  if(newPhase === 'flight' && phase !== 'flight'){
    for(let i=0;i<25;i++)
      spawnSpray(LAUNCH.x, LAUNCH.y + 0.06, (srand()-0.5)*1.6,
        (srand()-0.5)*3.5, 1 + srand()*3.5, (srand()-0.5)*3.5, 0.4 + srand()*0.3);
  }
  if(newPhase === 'glide' && phase !== 'glide'){
    for(let i=0;i<90;i++){
      const a = srand()*Math.PI*2, s = 2 + srand()*6;
      spawnSpray(LAND_X, LAND_Y + 0.12, (srand()-0.5)*1.4,
        Math.cos(a)*s*0.55, 1.5 + srand()*5.5, Math.sin(a)*s*0.55, 0.5 + srand()*0.6);
    }
    shakeT = 0.35;
  }
  phase = newPhase;

  /* ---------- 姿态应用 ---------- */
  smoothRotZ   = damp(smoothRotZ, targetRotZ, 12, dt);
  smoothSpread = damp(smoothSpread, targetSpread, 6, dt);
  smoothYaw    = damp(smoothYaw, targetYaw, 2.5, dt);
  penguin.position.set(px, py, 0);
  penguin.rotation.set(0, smoothYaw, smoothRotZ);
  const sy = 1 - crouch, sxz = 1 + crouch*0.55;
  penguin.scale.set(sxz, sy, sxz);
  penguin.userData.flipperL.rotation.z = -(0.25 + smoothSpread*1.9);
  penguin.userData.flipperR.rotation.z =  (0.25 + smoothSpread*1.9);

  /* ---------- 围巾飘动 ---------- */
  const speedF = clamp(speed/12, 0.15, 1);
  const posAttr = scarfGeo.attributes.position;
  for(let i=0;i<posAttr.count;i++){
    const bx = scarfBase[i*3], by = scarfBase[i*3+1];
    const f = -bx/0.95;
    posAttr.setZ(i, Math.sin(bx*7 - time*14*speedF)*0.10*f + Math.sin(by*6 + time*9*speedF)*0.025*f);
    posAttr.setY(i, by + Math.sin(bx*5 - time*11*speedF)*0.05*f);
  }
  posAttr.needsUpdate = true;
  scarfGeo.computeVertexNormals();

  /* ---------- 相机跟拍 ---------- */
  const inFlight = (newPhase === 'flight');
  const offTgt = inFlight ? OFF_FLIGHT : OFF_DEFAULT;
  curOff.x = damp(curOff.x, offTgt.x, 3, dt);
  curOff.y = damp(curOff.y, offTgt.y, 3, dt);
  curOff.z = damp(curOff.z, offTgt.z, 3, dt);
  if(t >= T_TELEPORT){
    camPos.copy(CAM_START); camTgt.copy(TGT_START);
  } else {
    /* 速度前瞻 */
    let lvx = 0, lvy = 0;
    if(newPhase === 'slide'){
      const r = rampAt(Math.pow((t - T_IDLE)/T_SLIDE, 1.5));
      const m = Math.hypot(r.dx, r.dy); lvx = r.dx/m; lvy = r.dy/m;
    } else if(newPhase === 'flight'){
      const tau = t - T_FLIGHT_START, vy = LAUNCH.vy - GRAV*tau;
      const m = Math.hypot(LAUNCH.vx, vy); lvx = LAUNCH.vx/m; lvy = vy/m;
    } else if(newPhase === 'glide'){
      const tau = t - T_GLIDE_START;
      if(tau < GLIDE_STOP_T){
        lvy = landingSlope(LAND_X + LAUNCH.vx*tau - 0.5*GLIDE_DECEL*tau*tau);
        const m = Math.hypot(1, lvy); lvx = 1/m; lvy = lvy/m;
      }
    }
    camPos.x = damp(camPos.x, px + curOff.x + lvx*1.2, 4, dt);
    camPos.y = damp(camPos.y, py + curOff.y + lvy*0.6, 4, dt);
    camPos.z = damp(camPos.z, curOff.z, 4, dt);
    camTgt.x = damp(camTgt.x, px + lvx*2.2, 5, dt);
    camTgt.y = damp(camTgt.y, py + 0.5 + lvy*1.0, 5, dt);
    camTgt.z = damp(camTgt.z, 0, 5, dt);
    camPos.y = Math.max(camPos.y, groundApprox(camPos.x) + 1.1);
    if(shakeT > 0){
      shakeT -= dt;
      const a = 0.08*Math.exp(-(0.35 - shakeT)*9);
      camPos.x += (srand()-0.5)*a; camPos.y += (srand()-0.5)*a;
    }
  }
  camera.position.copy(camPos);
  camera.lookAt(camTgt);

  /* ---------- 环境动画 ---------- */
  updateSpray(dt);
  for(let i=0;i<FLAKE_N;i++){
    flakePos[i*3+1] -= flakeSpd[i]*dt;
    flakePos[i*3]   += (Math.sin(time*0.7 + flakePh[i])*0.5 + 0.45)*dt;
    flakePos[i*3+2] += Math.cos(time*0.5 + flakePh[i])*0.25*dt;
    if(flakePos[i*3+1] < -14) flakePos[i*3+1] += 46;
    if(flakePos[i*3] > 75)    flakePos[i*3]   -= 150;
  }
  flakeGeo.attributes.position.needsUpdate = true;
  for(const c of clouds){
    c.position.x += c.userData.speed*dt;
    if(c.position.x > 130) c.position.x = -130;
  }
  for(let i=0;i<flags.length;i++) flags[i].rotation.y = Math.sin(time*6 + i*1.7)*0.35;
  banner.rotation.z = Math.sin(time*1.3)*0.02;

  /* ---------- 循环淡入淡出 ---------- */
  let fade = 0;
  if(t >= T_FADEOUT_START && t < T_TELEPORT) fade = (t - T_FADEOUT_START)/T_FADEOUT;
  else if(t >= T_TELEPORT) fade = 1 - (t - T_TELEPORT)/T_FADEIN;
  if(time < 0.8) fade = Math.max(fade, 1 - time/0.8);   // 首次打开淡入
  fadeEl.style.opacity = fade.toFixed(3);

  renderer.render(scene, camera);
}
animate();
</script>
