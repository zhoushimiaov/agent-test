    var hx = terrainY(x + 1.4, z) - terrainY(x - 1.4, z);
    var hz = terrainY(x, z + 1.4) - terrainY(x, z - 1.4);
    var grad = Math.sqrt(hx * hx + hz * hz) / 2.8;
    var rock = clamp((grad - 0.78) / 0.55, 0, 1);

    tmpC.copy(onPiste ? cPiste : cOff);
    tmpC.lerp(cDeep, clamp((az - W) / 26, 0, 1) * 0.72);
    tmpC.lerp(cRock, rock * 0.9);
    /* the higher the ground, the more it catches the warm sun */
    var alt = clamp((y - VALLEY_Y) / 120, 0, 1);
    tmpC.lerp(cHigh, alt * 0.55);
    tmpC.multiplyScalar(0.86 + 0.14 * rnd());
    tCol[i * 3] = tmpC.r; tCol[i * 3 + 1] = tmpC.g; tCol[i * 3 + 2] = tmpC.b;
  }
}
terrGeo.setAttribute('position', new THREE.BufferAttribute(tPos, 3));
terrGeo.setAttribute('color', new THREE.BufferAttribute(tCol, 3));
/* index the grid: rows run along +x, columns along +z; wind so normals face up */
var tIdx = new Uint32Array((NX - 1) * (NZ - 1) * 6);
var ti = 0;
for (var iz2 = 0; iz2 < NZ - 1; iz2++) {
  for (var ix2 = 0; ix2 < NX - 1; ix2++) {
    var a = iz2 * NX + ix2, b = a + 1, c = a + NX, d = a + NX + 1;
    tIdx[ti++] = a; tIdx[ti++] = c; tIdx[ti++] = b;
    tIdx[ti++] = b; tIdx[ti++] = c; tIdx[ti++] = d;
  }
}
terrGeo.setIndex(new THREE.BufferAttribute(tIdx, 1));
terrGeo.computeVertexNormals();
terrGeo.computeBoundingSphere();

var terrain = new THREE.Mesh(terrGeo, new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.93, metalness: 0.0
}));
terrain.receiveShadow = true;
scene.add(terrain);

/* groomed piste ribbon along the jump line.
   It has to sit ON the snow surface: the skis ride at pisteY(x), so a
   ribbon even a few centimetres proud of the terrain swallows the ski
   tips. Every vertex samples terrainY itself, lifted only enough to beat
   z-fighting with the mesh underneath. */
(function () {
  var COLS = 7;                       // across the ribbon
  var verts = [], idx = [], x = -14;
  var step = 1.1;
  var count = 0;
  var EPS = 0.012;
  while (x <= OUT_FROM + OUT_LEN) {
    var hw = pisteHalfWidth(x) * 0.90;
    for (var c = 0; c < COLS; c++) {
      var u = (c / (COLS - 1)) * 2 - 1;   // -1 .. +1 across
      var z = u * hw;
      verts.push(x, terrainY(x, z) + EPS, z);
    }
    count++;
    x += step;
  }
  for (var k = 0; k < count - 1; k++) {
    for (var c2 = 0; c2 < COLS - 1; c2++) {
      var a0 = k * COLS + c2, a1 = a0 + 1;
      var b0 = a0 + COLS, b1 = b0 + 1;
      idx.push(a0, a1, b0, a1, b1, b0);
    }
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  var m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.72, metalness: 0.0,
    emissive: 0x2a4468, emissiveIntensity: 0.05, side: THREE.DoubleSide
  }));
  m.receiveShadow = true;
  scene.add(m);
  window.__pisteRibbon = m;
})();


/* ---- part 4: inrun structure, tower, takeoff table ---- */
(function () {
  var pts = [];
  for (var i = 0; i < INRUN.length; i++) pts.push(INRUN[i]);

  // smooth the track polyline for the ribbon
  var W = 2.9;
  var verts = [], idx = [], vidx = [];
  for (var k = 0; k < pts.length; k++) {
    var p = pts[k];
    /* the ribbon hugs the track surface the skis ride on, lifted only
       enough to avoid z-fighting with the snow underneath */
    verts.push(p[0], p[1] + 0.012, -W, p[0], p[1] + 0.012, W);
    vidx.push([p[0], p[1], p[2]]);
  }
  for (var k2 = 0; k2 < pts.length - 1; k2++) {
    var a0 = k2 * 2, a1 = a0 + 1, b0 = a0 + 2, b1 = a0 + 3;
    idx.push(a0, b0, a1, a1, b0, b1);
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  var track = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    color: 0xf6faff, roughness: 0.7, metalness: 0.02,
    emissive: 0x243c5c, emissiveIntensity: 0.06, side: THREE.DoubleSide
  }));
  track.castShadow = true;
  track.receiveShadow = true;
  scene.add(track);

  // track kerbs: low steel edges along both sides of the inrun channel.
  // Kept low on purpose — tall rails would cut across the jumper from the
  // side-on camera.
  var railMat = new THREE.MeshStandardMaterial({ color: 0x6f7d90, roughness: 0.42, metalness: 0.8 });
  var railTubes = [];
  for (var side = -1; side <= 1; side += 2) {
    var rp = [];
    for (var j = 0; j < pts.length; j += 2) {
      var q = pts[j];
      rp.push(new THREE.Vector3(q[0], q[1] + 0.30, side * W));
    }
    var curve = new THREE.CatmullRomCurve3(rp);
    var tube = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(20, rp.length), 0.055, 6, false), railMat);
    tube.castShadow = true;
    tube.userData.railSide = side;
    scene.add(tube);
    railTubes.push(tube);
  }
  window.__rails = railTubes;

  // support pylons under the inrun
  var pylonMat = new THREE.MeshStandardMaterial({ color: 0x6d7684, roughness: 0.5, metalness: 0.6 });
  var legMat = new THREE.MeshStandardMaterial({ color: 0x5a636f, roughness: 0.55, metalness: 0.55 });
  var topX = N.towerTopX, topY = N.towerTopY;
  var towerH = topY - (pisteY(topX) - 0.4);

  // main tower legs
  var legSpread = 3.1;
  for (var s2 = -1; s2 <= 1; s2 += 2) {
    var legGeo = new THREE.CylinderGeometry(0.30, 0.42, towerH, 8);
    var leg = new THREE.Mesh(legGeo, legMat);
    leg.position.set(topX + 1.2, topY - towerH / 2, s2 * legSpread);
    leg.rotation.z = 0.05;
    leg.castShadow = true;
    scene.add(leg);
  }
  // cross bracing
  var braceCount = Math.max(2, Math.floor(towerH / 6));
  for (var bi = 0; bi < braceCount; bi++) {
    var yy = topY - 2.6 - bi * (towerH - 4) / braceCount;
    var br = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.22, legSpread * 2), pylonMat);
    br.position.set(topX + 1.2, yy, 0);
    br.castShadow = true;
    scene.add(br);
    var br2 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, legSpread * 2.3), pylonMat);
    br2.position.set(topX + 1.2, yy - 2.2, 0);
    br2.rotation.x = 0.30;
    br2.castShadow = true;
    scene.add(br2);
  }
  // platform at the tower top (uphill of the start, so it never clips the jumper)
  var plat = new THREE.Mesh(new THREE.BoxGeometry(5.4, 0.34, 7.4), pylonMat);
  plat.position.set(topX - 3.0, topY - 0.30, 0);
  plat.castShadow = true; plat.receiveShadow = true;
  scene.add(plat);

  // struts from the tower down to the arc start
  var aX = N.arcStartX, aY = N.arcStartY;
  for (var s3 = -1; s3 <= 1; s3 += 2) {
    var from = new THREE.Vector3(topX + 1.4, topY - 0.6, s3 * 3.0);
    var to = new THREE.Vector3(aX, aY - 0.4, s3 * 2.2);
    var len = from.distanceTo(to);
    var st = new THREE.Mesh(new THREE.CylinderGeometry(0.20, 0.20, len, 6), pylonMat);
    st.position.copy(from).lerp(to, 0.5);
    st.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), to.clone().sub(from).normalize());
    st.castShadow = true;
    scene.add(st);
  }
  // supports under the arc and the take-off table
  function supportAt(x, y, spread, radius) {
    var gy = pisteY(x);
    var h = y - gy;
    if (h < 1.0) return;
    for (var s = -1; s <= 1; s += 2) {
      var post = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius * 1.3, h, 8), legMat);
      post.position.set(x, gy + h / 2, s * spread);
      post.castShadow = true;
      scene.add(post);
    }
    var cap = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, spread * 2.3), pylonMat);
    cap.position.set(x, y - 0.2, 0);
    cap.castShadow = true;
    scene.add(cap);
  }
  // the arc runs from arcStart to the table
  supportAt(aX, aY + 0.4, 2.2, 0.30);
  supportAt(aX * 0.5, (aY + 0) * 0.5 + 1.0, 2.0, 0.26);
  supportAt(-1.6, 1.2, 1.9, 0.24);

  // takeoff table platform at the lip
  var tabLen = 3.4;
  var tab = new THREE.Mesh(new THREE.BoxGeometry(tabLen, 0.42, 6.0), new THREE.MeshStandardMaterial({
    color: 0xe8eef6, roughness: 0.55, metalness: 0.05
  }));
  tab.position.set(-tabLen / 2 + 0.05, -0.16, 0);
  tab.rotation.z = -C.s0 * DEG;
  tab.castShadow = true; tab.receiveShadow = true;
  scene.add(tab);

  // start gate platform at the very top of the tower
  var gate = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.3, 5.0), pylonMat);
  gate.position.set(topX - 1.6, topY + 0.35, 0);
  gate.castShadow = true;
  scene.add(gate);
  for (var gz = -1; gz <= 1; gz++) {
    var gp = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 1.5, 6), railMat);
    gp.position.set(topX - 1.6, topY + 1.2, gz * 2.2);
    scene.add(gp);
  }
})();


/* ---- part 5: the penguin ----
   Rig:
     penguin   – world placement + orientation frame (path normal up, downhill forward)
     bodyPivot – turns the model so it faces +x
     tilt      – leans the torso forward (the V-style)
     legs/skis – stay with the path
   Model-local axes: +y = head, +z = facing (beak forward).               */
var penguin = new THREE.Group();
scene.add(penguin);

var bodyPivot = new THREE.Group();
penguin.add(bodyPivot);

var tilt = new THREE.Group();
bodyPivot.add(tilt);

var matBlack = new THREE.MeshStandardMaterial({ color: 0x0e1118, roughness: 0.46, metalness: 0.07 });
var matWhite = new THREE.MeshStandardMaterial({ color: 0xfbfdff, roughness: 0.52, metalness: 0.0 });
var matBeak = new THREE.MeshStandardMaterial({ color: 0xff9c22, roughness: 0.4, metalness: 0.03 });
var matBeakDk = new THREE.MeshStandardMaterial({ color: 0xd9680f, roughness: 0.44, metalness: 0.03 });
var matBoot = new THREE.MeshStandardMaterial({ color: 0xf07d12, roughness: 0.46, metalness: 0.02 });
var matSki = new THREE.MeshStandardMaterial({ color: 0xf03a1e, roughness: 0.2, metalness: 0.15, emissive: 0x6b1408, emissiveIntensity: 0.25 });
var matPole = new THREE.MeshStandardMaterial({ color: 0xb9c6d6, roughness: 0.18, metalness: 0.9 });
var matGoggle = new THREE.MeshStandardMaterial({ color: 0x14315c, roughness: 0.05, metalness: 0.6, emissive: 0x3a8fd0, emissiveIntensity: 0.85 });
var matStrap = new THREE.MeshStandardMaterial({ color: 0x1d2740, roughness: 0.6, metalness: 0.1 });
var matScarf = new THREE.MeshStandardMaterial({ color: 0xd8203a, roughness: 0.85, metalness: 0.0 });

function pmesh(geo, mat, x, y, z) {
  var m = new THREE.Mesh(geo, mat);
  m.position.set(x || 0, y || 0, z || 0);
  m.castShadow = true;
  return m;
}

/* --- torso (tilts with the body) --- */
var body = pmesh(new THREE.SphereGeometry(0.44, 30, 22), matBlack, 0, 0.44, 0);
body.scale.set(0.86, 1.16, 0.82);
tilt.add(body);

var chest = pmesh(new THREE.SphereGeometry(0.37, 26, 20), matWhite, 0, 0.42, 0.15);
chest.scale.set(0.78, 1.10, 0.72);
tilt.add(chest);

var neck = pmesh(new THREE.CylinderGeometry(0.15, 0.22, 0.26, 16), matBlack, 0, 0.90, 0.01);
neck.rotation.x = 0.10;
tilt.add(neck);

var head = pmesh(new THREE.SphereGeometry(0.285, 28, 22), matBlack, 0, 1.12, 0.02);
head.scale.set(0.98, 1.0, 0.96);
tilt.add(head);
var face = pmesh(new THREE.SphereGeometry(0.252, 24, 18), matWhite, 0, 1.09, 0.115);
face.scale.set(0.86, 0.92, 0.66);
tilt.add(face);

/* one wrap-around lens over both eyes. Two separate lenses plus eyeball
   highlights read as a pair of googly eyes instead of ski goggles. */
var gogFrame = pmesh(new THREE.SphereGeometry(0.205, 24, 18), matStrap, 0, 1.195, 0.185);
gogFrame.scale.set(1.08, 0.55, 0.55);
tilt.add(gogFrame);
var gogLens = pmesh(new THREE.SphereGeometry(0.195, 24, 18), matGoggle, 0, 1.195, 0.212);
gogLens.scale.set(1.05, 0.46, 0.54);
tilt.add(gogLens);

var beak = pmesh(new THREE.ConeGeometry(0.085, 0.26, 14), matBeak, 0, 1.065, 0.325);
beak.rotation.x = Math.PI / 2;
beak.scale.set(1, 1, 0.68);
tilt.add(beak);
var beakLow = pmesh(new THREE.ConeGeometry(0.068, 0.14, 12), matBeakDk, 0, 1.015, 0.310);
beakLow.rotation.x = Math.PI / 2;
beakLow.scale.set(1, 1, 0.62);
tilt.add(beakLow);

var strapG = pmesh(new THREE.TorusGeometry(0.278, 0.024, 8, 24), matStrap, 0, 1.195, 0.01);
strapG.rotation.y = Math.PI / 2;
strapG.scale.set(1, 0.96, 1);
tilt.add(strapG);

var scarf = pmesh(new THREE.TorusGeometry(0.205, 0.072, 10, 22), matScarf, 0, 0.855, 0.01);
scarf.rotation.x = Math.PI / 2;
scarf.scale.set(1.0, 1.0, 0.72);
tilt.add(scarf);
var scarfTail = pmesh(new THREE.BoxGeometry(0.14, 0.46, 0.05), matScarf, -0.10, 0.63, -0.19);
scarfTail.rotation.set(-0.35, 0.2, 0.22);
tilt.add(scarfTail);

/* --- wings (part of the tilting torso) ---
   The flipper hangs from the shoulder down the side of the body, so the
   pivot is the shoulder and the flipper's long axis is the body's -y.
   rotation.x therefore swings the tip back and forth, and rotation.z
   swings it out to the side.                                            */
function makeWing(sign) {
  var g = new THREE.Group();
  var w = pmesh(new THREE.SphereGeometry(0.30, 20, 14), matBlack);
  w.scale.set(0.24, 0.94, 0.40);
  w.position.set(0, -0.26, 0);
  g.add(w);
  var tip = pmesh(new THREE.SphereGeometry(0.18, 16, 12), matBlack, 0, -0.58, -0.03);
  tip.scale.set(0.26, 0.80, 0.44);
  g.add(tip);
  g.position.set(0.32 * sign, 0.80, -0.02);
  g.userData.sign = sign;
  return g;
}
var wingL = makeWing(-1);
var wingR = makeWing(1);
tilt.add(wingL);
tilt.add(wingR);

/* --- ski poles ---
   A pole is a child of the torso, not of the flipper: a child would swing
   with the flipper and throw the shaft over the penguin's head. Instead
   the pole is placed at the flipper's grip point every frame, so the hand
   stays on the pole while the shaft trails straight back.                */
function makePole(sign) {
  var g = new THREE.Group();
  var shaft = pmesh(new THREE.CylinderGeometry(0.020, 0.014, 1.18, 6), matPole);
  shaft.rotation.x = -Math.PI / 2;
  shaft.position.z = -0.59;
  g.add(shaft);
  var basket = pmesh(new THREE.TorusGeometry(0.072, 0.016, 6, 12), matStrap, 0, 0, -1.14);
  g.add(basket);
  g.add(pmesh(new THREE.CylinderGeometry(0.030, 0.026, 0.15, 6), matStrap, 0, 0, -0.01));
  g.add(pmesh(new THREE.SphereGeometry(0.024, 8, 6), matStrap, 0, 0, -1.18));
  g.userData.sign = sign;
  return g;
}
var poleL = makePole(-1);
var poleR = makePole(1);
tilt.add(poleL);
tilt.add(poleR);

/* --- legs, webbed feet -----------------------------------------------
   Each leg pivots at the boot, so the leg can splay outward while the
   foot stays planted on its ski — the V-style silhouette.                */
var legs = new THREE.Group();
legs.position.set(0, 0.22, 0.04);
bodyPivot.add(legs);
var legL = new THREE.Group(), legR = new THREE.Group();
legs.add(legL); legs.add(legR);
for (var li = -1; li <= 1; li += 2) {

  lg.position.set(li * 0.175, -0.235, 0.045);

  var foot = pmesh(new THREE.SphereGeometry(0.115, 14, 10), matBoot, 0, 0, 0);
  foot.scale.set(0.85, 0.42, 1.35);
  lg.add(foot);
}

/* --- skis (stay with the path) ---------------------------------------
   Each ski is its own group pivoting at the binding, so in the air the
   two can be splayed into the classic V.                                */
var skis = new THREE.Group();
skis.position.set(0, -0.34, 0);
bodyPivot.add(skis);
var skiL = new THREE.Group(), skiR = new THREE.Group();
skis.add(skiL); skis.add(skiR);
for (var si = -1; si <= 1; si += 2) {

  var tipUp = pmesh(new THREE.BoxGeometry(0.20, 0.07, 0.52), matSki, 0, 0.20, 1.44);

  tailUp.rotation.x = 0.52;
  sg.add(tailUp);
  sg.add(pmesh(new THREE.BoxGeometry(0.19, 0.085, 0.36), matStrap, 0, 0.078, 0.02));
}

/* the model is authored facing +z; the scene frame maps +z onto the path
   tangent, so no extra yaw is needed here */
bodyPivot.scale.setScalar(1.50);


/* ---- part 6: distant scenery, flags, snowfall ---- */

/* --- far mountain ranges --- */
function makeRange(z, dist, height, colorHex, seedShift) {
  var g = new THREE.Group();
  var mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 1.0, metalness: 0.0, flatShading: true });
  var segs = 46;
  for (var i = 0; i < segs; i++) {
    var x = -900 + i * (1800 / segs) + (seedShift || 0);
    var h = height * (0.35 + 0.65 * Math.abs(Math.sin(i * 0.9 + (seedShift || 0) * 0.1)) *
      (0.5 + 0.5 * Math.sin(i * 0.37 + 1.7)));
    var w = 1900 / segs * 2.4;
    var cone = new THREE.Mesh(new THREE.ConeGeometry(w, h, 5, 1), mat);
    cone.position.set(x, h / 2 - height * 0.55, z);
    cone.rotation.y = rnd() * Math.PI;
    g.add(cone);
  }
  g.renderOrder = -1;
  scene.add(g);
  return g;
}
makeRange(-620, 620, 210, 0x8fa6c6, 0);
makeRange(-430, 430, 140, 0x7690b4, 2.1);
makeRange(470, 470, 165, 0x7f97b8, 4.3);

/* --- snow-laden pine forest on the flanks --- */
var treeTrunk = new THREE.MeshStandardMaterial({ color: 0x3b3226, roughness: 0.9 });
var treeLeaf = new THREE.MeshStandardMaterial({ color: 0x1f4038, roughness: 0.95, flatShading: true });
var treeSnow = new THREE.MeshStandardMaterial({ color: 0xe8f1fb, roughness: 0.85 });

  for (var v = 0; v < 3; v++) {

    tr.position.y = 1.1;

      var r = 1.5 - k * 0.36, h = 2.3 - k * 0.35;

for (var ti = 0; ti < 300; ti++) {
  var x2 = rr(-160, 330);

}

/* --- a village of chalets out in the valley, so the run-out has scale --- */
(function () {
  var wallMats = [0x6d5a4a, 0x7a6450, 0x5d5468, 0x7d6a55].map(function (c) {
    return new THREE.MeshStandardMaterial({ color: c, roughness: 0.92 });
  });
  var roofMat = new THREE.MeshStandardMaterial({ color: 0x3d4657, roughness: 0.8 });
  var snowCap = new THREE.MeshStandardMaterial({ color: 0xf2f7ff, roughness: 0.9 });
  var litMat = new THREE.MeshStandardMaterial({
    color: 0xffcf7a, roughness: 0.5, emissive: 0xff9c3a, emissiveIntensity: 1.5
  });
  for (var h = 0; h < 18; h++) {
    var hx = rr(155, 295);
    var hz = (rnd() < 0.5 ? -1 : 1) * rr(20, 48);
    var hw = pisteHalfWidth(hx);
    if (Math.abs(hz) < hw + 8) continue;
    var hy = terrainY(hx, hz);
    /* the chalets belong on the valley floor, not up the wall */

/* ---- part 7: animation, camera, loop ---- */

/* local frame of the penguin model: +y = head, +z = facing (belly/front) */
var AXIS_X = new THREE.Vector3(1, 0, 0);
var AXIS_Y = new THREE.Vector3(0, 1, 0);
var AXIS_Z = new THREE.Vector3(0, 0, 1);

var qGround = new THREE.Quaternion();
var qAir = new THREE.Quaternion();
var qLean = new THREE.Quaternion();
var qTmp = new THREE.Quaternion();
var mTmp = new THREE.Matrix4();
var vUp = new THREE.Vector3();
var vFwd = new THREE.Vector3();
var vSide = new THREE.Vector3();

/* build a quaternion whose local +y is `up` and local +z is `fwd` */
function frameQuat(up, fwd, out) {
  vSide.copy(up).cross(fwd).normalize();       // local +x = up x fwd
  mTmp.makeBasis(vSide, up, fwd);
  return out.setFromRotationMatrix(mTmp);
}

var SKI_LIFT = 0.60;     // distance from the group origin down to the ski base
var BODY_CENTER = 0.39;  // distance from the origin up to the body centre

var camPos = new THREE.Vector3(-50, 45, 40);
var camLook = new THREE.Vector3(0, 0, 0);
var camTargetPos = new THREE.Vector3();
var camTargetLook = new THREE.Vector3();
var camReady = false;
var curFov = 44;

/* path-relative camera: sits beside the track, looking slightly ahead along it,
   so the slope always stays in frame under the jumper. */
function phaseOf(t) {
  if (t < T_IN) return 'inrun';
  if (t < T_IN + 0.9) return 'launch';
  if (t < T_LAND - 0.6) return 'flight';
  if (t < T_LAND + 1.8) return 'land';
  return 'outrun';
}

function updatePenguin(t, dt) {
  var s = sampleAt(t);
  var px = s[0], py = s[1], slope = s[2], v = s[3];
  var a = slope * DEG;
  var onGround = (t < T_IN) || (t >= T_LAND);

  /* --- the model frame: body upright relative to the slope, facing downhill --- */
  vUp.set(-Math.sin(a), Math.cos(a), 0);
  vFwd.set(Math.cos(a), Math.sin(a), 0);
  frameQuat(vUp, vFwd, qGround);
  frameQuat(vUp, vFwd, qAir);
  penguin.quaternion.copy(qGround);

  /* --- the V-style -------------------------------------------------
     The body frame already follows the flight path, so the classic V is
     made by the legs: they splay out to the sides and swing forward.
     The torso adds only a modest forward pitch — a large one would bury
     the head in the slope, because the frame is already tilted downhill. */
  var lean = 0.0;
  if (!onGround) {
    lean = 0.26;
    if (t < T_IN + 1.0) lean = 0.26 * smoothstep(T_IN - 0.35, T_IN + 0.45, t);
    else if (t > T_LAND - 0.9) lean = 0.26 * (1 - smoothstep(T_LAND - 0.6, T_LAND + 0.5, t));
  }
  var leanK = 1 - Math.exp(-6 * dt);
  tilt.rotation.x += (lean - tilt.rotation.x) * leanK;

  /* --- placement: the group origin sits at the ski base, so the model is
         lifted by half its height along the body's up axis. The inrun
         ribbon now hugs the track surface, so the skis ride on py
         everywhere rather than 0.16 m proud of it.                     --- */
  var bux = -Math.sin(a), buy = Math.cos(a);
  penguin.position.set(px + bux * SKI_LIFT, py + buy * SKI_LIFT, 0);

  /* --- crouch / extension --- */
  var crouch = (t < T_IN) ? 0.13 : (onGround ? 0.05 : 0.0);
  var sTarget = 1.50 * (1 - crouch);
  bodyPivot.scale.lerp(new THREE.Vector3(sTarget, sTarget, sTarget), 1 - Math.exp(-7 * dt));

  /* --- the V-style: legs splay outward, skis spread into a V ----------- */
  var tuck = onGround ? 0 : 1;
  var lk = 1 - Math.exp(-7 * dt);
  /* the left leg falls away to the left, the right one to the right */
  legL.rotation.z += ((0.85 * tuck) - legL.rotation.z) * lk;
  legR.rotation.z += ((-0.85 * tuck) - legR.rotation.z) * lk;
  legL.rotation.x += ((0.30 * tuck) - legL.rotation.x) * lk;
  legR.rotation.x += ((0.30 * tuck) - legR.rotation.x) * lk;
  legL.position.x += ((-0.175 - 0.10 * tuck) - legL.position.x) * lk;
  legR.position.x += ((0.175 + 0.10 * tuck) - legR.position.x) * lk;
  legs.position.z += ((onGround ? 0.0 : 0.10) - legs.position.z) * lk;
  /* the skis spread apart into a V (they run along +z, so they splay
     about the vertical axis) and lift their tails */
  skiL.rotation.y += ((0.30 * tuck) - skiL.rotation.y) * lk;
  skiR.rotation.y += ((-0.30 * tuck) - skiR.rotation.y) * lk;
  skiL.rotation.x += ((-0.16 * tuck) - skiL.rotation.x) * lk;
  skiR.rotation.x += ((-0.16 * tuck) - skiR.rotation.x) * lk;

  /* --- the finish: once the jumper has actually come to rest, the
         flippers open out and the body straightens. Without this the hold
         at the end of the loop reads as a frozen frame rather than as the
         landing pose the run settles into.                                */
  var rest = smoothstep(T_END - 0.30, T_END + 0.55, t);

  /* --- wings: at the sides on the ground, swept back in the air ---
     The flipper hangs from the shoulder along the body's -y, so rotation.x
     swings the tip back (into the airstream) and rotation.z opens it out
     away from the body. A little flutter keeps it from looking frozen.
     The sign of rotation.z follows the side: a positive angle lifts the
     local -y axis towards +x, so the left flipper needs the opposite
     sign from the right to move out of the body.                          */
  var flut = Math.sin(t * 5.4) * (onGround ? 0.04 : 0.07);
  var wk = 1 - Math.exp(-5 * dt);
  var wBack = onGround ? lerp(0.22, -0.34, rest) : 1.10;  // how far the flipper lies back
  var wOut = onGround ? lerp(0.22, 0.60, rest) : 0.66;    // how far it opens from the body
  wingL.rotation.x += (wBack - wingL.rotation.x) * wk;
  wingR.rotation.x += (wBack - wingR.rotation.x) * wk;
  wingL.rotation.z += (-wOut + flut - wingL.rotation.z) * wk;
  wingR.rotation.z += (wOut + flut - wingR.rotation.z) * wk;

  /* --- the poles: grip the flipper's tip, shaft trailing back ---
     The grip point is derived from the flipper's own rotation, so the
     hand stays on the pole however the flipper is posed. On the ground the
     poles hang down the way a skier carries them; in the air they stream
     out behind, splayed to the sides.                                     */
  var grip = new THREE.Vector3(0, -0.50, -0.02);
  var poleTilt = onGround ? -1.15 : -0.20;
  var poleSplay = onGround ? 0.10 : 0.34;
  poleL.position.copy(grip).applyEuler(wingL.rotation).add(wingL.position);
  poleR.position.copy(grip).applyEuler(wingR.rotation).add(wingR.position);
  poleL.rotation.set(poleTilt, poleSplay, 0);
  poleR.rotation.set(poleTilt, -poleSplay, 0);

  return { x: px, y: py, v: v, slope: slope, onGround: onGround, a: a };
}

/* powder spray */
function emitSpray(x, y, v, dt) {
  var rate = clamp(v * 2.6, 0, 70) * dt;
  var count = Math.floor(rate) + (rnd() < (rate % 1) ? 1 : 0);
  for (var i = 0; i < count; i++) {
    var idx = sprayCursor % SPRAY_N; sprayCursor++;
    sprayPos[idx * 3] = x + rr(-0.9, 0.5);
    sprayPos[idx * 3 + 1] = y + rr(0.0, 0.3);
    sprayPos[idx * 3 + 2] = rr(-0.6, 0.6);
    sprayVel[idx * 3] = -v * rr(0.04, 0.14) + rr(-1.4, 1.4);
    sprayVel[idx * 3 + 1] = rr(1.0, 4.0);
    sprayVel[idx * 3 + 2] = rr(-1.4, 1.4);
    sprayLife[idx] = 1;
  }
}
function updateSpray(dt) {
  for (var i = 0; i < SPRAY_N; i++) {
    if (sprayLife[i] <= 0) continue;
    sprayLife[i] -= dt * 1.4;
    if (sprayLife[i] <= 0) { sprayPos[i * 3 + 1] = -9999; continue; }
    sprayVel[i * 3 + 1] -= 9.0 * dt;
    sprayVel[i * 3] *= 1 - 1.7 * dt;
    sprayVel[i * 3 + 2] *= 1 - 1.7 * dt;
    sprayPos[i * 3] += sprayVel[i * 3] * dt;
    sprayPos[i * 3 + 1] += sprayVel[i * 3 + 1] * dt;
    sprayPos[i * 3 + 2] += sprayVel[i * 3 + 2] * dt;
  }
  sprayGeo.attributes.position.needsUpdate = true;
}

/* wind streaks in flight */
function updateStreaks(t, dt, p) {
  var flying = (t >= T_IN + 0.1 && t < T_LAND - 0.2);
  var mat = streakPts.material;
  mat.opacity += ((flying ? 0.12 : 0.0) - mat.opacity) * (1 - Math.exp(-4 * dt));
  for (var i = 0; i < STREAK_N; i++) {
    var st = streakState[i];
    var o = i * 6;
    if (st.life <= 0) {
      if (!flying) {
        streakPos[o] = 0; streakPos[o + 1] = -9999; streakPos[o + 2] = 0;
        streakPos[o + 3] = 0; streakPos[o + 4] = -9999; streakPos[o + 5] = 0;
        continue;
      }
      st.x = p.x + rr(-10, 18);
      st.y = p.y + rr(-9, 9);
      st.z = rr(-20, 20);
      st.life = 1;
      st.len = rr(0.6, 1.8);
    } else {
      st.x -= p.v * 0.5 * dt;
      st.life -= dt * 1.4;
    }
    /* the streak trails backwards, opposite to the direction of travel */
    streakPos[o] = st.x; streakPos[o + 1] = st.y; streakPos[o + 2] = st.z;
    streakPos[o + 3] = st.x - st.len; streakPos[o + 4] = st.y; streakPos[o + 5] = st.z;
  }
  streakGeo.attributes.position.needsUpdate = true;
}

/* snowfall */
function updateSnow(t, dt, camX, camY) {
  for (var l = 0; l < snowLayers.length; l++) {
    var L = snowLayers[l];
    var pos = L.geo.attributes.position.array;
    var n = L.cfg.n;
    for (var i = 0; i < n; i++) {
      var iy = i * 3 + 1, ix = i * 3, iz = i * 3 + 2;
      pos[iy] -= L.spd[i] * (1.4 + L.cfg.spd) * dt;
      pos[ix] += Math.sin(t * 0.6 + i * 0.31) * L.cfg.drift * dt;
      pos[iz] += Math.cos(t * 0.45 + i * 0.17) * L.cfg.drift * 0.45 * dt;
      if (pos[iy] < camY - 60) {
        pos[iy] = camY + 75;
        pos[ix] = camX + rr(-110, 140);
        pos[iz] = rr(L.cfg.zmin, L.cfg.zmax);
      }
    }
    L.geo.attributes.position.needsUpdate = true;
  }
}

/* flags */
function updateFlags(t) {
  for (var i = 0; i < window.__FLAGS.length; i++) {
    var g = window.__FLAGS[i];
    var cloth = g.userData.cloth;
    var pa = cloth.geometry.attributes.position;
    for (var k = 0; k < pa.count; k++) {
      var x = pa.getX(k);
      var w = (x + 0.85) / 1.7;
      pa.setZ(k, Math.sin(t * 5.2 + x * 3.4 + g.userData.phase) * 0.24 * w);
    }
    pa.needsUpdate = true;
    cloth.rotation.y = -0.45 + Math.sin(t * 0.9 + g.userData.phase) * 0.3;
  }
  /* the finish banner ripples the same way */
  var fin = window.__FINISH;
  if (fin) {
    var fc = fin.userData.cloth;
    var fpa = fc.geometry.attributes.position;
    for (var fk = 0; fk < fpa.count; fk++) {
      var fx2 = fpa.getX(fk);
      var fw = (fx2 + 17.5) / 35;
      fpa.setZ(fk, Math.sin(t * 4.1 + fx2 * 1.9) * 0.32 * fw);
    }
    fpa.needsUpdate = true;
  }
}

/* camera --------------------------------------------------------------
   A stabilised tracking camera: it rides beside the track, locked to the
   jumper's own path frame, so the terrain streams past and the subject
   never drifts out of frame.  tgtX/tgtY place the jumper deliberately on
   a third of the screen instead of wherever it happens to land.          */
var CAM = {
  inrun:  { side: 13.5, lift: 4.6, back: 7.0, fov: 40, tgtX: -0.30, tgtY: 0.12, lookUp: 0.9 },
  launch: { side: 11.5, lift: 3.8, back: 2.5, fov: 46, tgtX: -0.24, tgtY: 0.14, lookUp: 0.9 },
  flight: { side: 16.0, lift: 3.0, back: 2.5, fov: 48, tgtX: -0.18, tgtY: 0.10, lookUp: 0.8 },
  land:   { side: 12.0, lift: 3.2, back: 2.0, fov: 42, tgtX: -0.20, tgtY: 0.12, lookUp: 0.9 },
  /* the closing shot looks PAST the penguin at the finish arch: the subject
     drops to the lower-left third and the arch, ridge and sky carry the
     rest of the frame, so the shot ends on the run-out rather than on a
     field of empty snow.                                                    */
  outrun: { side: 7.0, lift: 2.4, back: 11.0, fov: 38, tgtX: -0.44, tgtY: -0.22, lookUp: 1.5 }
};
var camCfg = { side: 13.5, lift: 4.6, back: 7.0, fov: 40, tgtX: -0.30, tgtY: 0.12, lookUp: 0.9 };
var camInit = false;
var _cSub = new THREE.Vector3();
var _cLook = new THREE.Vector3();
var _cFwd = new THREE.Vector3();
var _cRight = new THREE.Vector3();
var _cUp = new THREE.Vector3();
var _cRel = new THREE.Vector3();
var WORLD_UP = new THREE.Vector3(0, 1, 0);

function updateCamera(t, dt, p) {
  var ph = phaseOf(t);
  var tgt;
  if (ph === 'inrun') {
    /* the shot opens wide at the start gate and tightens as the jumper
       accelerates down the inrun */
    var pr = smooth(clamp(t / T_IN, 0, 1));
    tgt = {
      side: lerp(17.5, 11.0, pr),
      lift: lerp(7.6, 4.4, pr),
      back: lerp(12.5, 4.6, pr),
      fov: lerp(44, 38, pr),
      tgtX: lerp(-0.34, -0.28, pr),
      tgtY: 0.12,
      lookUp: lerp(1.4, 0.9, pr)
    };
  } else {
    tgt = CAM[ph];
  }
  if (!camInit) { for (var k0 in tgt) camCfg[k0] = tgt[k0]; camInit = true; }
  else {
    var rk = 1 - Math.exp(-2.4 * dt);
    for (var k1 in tgt) camCfg[k1] += (tgt[k1] - camCfg[k1]) * rk;
  }

  var a = p.a, ca = Math.cos(a), sa = Math.sin(a);
  var tx = ca, ty = sa;                 // path tangent, downhill
  var nx = -sa, ny = ca;                // path normal, up off the slope

  /* camera anchor: beside and above the jumper, in the jumper's own frame */
  camTargetPos.set(
    p.x + nx * camCfg.lift - tx * camCfg.back,
    p.y + ny * camCfg.lift - ty * camCfg.back,
    camCfg.side
  );
  var gy = terrainY(camTargetPos.x, camTargetPos.z) + 1.8;
  if (camTargetPos.y < gy) camTargetPos.y = gy;

  /* the point we frame: the body centre, not the ski base */

    o.traverse(function (c) {
      if (!c.isMesh || !c.geometry.attributes.position) return;
      var pa = c.geometry.attributes.position.array;
      for (var k = 0; k < pa.length; k += 3) {
        var v = new THREE.Vector3(pa[k], pa[k + 1], pa[k + 2]).applyMatrix4(c.matrixWorld);
        if (v.x < lo[0]) lo[0] = v.x; if (v.x > hi[0]) hi[0] = v.x;
        if (v.y < lo[1]) lo[1] = v.y; if (v.y > hi[1]) hi[1] = v.y;
        if (v.z < lo[2]) lo[2] = v.z; if (v.z > hi[2]) hi[2] = v.z;
      }
    });
    return { lo: lo.map(function (n) { return +n.toFixed(2); }),
             hi: hi.map(function (n) { return +n.toFixed(2); }) };
  }
  var s = sampleAt(t);
  return {
    t: t, phase: phaseOf(t),
    travel: [+Math.cos(s[2] * DEG).toFixed(3), +Math.sin(s[2] * DEG).toFixed(3)],
    pathPt: [+s[0].toFixed(2), +s[1].toFixed(2)],
    origin: wp(penguin),
    head: wp(head), beak: wp(beak), chest: wp(chest),
    wingL: wp(wingL), wingR: wp(wingR),
    poleL: wp(poleL), poleR: wp(poleR),
    bootL: wp(legs.children[0]), bootR: wp(legs.children[1]),
    skiL: wp(skis.children[0]), skiR: wp(skis.children[1]),
    spanBody: span(body), spanWingL: span(wingL), spanWingR: span(wingR),
    spanSkiL: span(skis.children[0]), spanSkiR: span(skis.children[1]),
    spanHead: span(head),
    spanPoleL: span(poleL), spanPoleR: span(poleR),
    wingRotL: [+wingL.rotation.x.toFixed(3), +wingL.rotation.y.toFixed(3), +wingL.rotation.z.toFixed(3)],
    wingRotR: [+wingR.rotation.x.toFixed(3), +wingR.rotation.y.toFixed(3), +wingR.rotation.z.toFixed(3)]
  };
};
window.__state = function () {
  return {
    t: simTime, loop: LOOP,
    x: +penguin.position.x.toFixed(2), y: +penguin.position.y.toFixed(2),
    phase: phaseOf(simTime),
    cam: [+camera.position.x.toFixed(1), +camera.position.y.toFixed(1), +camera.position.z.toFixed(1)],
    calls: renderer.info.render.calls, tris: renderer.info.render.triangles
  };
};

/* which scene objects sit near a point, and what are they? used to track
   down stray geometry that shows up in a render */
window.__near = function (t, radius) {
  window.__halt(); window.__seek(t);
  var w = new THREE.Vector3();
  var out = [];
  scene.traverse(function (o) {
    if (!o.isMesh || !o.material || !o.material.color) return;
    o.getWorldPosition(w);
    var d = w.distanceTo(penguin.position);
    if (d > (radius || 12)) return;
    out.push({
      hex: o.material.color.getHex().toString(16),
      geo: o.geometry.type,
      pos: [+w.x.toFixed(2), +w.y.toFixed(2), +w.z.toFixed(2)],
      d: +d.toFixed(2),
      detail: o.geometry.parameters ? JSON.stringify(o.geometry.parameters).slice(0, 70) : ''
    });
  });
  out.sort(function (a, b) { return a.d - b.d; });
  return out.slice(0, 40);
};

/* what object is under a normalised screen point? (x,y in NDC) */
window.__pick = function (t, ndcX, ndcY, azim, elev, dist) {
  window.__model(t, azim, elev, dist, 32);
  var rc = new THREE.Raycaster();
  rc.setFromCamera(new THREE.Vector2(ndcX, ndcY), camera);
  var hits = rc.intersectObjects(scene.children, true);
  return hits.slice(0, 4).map(function (h) {
    return {
      geo: h.object.geometry ? h.object.geometry.type : '?',
      hex: (h.object.material && h.object.material.color) ? h.object.material.color.getHex().toString(16) : '-',
      d: +h.distance.toFixed(2),
      p: [+h.point.x.toFixed(2), +h.point.y.toFixed(2), +h.point.z.toFixed(2)],
      chain: (function () { var n = h.object, s = []; while (n && s.length < 5) { s.push(n.type); n = n.parent; } return s.join('<'); })()
    };
  });
};

/* list every mesh under a named rig group, in world space */
window.__tree = function (t, which) {
  window.__halt(); window.__seek(t);
  var root = { skis: skis, legs: legs, tilt: tilt, wingL: wingL, wingR: wingR, bodyPivot: bodyPivot }[which];
  var out = [];
  (function walk(o, path) {
    if (o.isMesh) {
      var w = new THREE.Vector3(); o.getWorldPosition(w);
      out.push({ path: path, geo: o.geometry.type,
        hex: o.material && o.material.color ? o.material.color.getHex().toString(16) : '-',
        pos: [+w.x.toFixed(2), +w.y.toFixed(2), +w.z.toFixed(2)],
        p: o.geometry.parameters ? JSON.stringify(o.geometry.parameters) : '' });
    }
    for (var i = 0; i < o.children.length; i++) walk(o.children[i], path + '/' + i);
  })(root, which);
  return out;
};

/* screen-space NDC of the ski parts in the live animated camera, plus all
   orange meshes in the scene — used to explain strays in a render */
window.__skiNdc = function (t) {
  window.__halt(); window.__seek(t, 90);
  var out = [];
  scene.traverse(function (o) {
    if (!o.isMesh || !o.material || !o.material.color) return;
    var hex = o.material.color.getHex();
    if (hex !== 0xf03a1e && hex !== 0xf07d12) return;
    var w = new THREE.Vector3(); o.getWorldPosition(w);
    var v = w.clone().project(camera);
    out.push({ hex: hex.toString(16), geo: o.geometry.type,
      world: [+w.x.toFixed(2), +w.y.toFixed(2), +w.z.toFixed(2)],
      ndc: [+v.x.toFixed(3), +v.y.toFixed(3)],
      onScreen: Math.abs(v.x) < 1 && Math.abs(v.y) < 1 });
  });
  return out;
};
window.__hide = function (name, on) {
  var m = { skis: skis, tilt: tilt, legs: legs, wingL: wingL, wingR: wingR };
  if (m[name]) m[name].visible = !on;
  return 'ok';
};

/* raycast with the LIVE animated camera at an NDC point */
window.__pickLive = function (t, ndcX, ndcY) {
  window.__halt(); window.__seek(t, 90);
  var rc = new THREE.Raycaster();
  rc.setFromCamera(new THREE.Vector2(ndcX, ndcY), camera);
  var hits = rc.intersectObjects(scene.children, true);
  return hits.slice(0, 3).map(function (h) {
    var chain = [], n = h.object;
    while (n && chain.length < 6) { chain.push(n.type); n = n.parent; }
    return { geo: h.object.geometry ? h.object.geometry.type : '?',
      hex: (h.object.material && h.object.material.color) ? h.object.material.color.getHex().toString(16) : '-',
      d: +h.distance.toFixed(2),
      p: [+h.point.x.toFixed(2), +h.point.y.toFixed(2), +h.point.z.toFixed(2)],
      chain: chain.join('<') };
  });
};

/* local-space audit of the leg/ski assembly, so a hover or a sink is a
   number rather than a guess */
window.__fit = function (t) {
  window.__halt(); window.__seek(t);
  penguin.updateMatrixWorld(true);
  var w = new THREE.Vector3();
  function bottom(o) {
    var g = o.geometry, pa = g.attributes.position.array, lo = 1e9;
    for (var k = 0; k < pa.length; k += 3) {
      var v = new THREE.Vector3(pa[k], pa[k + 1], pa[k + 2]).applyMatrix4(o.matrixWorld);
      if (v.y < lo) lo = v.y;
    }
    return lo;
  }
  function top(o) {
    var g = o.geometry, pa = g.attributes.position.array, hi = -1e9;
    for (var k = 0; k < pa.length; k += 3) {
      var v = new THREE.Vector3(pa[k], pa[k + 1], pa[k + 2]).applyMatrix4(o.matrixWorld);
      if (v.y > hi) hi = v.y;
    }
    return hi;
  }
  var out = { t: t, phase: phaseOf(t), scale: +bodyPivot.scale.x.toFixed(3) };
  /* the boot: legs > legL > [cylinder, foot] ; the foot is the 2nd child */
  out.bootL = { bottom: +bottom(legL.children[1]).toFixed(3) };
  out.bootR = { bottom: +bottom(legR.children[1]).toFixed(3) };
  /* the ski: skis > skiL > [plank, tip, tail, strap] */
  out.bindingTopL = +top(skiL.children[3]).toFixed(3);
  out.bindingTopR = +top(skiR.children[3]).toFixed(3);
  out.plankTopL = +top(skiL.children[0]).toFixed(3);
  out.bootAboveBindingL = +(out.bootL.bottom - out.bindingTopL).toFixed(3);
  out.bootAboveBindingR = +(out.bootR.bottom - out.bindingTopR).toFixed(3);
  return out;
};

/* where each ski child sits relative to the boot, in the model frame
   (+f = forward along travel, +u = up off the slope) */
window.__skioff = function (t) {
  window.__halt(); window.__seek(t);
  penguin.updateMatrixWorld(true);
  var q = penguin.getWorldQuaternion(new THREE.Quaternion());
  var fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(q);
  var up = new THREE.Vector3(0, 1, 0).applyQuaternion(q);
  var org = penguin.position.clone();
  function rel(o) {
    var w = new THREE.Vector3(); o.getWorldPosition(w); w.sub(org);
    return [+w.dot(fwd).toFixed(2), +w.dot(up).toFixed(2)];
  }
  function span(o) {
    var g = o.geometry, pa = g.attributes.position.array;
    var lo = 1e9, hi = -1e9;
    for (var k = 0; k < pa.length; k += 3) {
      var v = new THREE.Vector3(pa[k], pa[k + 1], pa[k + 2]).applyMatrix4(o.matrixWorld).sub(org);
      var f = v.dot(fwd);
      if (f < lo) lo = f; if (f > hi) hi = f;
    }
    return [+lo.toFixed(2), +hi.toFixed(2)];
  }
  return {
    t: t, phase: phaseOf(t),
    bootL: rel(legL.children[1]),
    skiGroup: rel(skis),
    skiLOrigin: rel(skiL),
    plank: span(skiL.children[0]),
    tip: span(skiL.children[1]),
    tail: span(skiL.children[2])
  };
};

/* height of the RENDERED snow mesh under a point (raycast straight down),
   compared with the analytic terrainY and with the lowest ski corner.
   The mesh is a coarse grid, so between vertices its surface can sit above
   the analytic function and swallow the skis.                            */
window.__mesh = function (t) {
  window.__halt(); window.__seek(t);
  penguin.updateMatrixWorld(true);
  var rc = new THREE.Raycaster();
  function snowAt(x, z, fromY) {
    rc.set(new THREE.Vector3(x, fromY, z), new THREE.Vector3(0, -1, 0));
    var hit = rc.intersectObject(terrain, false);
    return hit.length ? hit[0].point.y : null;
  }
  var lo = null;
  skis.traverse(function (c) {
    if (!c.isMesh || !c.geometry.attributes || !c.geometry.attributes.position) return;
    var pa = c.geometry.attributes.position.array;
    for (var k = 0; k < pa.length; k += 3) {
      var v = new THREE.Vector3(pa[k], pa[k + 1], pa[k + 2]).applyMatrix4(c.matrixWorld);
      var sy = snowAt(v.x, v.z, v.y + 3);
      if (sy === null) continue;
      var gap = v.y - sy;
      if (lo === null || gap < lo.gap) lo = { gap: gap, x: v.x, z: v.z, skiY: v.y, snowY: sy };
    }
  });
  return {
    t: t, phase: phaseOf(t),
    worst: lo ? { gap: +lo.gap.toFixed(3), skiY: +lo.skiY.toFixed(2),
                  snowY: +lo.snowY.toFixed(2), x: +lo.x.toFixed(1), z: +lo.z.toFixed(2) } : null,
    analyticAtPath: +terrainY(penguin.position.x, 0).toFixed(3),
    meshAtPath: (function () { var y = snowAt(penguin.position.x, 0, penguin.position.y + 6); return y === null ? null : +y.toFixed(3); })()
  };
};

/* free look-at from an offset relative to the jumper, in world axes */
window.__closeup = function (t, dx, dy, dz, fov, lookUp) {
  window.__halt(); window.__seek(t, 90);
  var c = penguin.position;
  camera.position.set(c.x + dx, c.y + dy, c.z + dz);
  camera.lookAt(c.x, c.y + (lookUp === undefined ? 0.8 : lookUp), c.z);
  camera.fov = fov || 34;
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  return canvas.toDataURL('image/png');
};

})();
</script>
