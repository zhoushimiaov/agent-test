// ---------- helpers ----------
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
function profileInterp(ctrl,t){
  for(let i=0;i<ctrl.length-1;i++){
    const [t0,v0]=ctrl[i],[t1,v1]=ctrl[i+1];
    if(t>=t0&&t<=t1) return lerp(v0,v1,smoothstep(t0,t1,t));
  }
  return ctrl[ctrl.length-1][1];
}

}

  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}

function windowTex(seed){
  const w=64,h=128,c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');ctx.fillStyle='#05060f';ctx.fillRect(0,0,w,h);
  const cols=5,rows=12,mx=6,my=5,cw=(w-mx*(cols+1))/cols,ch=(h-my*(rows+1))/rows;
  let s=seed*9301+49297;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
  for(let r=0;r<rows;r++)for(let cc=0;cc<cols;cc++){
    if(rnd()<0.5){
      const b=rnd();
      ctx.fillStyle = rnd()<0.42
        ? `rgba(255,${180+(b*55|0)},${90+(b*60|0)},${0.5+b*0.5})`      // sodium amber
        : `rgba(${165+(b*65|0)},${196+(b*50|0)},255,${0.45+b*0.5})`;   // cold office light
      ctx.fillRect(mx+cc*(cw+mx),my+r*(ch+my),cw,ch);
    }
  }
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const buildMat=[0,1,2].map(i=>new THREE.MeshStandardMaterial({
  color:0x10152c,roughness:0.9,metalness:0.1,

const CITY_R=1600,CITY_N=680,dummy=new THREE.Object3D();
for(let i=0;i<CITY_N;i++){

}

// ---------- landmark towers (Gotham skyline) ----------
const lmWinTex=windowTex(7);
const landmarkMat=new THREE.MeshStandardMaterial({color:0x0c1124,roughness:0.85,metalness:0.18,

const spireMat=new THREE.MeshStandardMaterial({color:0x090d1a,roughness:0.55,metalness:0.45});
const beacons=[];
const GROUND=-40;
function makeLandmark(x,z,h,style){
  const g=new THREE.Group();
  const nSeg=3+(Math.random()*3|0), segH=h/nSeg;
  let w=lerp(34,56,Math.random());
  for(let s=0;s<nSeg;s++){
    const m=new THREE.Mesh(boxGeo,landmarkMat);
    m.scale.set(w,segH*1.02,w*lerp(0.82,1,Math.random()));
    m.position.set(x,GROUND+segH*(s+0.5),z);
    g.add(m);
    w*=lerp(0.72,0.86,Math.random());
  }
  const topY=GROUND+h;
  if(style!=='flat'){
    const spireH=lerp(h*0.2,h*0.42,Math.random());
    const spire=new THREE.Mesh(new THREE.ConeGeometry(w*0.55,spireH,6),spireMat);
    spire.position.set(x,topY+spireH/2,z);g.add(spire);
    const ant=new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.7,spireH*0.9,6),spireMat);
    ant.position.set(x,topY+spireH+spireH*0.45,z);g.add(ant);
    const bk=new THREE.Mesh(new THREE.SphereGeometry(2.4,12,12),
      new THREE.MeshStandardMaterial({color:0x400000,emissive:0xff2a18,emissiveIntensity:3}));
    bk.position.set(x,topY+spireH+spireH*0.9,z);g.add(bk);beacons.push(bk);
  }
  if(style==='gothic'){
    for(const dx of [-w*0.6,w*0.6])for(const dz of [-w*0.6,w*0.6]){
      const pin=new THREE.Mesh(new THREE.ConeGeometry(w*0.16,h*0.14,5),spireMat);
      pin.position.set(x+dx,topY+h*0.07,z+dz);g.add(pin);
    }
  }
  cityGroup.add(g);return g;
}

// ---------- the Bat-Signal ----------
function makeBatSignalTex(){

  const ctx=c.getContext('2d');

  ctx.fillStyle='rgba(9,9,13,0.93)';

  ctx.quadraticCurveTo(cx+0.34*u,cy-0.30*u,cx+0.5*u,cy-0.12*u);
  ctx.quadraticCurveTo(cx+0.86*u,cy-0.18*u,cx+1.0*u,cy-0.30*u);
  ctx.quadraticCurveTo(cx+0.9*u,cy-0.02*u,cx+0.82*u,cy+0.18*u);
  ctx.quadraticCurveTo(cx+0.78*u,cy+0.02*u,cx+0.66*u,cy+0.10*u);
  ctx.quadraticCurveTo(cx+0.62*u,cy+0.26*u,cx+0.5*u,cy+0.34*u);
  ctx.quadraticCurveTo(cx+0.46*u,cy+0.16*u,cx+0.34*u,cy+0.22*u);
  ctx.quadraticCurveTo(cx+0.26*u,cy+0.42*u,cx+0.12*u,cy+0.5*u);
  ctx.quadraticCurveTo(cx+0.06*u,cy+0.30*u,cx,cy+0.42*u);
  ctx.quadraticCurveTo(cx-0.06*u,cy+0.30*u,cx-0.12*u,cy+0.5*u);
  ctx.quadraticCurveTo(cx-0.26*u,cy+0.42*u,cx-0.34*u,cy+0.22*u);
  ctx.quadraticCurveTo(cx-0.46*u,cy+0.16*u,cx-0.5*u,cy+0.34*u);
  ctx.quadraticCurveTo(cx-0.62*u,cy+0.26*u,cx-0.66*u,cy+0.10*u);
  ctx.quadraticCurveTo(cx-0.78*u,cy+0.02*u,cx-0.82*u,cy+0.18*u);
  ctx.quadraticCurveTo(cx-0.9*u,cy-0.02*u,cx-1.0*u,cy-0.30*u);
  ctx.quadraticCurveTo(cx-0.86*u,cy-0.18*u,cx-0.5*u,cy-0.12*u);
  ctx.quadraticCurveTo(cx-0.34*u,cy-0.30*u,cx-0.16*u,cy-0.26*u);
  ctx.lineTo(cx-0.10*u,cy-0.52*u);ctx.lineTo(cx,cy-0.28*u);
  ctx.closePath();ctx.fill();
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}

// ---------- whale geometry ----------
function geomFromTris(verts){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  const n=verts.length/3,idx=[];for(let i=0;i<n;i++)idx.push(i);
  g.setIndex(idx);return g;
}
function transformTris(local,mat){
  const out=[],v=new THREE.Vector3();
  for(let i=0;i<local.length;i+=3){
    v.set(local[i],local[i+1],local[i+2]).applyMatrix4(mat);
    out.push(v.x,v.y,v.z);
  }
  return out;
}
const X_HEAD=28, X_TAIL=-34, R_MAX=9.2;
function buildWhale(){
  const N=120,M=30;
  const ctrl=[[0.00,0.02],[0.03,0.20],[0.07,0.40],[0.14,0.66],[0.26,0.92],
    [0.40,1.00],[0.52,0.97],[0.64,0.88],[0.75,0.70],[0.85,0.48],
    [0.93,0.28],[0.98,0.12],[1.00,0.02]];
  const pos=[];
  for(let i=0;i<=N;i++){
    const t=i/N, x=lerp(X_HEAD,X_TAIL,t), R=R_MAX*profileInterp(ctrl,t);
    for(let j=0;j<M;j++){
      const a=j/M*Math.PI*2, cy=Math.sin(a), cz=Math.cos(a);
      pos.push(x, R*cy*(cy<0?1.14:0.95), R*cz*0.92);
    }
  }
  const idx=[];
  for(let i=0;i<N;i++)for(let j=0;j<M;j++){
    const a=i*M+j,b=i*M+(j+1)%M,c=(i+1)*M+j,d=(i+1)*M+(j+1)%M;
    idx.push(a,c,b, b,c,d);
  }
  const body=new THREE.BufferGeometry();
  body.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  body.setIndex(idx);
  // long humpback pectoral fin (local, extends +z)
  const pec=[0,0,0, 3.5,0,10, 0.6,0,24,   0,0,0, 0.6,0,24, -4.5,0,11];
  const mR=new THREE.Matrix4().makeTranslation(11.5,-2.4,6.4)
    .multiply(new THREE.Matrix4().makeRotationY(-0.5))
    .multiply(new THREE.Matrix4().makeRotationX(0.55));
  const mL=new THREE.Matrix4().makeScale(1,1,-1).multiply(mR);
  // horizontal tail flukes (local, extends +z)
  const flk=[0,0,0, 7,0,4, 2,0,19,   0,0,0, 2,0,19, -6,0,7];
  const mFR=new THREE.Matrix4().makeTranslation(-30,0,1.2);
  const mFL=new THREE.Matrix4().makeScale(1,1,-1).multiply(mFR);
  // small dorsal hump
  const dor=[3,8.3,0, -4,8.3,0, -2,12.4,0];

  const parts=[body,
    geomFromTris(transformTris(pec,mR)),
    geomFromTris(transformTris(pec,mL)),
    geomFromTris(transformTris(flk,mFR)),
    geomFromTris(transformTris(flk,mFL)),
    geomFromTris(dor)];
  const merged=mergeGeometries(parts,false);
  merged.computeVertexNormals();
  return merged;
}

const geo=buildWhale();
// countershading via vertex colors (pale belly, deep-blue back)
const pA=geo.attributes.position;
const colors=new Float32Array(pA.count*3);
const back=new THREE.Color(0x2a3a63), belly=new THREE.Color(0xaebfd8), tmp=new THREE.Color();
for(let i=0;i<pA.count;i++){
  tmp.copy(belly).lerp(back,smoothstep(-7,7,pA.getY(i)));
  colors[i*3]=tmp.r;colors[i*3+1]=tmp.g;colors[i*3+2]=tmp.b;
}
geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
const origPos=pA.array.slice();

const whaleMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.8,
  metalness:0.05,side:THREE.DoubleSide});
const whale=new THREE.Mesh(geo,whaleMat);
const whaleGroup=new THREE.Group();whaleGroup.add(whale);
whaleGroup.scale.setScalar(1.5); // a truly giant whale
scene.add(whaleGroup);

// eyes
const eyeGeo=new THREE.SphereGeometry(1.25,16,16);
const eyeMat=new THREE.MeshStandardMaterial({color:0x080810,roughness:0.25,metalness:0.1});
const eyeR=new THREE.Mesh(eyeGeo,eyeMat), eyeL=new THREE.Mesh(eyeGeo,eyeMat);
eyeR.position.set(18,-2.6,5.4);eyeL.position.set(18,-2.6,-5.4);
whale.add(eyeR,eyeL);
// swimming undulation: vertical traveling wave, growing toward the tail
function deform(time){
  const arr=pA.array;
  for(let i=0;i<arr.length;i+=3){
    const x=origPos[i];
    const s=clamp((X_HEAD-x)/(X_HEAD-X_TAIL),0,1); // 0 nose .. 1 tail
    const amp=6.6*Math.pow(s,1.7);
    arr[i+1]=origPos[i+1]+amp*Math.sin(s*3.0-time*2.6);
  }
  pA.needsUpdate=true;
  geo.computeVertexNormals();
}

// ---------- flight path (closed loop above the city) ----------
const path=new THREE.CatmullRomCurve3([
  new THREE.Vector3(360,150,0),
  new THREE.Vector3(240,198,300),
  new THREE.Vector3(0,172,410),
  new THREE.Vector3(-290,208,250),
  new THREE.Vector3(-395,158,0),
  new THREE.Vector3(-250,198,-300),
  new THREE.Vector3(0,180,-410),
  new THREE.Vector3(285,208,-260)
],true,'catmullrom',0.5);

const UP=new THREE.Vector3(0,1,0);
const _tan=new THREE.Vector3(),_right=new THREE.Vector3(),_up=new THREE.Vector3();
const _m=new THREE.Matrix4(),_q=new THREE.Quaternion(),_qb=new THREE.Quaternion();
function moveWhale(time){
  const u=(time*0.013)%1;
  const p=path.getPointAt(u);
  path.getTangentAt(u,_tan).normalize();
  whaleGroup.position.copy(p);
  _right.crossVectors(UP,_tan).normalize();
  _up.crossVectors(_tan,_right).normalize();
  _m.makeBasis(_tan,_up,_right);
  _q.setFromRotationMatrix(_m);
  const t2=path.getTangentAt((u+0.012)%1,new THREE.Vector3());
  const turn=t2.x*_tan.z-t2.z*_tan.x;          // signed horizontal turn
  _qb.setFromAxisAngle(_tan,clamp(turn*20,-0.55,0.55)); // bank into turns
  _q.premultiply(_qb);
  whaleGroup.quaternion.slerp(_q,0.08);
  return p;
}
// ---------- cinematic camera (slow orbit that keeps the whale framed) ----------
const camTarget=new THREE.Vector3(0,160,0);
const _desired=new THREE.Vector3();
function moveCamera(time,whalePos){
  camTarget.lerp(whalePos,0.045);
  const ang=time*0.05;
  const dist=270+80*Math.sin(time*0.07);
  const h=66+58*Math.sin(time*0.045+1.0);
  _desired.set(camTarget.x+Math.cos(ang)*dist,
    Math.max(camTarget.y+h,25),
    camTarget.z+Math.sin(ang)*dist);
  camera.position.lerp(_desired,0.04);
  camera.lookAt(camTarget.x,camTarget.y-12,camTarget.z);
}

// ---------- clouds (soft drifting billboards) ----------
const cloudTex=radialTex([[0,'rgba(255,232,242,0.95)'],[0.4,'rgba(228,198,230,0.5)'],
  [1,'rgba(206,178,220,0)']]);
const clouds=[];
const cloudGroup=new THREE.Group();scene.add(cloudGroup);
function addCloud(cx,cy,cz,scale,puffs){
  for(let k=0;k<puffs;k++){
    const col=new THREE.Color().setHSL(0.6+Math.random()*0.08,0.28,0.46);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:cloudTex,color:col,
      transparent:true,opacity:0.45+Math.random()*0.3,depthWrite:false,fog:false}));
    const sx=scale*(0.6+Math.random()*0.8);
    sp.scale.set(sx*2.2,sx*1.3,1);
    sp.position.set(cx+(Math.random()-0.5)*scale*2.5,
      cy+(Math.random()-0.5)*scale*0.5,
      cz+(Math.random()-0.5)*scale*2.5);
    cloudGroup.add(sp);clouds.push(sp);
  }
}
for(let i=0;i<15;i++){
  const ang=Math.random()*Math.PI*2, rad=Math.random()*1800;
  addCloud(Math.cos(ang)*rad,lerp(70,270,Math.random()),Math.sin(ang)*rad,
    lerp(60,145,Math.random()),6+(Math.random()*5|0));
}
function moveClouds(dt){
  for(const sp of clouds){
    sp.position.x+=dt*7;
    if(sp.position.x>2100)sp.position.x-=4200;
  }
}
// ---------- post-processing (bloom) ----------
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.95,0.55,0.62);
composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});

// ---------- interaction: WASD free-fly + drag-to-look ----------
const clock=new THREE.Clock();
const keys=new Set();
let manual=false,lastInput=-999;
let yaw=0,pitch=0,dragging=false,lastMX=0,lastMY=0;
const flyPos=new THREE.Vector3();
const MOVE=['w','a','s','d','q','e',' ','shift','arrowup','arrowdown','arrowleft','arrowright'];
function enterManual(){
  if(manual)return;
  manual=true;flyPos.copy(camera.position);
  const d=new THREE.Vector3();camera.getWorldDirection(d);
  pitch=Math.asin(clamp(d.y,-1,1));yaw=Math.atan2(d.x,d.z);
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(MOVE.includes(k)){keys.add(k);lastInput=clock.elapsedTime;enterManual();if(k===' ')e.preventDefault();}
});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
const cvs=renderer.domElement;
cvs.addEventListener('mousedown',e=>{dragging=true;lastMX=e.clientX;lastMY=e.clientY;enterManual();lastInput=clock.elapsedTime;});
addEventListener('mouseup',()=>dragging=false);
addEventListener('mousemove',e=>{
  if(!dragging)return;
  yaw-=(e.clientX-lastMX)*0.0032;
  pitch=clamp(pitch-(e.clientY-lastMY)*0.0032,-1.45,1.45);
  lastMX=e.clientX;lastMY=e.clientY;lastInput=clock.elapsedTime;
});
const _fwd=new THREE.Vector3(),_rgt=new THREE.Vector3(),_tgt=new THREE.Vector3();
function flyCamera(dt,time){
  _fwd.set(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch));
  _rgt.crossVectors(_fwd,UP).normalize();
  const spd=250*(keys.has('shift')?2.8:1)*dt;
  if(keys.has('w')||keys.has('arrowup'))flyPos.addScaledVector(_fwd,spd);
  if(keys.has('s')||keys.has('arrowdown'))flyPos.addScaledVector(_fwd,-spd);
  if(keys.has('d')||keys.has('arrowright'))flyPos.addScaledVector(_rgt,spd);
  if(keys.has('a')||keys.has('arrowleft'))flyPos.addScaledVector(_rgt,-spd);
  if(keys.has(' ')||keys.has('e'))flyPos.y+=spd;
  if(keys.has('q'))flyPos.y-=spd;
  flyPos.y=Math.max(flyPos.y,-20);
  camera.position.copy(flyPos);
  _tgt.copy(flyPos).add(_fwd);camera.lookAt(_tgt);
  if(time-lastInput>12&&!dragging)manual=false; // idle -> back to cinematic
}
const hintEl=document.getElementById('hint');
setTimeout(()=>{if(hintEl)hintEl.style.opacity='0';},8000);

// ---------- main loop ----------
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;
  deform(t);
  const p=moveWhale(t);
  if(manual)flyCamera(dt,t); else moveCamera(t,p);
  moveClouds(dt);
  const pulse=0.5+0.5*Math.sin(t*3.0);
  for(const b of beacons)b.material.emissiveIntensity=1.6+pulse*3.4;
  signal.material.opacity=0.82+0.08*Math.sin(t*1.7)+0.04*Math.sin(t*11.0);
  composer.render();
}
animate();
</script>
