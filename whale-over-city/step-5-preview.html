<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="dark"/>
<title>巨鲸游过城市上空 · A Whale Above the City</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0a0f26; }
  body { cursor: default; -webkit-user-select: none; user-select: none; }
  #scene { display: block; width: 100vw; height: 100vh; }
  /* 片头字卡:淡入 -> 停留 -> 淡出,仅第一轮出现,无任何交互 */
  #title {
    position: fixed; left: 7vw; bottom: 15vh;
    pointer-events: none; opacity: 0;
    animation: card 9s cubic-bezier(.22,.8,.24,1) .6s forwards;
  }
  #title .rule {
    width: 54px; height: 1px; background: rgba(243,230,214,.55);
    margin-bottom: 16px; transform: scaleX(0); transform-origin: left;
    animation: rulein 1.1s ease .9s forwards;
  }
  #title .cn {
    font-family: "Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
    font-weight: 600; font-size: clamp(26px, 3.4vw, 46px);
    letter-spacing: .18em; color: #f6ecdd;
    text-shadow: 0 2px 26px rgba(0,0,0,.5);
  }
  #title .en {
    margin-top: 12px; font-size: clamp(10px, 1vw, 12px);
    letter-spacing: .42em; color: rgba(246,236,221,.72);
    font-family: "Montserrat","Helvetica Neue",Arial,sans-serif;
  }
  @keyframes card {
    0%   { opacity: 0; transform: translateY(16px); }
    10%  { opacity: 1; transform: none; }
    78%  { opacity: 1; transform: none; }
    100% { opacity: 0; transform: translateY(-8px); }
  }
  @keyframes rulein { to { transform: scaleX(1); } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="title">
  <div class="rule"></div>
  <div class="cn">巨鲸游过城市上空</div>
  <div class="en">A WHALE ABOVE THE CITY</div>
</div>
<script>
'use strict';
/* ============================================================
   巨鲸游过城市上空 · 单文件 Canvas 2D 动画
   蓝调时刻的暮色城市,巨鲸沿弧线横越天空,
   尾鳍摆动、胸鳍划水、喷潮雾团、浮游微光,
   多层视差云层 + 双层城市剪影 + 缓慢推拉镜头,无缝循环。
   ============================================================ */
const TAU = Math.PI * 2;
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');

let W = 0, H = 0, DPR = 1;
let clock = 0;

/* ---------- 工具 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng = mulberry32(20261012);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const smoothstep = (a,b,x) => { const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const offscreen = (w,h) => { const c=document.createElement('canvas'); c.width=Math.max(1,Math.ceil(w)); c.height=Math.max(1,Math.ceil(h)); return c; };

/* ---------- 场景状态 ---------- */
let stars = [], cirrus = null, cumulus = null, fog = null;
let farCity = null, nearCity = null, fgCity = null;
let birds = [], shafts = [], grainPat = null;
let plankton = [], mist = [];
const SUN = { x: 0, y: 0, r: 0 };
const hero = { wx: 0, wy: 0, L: 0, rot: 0, bh: { x: 0, y: 0 } };
let spoutTimer = 2.6, spawnTimer = 0;

/* ---------- 构建 ---------- */
function build() {
  SUN.x = W * 0.70; SUN.y = H * 0.725; SUN.r = Math.max(13, H * 0.016);

  stars = [];
  for (let i = 0; i < 160; i++) {
    const y = rng() * H * 0.5;
    stars.push({ x: rng()*W, y: y, r: 0.4+rng()*1.2, ph: rng()*TAU, sp: 0.3+rng()*1.1, base: (1 - y/(H*0.5)) * 0.8 });
  }

  cirrus  = makeCirrus();
  cumulus = makeCumulus();
  fog     = makeFog();

  farCity = makeCity({
    base: 0.80, h: [0.07, 0.20], w: [42, 105], gap: [8, 34], speed: 4,
    color: '#232e52', rim: 'rgba(255,196,140,0.14)', antColor: 'rgba(12,16,32,0.8)',
    win: { p: 0.10, lit: 0.40, dim: 'rgba(150,168,210,0.10)', litc: 'rgba(190,205,240,0.50)' },
    antP: 0.14, towerP: 0.08
  });
  nearCity = makeCity({
    base: 0.86, h: [0.16, 0.34], w: [55, 130], gap: [14, 44], speed: 13,
    color: '#0d1428', rim: 'rgba(255,180,120,0.30)', antColor: 'rgba(6,9,20,0.9)',
    win: { p: 0.16, lit: 0.55, dim: 'rgba(140,158,200,0.10)', litc: 'rgba(255,199,122,0.92)' },
    antP: 0.20, towerP: 0.16
  });
  fgCity = makeCity({
    base: 1.04, h: [0.10, 0.20], w: [120, 300], gap: [40, 160], speed: 44,
    color: '#04060e', rim: 'rgba(255,180,120,0.10)', antColor: 'rgba(4,6,14,0.9)',
    win: { p: 0, lit: 0, dim: 'rgba(0,0,0,0)', litc: 'rgba(0,0,0,0)' },
    antP: 0.5, towerP: 0
  });

  birds = [];
  for (let i = 0; i < 7; i++) {
    birds.push({ x: rng()*W, y: H*(0.14+rng()*0.16), v: -(10+rng()*13), ph: rng()*TAU, s: 2.4+rng()*2.4, flap: 5.5+rng()*3 });
  }

  shafts = [];
  const baseAng = Math.atan2(-1, -0.32);
  for (let i = 0; i < 3; i++) {
    shafts.push({ a: baseAng + (i-1)*0.24 + (rng()-0.5)*0.08, w: 26+rng()*44, len: H*(1.0+rng()*0.25), ph: rng()*TAU });
  }

  grainPat = makeGrain();
}

/* 高层卷云:暖粉色细长条纹 */
function makeCirrus() {
  const total = W + 700, list = [];
  const n = 6 + Math.floor(rng()*4);
  for (let i = 0; i < n; i++) {
    const w = 230 + rng()*320, h = 20 + rng()*26;
    const c = offscreen(w, h), g = c.getContext('2d');
    const streaks = 3 + Math.floor(rng()*3);
    for (let s = 0; s < streaks; s++) {
      const cx = w*(0.18+rng()*0.64), cy = h*(0.3+rng()*0.4);
      const rx = w*(0.22+rng()*0.30), ry = h*(0.10+rng()*0.14);
      const gr = g.createRadialGradient(cx, cy, 0, cx, cy, rx);
      gr.addColorStop(0, 'rgba(255,214,190,0.20)');
      gr.addColorStop(0.55, 'rgba(196,178,214,0.10)');
      gr.addColorStop(1, 'rgba(196,178,214,0)');
      g.fillStyle = gr;
      g.save(); g.translate(cx, cy); g.scale(1, ry/rx); g.beginPath(); g.arc(0, 0, rx, 0, TAU); g.fill(); g.restore();
    }
    list.push({ cv: c, x: rng()*total, y: H*(0.05+rng()*0.16), speed: 3+rng()*2 });
  }
  return { list: list, total: total };
}

/* 中层积云:底部受夕阳染暖,顶部沉入暮紫 */
function makeCumulus() {
  const total = W + 800, list = [];
  const n = 4 + Math.floor(rng()*3);
  for (let i = 0; i < n; i++) {
    const w = 200 + rng()*280, h = 90 + rng()*100;
    const c = offscreen(w, h), g = c.getContext('2d');
    const puffs = 11 + Math.floor(rng()*8);
    for (let s = 0; s < puffs; s++) {
      const cx = w*0.12 + rng()*w*0.76, cy = h*0.30 + rng()*h*0.42;
      const r = 24 + rng()*58;
      const gr = g.createRadialGradient(cx, cy + r*0.55, 0, cx, cy + r*0.55, r*1.45);
      gr.addColorStop(0, 'rgba(255,204,152,0.42)');
      gr.addColorStop(0.38, 'rgba(216,150,118,0.24)');
      gr.addColorStop(0.72, 'rgba(102,82,126,0.13)');
      gr.addColorStop(1, 'rgba(102,82,126,0)');
      g.fillStyle = gr;
      g.save(); g.translate(cx, cy); g.scale(1, 0.62); g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill(); g.restore();
    }
    list.push({ cv: c, x: rng()*total, y: H*(0.14+rng()*0.26), speed: 8+rng()*5 });
  }
  return { list: list, total: total };
}

/* 低层雾带:贴近地平线的长条暮霭 */
function makeFog() {
  const total = W + 700, list = [];
  const n = 3 + Math.floor(rng()*2);
  for (let i = 0; i < n; i++) {
    const w = W + 200, h = H * 0.16;
    const c = offscreen(w, h), g = c.getContext('2d');
    for (let s = 0; s < 9; s++) {
      const cx = rng()*w, cy = h*(0.25+rng()*0.5);
      const rx = w*(0.18+rng()*0.30), ry = h*(0.10+rng()*0.16);
      const gr = g.createRadialGradient(cx, cy, 0, cx, cy, rx);
      gr.addColorStop(0, 'rgba(168,152,190,0.13)');
      gr.addColorStop(0.6, 'rgba(128,116,158,0.06)');
      gr.addColorStop(1, 'rgba(128,116,158,0)');
      g.fillStyle = gr;
      g.save(); g.translate(cx, cy); g.scale(1, ry/rx); g.beginPath(); g.arc(0, 0, rx, 0, TAU); g.fill(); g.restore();
    }
    list.push({ cv: c, x: rng()*total, y: H*(0.55+rng()*0.14), speed: 22+rng()*8 });
  }
  return { list: list, total: total };
}

/* 胶片颗粒 */
function makeGrain() {
  const s = 128, c = offscreen(s, s), g = c.getContext('2d');
  const img = g.createImageData(s, s);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random()*255 | 0;
    img.data[i] = v; img.data[i+1] = v; img.data[i+2] = v;
    img.data[i+3] = Math.random() < 0.5 ? 0 : 16;
  }
  g.putImageData(img, 0, 0);
  return ctx.createPattern(c, 'repeat');
}

/* 程序化城市 */
function makeCity(o) {
  const total = W + 640, list = [];
  let x = -220;
  while (x < total) {
    const w = o.w[0] + rng()*(o.w[1]-o.w[0]);
    const h = (o.h[0] + rng()*(o.h[1]-o.h[0])) * H;
    const base = o.base * H;
    const b = { x: x, w: w, h: h, base: base, wins: [], ant: null, tower: null };
    if (rng() < o.antP) b.ant = { h: 16+rng()*46, ph: rng()*TAU };
    if (o.towerP > 0 && rng() < o.towerP) b.tower = { x: w*(0.22+rng()*0.45), w: 9+rng()*6, h: 11+rng()*9 };
    if (o.win.p > 0) {
      const cols = Math.max(0, Math.floor((w-14)/13));
      const rows = Math.max(0, Math.floor((h*0.52)/15));
      for (let r = 0; r < rows; r++) for (let c2 = 0; c2 < cols; c2++) {
        if (rng() < o.win.p) {
          b.wins.push({ x: 7+c2*13+rng()*3.5, y: h*0.34+r*15+rng()*3, lit: rng()<o.win.lit, ph: rng()*TAU });
        }
      }
    }
    list.push(b);
    x += w + o.gap[0] + rng()*(o.gap[1]-o.gap[0]);
  }
  return { list: list, total: total, speed: o.speed, color: o.color, rim: o.rim, win: o.win, antColor: o.antColor };
}

/* ---------- 更新 ---------- */
function update(dt) {
  for (const L of [cirrus, cumulus, fog]) {
    for (const c of L.list) { c.x -= c.speed*dt; if (c.x + c.cv.width < -40) c.x += L.total; }
  }
  for (const layer of [farCity, nearCity, fgCity]) {
    for (const b of layer.list) { b.x -= layer.speed*dt; if (b.x + b.w < -60) b.x += layer.total; }
  }
  for (const b of birds) { b.x += b.v*dt; if (b.x < -20) b.x = W + 20; }

  for (let i = mist.length-1; i >= 0; i--) {
    const m = mist[i]; m.age += dt;
    if (m.age < 0) continue;
    m.x += m.vx*dt; m.y += m.vy*dt;
    const damp = Math.max(0, 1 - 1.1*dt);
    m.vx *= damp; m.vy = m.vy*damp - 5*dt;
    m.r += m.rg*dt;
    if (m.age > m.life) mist.splice(i, 1);
  }
  for (let i = plankton.length-1; i >= 0; i--) {
    const p = plankton[i]; p.age += dt;
    p.x += p.vx*dt; p.y += p.vy*dt + Math.sin(clock*1.7 + p.ph)*6*dt;
    if (p.age > p.life) plankton.splice(i, 1);
  }
}

/* 主角鲸:42 秒一轮横越画面,弧线路线 + 透视呼吸 */
function blowholePos(wx, wy, L, rot) {
  const OM = TAU*0.34, AMP = 0.045*L, K = TAU*1.15/L;
  const u = 0.11, x = u*L;
  const env = Math.pow(clamp(u/0.92, 0, 1), 2.1);
  const y = AMP*Math.sin(K*x - OM*clock)*env;
  const u2 = u + 1/64, x2 = u2*L;
  const env2 = Math.pow(clamp(u2/0.92, 0, 1), 2.1);
  const y2 = AMP*Math.sin(K*x2 - OM*clock)*env2;
  let tx = x2 - x, ty = y2 - y;
  const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
  const nx = -ty, ny = tx;
  let r = 0.088*Math.exp(-Math.pow((u-0.34)/0.24, 2)*1.2) + 0.012*Math.exp(-Math.pow((u-0.04)/0.09, 2));
  r *= 0.55 + 0.45*smoothstep(0, 0.16, u);
  r *= 1 - 0.86*smoothstep(0.60, 0.96, u);
  r = Math.max(r, 0.006) * L;
  const lx = x - nx*r*1.04, ly = y - ny*r*1.04;
  const c = Math.cos(rot), s = Math.sin(rot);
  return { x: wx + (lx*c - ly*s), y: wy + (lx*s + ly*c) };
}

function emitSpout() {
  for (let i = 0; i < 15; i++) {
    const a = -Math.PI/2 + (rng()-0.5)*0.9;
    const sp = 34 + rng()*46;
    mist.push({
      x: hero.bh.x, y: hero.bh.y,
      vx: Math.cos(a)*sp - 38, vy: Math.sin(a)*sp - 14,
      r: 3+rng()*4, rg: 9+rng()*10,
      life: 2.6+rng()*1.6, age: -i*0.10
    });
  }
}

function updateHero(dt) {
  const T = 42, p = (clock % T) / T;
  hero.wx = (-0.18 + 1.36*p) * W;
  hero.wy = H * (0.34 + 0.09*Math.sin(TAU*p - 0.6) + 0.025*Math.sin(TAU*2*p + 2.0));
  hero.L  = W * (0.36 + 0.12*Math.sin(Math.PI*p));
  const dydp = H * (0.09*TAU*Math.cos(TAU*p - 0.6) + 0.05*TAU*Math.cos(TAU*2*p + 2.0));
  const target = clamp(Math.atan2(dydp, 1.36*W), -0.4, 0.4);
  hero.rot += (target - hero.rot) * Math.min(1, dt*2.2);
  hero.bh = blowholePos(hero.wx, hero.wy, hero.L, hero.rot);

  /* 喷潮:约每 7 秒一次,雾团逆风向上飘散 */
  spoutTimer -= dt;
  if (spoutTimer <= 0 && p > 0.04 && p < 0.96) {
    spoutTimer = 6.8;
    emitSpout();
  }

  /* 尾迹浮游微光 */
  spawnTimer -= dt;
  if (spawnTimer <= 0 && p > 0.03 && p < 0.97) {
    spawnTimer = 0.11;
    plankton.push({
      x: hero.wx + (rng()-0.5)*hero.L*0.2, y: hero.wy + (rng()-0.5)*40,
      vx: -(26+rng()*64), vy: (rng()-0.5)*22,
      life: 2.0+rng()*1.6, age: 0, ph: rng()*TAU,
      warm: rng() < 0.22
    });
  }
  if (plankton.length > 170) plankton.splice(0, plankton.length - 170);
  if (mist.length > 110) mist.splice(0, mist.length - 110);
}

/* ---------- 绘制 ---------- */
function drawSky() {
  let g = ctx.createLinearGradient(0, 0, 0, H*0.80);
  g.addColorStop(0, '#0a0f26');
  g.addColorStop(0.30, '#1a2150');
  g.addColorStop(0.52, '#3a2f63');
  g.addColorStop(0.68, '#7b4363');
  g.addColorStop(0.85, '#c05f4e');
  g.addColorStop(1, '#f0a25c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H*0.80);

  g = ctx.createLinearGradient(0, H*0.76, 0, H);
  g.addColorStop(0, '#5a3547');
  g.addColorStop(0.35, '#332436');
  g.addColorStop(1, '#14101f');
  ctx.fillStyle = g; ctx.fillRect(0, H*0.76, W, H*0.24 + 1);

  const hg = ctx.createRadialGradient(SUN.x, H*0.76, 0, SUN.x, H*0.76, W*0.46);
  hg.addColorStop(0, 'rgba(255,168,104,0.34)');
  hg.addColorStop(1, 'rgba(255,168,104,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, H*0.55, W, H*0.45);
}

function drawStars() {
  for (const s of stars) {
    const a = s.base * (0.35 + 0.65*Math.abs(Math.sin(clock*s.sp + s.ph)));
    if (a <= 0.02) continue;
    ctx.fillStyle = 'rgba(226,232,255,' + a.toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
  }
}

function drawSun() {
  const g1 = ctx.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, H*0.30);
  g1.addColorStop(0, 'rgba(255,196,132,0.50)');
  g1.addColorStop(0.4, 'rgba(255,170,110,0.18)');
  g1.addColorStop(1, 'rgba(255,170,110,0)');
  ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.shadowColor = 'rgba(255,196,128,0.9)'; ctx.shadowBlur = 34;
  ctx.fillStyle = '#ffd9a0';
  ctx.beginPath(); ctx.arc(SUN.x, SUN.y, SUN.r, 0, TAU); ctx.fill();
  ctx.restore();
}

/* 丁达尔光柱 */
function drawShafts() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const s of shafts) {
    const a = s.a + 0.05*Math.sin(clock*0.07 + s.ph);
    ctx.save();
    ctx.translate(SUN.x, SUN.y); ctx.rotate(a);
    const g = ctx.createLinearGradient(0, 0, 0, -s.len);
    g.addColorStop(0, 'rgba(255,203,150,0.085)');
    g.addColorStop(1, 'rgba(255,203,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-s.w*0.5, 0); ctx.lineTo(s.w*0.5, 0);
    ctx.lineTo(s.w*1.7, -s.len); ctx.lineTo(-s.w*1.7, -s.len);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawCloudLayer(L) {
  for (const c of L.list) ctx.drawImage(c.cv, c.x, c.y);
}

function drawCity(layer) {
  for (const b of layer.list) {
    const top = b.base - b.h;
    ctx.fillStyle = layer.color;
    ctx.fillRect(b.x, top, b.w, H - top + 2);
    ctx.strokeStyle = layer.rim;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(b.x, top + 0.5); ctx.lineTo(b.x + b.w, top + 0.5); ctx.stroke();
    for (const w of b.wins) {
      if (w.lit) {
        if (Math.sin(clock*0.5 + w.ph) > 0.995) continue;
        ctx.fillStyle = layer.win.litc;
      } else {
        ctx.fillStyle = layer.win.dim;
      }
      ctx.fillRect(b.x + w.x, top + w.y, 2.6, 3.6);
    }
    if (b.ant) {
      const ax = b.x + b.w*0.5, ay = top;
      ctx.strokeStyle = layer.antColor; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax, ay - b.ant.h); ctx.stroke();
      const on = Math.sin(clock*1.6 + b.ant.ph) > 0.5;
      ctx.fillStyle = on ? 'rgba(255,96,84,0.95)' : 'rgba(255,96,84,0.10)';
      ctx.beginPath(); ctx.arc(ax, ay - b.ant.h - 1.6, 1.7, 0, TAU); ctx.fill();
    }
    if (b.tower) {
      const tx = b.x + b.tower.x, ty = top;
      ctx.fillStyle = layer.color;
      ctx.fillRect(tx, ty - b.tower.h, b.tower.w, b.tower.h);
      ctx.beginPath();
      ctx.moveTo(tx - 1.5, ty - b.tower.h);
      ctx.lineTo(tx + b.tower.w/2, ty - b.tower.h - 7);
      ctx.lineTo(tx + b.tower.w + 1.5, ty - b.tower.h);
      ctx.closePath(); ctx.fill();
    }
  }
}

function drawBirds() {
  ctx.strokeStyle = 'rgba(18,22,38,0.7)';
  ctx.lineWidth = 1.2; ctx.lineCap = 'round';
  for (const b of birds) {
    const f = Math.sin(clock*b.flap + b.ph);
    const s = b.s;
    ctx.beginPath();
    ctx.moveTo(b.x - s, b.y - f*s*0.85);
    ctx.quadraticCurveTo(b.x - s*0.4, b.y - f*s*0.15, b.x, b.y);
    ctx.quadraticCurveTo(b.x + s*0.4, b.y - f*s*0.15, b.x + s, b.y - f*s*0.85);
    ctx.stroke();
  }
}

/* ---------- 鲸鱼 ---------- */
function drawWhaleShape(P, wx, wy, L, rot) {
  const N = 64, OM = TAU*0.34, AMP = 0.045*L, K = TAU*1.15/L;
  const pts = [], ns = [], top = [], bot = [], rr = [];
  for (let i = 0; i <= N; i++) {
    const u = i/N, x = u*L;
    const env = Math.pow(clamp(u/0.92, 0, 1), 2.1);   /* 行波:头端不动,尾端最大 */
    pts.push({ x: x, y: AMP*Math.sin(K*x - OM*clock)*env });
  }
  for (let i = 0; i <= N; i++) {
    const a = pts[Math.max(0, i-1)], b = pts[Math.min(N, i+1)];
    let tx = b.x - a.x, ty = b.y - a.y;
    const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    ns.push({ x: -ty, y: tx });
  }
  for (let i = 0; i <= N; i++) {
    const u = i/N;
    let r = 0.088*Math.exp(-Math.pow((u-0.34)/0.24, 2)*1.2) + 0.012*Math.exp(-Math.pow((u-0.04)/0.09, 2));
    r *= 0.55 + 0.45*smoothstep(0, 0.16, u);          /* 吻部略钝 */
    r *= 1 - 0.86*smoothstep(0.60, 0.96, u);          /* 尾柄收细 */
    r = Math.max(r, 0.006) * L;
    rr.push(r);
    top.push({ x: pts[i].x - ns[i].x*r, y: pts[i].y - ns[i].y*r });
    bot.push({ x: pts[i].x + ns[i].x*r, y: pts[i].y + ns[i].y*r });
  }

  ctx.save();
  ctx.translate(wx, wy); ctx.rotate(rot);
  ctx.globalAlpha = P.alpha;

  const trace = () => {
    ctx.beginPath();
    ctx.moveTo(top[0].x, top[0].y);
    for (let i = 1; i <= N; i++) ctx.lineTo(top[i].x, top[i].y);
    ctx.quadraticCurveTo(pts[N].x + ns[N].x*rr[N]*0.5, pts[N].y + ns[N].y*rr[N]*0.5, bot[N].x, bot[N].y);
    for (let i = N-1; i >= 0; i--) ctx.lineTo(bot[i].x, bot[i].y);
    ctx.quadraticCurveTo(pts[0].x, pts[0].y, top[0].x, top[0].y);
    ctx.closePath();
  };

  /* 身体:天光返亮的顶面 -> 深青 -> 近黑腹底 */
  trace();
  const g = ctx.createLinearGradient(0, -0.10*L, 0, 0.11*L);
  g.addColorStop(0, P.top); g.addColorStop(0.55, P.mid); g.addColorStop(1, P.bot);
  ctx.fillStyle = g; ctx.fill();

  /* 上部受光 + 喉腹褶 */
  ctx.save(); trace(); ctx.clip();
  const sg = ctx.createLinearGradient(0, -0.10*L, 0, 0);
  sg.addColorStop(0, 'rgba(255,214,170,' + (0.10*P.rimA) + ')');
  sg.addColorStop(1, 'rgba(255,214,170,0)');
  ctx.fillStyle = sg; ctx.fillRect(-0.25*L, -0.13*L, 1.5*L, 0.35*L);
  ctx.strokeStyle = P.pleat; ctx.lineWidth = Math.max(1, L*0.002);
  for (let j = 0; j < 5; j++) {
    const i0 = Math.round((0.20 + j*0.075)*N), i1 = Math.round((0.33 + j*0.075)*N);
    ctx.beginPath();
    ctx.moveTo(bot[i0].x, bot[i0].y);
    ctx.quadraticCurveTo((bot[i0].x+bot[i1].x)/2, (bot[i0].y+bot[i1].y)/2 + 0.05*L, bot[i1].x, bot[i1].y);
    ctx.stroke();
  }
  ctx.restore();

  drawFlukes(P, pts, ns, rr, N, L, OM);
  drawPectoral(P, pts, ns, rr, N, L, OM);
  drawDorsal(P, pts, ns, rr, N, L);

  /* 背缘轮廓光(宽柔 + 锐利两遍) */
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(' + P.rim + ',' + (0.55*P.rimA) + ')';
  ctx.strokeStyle = 'rgba(' + P.rim + ',' + (0.16*P.rimA) + ')';
  ctx.lineWidth = Math.max(3, L*0.011); ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.moveTo(top[0].x, top[0].y);
  for (let i = 1; i <= N; i++) ctx.lineTo(top[i].x, top[i].y);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(' + P.rim + ',' + (0.85*P.rimA) + ')';
  ctx.lineWidth = Math.max(1.2, L*0.0032); ctx.shadowBlur = 8;
  ctx.stroke();
  /* 吻部前缘:天光包裹嘴角的一线 */
  ctx.strokeStyle = 'rgba(' + P.rim + ',' + (0.38*P.rimA) + ')';
  ctx.lineWidth = Math.max(1, L*0.0022); ctx.shadowBlur = 5;
  ctx.beginPath();
  ctx.moveTo(bot[0].x, bot[0].y);
  ctx.quadraticCurveTo(pts[0].x, pts[0].y, top[0].x, top[0].y);
  ctx.stroke();
  ctx.restore();   /* 轮廓光 */
  ctx.restore();   /* 鲸鱼 transform */
}

/* 尾鳍:两叶开合划水 */
function drawFlukes(P, pts, ns, rr, N, L, OM) {
  const E = { x: pts[N].x, y: pts[N].y };
  let tx = pts[N].x - pts[N-1].x, ty = pts[N].y - pts[N-1].y;
  const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
  const spread = 0.62 + 0.30*Math.sin(OM*clock - 1.2);
  const len = 0.17*L, w0 = rr[N]*1.0, w1 = len*0.17;
  for (const sgn of [-1, 1]) {
    const ang = spread*sgn, c = Math.cos(ang), s = Math.sin(ang);
    const dx = tx*c - ty*s, dy = tx*s + ty*c;
    const px = -dy, py = dx;
    const tipX = E.x + dx*len, tipY = E.y + dy*len;
    ctx.beginPath();
    ctx.moveTo(E.x + px*w0, E.y + py*w0);
    ctx.quadraticCurveTo(E.x + dx*len*0.45 + px*(w0+w1) + dx*len*0.12*sgn,
                         E.y + dy*len*0.45 + py*(w0+w1) + dy*len*0.12*sgn,
                         tipX + px*w1, tipY + py*w1);
    ctx.quadraticCurveTo(E.x + dx*len*0.55 - px*(w0+w1)*0.6,
                         E.y + dy*len*0.55 - py*(w0+w1)*0.6,
                         E.x - px*w0, E.y - py*w0);
    ctx.closePath();
    ctx.fillStyle = P.bot; ctx.fill();
    ctx.save();
    ctx.shadowColor = 'rgba(' + P.rim + ',0.45)'; ctx.shadowBlur = 6;
    ctx.strokeStyle = 'rgba(' + P.rim + ',' + (0.5*P.finA) + ')';
    ctx.lineWidth = Math.max(1, L*0.0024);
    ctx.beginPath();
    ctx.moveTo(tipX + px*w1, tipY + py*w1);
    ctx.quadraticCurveTo(E.x + dx*len*0.55 - px*(w0+w1)*0.6, E.y + dy*len*0.55 - py*(w0+w1)*0.6, E.x - px*w0, E.y - py*w0);
    ctx.stroke();
    ctx.restore();
  }
}

/* 胸鳍:长镰刀形,带相位迟滞后摆 */
function drawPectoral(P, pts, ns, rr, N, L, OM) {
  const i = Math.round(N*0.30);
  const ax = pts[i].x + ns[i].x*rr[i]*0.1, ay = pts[i].y + ns[i].y*rr[i]*0.1;
  const ang = 2.52 + 0.13*Math.sin(OM*clock - 1.0);
  const len = 0.27*L;
  const dx = Math.cos(ang), dy = Math.sin(ang);
  const px = -dy, py = dx, w = 0.040*L;
  const tipX = ax + dx*len, tipY = ay + dy*len;
  ctx.beginPath();
  ctx.moveTo(ax + px*w, ay + py*w);
  ctx.quadraticCurveTo(ax + dx*len*0.5 + px*w*1.8, ay + dy*len*0.5 + py*w*1.8, tipX + px*w*0.2, tipY + py*w*0.2);
  ctx.quadraticCurveTo(ax + dx*len*0.62 - px*w*0.8, ay + dy*len*0.62 - py*w*0.8, ax - px*w, ay - py*w);
  ctx.closePath();
  ctx.fillStyle = P.bot; ctx.fill();
  ctx.save();
  ctx.strokeStyle = 'rgba(' + P.rim + ',' + (0.32*P.finA) + ')';
  ctx.lineWidth = Math.max(1, L*0.0022);
  ctx.stroke();
  ctx.restore();
}

/* 背鳍:座头鲸的小驼峰 */
function drawDorsal(P, pts, ns, rr, N, L) {
  const i = Math.round(N*0.60);
  const bx = pts[i].x - ns[i].x*rr[i]*0.92, by = pts[i].y - ns[i].y*rr[i]*0.92;
  const hgt = 0.030*L;
  ctx.beginPath();
  ctx.moveTo(bx - 0.030*L, by + 0.004*L);
  ctx.quadraticCurveTo(bx - 0.002*L, by - hgt*1.25, bx + 0.030*L, by - hgt*0.30);
  ctx.quadraticCurveTo(bx + 0.014*L, by - hgt*0.05, bx + 0.026*L, by + 0.004*L);
  ctx.closePath();
  ctx.fillStyle = P.bot; ctx.fill();
  ctx.save();
  ctx.strokeStyle = 'rgba(' + P.rim + ',' + (0.5*P.finA) + ')';
  ctx.lineWidth = Math.max(1, L*0.0022);
  ctx.stroke();
  ctx.restore();
}

/* 远处另一头小鲸(被云层半遮,增加纵深与传说感) */
function drawMiniWhale() {
  const T = 150, p = (clock % T) / T;
  const mx = (-0.12 + 1.24*p) * W;
  const my = H * (0.20 + 0.015*Math.sin(TAU*p*2));
  drawWhaleShape({
    alpha: 0.34, top: '#39436e', mid: '#28305a', bot: '#202849',
    rim: '255,190,150', rimA: 0.5, finA: 0.35, pleat: 'rgba(0,0,0,0)'
  }, mx, my, W*0.085, -0.05);
}

function drawMist() {
  for (const m of mist) {
    if (m.age < 0) continue;
    const k = 1 - m.age/m.life;
    const a = Math.pow(clamp(k, 0, 1), 1.4) * 0.5;
    if (a <= 0.01) continue;
    const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r);
    g.addColorStop(0, 'rgba(255,230,208,' + a.toFixed(3) + ')');
    g.addColorStop(0.5, 'rgba(255,220,198,' + (a*0.4).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,220,198,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
  }
}

function drawPlankton() {
  for (const p of plankton) {
    const k = 1 - p.age/p.life;
    const tw = 0.45 + 0.55*Math.abs(Math.sin(clock*5 + p.ph));
    const a = clamp(k, 0, 1) * tw * 0.8;
    if (a <= 0.02) continue;
    const col = p.warm ? '255,214,170' : '214,228,255';
    ctx.fillStyle = 'rgba(' + col + ',' + a.toFixed(3) + ')';
    ctx.fillRect(p.x - 0.8, p.y - 0.8, 1.7, 1.7);
    ctx.fillStyle = 'rgba(' + col + ',' + (a*0.16).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, 3.2, 0, TAU); ctx.fill();
  }
}

function drawGrain() {
  ctx.save();
  ctx.globalAlpha = 0.05;
  ctx.fillStyle = grainPat;
  ctx.translate(-(Math.random()*128 | 0), -(Math.random()*128 | 0));
  ctx.fillRect(0, 0, W + 256, H + 256);
  ctx.restore();
}

function drawVignette() {
  const g = ctx.createRadialGradient(W*0.5, H*0.42, Math.min(W,H)*0.25, W*0.5, H*0.5, Math.hypot(W,H)*0.62);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.55, 'rgba(10,8,26,0.16)');
  g.addColorStop(1, 'rgba(6,6,20,0.50)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

/* ---------- 合成 ---------- */
function render() {
  drawSky();
  ctx.save();
  /* 极缓慢的呼吸推拉,制造运镜感 */
  const zoom = 1 + 0.012*(1 - Math.cos(TAU*clock/64)) / 2;
  ctx.translate(W/2, H/2); ctx.scale(zoom, zoom); ctx.translate(-W/2, -H/2);

  drawStars();
  drawSun();
  drawShafts();
  drawCloudLayer(cirrus);
  drawCity(farCity);
  drawCloudLayer(fog);
  drawMiniWhale();
  drawCloudLayer(cumulus);
  drawCity(nearCity);
  drawBirds();
  drawWhaleShape({
    alpha: 1,
    top: '#26385f', mid: '#101d36', bot: '#060a14',
    rim: '255,206,152', rimA: 0.9, finA: 0.5, pleat: 'rgba(159,182,221,0.07)'
  }, hero.wx, hero.wy, hero.L, hero.rot);
  drawMist();
  drawPlankton();
  drawCity(fgCity);

  ctx.restore();
  drawGrain();
  drawVignette();
}

/* ---------- 主循环 ---------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last)/1000; last = now;
  if (dt > 0.06) dt = 0.06;
  clock += dt;
  updateHero(dt);
  update(dt);
  render();
}

let rt = null;
function doResize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  build();
}
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(doResize, 180); });

/* 测试钩子:URL 带 ?t=秒 时确定性寻帧到该时刻(仅供截图验证,正常双击播放不传该参数) */
const QT = /[?&]t=([\d.]+)/.exec(location.search);

doResize();

if (QT) {
  clock = Math.max(0, parseFloat(QT[1]) || 0);
  const steps = Math.min(Math.round(clock*60), 5400);
  for (let i = 0; i < steps; i++) { updateHero(1/60); update(1/60); }
  emitSpout(); spoutTimer = 6.8;   /* 寻帧后补一发新鲜喷潮便于检视 */
}

requestAnimationFrame(frame);
</script>
