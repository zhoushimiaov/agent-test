// 确定性随机(场景可复现)
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296}}

// ---------- 程序化巨鲸(脊柱分段,游动时波动) ----------
const whaleG=new THREE.Group();scene.add(whaleG);
const SEG=52;                      // 脊柱分段数
const spine=[];                     // 各段基准坐标(局部)
const LEN=120;                      // 鲸鱼全长
{
  for(let i=0;i<SEG;i++){
    const t=i/(SEG-1);             // 0=吻端 1=尾
    spine.push({t,z:-t*LEN});      // 头朝 +z 游
  }
  const whaleProfile=t=>{
    if(t<0.10) return Math.sin(t/0.10*Math.PI/2)*6.2;   // 吻端
    if(t<0.42) return 6.2+Math.sin((t-0.10)/0.32*Math.PI)*4.6; // 鼓起到10.8
    if(t<0.78) return 10.8-(t-0.42)/0.36*6.4;           // 收到4.4
    return Math.max(4.4-(t-0.78)/0.22*3.4,0.9);         // 尾柄
  };
  const whaleSquashY=t=> t>0.24&&t<0.34 ? 1.28 : (t<0.5?1.06:0.92);
  const RAD=32;                    // 截面圆周细分
  const pos=[],idx=[],uv=[];
  for(let i=0;i<SEG;i++){
    const t=spine[i].t;
    const r=whaleProfile(t),sy=whaleSquashY(t);
    for(let j=0;j<=RAD;j++){
      const a=j/RAD*Math.PI*2;
      // 腹部略压扁(x 方向稍宽)
      const rx=r*1.06,ry=r*sy;
      pos.push(Math.sin(a)*rx,Math.cos(a)*ry,spine[i].z);
      uv.push(j/RAD,t);
    }
  }
  for(let i=0;i<SEG-1;i++)for(let j=0;j<RAD;j++){
    const a=i*(RAD+1)+j,b=a+1,c=a+RAD+1,d=c+1;
    idx.push(a,c,b,b,c,d);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();
  const whaleGeo=g;

  // 腹部白色贴图(沿 v 即身体长度方向渐变:腹白背深)
  const cv=document.createElement('canvas');cv.width=64;cv.height=512;
  const ctx=cv.getContext('2d');
  // 用 uv.y 作长度、uv.x 作圆周:圆周上 0.5=腹
  for(let y=0;y<512;y+=4){
    const t=y/512;
    for(let x=0;x<64;x+=2){
      const a=x/64;
      const dorsal=Math.abs(a-0.5)*2;      // 0=腹 1=背
      const base=[10+t*8,16+t*10,30+t*22];   // 深蓝灰
      const belly=[200-40*t,205-40*t,215-35*t]; // 腹白
      const mix=Math.pow(1-dorsal,2.2);     // 腹侧混白
      const r=base[0]*(1-mix)+belly[0]*mix;
      const gg=base[1]*(1-mix)+belly[1]*mix;
      const b=base[2]*(1-mix)+belly[2]*mix;
      ctx.fillStyle=`rgb(${r|0},${gg|0},${b|0})`;
      ctx.fillRect(x,y,2,4);
    }
  }
  const tx=new THREE.CanvasTexture(cv);tx.colorSpace=THREE.SRGBColorSpace;
  const whaleTex=tx;
  window.__whale={whaleGeo,whaleTex,whaleProfile,whaleSquashY,RAD:32};
}

// 胸鳍(长鳍,座头鲸式)
function makeFlipper(side){ // side=+1 右,-1 左
  const pos=[],idx=[];
  const CH=14,CW=6;
  for(let i=0;i<CH;i++){const t=i/(CH-1);
    for(let j=0;j<=CW;j++){const s=j/CW;
      const len=(1-t)*22*(0.55+0.45*Math.sin(Math.min(t*2.2,1)*Math.PI/2));
      const wid=4.6*(1-Math.abs(s-0.45)*1.6);
      pos.push(side*(2+Math.sin(t*1.5)*1.5+len), -1.5+t*4+Math.sin(s*Math.PI)*wid*0.3,
               2-t*20+ (s-0.45)*2);
    }}
  for(let i=0;i<CH-1;i++)for(let j=0;j<CW;j++){
    const a=i*(CW+1)+j,b=a+1,c=a+CW+1,d=c+1;idx.push(a,c,b,b,c,d);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,whaleMat);
  m.position.set(side*4,2,-14); // 挂在前腹
  m.userData.ph=side>0?0:Math.PI; // 胸鳍缓摆相位
  return m;
}

// ---------- 云层(体积感平面云,多层) ----------
const clouds=[];
function makeCloudLayer(y,count,scale,op,spd){
  const grp=new THREE.Group();
  const cv=document.createElement('canvas');cv.width=256;cv.height=256;
  const ctx=cv.getContext('2d');
  // 软团块云纹理
  ctx.clearRect(0,0,256,256);
  for(let i=0;i<26;i++){
    const x=40+R()*176,y=70+R()*116,r=18+R()*42;
    const g=ctx.createRadialGradient(x,y,1,x,y,r);
    g.addColorStop(0,'rgba(190,205,235,0.16)');
    g.addColorStop(1,'rgba(190,205,235,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  }
  const tx=new THREE.CanvasTexture(cv);
  for(let i=0;i<count;i++){
    const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
      new THREE.MeshBasicMaterial({map:tx,transparent:true,opacity:op,
        depthWrite:false,fog:false}));
    m.position.set((R()-0.5)*1600,y+(R()-0.5)*60,(R()-0.5)*1600);
    const s=scale*(0.6+R()*0.9);m.scale.set(s,s*0.45,1);
    m.rotation.z=R()*Math.PI;
    m.userData.spd=spd*(0.6+R()*0.8);
    grp.add(m);clouds.push(m);
  }
  scene.add(grp);return grp;
}

// ---------- 鲸的游动路径(环绕城市的大环线) ----------
const CY=95;                          // 鲸巡游高度
const pathPos=t=>{                    // t∈[0,1) 环线参数
  const a=t*Math.PI*2;
  const x=Math.sin(a)*260;
  const z=140+Math.cos(a)*200;        // 绕城心(0,140)
  const y=CY+Math.sin(a*2)*14+Math.sin(a*3+1)*6;
  return new THREE.Vector3(x,y,z);
};

// ---------- 运镜(电影感镜头循环) ----------

// 镜头脚本:60s 循环,5 个分镜
const SHOT_T=[0,12,24,36,48,60];     // 分镜切点
function shotAt(t){t=t%60;for(let i=0;i<5;i++)if(t<SHOT_T[i+1])return i;return 4;}
function segT(t,s){return (t-SHOT_T[s])/(SHOT_T[s+1]-SHOT_T[s]);}
const lerp=(a,b,k)=>a+(b-a)*k;
const smooth=k=>k*k*(3-2*k);          // smoothstep

// ---------- 动画循环 ----------
const clock=new THREE.Clock();
const V0=new THREE.Vector3(),V1=new THREE.Vector3(),V2=new THREE.Vector3();
const whalePos=new THREE.Vector3(),whaleDir=new THREE.Vector3();
let P0=pathPos(0),P1=pathPos(0.002);
const TIME_WRAP=60; // 与分镜共用 60s 循环

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const et=clock.elapsedTime;          // 总时间(不回绕)
  const t60=et%60;                     // 60s 循环相位
  const pathT=t60/60*1.0;              // 鲸沿环线 60s 一圈

  // --- 鲸沿路径游动 ---
  const wp=pathPos(pathT);
  const wp2=pathPos((pathT+0.004)%1);
  whalePos.copy(wp);whaleDir.copy(wp2).sub(wp).normalize();
  whaleG.position.copy(whalePos);
  // 朝向:z 轴指向游动方向
  V0.copy(whalePos).add(whaleDir);
  whaleG.lookAt(V0);

  // --- 脊柱游动波动(修改顶点) ---
  const posAttr=whaleGeo.attributes.position;
  const swim=et*0.9;                    // 摆尾相位速度
  const amp=3.2;                        // 侧向摆幅
  for(let i=0;i<SEG;i++){
    const t=spine[i].t;
    // 行波:越靠尾部摆幅越大,相位滞后
    const wave=Math.sin(swim - t*3.6)*amp*(0.25+t*1.1);
    const dip=Math.sin(swim*0.5 - t*2.2)*1.8*(0.2+t*0.8); // 上下起伏
    for(let j=0;j<=RAD;j++){
      const vi=i*(RAD+1)+j;
      // 原始截面(重建以基准):从 spine 基准位置加偏移
      const a=j/RAD*Math.PI*2;
      const r=whaleProfile(t),sy=whaleSquashY(t);
      const rx=r*1.06,ry=r*sy;
      posAttr.setXYZ(vi,Math.sin(a)*rx+wave,Math.cos(a)*ry+dip,spine[i].z);
    }
  }
  posAttr.needsUpdate=true;
  whaleGeo.computeVertexNormals();

  // 尾鳍跟随摆动
  tailG.rotation.y=Math.sin(swim-1*3.6)*0.55;
  tailG.position.x=Math.sin(swim-1*3.6)*amp*1.35;

  // 胸鳍缓摆
  whaleG.children.forEach(ch=>{
    if(ch.userData&&ch.userData.ph!==undefined&&ch.userData.ph!==null)
      ch.rotation.z=Math.sin(et*1.4+ch.userData.ph)*0.25;
  });

  // --- 镜头 ---
  const cfg=SHOTS[shotAt(t60)];
  // 相机位:把相对偏移按鲸的世界矩阵变换
  const m=whaleG.matrixWorld;
  V1.set(cfg.o[0],cfg.o[1],cfg.o[2]).applyMatrix4(m);
  V2.set(cfg.l[0],cfg.l[1],cfg.l[2]).applyMatrix4(m);
  // 帧率无关阻尼跟随,分镜切换自然过渡
  if(!animate.lastCam)animate.lastCam=V1.clone();
  animate.lastCam.lerp(V1,1-Math.pow(0.001,dt));
  dolly.position.copy(animate.lastCam);
  cam.lookAt(V2);
  // FOV 缓动
  const targetFov=cfg.fov;
  cam.fov+=(targetFov-cam.fov)*(1-Math.pow(0.02,dt));
  cam.updateProjectionMatrix();

  // --- 暖光跟随鲸(城市反光) ---
  glow.position.set(whalePos.x,20,whalePos.z-40);

  // --- 云移动 ---
  clouds.forEach(c=>{
    c.position.x+=c.userData.spd*dt;
    if(c.position.x>850)c.position.x=-850;
  });

  // --- 楼窗闪烁 / 障碍灯 ---
  flickers.forEach(f=>{f.m.emissiveIntensity=f.base+f.amp*Math.sin(et*f.sp+f.ph);});
  beacons.forEach(b=>{b.m.material.color.setRGB(1,0.12,0.12);
    const on=(Math.sin(et*2.4+b.ph)+Math.sin(et*3.7+b.ph*2))>0.9?1:0.25;
    b.m.material.opacity=on;b.m.material.transparent=true;});

  // --- 星星呼吸 ---
  starMat.opacity=0.72+0.18*Math.sin(et*0.5);

  renderer.render(scene,cam);
}
animate();
</script>
