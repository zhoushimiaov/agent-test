<style>

<body>
<canvas id="scene"></canvas>
<script>
(function () {
  'use strict';

  var cv  = document.getElementById('scene');
  var ctx = cv.getContext('2d', { alpha: false });

  var TAU = Math.PI * 2;
  var W = 0, H = 0, DPR = 1, PAD = 160;

  /* ------------------------------------------------------------------ */
  /* 小工具                                                              */
  /* ------------------------------------------------------------------ */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }

  // 确定性随机：同一屏幕尺寸每次刷新画面完全一致
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ------------------------------------------------------------------ */
  /* 鲸鱼体型剖线（非均匀 Catmull-Rom，C1 连续）                          */
  /* u = 0 → 尾柄末端 ; u = 1 → 吻端                                     */
  /* 数值 = 该处横截面半高，1.0 为最大围度                                 */
  /* ------------------------------------------------------------------ */
  var GIRTH_PTS = [
    [0.000, 0.030],  // 尾柄尖
    [0.045, 0.092],
    [0.100, 0.152],  // 尾柄最细处
    [0.150, 0.168],
    [0.230, 0.450],  // 迅速膨大
    [0.320, 0.730],
    [0.400, 0.905],
    [0.480, 0.985],
    [0.560, 1.000],  // 最大围度（约吻端后 44%）
    [0.650, 0.980],
    [0.740, 0.905],
    [0.820, 0.792],
    [0.880, 0.660],
    [0.930, 0.536],
    [0.970, 0.452],
    [1.000, 0.384]   // 钝圆吻端
  ];

  function makeProfile(pts) {
    return function (u) {
      u = clamp(u, 0, 1);
      var i = 0;
      while (i < pts.length - 2 && u > pts[i + 1][0]) i++;
      var p0 = pts[Math.max(i - 1, 0)];
      var p1 = pts[i];
      var p2 = pts[i + 1];
      var p3 = pts[Math.min(i + 2, pts.length - 1)];
      var du = p2[0] - p1[0];
      var t  = du > 1e-6 ? (u - p1[0]) / du : 0;
      var m1 = (p2[1] - p0[1]) / Math.max(p2[0] - p0[0], 1e-6) * du;
      var m2 = (p3[1] - p1[1]) / Math.max(p3[0] - p1[0], 1e-6) * du;
      var t2 = t * t, t3 = t2 * t;
      return Math.max(0,
        (2 * t3 - 3 * t2 + 1) * p1[1] + (t3 - 2 * t2 + t) * m1 +
        (-2 * t3 + 3 * t2) * p2[1] + (t3 - t2) * m2);
    };
  }
  var girth = makeProfile(GIRTH_PTS);

  /* ------------------------------------------------------------------ */
  /* 全局状态                                                            */
  /* ------------------------------------------------------------------ */
  var stars = [];
  var cityLayers = [];   // { canvas, baseY, depth }
  var flickerWins = [];  // 运行期闪烁的窗
  var beacons = [];      // 楼顶航空障碍灯
  var clouds = [];
  var sprites = {};
  var motes = [];
  var horizonY = 0;

  /* ------------------------------------------------------------------ */
  /* 云 sprite（预渲染柔化）                                             */
  /* ------------------------------------------------------------------ */
  function makeCloudSprite(rand, w, h, rgb, puffs, blurPx, alphaMul) {
    var tmp = document.createElement('canvas');
    tmp.width = w; tmp.height = h;
    var tg = tmp.getContext('2d');
    var col = rgb[0] + ',' + rgb[1] + ',' + rgb[2];

    for (var i = 0; i < puffs; i++) {
      var px = w * (0.22 + 0.56 * rand());
      var py = h * (0.42 + 0.34 * rand());
      var pr = h * (0.24 + 0.30 * rand());
      // 关键：保证每个气团连同模糊扩散半径都完整落在 sprite 画布内，
      // 否则边缘会被裁成直角，在大片天空上露出难看的矩形接缝
      var safe = blurPx * 2 + 4;
      pr = Math.min(pr, px - safe, w - px - safe, py - safe, h - py - safe);
      if (pr <= 1) continue;
      var gr = tg.createRadialGradient(px, py, 0, px, py, pr);
      gr.addColorStop(0.00, 'rgba(' + col + ',' + (0.72 * alphaMul) + ')');
      gr.addColorStop(0.42, 'rgba(' + col + ',' + (0.34 * alphaMul) + ')');
      gr.addColorStop(0.72, 'rgba(' + col + ',' + (0.10 * alphaMul) + ')');
      gr.addColorStop(1.00, 'rgba(' + col + ',0)');
      tg.fillStyle = gr;
      tg.beginPath(); tg.arc(px, py, pr, 0, TAU); tg.fill();
    }

    var out = document.createElement('canvas');
    out.width = w; out.height = h;
    var g = out.getContext('2d');
    // 不支持 ctx.filter 的浏览器会静默跳过，径向渐变本身已经足够柔
    if (blurPx > 0) { try { g.filter = 'blur(' + blurPx + 'px)'; } catch (e) {} }
    g.drawImage(tmp, 0, 0);
    g.filter = 'none';
    return out;
  }

  /* ------------------------------------------------------------------ */
  /* 城市：分层预渲染                                                    */
  /* ------------------------------------------------------------------ */
  // baseY 为地平线占屏高比例；层越近，地基越低、楼越高、颜色越暗
  var CITY_CFG = [
    { key: 'far',   baseY: 0.742, depth: 0.30, hMin: 0.020, hMax: 0.075,
      wMin: 12, wMax: 34, gapMin: 1, gapMax: 7, fill: '#33445f', alpha: 0.62,
      win: false, tall: 0.02 },
    { key: 'mid',   baseY: 0.756, depth: 0.50, hMin: 0.035, hMax: 0.135,
      wMin: 18, wMax: 48, gapMin: 2, gapMax: 11, fill: '#243349', alpha: 0.85,
      win: true, winW: 3, winH: 4, winGapX: 4, winGapY: 5,
      winChance: 0.30, winAlpha: 0.42, winColor: '#ffcf8e', tall: 0.06 },
    { key: 'near',  baseY: 0.782, depth: 0.78, hMin: 0.055, hMax: 0.225,
      wMin: 26, wMax: 66, gapMin: 4, gapMax: 17, fill: '#131d31', alpha: 0.95,
      win: true, winW: 4, winH: 5, winGapX: 5, winGapY: 6,
      winChance: 0.26, winAlpha: 0.80, winColor: '#ffc878', tall: 0.10 },
    { key: 'fore',  baseY: 0.842, depth: 1.10, hMin: 0.090, hMax: 0.300,
      wMin: 46, wMax: 116, gapMin: 9, gapMax: 32, fill: '#070b14', alpha: 1.0,
      win: true, winW: 5, winH: 6, winGapX: 7, winGapY: 8,
      winChance: 0.17, winAlpha: 0.92, winColor: '#ffb964', tall: 0.13 }
  ];

  function buildCityLayer(cfg, rand) {
    var w = W + PAD * 2;
    var c = document.createElement('canvas');
    c.width  = Math.max(1, Math.round(w * DPR));
    c.height = Math.max(1, Math.round(H * DPR));
    var g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    var baseY = H * cfg.baseY;
    var blds = [];
    var x = -20;

    while (x < w + 20) {
      var bw = cfg.wMin + rand() * (cfg.wMax - cfg.wMin);
      var bh = (cfg.hMin + rand() * (cfg.hMax - cfg.hMin)) * H;
      if (rand() < cfg.tall) bh *= 1.45 + rand() * 1.05;   // 少数摩天楼
      bh = Math.min(bh, H * 0.36);
      blds.push({ x: x, w: bw, h: bh, seed: rand() });
      x += bw + cfg.gapMin + rand() * cfg.gapMax;
    }

    for (var i = 0; i < blds.length; i++) {
      var b = blds[i];
      var top = baseY - b.h;

      g.globalAlpha = cfg.alpha;
      g.fillStyle = cfg.fill;
      g.fillRect(b.x, top, b.w, b.h + (H - baseY) + 4);

      // 退台 / 塔冠
      if (b.seed > 0.72 && b.w > 26) {
        var inset = b.w * 0.20;
        var crownH = b.h * (0.10 + b.seed * 0.10);
        g.fillRect(b.x + inset, top - crownH, b.w - inset * 2, crownH + 2);
        top -= crownH;
      }
      // 天线
      if (b.seed > 0.90 && b.h > H * 0.12) {
        g.fillRect(b.x + b.w * 0.5 - 1, top - H * 0.045, 2, H * 0.045);
        beacons.push({ x: b.x + b.w * 0.5, y: top - H * 0.045, ph: rand() * TAU, layer: cfg });
      }

      // 顶部受月光/天光的极窄高光边
      g.globalAlpha = cfg.alpha * 0.55;
      g.fillStyle = 'rgba(150,180,225,0.30)';
      g.fillRect(b.x, top, b.w, 1);

      // 窗
      if (cfg.win && b.h > 34) {
        var stepX = cfg.winW + cfg.winGapX;
        var stepY = cfg.winH + cfg.winGapY;
        var cols = Math.max(1, Math.floor((b.w - 8) / stepX));
        var rows = Math.max(1, Math.floor((b.h - 14) / stepY));
        var ox = b.x + (b.w - (cols * stepX - cfg.winGapX)) * 0.5;
        var oy = baseY - b.h + 8;

        for (var r = 0; r < rows; r++) {
          for (var k = 0; k < cols; k++) {
            if (rand() > cfg.winChance) continue;
            var wx = ox + k * stepX;
            var wy = oy + r * stepY;
            g.globalAlpha = cfg.winAlpha * (0.45 + rand() * 0.55);
            g.fillStyle = rand() < 0.78 ? cfg.winColor : '#cfe2ff';
            g.fillRect(wx, wy, cfg.winW, cfg.winH);

            // 抽样一部分窗交给运行期做明灭
            if (rand() < 0.012) {
              flickerWins.push({
                x: wx + PAD, y: wy,
                ph: rand() * TAU,
                sp: 0.25 + rand() * 0.9,
                a: cfg.winAlpha,
                c: cfg.winColor
              });
            }
          }
        }
      }
    }

    g.globalAlpha = 1;
    return { canvas: c, baseY: cfg.baseY, depth: cfg.depth, cfg: cfg };
  }

  /* ------------------------------------------------------------------ */
  /* 场景构建                                                            */
  /* ------------------------------------------------------------------ */
  function buildScene() {
    var rand = mulberry32(20261011);
    horizonY = H * 0.742;

    // ---- 星 ----
    stars = [];
    var nStars = Math.round(clamp(W * H / 8200, 60, 420));
    for (var i = 0; i < nStars; i++) {
      var y = Math.pow(rand(), 1.25) * H * 0.62;
      stars.push({
        x: rand() * W,
        y: y,
        r: 0.35 + rand() * 1.25,
        a: 0.12 + rand() * 0.72 * (1 - y / (H * 0.72)),
        ph: rand() * TAU,
        sp: 0.5 + rand() * 1.7
      });
    }

    // ---- 城市 ----
    cityLayers = [];
    flickerWins = [];
    beacons = [];
    for (var li = 0; li < CITY_CFG.length; li++) {
      cityLayers.push(buildCityLayer(CITY_CFG[li], rand));
    }

    // ---- 云 sprite ----
    sprites.high = makeCloudSprite(rand, 460, 210, [126, 148, 186], 9,  14, 1.15);
    sprites.mid  = makeCloudSprite(rand, 520, 250, [158, 174, 204], 10, 16, 1.25);
    sprites.low  = makeCloudSprite(rand, 620, 300, [216, 180, 152], 11, 20, 1.30);
    sprites.veil = makeCloudSprite(rand, 700, 320, [ 52,  64,  96], 10, 26, 1.10);

    // ---- 云分布：四带，veil 带在鲸鱼前方掠过 ----
    clouds = [];
    var bands = [
      { key: 'high', n: 16, yMin: 0.02, yMax: 0.30, sMin: 0.55, sMax: 1.15,
        spd:  3.5, aMin: 0.26, aMax: 0.56, depth: 0.30 },
      { key: 'mid',  n: 14, yMin: 0.16, yMax: 0.50, sMin: 0.90, sMax: 1.80,
        spd:  6.5, aMin: 0.38, aMax: 0.70, depth: 0.55 },
      { key: 'low',  n: 10, yMin: 0.54, yMax: 0.86, sMin: 1.30, sMax: 2.60,
        spd: 12.0, aMin: 0.44, aMax: 0.84, depth: 0.95 },
      { key: 'veil', n:  6, yMin: 0.17, yMax: 0.48, sMin: 1.70, sMax: 3.10,
        spd: 17.0, aMin: 0.14, aMax: 0.34, depth: 1.35 }
    ];

    for (var bi = 0; bi < bands.length; bi++) {
      var bd = bands[bi];
      for (var ci = 0; ci < bd.n; ci++) {
        var sc = bd.sMin + rand() * (bd.sMax - bd.sMin);
        clouds.push({
          key: bd.key,
          x: rand() * (W + 900) - 450,
          y: (bd.yMin + rand() * (bd.yMax - bd.yMin)) * H,
          s: sc,
          a: bd.aMin + rand() * (bd.aMax - bd.aMin),
          spd: bd.spd * (0.75 + rand() * 0.6),
          depth: bd.depth,
          flip: rand() < 0.5 ? -1 : 1,
          wob: rand() * TAU
        });
      }
    }

    // ---- 空气中的浮尘 ----
    motes = [];
    var nM = Math.round(clamp(W * H / 16000, 40, 180));
    for (var mi = 0; mi < nM; mi++) {
      motes.push({
        x: rand() * W, y: rand() * H,
        r: 0.6 + rand() * 1.9,
        a: 0.06 + rand() * 0.26,
        vx: -(4 + rand() * 14),
        vy: -(1 + rand() * 6),
        ph: rand() * TAU
      });
    }
  }

  /* ------------------------------------------------------------------ */
  /* 视差 / 运镜                                                         */
  /* ------------------------------------------------------------------ */
  function camAt(T) {
    return {
      x: Math.sin(T * 0.0370) * W * 0.014 + Math.sin(T * 0.0113 + 2.0) * W * 0.006,
      y: Math.sin(T * 0.0210 + 1.2) * H * 0.010
    };
  }

  /* ------------------------------------------------------------------ */
  /* 天空 / 星 / 月                                                      */
  /* ------------------------------------------------------------------ */
  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0.00, '#03050c');
    g.addColorStop(0.20, '#070c1c');
    g.addColorStop(0.40, '#101a34');
    g.addColorStop(0.58, '#1e2848');
    g.addColorStop(0.70, '#2e3459');
    g.addColorStop(0.78, '#3c3459');
    g.addColorStop(0.87, '#241c36');
    g.addColorStop(1.00, '#0b0916');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawHorizonGlow() {
    var hy = horizonY + H * 0.012;
    var g = ctx.createRadialGradient(W * 0.52, hy, 0, W * 0.52, hy, W * 0.62);
    g.addColorStop(0.00, 'rgba(255,163,86,0.34)');
    g.addColorStop(0.22, 'rgba(240,126,74,0.20)');
    g.addColorStop(0.52, 'rgba(150,72,86,0.09)');
    g.addColorStop(1.00, 'rgba(80,50,90,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var g2 = ctx.createRadialGradient(W * 0.52, hy, 0, W * 0.52, hy, W * 0.20);
    g2.addColorStop(0.00, 'rgba(255,214,150,0.34)');
    g2.addColorStop(0.45, 'rgba(255,168,96,0.12)');
    g2.addColorStop(1.00, 'rgba(255,150,80,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, W, H);
  }

  function drawStars(T, cam) {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var tw = 0.62 + 0.38 * Math.sin(T * s.sp + s.ph);
      var a = s.a * tw;
      if (a <= 0.01) continue;
      var x = s.x + cam.x * 0.06;
      var y = s.y + cam.y * 0.06;
      ctx.globalAlpha = a;
      ctx.fillStyle = '#eaf1ff';
      ctx.beginPath();
      ctx.arc(x, y, s.r, 0, TAU);
      ctx.fill();
      if (s.r > 1.15) {
        ctx.globalAlpha = a * 0.28;
        ctx.beginPath();
        ctx.arc(x, y, s.r * 3.4, 0, TAU);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawMoon(T, cam) {
    var mx = W * 0.775 + cam.x * 0.05;
    var my = H * 0.135 + cam.y * 0.05;
    var mr = Math.min(W, H) * 0.033;

    var halo = ctx.createRadialGradient(mx, my, mr * 0.6, mx, my, mr * 9.5);
    halo.addColorStop(0.00, 'rgba(238,232,214,0.30)');
    halo.addColorStop(0.16, 'rgba(206,208,206,0.13)');
    halo.addColorStop(0.46, 'rgba(150,164,196,0.05)');
    halo.addColorStop(1.00, 'rgba(120,140,190,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(mx, my, mr * 9.5, 0, TAU); ctx.fill();

    ctx.globalAlpha = 0.94;
    var disc = ctx.createRadialGradient(mx - mr * 0.28, my - mr * 0.28, mr * 0.1, mx, my, mr);
    disc.addColorStop(0.00, '#fffaf0');
    disc.addColorStop(0.72, '#f2ecdd');
    disc.addColorStop(1.00, '#d8d6cc');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  /* ------------------------------------------------------------------ */
  /* 云                                                                  */
  /* ------------------------------------------------------------------ */
  function drawClouds(T, cam, which) {
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      if (which === 'back' && c.key === 'veil') continue;
      if (which === 'front' && c.key !== 'veil') continue;

      var spr = sprites[c.key];
      var w = spr.width * c.s;
      var h = spr.height * c.s;

      // 漂移 + 环绕
      var span = W + w * 2 + 400;
      var x = ((c.x - T * c.spd) % span + span) % span - w - 200;
      x += cam.x * c.depth;
      var y = c.y + cam.y * c.depth + Math.sin(T * 0.11 + c.wob) * 8 * c.s;

      ctx.globalAlpha = c.a;
      ctx.save();
      ctx.translate(x + w * 0.5, y + h * 0.5);
      ctx.scale(c.flip, 1);
      ctx.drawImage(spr, -w * 0.5, -h * 0.5, w, h);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  /* ------------------------------------------------------------------ */
  /* 城市                                                                */
  /* ------------------------------------------------------------------ */
  // from/to 用来把城市拆成"远景段"和"近景段"，中间插入鲸鱼投影
  function drawCity(T, cam, from, to) {
    for (var i = from; i < to; i++) {
      var L = cityLayers[i];
      var ox = -PAD + cam.x * L.depth;
      var oy = cam.y * L.depth;
      ctx.globalAlpha = 1;
      ctx.drawImage(L.canvas, ox, oy, W + PAD * 2, H);

      // 远景层覆一层大气雾
      if (L.cfg.key === 'far' || L.cfg.key === 'mid') {
        var fogA = L.cfg.key === 'far' ? 0.42 : 0.20;
        var fg = ctx.createLinearGradient(0, horizonY - H * 0.16, 0, horizonY + H * 0.10);
        fg.addColorStop(0.00, 'rgba(58,64,104,0)');
        fg.addColorStop(0.55, 'rgba(96,88,120,' + (fogA * 0.55) + ')');
        fg.addColorStop(1.00, 'rgba(190,140,110,' + (fogA * 0.70) + ')');
        ctx.fillStyle = fg;
        ctx.fillRect(0, horizonY - H * 0.16, W, H * 0.26);
      }
    }

    // 闪烁的窗与航空灯属于中/近景，只在近景段绘制
    if (to < cityLayers.length) return;

    for (var k = 0; k < flickerWins.length; k++) {
      var fw = flickerWins[k];
      var a = fw.a * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(T * fw.sp + fw.ph)));
      ctx.globalAlpha = a;
      ctx.fillStyle = fw.c;
      ctx.fillRect(fw.x, fw.y, 3, 4);
    }

    // 楼顶红色航空灯
    for (var m = 0; m < beacons.length; m++) {
