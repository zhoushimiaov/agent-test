import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';

/* ============================================================
   犀牛绕地球 · Three.js 3D
   - 地球: 程序化 fBm 噪声纹理(海域/陆地/极冰) + 云层 + 大气辉光
   - 犀牛: 低多边形几何拼装, 奔跑起伏与四腿摆动
   - 轨道: 开普勒椭圆(近日点快/远日点慢), 有近大远小与前后遮挡
   - 运镜: 缓慢环绕 + 呼吸推拉, 自动循环, 无任何交互
   ============================================================ */

// ---------- 渲染器 / 场景 / 相机 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060a);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.05, 400);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- 噪声(fBm, 3D 采样保证球面无缝) ----------
function hash3(x, y, z) {
  let n = (x | 0) * 374761393 + (y | 0) * 668265263 + (z | 0) * 1274126177;
  n = Math.imul(n ^ (n >>> 13), 1103515245);
  n = n ^ (n >>> 16);
  return (n >>> 0) / 4294967296;
}
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  let xf = x - xi, yf = y - yi, zf = z - zi;
  xf = xf * xf * (3 - 2 * xf); yf = yf * yf * (3 - 2 * yf); zf = zf * zf * (3 - 2 * zf);
  const c000 = hash3(xi, yi, zi),     c100 = hash3(xi + 1, yi, zi);
  const c010 = hash3(xi, yi + 1, zi), c110 = hash3(xi + 1, yi + 1, zi);
  const c001 = hash3(xi, yi, zi + 1),     c101 = hash3(xi + 1, yi, zi + 1);
  const c011 = hash3(xi, yi + 1, zi + 1), c111 = hash3(xi + 1, yi + 1, zi + 1);
  const x00 = c000 + (c100 - c000) * xf, x10 = c010 + (c110 - c010) * xf;
  const x01 = c001 + (c101 - c001) * xf, x11 = c011 + (c111 - c011) * xf;
  const y0 = x00 + (x10 - x00) * yf, y1 = x01 + (x11 - x01) * yf;
  return y0 + (y1 - y0) * zf;
}
function fbm(x, y, z, oct) {
  let s = 0, a = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) {
    s += a * vnoise(x * f, y * f, z * f);
    norm += a; a *= 0.5; f *= 2.03;
  }
  return s / norm;
}
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, v) => { const t = clamp01((v - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };

// ---------- 程序化地球纹理 ----------
function makeEarthTexture() {
  const W = 1024, H = 512;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W, H);
  const d = img.data;
  const landT = 0.535;                       // 海陆阈值
  let k = 0;
  for (let j = 0; j < H; j++) {
    const lat = Math.PI * (0.5 - (j + 0.5) / H);
    const cl = Math.cos(lat), sl = Math.sin(lat);
    for (let i = 0; i < W; i++) {
      const lon = 2 * Math.PI * ((i + 0.5) / W) - Math.PI;
      const px = cl * Math.cos(lon), py = sl, pz = cl * Math.sin(lon);

      // 域扭曲: 让海岸线有机
      const w1 = fbm(px * 1.7 + 11.3, py * 1.7 + 5.1, pz * 1.7 + 7.7, 4);
      const w2 = fbm(px * 1.7 + 3.9,  py * 1.7 + 13.2, pz * 1.7 + 9.1, 4);
      const h = fbm(px * 2.3 + (w1 - 0.5) * 1.9,
                    py * 2.3 + (w2 - 0.5) * 1.9,
                    pz * 2.3 + (w1 - 0.5) * 1.9, 5);
      const moist = fbm(px * 4.5 + 21.7, py * 4.5 + 8.2, pz * 4.5 + 2.3, 3);

      let r, g, b;
      if (h > landT) {                        // 陆地
        const e = (h - landT) / (1 - landT);  // 海拔 0..1
        r = 0.23; g = 0.36; b = 0.19;         // 植被绿
        const dry = smooth(0.42, 0.72, moist);
        r = lerp(r, 0.56, dry); g = lerp(g, 0.47, dry * 0.85); b = lerp(b, 0.27, dry * 0.5);
        const rock = smooth(0.22, 0.55, e);
        r = lerp(r, 0.43, rock); g = lerp(g, 0.39, rock); b = lerp(b, 0.36, rock);
        const snow = smooth(0.5, 0.8, e + Math.abs(sl) * 0.45);
        r = lerp(r, 0.93, snow); g = lerp(g, 0.94, snow); b = lerp(b, 0.97, snow);
      } else {                                // 海洋
        const dp = smooth(0, 0.5, (landT - h) / landT);   // 0 近岸 → 1 深海
        r = lerp(0.075, 0.008, dp);
        g = lerp(0.26, 0.05, dp);
        b = lerp(0.42, 0.17, dp);
      }
      // 极地海冰
      const ice = smooth(0.8, 0.88, Math.abs(sl) + (w1 - 0.5) * 0.16);
      r = lerp(r, 0.9, ice); g = lerp(g, 0.93, ice); b = lerp(b, 0.96, ice);
      // 细微明度变化
      const shade = 0.9 + 0.18 * w2;
      d[k++] = Math.round(clamp01(r * shade) * 255);
      d[k++] = Math.round(clamp01(g * shade) * 255);
      d[k++] = Math.round(clamp01(b * shade) * 255);
      d[k++] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function makeCloudTexture() {
  const W = 512, H = 256;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W, H);
  const d = img.data;
  let k = 0;
  for (let j = 0; j < H; j++) {
    const lat = Math.PI * (0.5 - (j + 0.5) / H);
    const cl = Math.cos(lat), sl = Math.sin(lat);
    for (let i = 0; i < W; i++) {
      const lon = 2 * Math.PI * ((i + 0.5) / W) - Math.PI;
      const px = cl * Math.cos(lon), py = sl, pz = cl * Math.sin(lon);
      const w = fbm(px * 2 + 4.7, py * 2 + 9.3, pz * 2 + 1.1, 4);
      const v = fbm(px * 3.1 + (w - 0.5) * 2.2,
                    py * 3.1 + (w - 0.5) * 2.2,
                    pz * 3.1 + (w - 0.5) * 2.2, 5);
      const a = smooth(0.52, 0.74, v) * 0.92;
      // 赤道信风带云更多, 副热带少
      const band = 0.75 + 0.25 * Math.cos(py * 6.0);
      d[k++] = 255; d[k++] = 255; d[k++] = 255;
      d[k++] = Math.round(clamp01(a * band) * 255);
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ---------- 光照 ----------
const sunDir = new THREE.Vector3(1, 0.38, 0.55).normalize();
const sunLight = new THREE.DirectionalLight(0xfff1dc, 2.1);
sunLight.position.copy(sunDir).multiplyScalar(20);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x33415e, 0.65));

// ---------- 地球 ----------
const earthAxis = new THREE.Group();          // 23.4° 轴倾
earthAxis.rotation.z = 23.4 * Math.PI / 180;
scene.add(earthAxis);
const earthSpin = new THREE.Group();
earthAxis.add(earthSpin);

const earth = new THREE.Mesh(
  new THREE.SphereGeometry(1, 96, 64),
  new THREE.MeshPhongMaterial({
    map: makeEarthTexture(),
    specular: new THREE.Color(0x22303f),
    shininess: 14,
  })
);
earthSpin.add(earth);

const clouds = new THREE.Mesh(
  new THREE.SphereGeometry(1.018, 96, 64),
  new THREE.MeshPhongMaterial({
    map: makeCloudTexture(),
    transparent: true,
    opacity: 0.85,
    depthWrite: false,
  })
);
earthSpin.add(clouds);

// 大气外辉光: 面向相机的径向渐变光晕, 中心被地球逐像素遮挡, 只留柔和外圈
function makeHaloTexture() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0.00, 'rgba(70, 120, 210, 0.55)');
  g.addColorStop(0.60, 'rgba(60, 110, 200, 0.50)');
  g.addColorStop(0.714, 'rgba(56, 104, 195, 0.42)');   // 地球轮廓(1/1.4)处最亮
  g.addColorStop(0.80, 'rgba(48, 92, 180, 0.22)');
  g.addColorStop(0.90, 'rgba(40, 80, 165, 0.08)');
  g.addColorStop(1.00, 'rgba(36, 70, 150, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const halo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeHaloTexture(),
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthWrite: false,
}));
halo.scale.setScalar(2.8);
scene.add(halo);

// 地球边缘薄薄一圈大气(正面菲涅尔)
const atmoRim = new THREE.Mesh(
  new THREE.SphereGeometry(1.002, 96, 64),
  new THREE.ShaderMaterial({
    vertexShader: `
      varying vec3 vN;
      void main() {
        vN = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vN;
      void main() {
        float i = pow(1.0 - max(dot(vN, vec3(0.0, 0.0, 1.0)), 0.0), 4.0) * 0.35;
        gl_FragColor = vec4(0.4, 0.62, 1.0, 1.0) * i;
      }`,
    side: THREE.FrontSide,
    blending: THREE.AdditiveBlending,
    transparent: true,
    depthWrite: false,
  })
);
scene.add(atmoRim);

// ---------- 星空 ----------
function makeStars(count, size, brightBase) {
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    const r = 100 + Math.random() * 70;
    pos[i * 3]     = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.cos(ph);
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
    const lum = brightBase * (0.35 + Math.random() * 0.65);
    const t = Math.random();
    let cr = 1, cb = 1, cg = 1;
    if (t < 0.12)      { cr = 1; cg = 0.82; cb = 0.62; }   // 暖
    else if (t < 0.24) { cr = 0.74; cg = 0.85; cb = 1; }   // 冷
    col[i * 3] = cr * lum; col[i * 3 + 1] = cg * lum; col[i * 3 + 2] = cb * lum;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({
    size, sizeAttenuation: true, vertexColors: true,
    transparent: true, depthWrite: false,
  }));
}
const starGroup = new THREE.Group();
starGroup.add(makeStars(1500, 0.22, 0.75));
starGroup.add(makeStars(220, 0.5, 1.0));
scene.add(starGroup);

// ---------- 太阳光斑 ----------
function makeGlowTexture() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255, 244, 224, 1)');
  g.addColorStop(0.25, 'rgba(255, 236, 200, 0.55)');
  g.addColorStop(0.55, 'rgba(255, 224, 176, 0.16)');
  g.addColorStop(1, 'rgba(255, 220, 170, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture(),
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthWrite: false,
}));
sunSprite.position.copy(sunDir).multiplyScalar(90);
sunSprite.scale.setScalar(26);
scene.add(sunSprite);

// ---------- 开普勒椭圆轨道 ----------
const ORBIT = { a: 2.75, e: 0.34, T: 26 };                  // 半长轴 / 离心率 / 周期(s)
ORBIT.b = ORBIT.a * Math.sqrt(1 - ORBIT.e * ORBIT.e);
const orbitEuler = new THREE.Euler(0.42, 0, -0.15);        // 轨道面倾角
const uAxis = new THREE.Vector3(1, 0, 0).applyEuler(orbitEuler);   // 长轴方向
const vAxis = new THREE.Vector3(0, 0, 1).applyEuler(orbitEuler);   // 短轴方向
const nMotion = 2 * Math.PI / ORBIT.T;

function solveKepler(M, e) {
  let E = M;
  for (let i = 0; i < 7; i++) {
    E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
  }
  return E;
}
function orbitPoint(t, out) {
  const M = (nMotion * t) % (2 * Math.PI);
  const E = solveKepler(M, ORBIT.e);
  const x = ORBIT.a * (Math.cos(E) - ORBIT.e);
  const z = ORBIT.b * Math.sin(E);
  return out.copy(uAxis).multiplyScalar(x).addScaledVector(vAxis, z);
}

// 轨道线(几何椭圆, 焦点在地球球心)
{
  const N = 256;
  const pts = new Float32Array((N + 1) * 3);
  const p = new THREE.Vector3();
  for (let i = 0; i <= N; i++) {
    const th = (i / N) * Math.PI * 2;
    orbitEllipse(th, p);
    pts[i * 3] = p.x; pts[i * 3 + 1] = p.y; pts[i * 3 + 2] = p.z;
  }
  function orbitEllipse(th, out) {
    const x = ORBIT.a * (Math.cos(th) - ORBIT.e);
    const z = ORBIT.b * Math.sin(th);
    return out.copy(uAxis).multiplyScalar(x).addScaledVector(vAxis, z);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pts, 3));
  scene.add(new THREE.LineLoop(geo, new THREE.LineBasicMaterial({
    color: 0x9fc0e8, transparent: true, opacity: 0.3,
  })));
}

// ---------- 低多边形犀牛 ----------
const rhino = new THREE.Group();
const rhinoBody = new THREE.Group();           // 身体(起伏用)
rhino.add(rhinoBody);

const skinMat     = new THREE.MeshStandardMaterial({ color: 0xa6aeb8, roughness: 0.72, metalness: 0.02, flatShading: true });
const skinDarkMat = new THREE.MeshStandardMaterial({ color: 0x7c8492, roughness: 0.78, metalness: 0.02, flatShading: true });
const hornMat     = new THREE.MeshStandardMaterial({ color: 0xd9d4c5, roughness: 0.5,  metalness: 0.05, flatShading: true });
const eyeMat      = new THREE.MeshBasicMaterial({ color: 0x14161a });

function box(w, h, d, mat, x, y, z, rz = 0, parent = rhinoBody) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.rotation.z = rz;
  parent.add(m);
  return m;
}
function cone(r, h, mat, x, y, z, rz = 0, rx = 0, parent = rhinoBody) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 6), mat);
  m.position.set(x, y, z);
  m.rotation.z = rz; m.rotation.x = rx;
  parent.add(m);
  return m;
}

box(0.55, 0.36, 0.30, skinMat, -0.02, 0, 0);                    // 躯干
box(0.28, 0.16, 0.27, skinMat, 0.06, 0.24, 0);                  // 肩峰
box(0.30, 0.10, 0.28, skinMat, -0.20, 0.14, 0);                 // 腰背
box(0.16, 0.05, 0.24, skinDarkMat, -0.02, -0.19, 0);            // 腹线

// 头部(独立组, 可摆动)
const rhinoHead = new THREE.Group();
rhinoHead.position.set(0.3, 0.05, 0);
rhinoHead.rotation.z = -0.14;
rhinoBody.add(rhinoHead);
box(0.30, 0.21, 0.20, skinDarkMat, 0.02, 0.02, 0, 0, rhinoHead);      // 颅
box(0.14, 0.09, 0.13, skinDarkMat, 0.20, -0.06, 0, -0.15, rhinoHead); // 吻部
cone(0.032, 0.17, hornMat, 0.10, 0.19, 0, -0.42, 0, rhinoHead);       // 主角
cone(0.026, 0.09, hornMat, -0.04, 0.16, 0, -0.12, 0, rhinoHead);      // 副角
cone(0.026, 0.08, skinDarkMat, -0.08, 0.13, 0.075, 0.25, 0.55, rhinoHead); // 左耳
cone(0.026, 0.08, skinDarkMat, -0.08, 0.13, -0.075, 0.25, -0.55, rhinoHead); // 右耳
box(0.03, 0.03, 0.03, eyeMat, 0.09, 0.06, 0.105, 0, rhinoHead);       // 左眼
box(0.03, 0.03, 0.03, eyeMat, 0.09, 0.06, -0.105, 0, rhinoHead);      // 右眼
cone(0.024, 0.16, skinDarkMat, -0.34, 0.12, 0, 2.45, 0);              // 尾

// 四条腿(髋部为轴心, 摆动出奔跑感)
function makeLeg(x, z, phase) {
  const pivot = new THREE.Group();
  pivot.position.set(x, -0.12, z);
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.095, 0.32, 0.105), skinMat);
  leg.position.y = -0.15;
  pivot.add(leg);
  pivot.userData.phase = phase;
  rhinoBody.add(pivot);
  return pivot;
}
const legFL = makeLeg( 0.17,  0.105, 0);
const legFR = makeLeg( 0.17, -0.105, 0.5);
const legBL = makeLeg(-0.20,  0.105, Math.PI);
const legBR = makeLeg(-0.20, -0.105, Math.PI + 0.5);

rhino.scale.setScalar(0.22);          // 犀牛全长约 0.23, 地球半径 1 —— 极小
scene.add(rhino);

// ---------- 尾迹粒子(暖白渐隐, 加色) ----------
const TRAIL_N = 42;
const trailPos = new Float32Array(TRAIL_N * 3);
const trailCol = new Float32Array(TRAIL_N * 3);
for (let i = 0; i < TRAIL_N; i++) {
  const f = Math.pow(1 - i / (TRAIL_N - 1), 2);
  trailCol[i * 3] = 0.95 * f; trailCol[i * 3 + 1] = 0.85 * f; trailCol[i * 3 + 2] = 0.62 * f;
}
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3).setUsage(THREE.DynamicDrawUsage));
trailGeo.setAttribute('color', new THREE.BufferAttribute(trailCol, 3));
const trail = new THREE.Points(trailGeo, new THREE.PointsMaterial({
  size: 0.027, sizeAttenuation: true, vertexColors: true,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(trail);

// ---------- 动画 ----------
const _pos = new THREE.Vector3(), _posNext = new THREE.Vector3();
const _up = new THREE.Vector3(), _fwd = new THREE.Vector3(), _right = new THREE.Vector3();
const _basis = new THREE.Matrix4();
const _lookTarget = new THREE.Vector3();
const _rollQ = new THREE.Quaternion();
let gallopPhase = 0;
let trailInit = false;

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // 地球自转 / 云层漂移 / 星空缓转
  earthSpin.rotation.y = t * (2 * Math.PI / 90);
  clouds.rotation.y = t * (2 * Math.PI / 66);
  starGroup.rotation.y = t * 0.004;

  // --- 开普勒轨道位置(近日点快, 远日点慢) ---
  orbitPoint(t, _pos);
  orbitPoint(t + 0.016, _posNext);
  const speed = _pos.distanceTo(_posNext) / 0.016;

  // --- 姿态: 面朝运动方向, 腹部朝向地球 ---
  _fwd.copy(_posNext).sub(_pos).normalize();
  _up.copy(_pos).normalize();
  _right.copy(_fwd).cross(_up).normalize();
  _fwd.copy(_up).cross(_right).normalize();
  _basis.makeBasis(_fwd, _up, _right);
  rhino.quaternion.setFromRotationMatrix(_basis);
  rhino.position.copy(_pos);

  // --- 奔跑: 越快腿越急 ---
  gallopPhase += dt * (2.0 + speed * 3.2);
  const A = 0.52;
  legFL.rotation.z = Math.sin(gallopPhase) * A;
  legFR.rotation.z = Math.sin(gallopPhase + 0.5) * A * 0.9;
  legBL.rotation.z = Math.sin(gallopPhase + Math.PI) * A;
  legBR.rotation.z = Math.sin(gallopPhase + Math.PI + 0.5) * A * 0.9;
  rhinoBody.position.y = 0.018 * Math.sin(2 * gallopPhase);        // 起伏
  rhinoHead.rotation.z = -0.14 + 0.06 * Math.sin(gallopPhase);     // 点头
  _rollQ.setFromAxisAngle(_fwd, 0.05 * Math.sin(gallopPhase));     // 轻微侧倾
  rhino.quaternion.multiply(_rollQ);

  // --- 尾迹 ---
  if (!trailInit) {
    for (let i = 0; i < TRAIL_N; i++) {
      trailPos[i * 3] = _pos.x; trailPos[i * 3 + 1] = _pos.y; trailPos[i * 3 + 2] = _pos.z;
    }
    trailInit = true;
  } else {
    trailPos.copyWithin(3, 0, (TRAIL_N - 1) * 3);
    trailPos[0] = _pos.x - _fwd.x * 0.085;
    trailPos[1] = _pos.y - _fwd.y * 0.085;
    trailPos[2] = _pos.z - _fwd.z * 0.085;
  }
  trailGeo.attributes.position.needsUpdate = true;

  // --- 运镜: 缓慢环绕 + 呼吸推拉, 目标略向犀牛偏移 ---
  const camAz  = t * (2 * Math.PI / 80) + 0.7;
  const camPol = 1.18 + 0.25 * Math.sin(t * (2 * Math.PI / 47) + 1.3);
  const camR   = 5.9 + 0.65 * Math.sin(t * (2 * Math.PI / 61));
  camera.position.set(
    camR * Math.sin(camPol) * Math.cos(camAz),
    camR * Math.cos(camPol),
    camR * Math.sin(camPol) * Math.sin(camAz)
  );
  _lookTarget.copy(_pos).multiplyScalar(0.22);
  camera.lookAt(_lookTarget);

  renderer.render(scene, camera);
}
animate();
</script>
