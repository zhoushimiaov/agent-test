<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>犀牛绕地球公转</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  #scene {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// ---------- Renderer / Scene / Camera ----------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0012);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);

// ---------- Lighting ----------
const ambient = new THREE.AmbientLight(0x404060, 0.9);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff3e0, 2.6);
sun.position.set(60, 40, 80);
scene.add(sun);

const rim = new THREE.DirectionalLight(0x6688ff, 0.8);
rim.position.set(-50, -20, -40);
scene.add(rim);

// ---------- Starfield ----------
function makeStars(count, radius, size, color, opacity) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    // random point on a large sphere shell
    const r = radius * (0.85 + Math.random() * 0.3);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i * 3 + 2] = r * Math.cos(phi);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color, size, sizeAttenuation: true, transparent: true,
    opacity, depthWrite: false
  });
  return new THREE.Points(geo, mat);
}
const starsFar = makeStars(4000, 900, 1.4, 0xffffff, 0.9);
const starsMid = makeStars(800, 500, 2.6, 0xbfd4ff, 0.85);
const starsWarm = makeStars(250, 700, 3.2, 0xffd9a0, 0.8);
scene.add(starsFar, starsMid, starsWarm);

// ---------- Earth ----------
const earthGroup = new THREE.Group();
scene.add(earthGroup);

const EARTH_R = 14;

// Procedural earth texture (canvas)
function makeEarthTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const ctx = c.getContext('2d');
  // ocean
  const grad = ctx.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0, '#0a2a4a');
  grad.addColorStop(0.5, '#0e3d6b');
  grad.addColorStop(1, '#0a2a4a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1024, 512);
  // continents (organic blobs)
  ctx.fillStyle = '#2f6b3a';
  const land = [
    [180,150,110,70,18], [330,130,70,110,24], [420,160,90,60,26],
    [160,300,80,90,22], [520,280,60,70,20], [600,150,100,80,28],
    [700,220,70,90,22], [800,180,90,60,20], [240,380,50,50,18],
    [660,360,80,50,18], [780,320,50,60,18], [460,400,60,40,16]
  ];
  land.forEach(([x,y,rx,ry,seed]) => {
    ctx.beginPath();
    const pts = 24;
    for (let i = 0; i <= pts; i++) {
      const a = (i / pts) * Math.PI * 2;
      const wobble = Math.sin(a * 3 + seed) * 0.25 + Math.sin(a * 5 + seed*1.3) * 0.15;
      const px = x + Math.cos(a) * rx * (1 + wobble);
      const py = y + Math.sin(a) * ry * (1 + wobble);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  });
  // ice caps
  ctx.fillStyle = 'rgba(230,240,255,0.85)';
  ctx.fillRect(0, 0, 1024, 28);
  ctx.fillRect(0, 484, 1024, 28);
  // subtle cloud streaks
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  for (let i = 0; i < 26; i++) {
    const cx = Math.random() * 1024;
    const cy = 40 + Math.random() * 430;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 60 + Math.random()*90, 8 + Math.random()*14, 0, 0, Math.PI*2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const earthMat = new THREE.MeshStandardMaterial({
  map: makeEarthTexture(),
  roughness: 0.9,
  metalness: 0.0
});
const earth = new THREE.Mesh(new THREE.SphereGeometry(EARTH_R, 64, 48), earthMat);
earthGroup.add(earth);

// Atmosphere glow (slightly larger sphere, backside additive)
const atmo = new THREE.Mesh(
  new THREE.SphereGeometry(EARTH_R * 1.18, 48, 32),
  new THREE.MeshBasicMaterial({
    color: 0x4a90e2, transparent: true, opacity: 0.12,
    side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false
  })
);
earthGroup.add(atmo);

// Cloud layer
const cloudMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, transparent: true, opacity: 0.16, depthWrite: false
});
const clouds = new THREE.Mesh(new THREE.SphereGeometry(EARTH_R * 1.03, 48, 32), cloudMat);
earthGroup.add(clouds);

// ---------- Orbit path (ellipse) ----------
// Orbit in the XZ plane, slightly tilted
const ORBIT_A = 46;   // semi-major
const ORBIT_B = 36;   // semi-minor
const ORBIT_TILT = 0.18; // radians tilt of orbit plane

const orbitGroup = new THREE.Group();
orbitGroup.rotation.x = ORBIT_TILT;
scene.add(orbitGroup);

// orbit ring (line)
function makeOrbitRing() {
  const pts = [];
  const N = 256;
  for (let i = 0; i <= N; i++) {
    const t = (i / N) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(t) * ORBIT_A, 0, Math.sin(t) * ORBIT_B));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color: 0x6fb3ff, transparent: true, opacity: 0.35 });
  return new THREE.Line(geo, mat);
}
orbitGroup.add(makeOrbitRing());

// ---------- Rhino (low-poly built from primitives) ----------
function buildRhino() {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({
    color: 0x9a8f82, roughness: 0.65, metalness: 0.15, flatShading: true
  });
  const dark = new THREE.MeshStandardMaterial({
    color: 0x6b6258, roughness: 0.7, metalness: 0.1, flatShading: true
  });
  const hornMat = new THREE.MeshStandardMaterial({
    color: 0xe8dcc0, roughness: 0.4, metalness: 0.05, flatShading: true
  });

  // body — stretched box, slightly tapered
  const body = new THREE.Mesh(new THREE.BoxGeometry(3.4, 2.0, 4.6), mat);
  body.position.y = 0.1;
  g.add(body);

  // shoulder hump (rhino's characteristic shoulder)
  const hump = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.0, 1.8), mat);
  hump.position.set(-0.1, 1.5, -0.8);
  hump.rotation.x = -0.2;
  g.add(hump);

  // head — box angled down at the front
  const head = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.4, 2.2), mat);
  head.position.set(0.2, 0.35, 3.0);
  g.add(head);

  // snout (rounded)
  const snout = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.0, 1.4), mat);
  snout.position.set(0.2, 0.1, 4.4);
  g.add(snout);

  // front horn (main)
  const horn1 = new THREE.Mesh(new THREE.ConeGeometry(0.28, 1.5, 5), hornMat);
  horn1.position.set(0.2, 0.9, 5.5);
  horn1.rotation.x = -Math.PI/2 + 0.25;
  g.add(horn1);
  // small rear horn
  const horn2 = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.7, 5), hornMat);
  horn2.position.set(0.2, 1.25, 3.6);
  horn2.rotation.x = -Math.PI/2 + 0.15;
  g.add(horn2);

  // ears
  const earL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.7), dark);
  earL.position.set(-0.85, 1.15, 2.7);
  earL.rotation.z = 0.25;
  const earR = earL.clone(); earR.position.x = 1.15; earR.rotation.z = -0.25;
  g.add(earL, earR);

  // legs — 4 boxes
  const legGeo = new THREE.BoxGeometry(0.75, 1.8, 0.9);
  const legPos = [
    [1.0, -1.1, 1.6], [-1.0, -1.1, 1.6],
    [1.0, -1.1, -1.6], [-1.0, -1.1, -1.6]
  ];
  legPos.forEach(([x, y, z]) => {
    const leg = new THREE.Mesh(legGeo, dark);
    leg.position.set(x, y, z);
    g.add(leg);
  });

  // tail
  const tail = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 1.4), dark);
  tail.position.set(0, 0.4, -4.9);
  tail.rotation.x = 0.35;
  g.add(tail);

  // scale it down to be readable at orbit distance
  g.scale.setScalar(0.7);
  g.position.set(0, 0, 0);
  return g;
}

const rhino = buildRhino();
orbitGroup.add(rhino);

// ---------- Orbit motion state ----------
// The rhino moves along an ellipse; we compute its tangent to keep it facing
// its direction of travel.
const ORBIT_PERIOD = 14; // seconds for one revolution
let orbitAngle = 0;

function orbitPoint(t) {
  return new THREE.Vector3(
    Math.cos(t) * ORBIT_A,
    0,
    Math.sin(t) * ORBIT_B
  );
}
function orbitTangent(t) {
  // derivative of (cos t * A, 0, sin t * B) -> (-sin t * A, 0, cos t * B)
  return new THREE.Vector3(-Math.sin(t) * ORBIT_A, 0, Math.cos(t) * ORBIT_B).normalize();
}

// ---------- Camera: slow cinematic orbit + slight dolly ----------
const camOrbitRadius = 120;
let camAngle = 0;
const CAM_PERIOD = 48;

function updateCamera(elapsed) {
  camAngle = (elapsed / CAM_PERIOD) * Math.PI * 2;
  const r = camOrbitRadius + Math.sin(elapsed * 0.21) * 14; // gentle dolly
  const height = 42 + Math.sin(elapsed * 0.13 + 1.2) * 10; // slow vertical drift
  camera.position.set(
    Math.cos(camAngle) * r,
    height,
    Math.sin(camAngle) * r
  );
  // look at a point slightly ahead of the rhino for a leading look
  const lookAhead = orbitPoint(orbitAngle + 0.25).applyMatrix4(orbitGroup.matrixWorld);
  camera.lookAt(lookAhead);
}

// ---------- Animation loop ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;

  // earth self-rotation
  earth.rotation.y += dt * 0.18;
  clouds.rotation.y += dt * 0.26;

  // rhino orbits
  orbitAngle = (elapsed / ORBIT_PERIOD) * Math.PI * 2;
  const p = orbitPoint(orbitAngle);
  rhino.position.copy(p);
  const tan = orbitTangent(orbitAngle);
  rhino.lookAt(p.clone().add(tan));
  // add a little bob so it feels alive
  rhino.position.y = Math.sin(elapsed * 2.2) * 0.35;

  // star drift
  starsFar.rotation.y += dt * 0.008;
  starsMid.rotation.y += dt * 0.012;
  starsWarm.rotation.y += dt * 0.006;

  updateCamera(elapsed);

  renderer.render(scene, camera);
}
animate();

// ---------- Resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
