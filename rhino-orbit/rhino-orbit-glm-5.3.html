<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>犀牛绕地球 · Rhino Orbit</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #070B18; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* =====================================================================
   犀牛绕地球公转 — 单文件 Canvas 2D 动画(无外部依赖,双击即看)
   · 透视椭圆轨道:近大远小,绕到背面时被地球遮挡,形成 3D 环绕感
   · 卡通犀牛沿轨道"奔跑":四肢交替、身体起伏、围巾飘动、星尘尾迹
   ===================================================================== */
const TAU = Math.PI * 2;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

/* ---------- 调色板 ---------- */
const OUT    = "#2A3442";   // 描边(深蓝灰)
const BODY   = "#A6BBCD";   // 犀牛皮
const BODY_D = "#7E95A9";   // 远侧肢体(暗一档)
const BELLY  = "#CBDAE6";   // 腹部浅色
const FOLD   = "#4E6172";   // 皮褶
const HORN   = "#F5E9CF";   // 犄角(骨白)
const HORN_D = "#D9C3A0";
const EARIN  = "#C79AA6";   // 耳廓内侧
const TOE    = "#EAF0F6";   // 蹄尖
const SCARF  = "#E5484D";   // 红围巾
const EYED   = "#232B36";

/* roundRect 兜底 */
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(typeof r === "number" ? r : 4, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
  };
}

/* ---------- 布局 ---------- */
let W = 0, H = 0, DPR = 1, L = 0, cx = 0, cy = 0;
let ER = 0;                     // 地球半径
let OA = 0, OB = 0, OROT = 0;   // 犀牛轨道椭圆(长轴/短轴/倾角)
let MA = 0, MB = 0, MROT = 0, MR = 0; // 月亮轨道
function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  L = Math.min(W, H);
  cx = W * 0.5; cy = H * 0.545;
  ER = L * 0.29;
  OA = ER * 1.58; OB = ER * 0.78; OROT = -10 * Math.PI / 180;
  MA = Math.min(W * 0.44, ER * 2.7); MB = MA * 0.34; MROT = 24 * Math.PI / 180; MR = ER * 0.105;
}
window.addEventListener("resize", layout);
layout();

function ellPoint(th, A, B, rot) {
  const x = Math.cos(th) * A, y = Math.sin(th) * B;
  const c = Math.cos(rot), s = Math.sin(rot);
  return { x: cx + x * c - y * s, y: cy + x * s + y * c };
}

/* ---------- 星空(固定种子,保证每次打开一致) ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const srand = mulberry32(20261010);
const STAR_COLS = ["#E8F1FF", "#FFFFFF", "#FFECC9", "#CBDEFF", "#F6F9FF"];
const stars = [];
for (let i = 0; i < 150; i++) {
  stars.push({
    x: srand() * 1.12 - 0.06, y: srand() * 1.12 - 0.06,
    r: 0.4 + Math.pow(srand(), 2.2) * 1.7,
    a: 0.35 + srand() * 0.6,
    sp: 0.6 + srand() * 2.4,
    ph: srand() * TAU,
    col: STAR_COLS[(srand() * STAR_COLS.length) | 0],
    flare: srand() < 0.10
  });
}

/* ---------- 地球大陆 / 云(经度 lambda、纬度 phi、半径 rr[以 R 计]) ---------- */
function normAng(a) { return ((a + Math.PI) % TAU + TAU) % TAU - Math.PI; }
const LANDS = [
  { col: "#7FBF7A", edge: "#4F8A55", blobs: [[0.35, 0.15, 0.30], [0.75, 0.35, 0.15], [0.70, -0.05, 0.18], [0.15, -0.25, 0.14], [1.00, 0.10, 0.10]] },
  { col: "#74B773", edge: "#4A854F", blobs: [[2.30, -0.15, 0.26], [2.70, -0.02, 0.15], [1.95, 0.10, 0.13], [2.45, 0.28, 0.12]] },
  { col: "#86C684", edge: "#57945C", blobs: [[4.00, 0.25, 0.30], [4.35, 0.38, 0.16], [3.70, 0.05, 0.16], [4.15, -0.08, 0.12]] },
  { col: "#6EB06E", edge: "#487F4E", blobs: [[-0.85, -0.35, 0.22], [-0.50, -0.20, 0.13]] },
  { col: "#8ACA86", edge: "#5A9A5F", blobs: [[-2.00, 0.32, 0.20], [-1.70, 0.45, 0.12]] },
  { col: "#7AB878", edge: "#4F8A55", blobs: [[2.90, -0.42, 0.12], [3.12, -0.30, 0.09]] },
];
const CLOUDS = [
  [0.80, 0.05, 0.30, 0.80], [1.90, 0.30, 0.24, 0.70], [2.80, -0.25, 0.22, 0.75],
  [4.40, -0.15, 0.28, 0.80], [5.40, 0.35, 0.22, 0.65], [0.20, 0.55, 0.20, 0.70],
  [3.30, 0.50, 0.18, 0.60], [5.90, -0.10, 0.26, 0.75], [2.20, -0.55, 0.16, 0.60]
];

/* ---------- 运动状态 ---------- */
const PERIOD = 12, OMEGA = TAU / PERIOD, PHASE0 = 0.8 * Math.PI;   // 犀牛公转:12s 一圈
const MPERIOD = 30, MOMEGA = TAU / MPERIOD, MPHASE = 2.4;          // 月亮:30s 一圈
const KBASE = () => L * 0.0044;                                    // 犀牛基础尺度

let t = 0;
try { const q = new URLSearchParams(location.search).get("t"); if (q) t = parseFloat(q) || 0; } catch (e) { }

const parts = [];    // 星尘粒子
const comets = [];   // 流星
let nextComet = 2.5;
let sparkAcc = 0;

function rhinoState() {
  const th = t * OMEGA + PHASE0;
  const p = ellPoint(th, OA, OB, OROT);
  const s = Math.sin(th);                       // 深度:>0 在地球前方
  const depth = 0.87 + 0.23 * (s + 1) / 2;      // 近大远小
  const k = KBASE() * depth;
  const dx = cx - p.x, dy = cy - p.y, dl = Math.hypot(dx, dy) || 1;
  const phi = Math.atan2(-dx / dl, dy / dl);    // 让"脚朝地心"的姿态角
  const lx = -4 * k, ly = 44 * k;               // 脚部(粒子发射点,局部坐标)
  return {
    th, p, s, k, phi,
    feetX: p.x + lx * Math.cos(phi) - ly * Math.sin(phi),
    feetY: p.y + lx * Math.sin(phi) + ly * Math.cos(phi)
  };
}
function moonState() {
  const th = t * MOMEGA + MPHASE;
  const p = ellPoint(th, MA, MB, MROT);
  return { th, p, z: Math.sin(th) };
}

/* ---------- 更新 ---------- */
function update(dt) {
  /* 星尘:从犀牛脚下持续冒出 */
  sparkAcc += dt;
  while (sparkAcc > 0.075) {
    sparkAcc -= 0.075;
    const rs = rhinoState();
    const tdx = -OA * Math.sin(rs.th), tdy = OB * Math.cos(rs.th);
    const oc = Math.cos(OROT), os = Math.sin(OROT);
    let tvx = tdx * oc - tdy * os, tvy = tdx * os + tdy * oc;      // 轨道切向(运动方向)
    const tl = Math.hypot(tvx, tvy) || 1; tvx /= tl; tvy /= tl;
    const ox = rs.p.x - cx, oy = rs.p.y - cy, ol = Math.hypot(ox, oy) || 1;
    for (let i = 0; i < 2; i++) {
      const back = 40 + Math.random() * 35, outw = 16 + Math.random() * 14;
      parts.push({
        x: rs.feetX + (Math.random() - 0.5) * 26,
        y: rs.feetY + (Math.random() - 0.5) * 26,
        vx: -tvx * back + ox / ol * outw + (Math.random() - 0.5) * 46,
        vy: -tvy * back + oy / ol * outw + (Math.random() - 0.5) * 46,
        rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 8,
        size: 2.5 + Math.random() * 3.5,
        life: 0.55 + Math.random() * 0.6, max: 1,
        col: ["#FFE9A8", "#FFFFFF", "#FFD27A"][(Math.random() * 3) | 0],
        z: rs.s < 0 ? -1 : 1
      });
      parts[parts.length - 1].max = parts[parts.length - 1].life;
    }
  }
  if (parts.length > 170) parts.splice(0, parts.length - 170);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    p.vx *= Math.max(0, 1 - 1.4 * dt); p.vy *= Math.max(0, 1 - 1.4 * dt);
  }
  /* 流星 */
  if (t > nextComet) {
    nextComet = t + 7 + Math.random() * 7;
    const dir = Math.random() < 0.5;
    comets.push({
      x: W * (0.15 + Math.random() * 0.7), y: H * (0.05 + Math.random() * 0.25),
      ang: dir ? 0.25 + Math.random() * 0.3 : Math.PI - 0.25 - Math.random() * 0.3,
      sp: L * (0.5 + Math.random() * 0.35), len: L * (0.10 + Math.random() * 0.07),
      life: 0, max: 1.2 + Math.random() * 0.6
    });
  }
  for (let i = comets.length - 1; i >= 0; i--) {
    const c = comets[i];
    c.life += dt;
    if (c.life > c.max) { comets.splice(i, 1); continue; }
    c.x += Math.cos(c.ang) * c.sp * dt; c.y += Math.sin(c.ang) * c.sp * dt;
  }
}

/* ---------- 背景:星云 / 星空 / 流星 ---------- */
function nebula(x, y, r, rgb, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, "rgba(" + rgb + "," + a + ")");
  g.addColorStop(1, "rgba(" + rgb + ",0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function drawStars(panx, pany) {
  ctx.save();
  ctx.translate(panx * 0.3, pany * 0.3);
  for (const s of stars) {
    const a = s.a * (0.55 + 0.45 * Math.sin(t * s.sp + s.ph));
    const sx = s.x * W, sy = s.y * H;
    ctx.globalAlpha = Math.max(0.05, a);
    ctx.fillStyle = s.col;
    ctx.beginPath(); ctx.arc(sx, sy, s.r, 0, TAU); ctx.fill();
    if (s.flare) {
      ctx.globalAlpha = a * 0.4;
      ctx.strokeStyle = s.col; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx - s.r * 3.4, sy); ctx.lineTo(sx + s.r * 3.4, sy);
      ctx.moveTo(sx, sy - s.r * 3.4); ctx.lineTo(sx, sy + s.r * 3.4);
      ctx.stroke();
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}
function drawComets(panx, pany) {
  ctx.save();
  ctx.translate(panx * 0.2, pany * 0.2);
  ctx.globalCompositeOperation = "lighter";
  ctx.lineCap = "round";
  for (const c of comets) {
    const pr = Math.min(1, c.life / c.max);
    const al = Math.sin(Math.PI * pr);
    const ln = c.len * (0.25 + 0.75 * al);
    const tx = c.x - Math.cos(c.ang) * ln, ty = c.y - Math.sin(c.ang) * ln;
    const g = ctx.createLinearGradient(c.x, c.y, tx, ty);
    g.addColorStop(0, "rgba(255,255,255," + (0.9 * al).toFixed(3) + ")");
    g.addColorStop(1, "rgba(180,205,255,0)");
    ctx.strokeStyle = g; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255," + al.toFixed(3) + ")";
    ctx.beginPath(); ctx.arc(c.x, c.y, 2.3, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/* ---------- 地球 ---------- */
function drawEarth() {
  const R = ER;
  // 大气外发光
  let g = ctx.createRadialGradient(cx, cy, R * 0.9, cx, cy, R * 1.34);
  g.addColorStop(0, "rgba(111,177,255,0.32)");
  g.addColorStop(0.55, "rgba(111,177,255,0.12)");
  g.addColorStop(1, "rgba(111,177,255,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, R * 1.34, 0, TAU); ctx.fill();
  // 海洋
  g = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.1, cx, cy, R * 1.02);
  g.addColorStop(0, "#63A0E8");
  g.addColorStop(0.55, "#3E71B8");
  g.addColorStop(1, "#2C5494");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
  // 表面(裁剪进圆内)
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.995, 0, TAU); ctx.clip();
  const rot = t * TAU / 70;
  for (const land of LANDS) {
    ctx.fillStyle = land.col;
    ctx.strokeStyle = land.edge;
    ctx.lineWidth = Math.max(1.5, R * 0.012);
    for (const b of land.blobs) {
      const la = normAng(b[0] + rot);
      const cl = Math.cos(la);
      if (cl <= 0.03) continue;                       // 转到背面去了
      const px = cx + R * Math.cos(b[1]) * Math.sin(la);
      const py = cy - R * Math.sin(b[1]);
      const rx = b[2] * R * Math.max(cl, 0.06);       // 经度方向透视压缩
      const ry = b[2] * R * Math.max(Math.cos(b[1]), 0.25);
      ctx.globalAlpha = Math.min(1, cl * 2.2 + 0.15);
      ctx.beginPath(); ctx.ellipse(px, py, rx, ry, 0, 0, TAU);
      ctx.fill(); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  // 云层(比地面转得快一点,有视差)
  const crot = t * TAU / 70 * 1.3 + 0.8;
  ctx.fillStyle = "#FFFFFF";
  for (const c of CLOUDS) {
    const la = normAng(c[0] + crot);
    const cl = Math.cos(la);
    if (cl <= 0.03) continue;
    const px = cx + R * Math.cos(c[1]) * Math.sin(la);
    const py = cy - R * Math.sin(c[1]);
    const rx = c[2] * R * Math.max(cl, 0.06) * 1.12;
    const ry = rx * 0.42;
    ctx.globalAlpha = c[3] * Math.min(1, cl * 2.4 + 0.1) * 0.9;
    ctx.beginPath(); ctx.ellipse(px, py, rx, ry, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(px - rx * 0.55, py + ry * 0.5, rx * 0.55, ry * 0.8, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(px + rx * 0.5, py - ry * 0.35, rx * 0.5, ry * 0.75, 0, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 极冠
  ctx.fillStyle = "rgba(240,248,255,0.95)";
  ctx.beginPath(); ctx.ellipse(cx, cy - R * 0.94, R * 0.17, R * 0.07, 0, 0, TAU); ctx.fill();
  // 晨昏线(光源在左上)
  g = ctx.createRadialGradient(cx - R * 0.5, cy - R * 0.45, R * 0.2, cx - R * 0.5, cy - R * 0.45, R * 2.05);
  g.addColorStop(0, "rgba(8,16,38,0)");
  g.addColorStop(0.55, "rgba(8,16,38,0)");
  g.addColorStop(1, "rgba(8,16,38,0.5)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
  // 高光
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.beginPath(); ctx.ellipse(cx - R * 0.36, cy - R * 0.42, R * 0.33, R * 0.15, -0.6, 0, TAU); ctx.fill();
  ctx.restore();
  // 轮廓 + 上缘大气亮边
  ctx.strokeStyle = OUT;
  ctx.lineWidth = Math.max(2.5, R * 0.014);
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();
  ctx.strokeStyle = "rgba(207,228,255,0.6)";
  ctx.lineWidth = Math.max(2, R * 0.02);
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.985, Math.PI * 1.05, Math.PI * 1.55); ctx.stroke();
}

/* ---------- 月亮 ---------- */
function drawMoon(m) {
  const x = m.p.x, y = m.p.y, r = MR;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
  const g = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
  g.addColorStop(0, "#DDE3ED"); g.addColorStop(1, "#96A2B6");
  ctx.fillStyle = g; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = "rgba(130,142,162,0.8)";
  const crs = [[-0.3, -0.25, 0.28], [0.28, 0.12, 0.2], [0.02, 0.45, 0.14], [-0.42, 0.3, 0.11], [0.35, -0.35, 0.1]];
  for (const c of crs) {
    ctx.beginPath(); ctx.arc(x + c[0] * r, y + c[1] * r, c[2] * r, 0, TAU); ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = OUT;
  ctx.lineWidth = Math.max(2, r * 0.13);
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
}

/* ---------- 轨道线(分前后两半,虚线沿运动方向流动) ---------- */
function drawOrbitArc(front) {
  const N = 72;
  ctx.beginPath();
  let started = false;
  for (let i = 0; i <= N; i++) {
    const th = i / N * TAU;
    const isFront = Math.sin(th) >= 0;
    if (isFront !== front) { started = false; continue; }
    const pt = ellPoint(th, OA, OB, OROT);
    if (!started) { ctx.moveTo(pt.x, pt.y); started = true; }
    else ctx.lineTo(pt.x, pt.y);
  }
  ctx.setLineDash([7, 9]);
  ctx.lineDashOffset = -t * 30;
  ctx.lineWidth = front ? 2.4 : 1.8;
  ctx.strokeStyle = front ? "rgba(150,180,255,0.5)" : "rgba(130,160,240,0.22)";
  ctx.stroke();
  ctx.setLineDash([]);
}

/* ---------- 星尘粒子 ---------- */
function star4(x, y, r, rot, fill) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const rr = i % 2 ? r * 0.4 : r;
    const a = rot + i * Math.PI / 4;
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
}
function drawSparks(zsign) {
  if (!parts.length) return;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const p of parts) {
    if ((p.z < 0 ? -1 : 1) !== zsign) continue;
    const f = p.life / p.max;
    ctx.globalAlpha = Math.min(1, f * 1.6) * 0.9;
    star4(p.x, p.y, p.size * (0.35 + 0.65 * f), p.rot, p.col);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ---------- 犀牛(局部坐标:头朝 +x,脚朝 +y,单位≈体长/100) ---------- */
function bodyPath() {
  const p = new Path2D();
  p.moveTo(-46, -22);
  p.bezierCurveTo(-38, -32, -20, -38, -2, -38);   // 背部隆起
  p.bezierCurveTo(8, -38, 14, -33, 22, -29);      // 颈部
  p.bezierCurveTo(34, -26, 44, -21, 52, -13);     // 额头 → 鼻梁
  p.bezierCurveTo(58, -8, 59, -1, 55, 4);         // 鼻头
  p.bezierCurveTo(50, 10, 43, 13, 36, 14);        // 嘴/下巴
  p.bezierCurveTo(28, 16, 24, 21, 15, 24);        // 下颌 → 喉
  p.bezierCurveTo(4, 28, -8, 30, -20, 29);        // 胸腹
  p.bezierCurveTo(-32, 28, -40, 24, -45, 17);     // 腹 → 后腿
  p.bezierCurveTo(-51, 10, -53, 2, -52, -4);      // 臀
  p.bezierCurveTo(-51, -11, -50, -16, -46, -22);
  p.closePath();
  return p;
}
function leg(px, py, ang, len, wd, fill) {
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(ang);
  ctx.lineJoin = "round";
  ctx.beginPath(); ctx.roundRect(-wd / 2, -6, wd, len + 8, wd / 2);
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 2.6; ctx.strokeStyle = OUT; ctx.stroke();
  ctx.beginPath(); ctx.roundRect(-wd / 2 - 2.5, len - 8, wd + 5, 13, 5.5);
  ctx.fillStyle = fill; ctx.fill(); ctx.stroke();
  ctx.fillStyle = TOE;
  ctx.lineWidth = 1.6;
  for (const dx of [-wd * 0.26, wd * 0.08]) {
    ctx.beginPath(); ctx.roundRect(dx, len - 1, wd * 0.32, 6.5, 3);
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function ear(bx, by, scale, inner, ph) {
  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(Math.sin(t * 2.3 + ph) * 0.09 - 0.12);
  ctx.scale(scale, scale);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(-4, -10, -2, -18, 5, -22);
  ctx.bezierCurveTo(9, -14, 8, -6, 7, 0);
  ctx.closePath();
  ctx.fillStyle = BODY_D; ctx.fill();
  ctx.lineJoin = "round"; ctx.lineWidth = 2.6; ctx.strokeStyle = OUT; ctx.stroke();
  if (inner) {
    ctx.beginPath();
    ctx.moveTo(1.5, -3);
    ctx.bezierCurveTo(-1.5, -9, 0, -14, 4.5, -17);
    ctx.bezierCurveTo(6.5, -11, 6, -6, 5.5, -3);
    ctx.closePath();
    ctx.fillStyle = EARIN; ctx.fill();
  }
  ctx.restore();
}
function drawTail() {
  ctx.save();
  ctx.translate(-48, -16);
  ctx.rotate(Math.sin(t * 1.6 + 1) * 0.18 - 0.55);
  ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-10, -6, -13, -16);
  ctx.lineWidth = 7; ctx.strokeStyle = OUT; ctx.stroke();
  ctx.lineWidth = 3.5; ctx.strokeStyle = BODY_D; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-12, -13);
  ctx.bezierCurveTo(-20, -16, -22, -26, -15, -31);
  ctx.bezierCurveTo(-14, -24, -11, -22, -9, -24);
  ctx.bezierCurveTo(-9, -28, -4, -29, -3, -25);
  ctx.bezierCurveTo(-5, -20, -7, -16, -6, -13);
  ctx.closePath();
  ctx.fillStyle = FOLD; ctx.fill();
  ctx.lineJoin = "round"; ctx.lineWidth = 2.4; ctx.strokeStyle = OUT; ctx.stroke();
  ctx.restore();
}
function drawScarf() {
  const N = 9, seg = 11;
  const pts = [[7, -35]];
  let x = 7, y = -35;
  for (let i = 1; i <= N; i++) {
    const d = 0.34 + 0.05 * i + 0.42 * Math.sin(t * 3.3 - i * 0.72);
    const ang = Math.PI + d;
    x += Math.cos(ang) * seg; y += Math.sin(ang) * seg;
    pts.push([x, y]);
  }
  const wOf = i => 10.5 - i * 0.95;
  const left = [], right = [];
  for (let i = 0; i <= N; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(N, i + 1)];
    let nx = b[1] - a[1], ny = -(b[0] - a[0]);
    const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
    const w = wOf(i) / 2;
    left.push([pts[i][0] + nx * w, pts[i][1] + ny * w]);
    right.push([pts[i][0] - nx * w, pts[i][1] - ny * w]);
  }
  const ux0 = pts[N][0] - pts[N - 1][0], uy0 = pts[N][1] - pts[N - 1][1];
  const ul = Math.hypot(ux0, uy0) || 1, ux = ux0 / ul, uy = uy0 / ul;
  const tipA = [pts[N][0] + ux * 7 - uy * 4.5, pts[N][1] + uy * 7 + ux * 4.5];
  const tipB = [pts[N][0] + ux * 7 + uy * 4.5, pts[N][1] + uy * 7 - ux * 4.5];
  const mid = [pts[N][0] + ux * 2, pts[N][1] + uy * 2];
  ctx.beginPath();
  ctx.moveTo(left[0][0], left[0][1]);
  for (let i = 1; i <= N; i++) ctx.lineTo(left[i][0], left[i][1]);
  ctx.lineTo(tipA[0], tipA[1]);
  ctx.lineTo(mid[0], mid[1]);
  ctx.lineTo(tipB[0], tipB[1]);
  ctx.lineTo(right[N][0], right[N][1]);
  for (let i = N - 1; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]);
  ctx.closePath();
  ctx.fillStyle = SCARF; ctx.fill();
  ctx.lineJoin = "round"; ctx.lineWidth = 2.6; ctx.strokeStyle = OUT; ctx.stroke();
}
function drawFolds() {
  ctx.lineCap = "round";
  ctx.strokeStyle = FOLD;
  const fold = (x1, y1, qx, qy, x2, y2, echo) => {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(qx, qy, x2, y2);
    ctx.lineWidth = 2.2; ctx.stroke();
    if (echo) {
      ctx.beginPath(); ctx.moveTo(x1 + 5, y1 + 1); ctx.quadraticCurveTo(qx + 5, qy, x2 + 5, y2 - 1);
      ctx.lineWidth = 1.7; ctx.stroke();
    }
  };
  fold(27, -22, 33, -12, 25, -4, false);   // 面部褶
  fold(18, -30, 26, -4, 16, 19, true);     // 颈褶
  fold(0, -33, 10, -4, -2, 22, true);      // 肩褶
  fold(-16, -33, -6, -3, -18, 23, true);   // 中段褶
  fold(-34, -29, -27, -2, -38, 19, false); // 后躯褶
  fold(-45, -11, -41, 2, -48, 10, false);  // 臀褶
}
function drawHorns() {
  ctx.lineJoin = "round";
  // 第二只角
  ctx.beginPath();
  ctx.moveTo(21, -27);
  ctx.bezierCurveTo(25, -36, 27, -43, 32, -49);
  ctx.bezierCurveTo(32, -40, 31, -32, 29, -24);
  ctx.closePath();
  ctx.fillStyle = HORN; ctx.fill();
  ctx.lineWidth = 2.6; ctx.strokeStyle = OUT; ctx.stroke();
  // 主角(大而弯)
  ctx.beginPath();
  ctx.moveTo(34, -20);
  ctx.bezierCurveTo(41, -33, 46, -46, 56, -58);
  ctx.bezierCurveTo(58, -45, 57, -29, 53, -12);
  ctx.closePath();
  ctx.fillStyle = HORN; ctx.fill(); ctx.stroke();
  ctx.save();
  ctx.clip();
  ctx.beginPath(); ctx.moveTo(53, -14);
  ctx.bezierCurveTo(57, -30, 57.5, -45, 56.5, -56);
  ctx.strokeStyle = HORN_D; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = HORN_D; ctx.lineWidth = 1.9; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(42, -36); ctx.quadraticCurveTo(47, -34, 50.5, -36.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(45, -46); ctx.quadraticCurveTo(50, -44, 53.5, -46.5); ctx.stroke();
}
function drawFace() {
  ctx.lineCap = "round";
  // 眉毛
  ctx.strokeStyle = OUT; ctx.lineWidth = 3.4;
  ctx.beginPath(); ctx.moveTo(27, -23); ctx.lineTo(41, -25.5); ctx.stroke();
  // 眼睛
  ctx.beginPath(); ctx.ellipse(34.5, -13, 5.2, 5.8, 0, 0, TAU);
  ctx.fillStyle = "#FFFFFF"; ctx.fill();
  ctx.lineWidth = 1.9; ctx.stroke();
  ctx.beginPath(); ctx.arc(36, -12.2, 2.9, 0, TAU); ctx.fillStyle = EYED; ctx.fill();
  ctx.beginPath(); ctx.arc(35.1, -13.6, 1.1, 0, TAU); ctx.fillStyle = "#FFFFFF"; ctx.fill();
  if ((t % 4.6) < 0.13) {                    // 偶尔眨眼
    ctx.beginPath(); ctx.ellipse(34.5, -13, 5.6, 6.1, 0, 0, TAU);
    ctx.fillStyle = BODY; ctx.fill();
    ctx.lineWidth = 1.9; ctx.strokeStyle = OUT; ctx.stroke();
  }
  // 鼻孔
  ctx.beginPath(); ctx.ellipse(52.5, -3, 2.0, 3.0, -0.45, 0, TAU);
  ctx.fillStyle = EYED; ctx.fill();
  // 嘴角微笑
  ctx.beginPath(); ctx.moveTo(37, 9); ctx.quadraticCurveTo(45, 14.5, 51, 6);
  ctx.strokeStyle = OUT; ctx.lineWidth = 2.2; ctx.stroke();
  // 腮红
  ctx.beginPath(); ctx.ellipse(28, -1, 4.6, 2.8, 0, 0, TAU);
  ctx.fillStyle = "rgba(214,126,116,0.35)"; ctx.fill();
  // 围巾结
  ctx.beginPath(); ctx.ellipse(9, -31, 6, 5.2, 0.5, 0, TAU);
  ctx.fillStyle = SCARF; ctx.fill();
  ctx.lineWidth = 2.4; ctx.strokeStyle = OUT; ctx.stroke();
}

function drawRhino(rs) {
  const k = rs.k, phi = rs.phi;
  const g = t * TAU * 2.15;                  // 奔跑步频
  const bob = Math.sin(g) * 2.6;             // 奔跑起伏
  ctx.save();
  ctx.translate(rs.p.x, rs.p.y);
  ctx.rotate(phi);
  ctx.scale(k, k);
  ctx.translate(0, bob);
  ctx.rotate(Math.sin(g + 0.7) * 0.035);
  drawTail();
  leg(-34, 4, 0.62 * Math.sin(g + Math.PI - 1.15) + 0.10, 30, 12, BODY_D);   // 远后腿
  leg(15, 4, 0.62 * Math.sin(g - 0.85) - 0.04, 30, 12.5, BODY_D);            // 远前腿
  drawScarf();
  ear(1, -31, 0.85, false, 0);
  ear(12, -30, 1, true, 2);
  const BP = bodyPath();
  ctx.fillStyle = BODY; ctx.fill(BP);
  ctx.save();
  ctx.clip(BP);
  ctx.globalAlpha = 0.9; ctx.fillStyle = BELLY;
  ctx.beginPath(); ctx.ellipse(-2, 34, 54, 24, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 0.22; ctx.fillStyle = "#FFFFFF";
  ctx.beginPath(); ctx.ellipse(-6, -40, 44, 14, -0.06, 0, TAU); ctx.fill();
  ctx.globalAlpha = 0.15; ctx.fillStyle = "#54697D";
  ctx.beginPath(); ctx.ellipse(2, 48, 62, 22, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.lineWidth = 3; ctx.strokeStyle = OUT;
  ctx.stroke(BP);
  drawFolds();
  leg(-29, 8, 0.62 * Math.sin(g + Math.PI - 0.35) + 0.10, 33, 14.5, BODY);   // 近后腿
  leg(21, 8, 0.62 * Math.sin(g) - 0.04, 33, 15, BODY);                       // 近前腿
  drawHorns();
  drawFace();
  ctx.restore();
}

/* ---------- 犀牛拖尾(沿轨道的光带) ---------- */
function drawTrail(th) {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.lineCap = "round";
  const N = 26, span = 0.62;
  for (let i = 0; i < N; i++) {
    const f = (i + 1) / N;
    const a = ellPoint(th - span + span * i / N, OA, OB, OROT);
    const b = ellPoint(th - span + span * (i + 1) / N, OA, OB, OROT);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = "rgba(255,190,110," + (0.02 + 0.10 * f * f).toFixed(3) + ")";
    ctx.lineWidth = 3 + 34 * f * f;
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = "rgba(255,222,150," + (0.04 + 0.38 * f * f).toFixed(3) + ")";
    ctx.lineWidth = 2 + 11 * f * f;
    ctx.stroke();
  }
  ctx.restore();
}
function drawRhinoActor(rs) {
  ctx.save();
  const gg = ctx.createRadialGradient(rs.p.x, rs.p.y, 0, rs.p.x, rs.p.y, L * 0.30);
  gg.addColorStop(0, "rgba(255,196,120,0.10)");
  gg.addColorStop(1, "rgba(255,196,120,0)");
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(rs.p.x, rs.p.y, L * 0.30, 0, TAU); ctx.fill();
  ctx.restore();
  drawTrail(rs.th);
  drawRhino(rs);
}

/* ---------- 主绘制 ---------- */
function draw() {
  const zoom = 1 + 0.017 * Math.sin(t * 0.21 + 1.3);
  const panx = 6 * Math.sin(t * 0.13);
  const pany = 4.5 * Math.sin(t * 0.17 + 0.8);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 深空底色
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#0A0F26");
  bg.addColorStop(0.5, "#131B38");
  bg.addColorStop(1, "#0A0D1E");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  // 星云(视差最小)
  ctx.save();
  ctx.translate(panx * 0.12, pany * 0.12);
  nebula(W * 0.22, H * 0.2, L * 0.5, "56,120,164", 0.14);
  nebula(W * 0.8, H * 0.78, L * 0.46, "112,84,160", 0.13);
  nebula(W * 0.6, H * 0.12, L * 0.3, "150,110,90", 0.08);
  nebula(W * 0.15, H * 0.85, L * 0.35, "60,110,120", 0.10);
  ctx.restore();
  drawStars(panx, pany);
  drawComets(panx, pany);
  // 地球环境光
  const ag = ctx.createRadialGradient(cx, cy, ER * 0.6, cx, cy, ER * 2.6);
  ag.addColorStop(0, "rgba(96,150,255,0.10)");
  ag.addColorStop(1, "rgba(96,150,255,0)");
  ctx.fillStyle = ag;
  ctx.fillRect(cx - ER * 2.6, cy - ER * 2.6, ER * 5.2, ER * 5.2);

  // 场景(呼吸运镜:缓慢推拉 + 轻微平移)
  ctx.save();
  ctx.translate(cx + panx, cy + pany);
  ctx.scale(zoom, zoom);
  ctx.translate(-cx, -cy);

  const rs = rhinoState();
  const ms = moonState();

  drawOrbitArc(false);                 // 背面半圈轨道
  if (ms.z < 0) drawMoon(ms);          // 月亮在背面
  if (rs.s < 0) drawRhinoActor(rs);    // 犀牛绕到地球背后 → 被遮挡
  drawSparks(-1);
  drawEarth();
  drawOrbitArc(true);                  // 正面半圈轨道
  if (ms.z >= 0) drawMoon(ms);
  if (rs.s >= 0) drawRhinoActor(rs);
  drawSparks(1);
  ctx.restore();

  // 暗角
  const vg = ctx.createRadialGradient(cx, cy, L * 0.5, cx, cy, Math.hypot(W, H) * 0.6);
  vg.addColorStop(0, "rgba(4,6,16,0)");
  vg.addColorStop(1, "rgba(3,5,14,0.55)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* ---------- 主循环 ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  t += dt;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
