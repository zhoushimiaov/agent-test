<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>犀牛绕地球公转</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; }
  canvas { display: block; }
  #scene { width: 100vw; height: 100vh; }
</style>
</head>
<body>
  <div id="scene"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  // ------------------------------------------------------------------
  // 一头犀牛绕地球公转 —— 单文件 Three.js 场景
  // 尺度:地球半径 5,犀牛体长约 0.5(约为地球直径的 1/20),刻意极小。
  // 轨道:倾斜椭圆,遵循开普勒第二定律(近地点更快),犀牛会转到地球背面被遮挡。
  // ------------------------------------------------------------------
  const container = document.getElementById('scene');
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 2000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  container.appendChild(renderer.domElement);

  // ---------- 光照:太阳为主光,微弱环境光补暗面 ----------
  const sun = new THREE.DirectionalLight(0xfff4e6, 1.7);
  sun.position.set(40, 18, 25);
  scene.add(sun);
  scene.add(new THREE.AmbientLight(0x33425e, 0.7));
  const rim = new THREE.DirectionalLight(0x5577ff, 0.5);
  rim.position.set(-30, -10, -20);
  scene.add(rim);

  // ---------- 星空背景 ----------
  (function stars() {
    const g = new THREE.BufferGeometry();
    const n = 2600, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
    const c = new THREE.Color();
    for (let i = 0; i < n; i++) {
      const r = 400 + Math.random() * 600;
      const t = Math.acos(2 * Math.random() - 1), p = Math.random() * Math.PI * 2;
      pos[i*3]   = r * Math.sin(t) * Math.cos(p);
      pos[i*3+1] = r * Math.cos(t);
      pos[i*3+2] = r * Math.sin(t) * Math.sin(p);
      c.setHSL(0.55 + Math.random() * 0.12, 0.5, 0.6 + Math.random() * 0.4);
      col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
    }
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const m = new THREE.PointsMaterial({ size: 1.4, vertexColors: true, transparent: true, opacity: 0.9, sizeAttenuation: true });
    scene.add(new THREE.Points(g, m));
  })();

  // ---------- 程序化地球贴图(海洋 + 大陆 + 极冠) ----------
  function noise2D(seed) {
    const grid = 48, g = [];
    const hash = (i, j) => { const s = Math.sin((i*127.1 + j*311.7 + seed*57.3)) * 43758.5453; return s - Math.floor(s); };
    for (let i = 0; i <= grid; i++) { g[i] = []; for (let j = 0; j <= grid; j++) g[i][j] = hash(i % grid, j % grid); }
    const smooth = t => t*t*(3 - 2*t);
    return (x, y) => {
      x *= grid; y *= grid;
      const xi = ((Math.floor(x) % grid) + grid) % grid, yi = ((Math.floor(y) % grid) + grid) % grid;
      const xf = x - Math.floor(x), yf = y - Math.floor(y);
      const a = g[xi][yi], b = g[xi+1][yi], c = g[xi][yi+1], d = g[xi+1][yi+1];
      const u = smooth(xf), v = smooth(yf);
      return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+d*u)*v;
    };
  }
  function earthTexture() {
    const w = 1024, h = 512, cv = document.createElement('canvas');
    cv.width = w; cv.height = h; const ctx = cv.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#0a1a3a'); grad.addColorStop(0.5, '#13407a'); grad.addColorStop(1, '#0a1a3a');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
    const n1 = noise2D(7), n2 = noise2D(31), n3 = noise2D(53), img = ctx.getImageData(0, 0, w, h), d = img.data;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const nx = x/w, ny = y/h;
      let v = n1(nx*1.4, ny*1.4)*0.62 + n2(nx*4, ny*4)*0.26 + n3(nx*9, ny*9)*0.12;
      const lat = Math.abs(ny - 0.5) * 2;
      const i = (y*w + x) * 4;
      if (v > 0.55) { // 陆地:低地绿、高地棕
        const g = Math.min(1, (v - 0.55) * 4.0);
        d[i]   = 42 + g*95;
        d[i+1] = 104 + g*45;
        d[i+2] = 52 + g*12;
      }
      if (lat > 0.80) { // 极冠
        const ice = (lat - 0.80) / 0.20;
        d[i] = d[i]*(1-ice) + 240*ice; d[i+1] = d[i+1]*(1-ice) + 245*ice; d[i+2] = d[i+2]*(1-ice) + 255*ice;
      }
    }
    ctx.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(cv); tex.encoding = THREE.sRGBEncoding; return tex;
  }
  function cloudTexture() {
    const w = 1024, h = 512, cv = document.createElement('canvas');
    cv.width = w; cv.height = h; const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    const n = noise2D(99), img = ctx.createImageData(w, h), d = img.data;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let v = n(x/w*4, y/h*4)*0.6 + n(x/w*9, y/h*9)*0.4;
      const a = Math.max(0, v - 0.55) * 2.4 * 255;
      const i = (y*w + x) * 4; d[i] = d[i+1] = d[i+2] = 255; d[i+3] = a;
    }
    ctx.putImageData(img, 0, 0);
    return new THREE.CanvasTexture(cv);
  }

  const EARTH_R = 5;
  const earthGroup = new THREE.Group();
  earthGroup.rotation.z = 23.4 * Math.PI / 180; // 地轴倾角
  scene.add(earthGroup);

  const earth = new THREE.Mesh(
    new THREE.SphereGeometry(EARTH_R, 96, 96),
    new THREE.MeshStandardMaterial({ map: earthTexture(), roughness: 0.92, metalness: 0.0 })
  );
  earthGroup.add(earth);

  const clouds = new THREE.Mesh(
    new THREE.SphereGeometry(EARTH_R + 0.08, 96, 96),
    new THREE.MeshPhongMaterial({ map: cloudTexture(), transparent: true, opacity: 0.5, depthWrite: false })
  );
  earthGroup.add(clouds);

  // 大气辉光(背面渲染的加色球)
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(EARTH_R + 0.55, 64, 64),
    new THREE.ShaderMaterial({
      transparent: true, side: THREE.BackSide, blending: THREE.AdditiveBlending,
      uniforms: { c: { value: new THREE.Color(0x3b82f6) } },
      vertexShader: 'varying vec3 vN; void main(){ vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: 'varying vec3 vN; uniform vec3 c; void main(){ float i = pow(0.72 - dot(vN, vec3(0.0,0.0,1.0)), 3.0); gl_FragColor = vec4(c, 1.0) * clamp(i,0.0,1.0); }'
    })
  );
  scene.add(glow);

  // ---------- 犀牛(用基础几何体拼合,朝向 +X 为前进方向) ----------
  function createRhino() {
    const g = new THREE.Group();
    const skin = new THREE.MeshStandardMaterial({ color: 0x8d9199, roughness: 0.85, metalness: 0.05 });
    const dark = new THREE.MeshStandardMaterial({ color: 0x6f737b, roughness: 0.9 });
    const horn = new THREE.MeshStandardMaterial({ color: 0xdfd8c8, roughness: 0.6 });

    const body = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 20), skin);
    body.scale.set(1.7, 1.0, 1.0); g.add(body);

    const rump = new THREE.Mesh(new THREE.SphereGeometry(0.95, 20, 16), skin);
    rump.position.set(-1.4, 0.05, 0); g.add(rump);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.62, 20, 16), skin);
    head.scale.set(1.4, 0.95, 0.9); head.position.set(1.95, -0.08, 0); g.add(head);

    const h1 = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.75, 16), horn);
    h1.position.set(2.75, 0.18, 0); h1.rotation.z = -0.5; g.add(h1);
    const h2 = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.4, 16), horn);
    h2.position.set(2.45, 0.2, 0); h2.rotation.z = -0.25; g.add(h2);

    [[0.3, 0.55], [-0.3, 0.55]].forEach(([z, y]) => {
      const ear = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.3, 12), dark);
      ear.position.set(1.55, y, z * 1.0); ear.rotation.x = z > 0 ? 0.5 : -0.5; g.add(ear);
    });

    const legGeo = new THREE.CylinderGeometry(0.2, 0.16, 1.0, 12);
    [[0.95, 0.55], [0.95, -0.55], [-1.15, 0.55], [-1.15, -0.55]].forEach(([x, z]) => {
      const leg = new THREE.Mesh(legGeo, dark);
      leg.position.set(x, -0.95, z); g.add(leg);
    });

    const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.03, 0.7, 8), dark);
    tail.position.set(-2.25, 0.1, 0); tail.rotation.z = 0.9; g.add(tail);

    g.scale.setScalar(0.16); // 犀牛相对地球极小
    return g;
  }
  const rhino = createRhino();
  scene.add(rhino);

  // ---------- 倾斜椭圆轨道 ----------
  const A = 9.2, B = 7.0;                 // 半长轴 / 半短轴
  const tiltX = 0.5, tiltY = 0.35;        // 轨道平面倾斜
  const orbitQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(tiltX, tiltY, 0));
  function orbitPoint(theta) {
    const p = new THREE.Vector3(A * Math.cos(theta), 0, B * Math.sin(theta));
    return p.applyQuaternion(orbitQuat);
  }

  // 轨道虚线(淡淡的轨迹)
  (function orbitLine() {
    const pts = [];
    for (let i = 0; i <= 160; i++) pts.push(orbitPoint(i / 160 * Math.PI * 2));
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: 0x4466aa, transparent: true, opacity: 0.28 })
    );
    scene.add(line);
  })();

  // ---------- 动画循环 ----------
  let theta = 0, t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.016;

    // 开普勒第二定律:近地点角速度更快(dθ ∝ 1/r²)
    const r = orbitPoint(theta).length();
    theta += 0.9 / (r * r) * 1.0;

    const pos = orbitPoint(theta);
    const ahead = orbitPoint(theta + 0.01);
    pos.y += Math.sin(t * 2) * 0.15; // 轻微起伏
    rhino.position.copy(pos);
    rhino.lookAt(ahead);
    rhino.rotateY(-Math.PI / 2); // 模型前方是 +X,对齐运动切线

    earth.rotation.y += 0.0016;
    clouds.rotation.y += 0.0021;

    // 缓慢运镜:摄像机环绕 + 轻微俯仰
    const cam = t * 0.045;
    camera.position.set(
      Math.sin(cam) * 22,
      6 + Math.sin(t * 0.12) * 2.5,
      Math.cos(cam) * 22
    );
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
  }
  animate();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  </script>
</body>
</html>
