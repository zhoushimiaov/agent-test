<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水母漂浮 · MiMo-V2.6-Flash</title>
<!-- model: MiMo-V2.6-Flash -->
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #01060d;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d', { alpha: false });
  var W = 0, H = 0, DPR = 1;
  var TAU = Math.PI * 2;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    initField();
  }

  function rgba(c, a) {
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }

  function smooth(t) {
    t = Math.max(0, Math.min(1, t));
    return t * t * (3 - 2 * t);
  }

  // 可复现的伪随机
  function mulberry(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------------- 水母伞体几何 ---------------- */

  // 伞体轮廓:上半为穹顶折线,下半(边缘)带回卷与波浪状缘膜
  function bellGeom(w, h, p, t, seed) {
    var dome = [], steps = 44, i, s, a, x, y;
    var lift = p * h * 0.11;
    for (i = 0; i <= steps; i++) {
      s = i / steps;
      a = Math.PI * s;
      x = -Math.cos(a) * w;
      y = -h * Math.pow(Math.max(Math.sin(a), 0), 0.72);
      y -= lift * Math.pow(Math.abs(Math.cos(a)), 2.4);
      dome.push([x, y]);
    }
    var margin = [], M = 26;
    var amp = 1.5 + p * 3.0;
    for (i = 0; i <= M; i++) {
      s = 1 - i / M; // 从右往左,与穹顶末端连续
      x = -w + 2 * w * s;
      var edge = -lift * Math.pow(Math.abs(2 * s - 1), 2.4);
      var scal = Math.sin(s * Math.PI * 7 + t * 2.6 + seed) * amp * Math.sin(Math.PI * s);
      margin.push([x, edge + scal]);
    }
    return { dome: dome, margin: margin };
  }

  function traceBell(gm) {
    ctx.beginPath();
    ctx.moveTo(gm.dome[0][0], gm.dome[0][1]);
    var i;
    for (i = 1; i < gm.dome.length; i++) ctx.lineTo(gm.dome[i][0], gm.dome[i][1]);
    for (i = 0; i < gm.margin.length; i++) ctx.lineTo(gm.margin[i][0], gm.margin[i][1]);
    ctx.closePath();
  }

  /* ---------------- 水母 ---------------- */

  function Jelly(o) {
    this.nx = o.nx; this.ny = o.ny;
    this.scale = o.scale;
    this.alpha = o.alpha;
    this.depth = o.depth;
    this.seed = o.seed;
    this.period = o.period;
    this.off = o.off;
    this.tent = o.tent;
    this.hue = o.hue;
    this.organ = o.organ;
    this.bw = 74;
    this.bh = 64;

    var rand = mulberry((o.seed * 1000) | 0);
    this.tv = [];
    for (var i = 0; i < this.tent; i++) {
      this.tv.push({
        len: 0.72 + rand() * 0.56,
        ph: rand() * TAU,
        sp: 0.8 + rand() * 0.5,
        amp: 0.75 + rand() * 0.5
      });
    }
    var as = [0.28, 0.40, 0.60, 0.72];
    this.arms = as.map(function (s) {
      return { s: s, ph: rand() * TAU, len: 0.85 + rand() * 0.4 };
    });
  }

  // 收缩冲程:0 松弛 → 1 收缩,收缩快、回落慢
  Jelly.prototype.stroke = function (t) {
    var u = ((t / this.period) + this.off) % 1;
    if (u < 0.28) return smooth(u / 0.28);
    return 1 - smooth((u - 0.28) / 0.72);
  };

  // 伞缘某处的纵坐标(与 bellGeom 的缘膜公式一致)
  Jelly.prototype.marginY = function (s, h, p, t) {
    var lift = p * h * 0.11;
    var edge = -lift * Math.pow(Math.abs(2 * s - 1), 2.4);
    var amp = 1.5 + p * 3.0;
    return edge + Math.sin(s * Math.PI * 7 + t * 2.6 + this.seed) * amp * Math.sin(Math.PI * s);
  };

  Jelly.prototype.drawTentacles = function (w, h, p, t, A) {
    var hue = this.hue;
    var seed = this.seed;
    ctx.lineCap = 'round';
    for (var i = 0; i < this.tent; i++) {
      var s = (i + 0.5) / this.tent;
      var v = this.tv[i];
      var back = (i % 2 === 1);
      var rootX = -w + 2 * w * s;
      var rootY = this.marginY(s, h, p, t);
      // 近大远小:靠近观者视线中央的触手更长
      var fore = 0.34 + 0.66 * Math.pow(Math.sin(Math.PI * s), 0.7);
      var L = h * 3.1 * v.len * fore;
      var segs = 13;
      var amp = L * 0.085 * v.amp;
      var aMul = (back ? 0.5 : 1) * A;
      var pts = [[rootX, rootY]];
      for (var k = 1; k <= segs; k++) {
        var g = k / segs;
        var yy = rootY + L * g * (1 - 0.16 * p);
        var xx = rootX
          + Math.sin(g * 4.4 - t * 2.3 * v.sp + v.ph) * amp * Math.pow(g, 1.15)
          + (s - 0.5) * L * 0.10 * g
          + Math.sin(t * 0.4 + v.ph + seed) * g * 6;
        pts.push([xx, yy]);
      }
      for (k = 0; k < segs; k++) {
        var gg = (k + 0.5) / segs;
        ctx.beginPath();
        ctx.moveTo(pts[k][0], pts[k][1]);
        ctx.lineTo(pts[k + 1][0], pts[k + 1][1]);
        ctx.lineWidth = Math.max(0.4, 2.6 * (1 - 0.82 * gg));
        ctx.strokeStyle = rgba(hue, (0.34 * (1 - 0.6 * gg) + 0.05) * aMul);
        ctx.stroke();
      }
    }
  };

  // 口腕:中央更粗的飘带,带扭转明暗
  Jelly.prototype.drawArms = function (w, h, p, t, A) {
    var organ = this.organ;
    for (var n = 0; n < this.arms.length; n++) {
      var a = this.arms[n];
      var s = a.s;
      var rootX = (-w + 2 * w * s) * 0.55;
      var rootY = this.marginY(s, h, p, t) + 2;
      var L = h * 3.4 * a.len;
      var segs = 12;
      var pts = [], k, g;
      for (k = 0; k <= segs; k++) {
        g = k / segs;
        pts.push([
          rootX
            + Math.sin(g * 3.6 - t * 1.5 + a.ph) * L * 0.10 * Math.pow(g, 1.2)
            + Math.sin(t * 0.35 + a.ph) * g * 8,
          rootY + L * g * (1 - 0.14 * p)
        ]);
      }
      var left = [], right = [];
      for (k = 0; k <= segs; k++) {
        var p0 = pts[Math.max(0, k - 1)];
        var p1 = pts[Math.min(segs, k + 1)];
        var dx = p1[0] - p0[0], dy = p1[1] - p0[1];
        var len = Math.sqrt(dx * dx + dy * dy) || 1;
        dx /= len; dy /= len;
        g = k / segs;
        var twist = 0.55 + 0.45 * Math.abs(Math.cos(g * 3.2 - t * 1.6 + a.ph));
        var hw = Math.max(0.4, w * 0.075 * (1 - 0.85 * g) * twist);
        left.push([pts[k][0] - dy * hw, pts[k][1] + dx * hw]);
        right.push([pts[k][0] + dy * hw, pts[k][1] - dx * hw]);
      }
    ctx.beginPath();
    ctx.moveTo(left[0][0], left[0][1]);
    for (k = 1; k <= segs; k++) ctx.lineTo(left[k][0], left[k][1]);
    for (k = segs; k >= 0; k--) ctx.lineTo(right[k][0], right[k][1]);
    ctx.closePath();
    ctx.fillStyle = rgba(organ, 0.28 * A * (0.7 + 0.3 * p));
    ctx.fill();
    ctx.lineWidth = 0.8;
    ctx.strokeStyle = rgba(organ, 0.22 * A);
    ctx.stroke();
    }
  };

  Jelly.prototype.drawBellFill = function (gm, w, h, p, t, A) {
    var hue = this.hue;
    traceBell(gm);
    var grad = ctx.createRadialGradient(0, -h * 0.78, w * 0.05, 0, -h * 0.45, w * 1.3);
    grad.addColorStop(0, 'rgba(235,250,255,' + ((0.36 + 0.08 * p) * A) + ')');
    grad.addColorStop(0.5, rgba(hue, (0.20 + 0.06 * p) * A));
    grad.addColorStop(1, rgba(hue, 0.05 * A));
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.lineWidth = 1.3;
    ctx.strokeStyle = rgba(hue, 0.40 * A);
    ctx.stroke();

    // 玻璃质感高光
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var hg = ctx.createRadialGradient(-w * 0.30, -h * 0.74, 1, -w * 0.30, -h * 0.74, w * 0.42);
    hg.addColorStop(0, 'rgba(255,255,255,' + (0.30 * A) + ')');
    hg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hg;
    ctx.save();
    ctx.translate(-w * 0.30, -h * 0.74);
    ctx.rotate(-0.5);
    ctx.scale(1, 0.55);
    ctx.beginPath();
    ctx.arc(0, 0, w * 0.42, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.restore();
  };

  Jelly.prototype.drawOrgans = function (w, h, p, t, A) {
    var organ = this.organ;
    var i;
    // 四组马蹄形生殖腺
    var xs = [-0.56, -0.20, 0.20, 0.56];
    ctx.lineCap = 'round';
    for (i = 0; i < 4; i++) {
      var gx = xs[i] * w;
      var rw = w * 0.13 * (1 - 0.45 * Math.abs(xs[i]));
      ctx.beginPath();
      ctx.arc(gx, -h * 0.52 + p * 2, rw, Math.PI * 0.12, Math.PI * 0.88);
      ctx.lineWidth = rw * 0.55;
      ctx.strokeStyle = rgba(organ, (0.36 + 0.20 * p) * A);
      ctx.stroke();
    }
    // 辐射管
    ctx.lineWidth = 1.1;
    ctx.strokeStyle = rgba(organ, 0.15 * A);
    var cans = [-0.85, -0.33, 0.33, 0.85];
    for (i = 0; i < 4; i++) {
      var cx = cans[i];
      ctx.beginPath();
      ctx.moveTo(0, -h * 0.94);
      ctx.quadraticCurveTo(cx * w * 0.25, -h * 0.5, cx * w, -h * 0.04 - p * h * 0.06);
      ctx.stroke();
    }
    // 垂下的口柱(胃部)
    var mw = w * 0.075, top = -h * 0.62, bot = h * 0.10 * (1 - 0.3 * p);
    var wob = Math.sin(t * 3) * 2;
    ctx.beginPath();
    ctx.moveTo(-mw, top);
    ctx.bezierCurveTo(-mw * 1.5, top + (bot - top) * 0.4, -mw * 1.2 + wob, bot - (bot - top) * 0.2, -mw * 0.6, bot);
    ctx.lineTo(mw * 0.6, bot);
    ctx.bezierCurveTo(mw * 1.2, bot - (bot - top) * 0.2, mw * 1.5, top + (bot - top) * 0.4, mw, top);
    ctx.closePath();
    ctx.fillStyle = rgba(organ, 0.26 * A);
    ctx.fill();
  };

  Jelly.prototype.drawRim = function (gm, w, h, p, t, A) {
    var hue = this.hue, i;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineJoin = 'round';
    // 伞缘辉光:加色模式下三层递进描边(替代 shadowBlur)
    ctx.beginPath();
    ctx.moveTo(gm.margin[0][0], gm.margin[0][1]);
    for (i = 1; i < gm.margin.length; i++) ctx.lineTo(gm.margin[i][0], gm.margin[i][1]);
    ctx.lineWidth = 10 + 7 * p;
    ctx.strokeStyle = rgba(hue, (0.09 + 0.07 * p) * A);
    ctx.stroke();
    ctx.lineWidth = 3.4;
    ctx.strokeStyle = rgba(hue, (0.28 + 0.26 * p) * A);
    ctx.stroke();
    ctx.lineWidth = 1.3;
    ctx.strokeStyle = 'rgba(235,252,255,' + ((0.40 + 0.35 * p) * A) + ')';
    ctx.stroke();
    // 伞缘生物光点
    for (i = 0; i < gm.margin.length; i += 2) {
      var m = gm.margin[i];
      var tw = 0.35 + 0.5 * (0.5 + 0.5 * Math.sin(t * 3 + i * 1.7 + this.seed));
      ctx.fillStyle = 'rgba(240,255,255,' + (tw * A * (0.65 + 0.4 * p)) + ')';
      ctx.beginPath();
      ctx.arc(m[0], m[1], 1.3, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  };

  Jelly.prototype.draw = function (t, cam) {
    var p = this.stroke(t);
    var w = this.bw * (1 - 0.24 * p);
    var h = this.bh * (1 + 0.16 * p);
    var A = this.alpha;
    var px = this.nx * W + Math.sin(t * 0.19 + this.seed) * 26 * this.scale + cam.x * this.depth;
    var py = this.ny * H - 46 * this.scale * p + Math.sin(t * 0.31 + this.seed * 1.7) * 9 + cam.y * this.depth;
    var tilt = Math.sin(t * 0.21 + this.seed * 0.9) * 0.075;

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(tilt);
    ctx.scale(this.scale, this.scale);

    // 生物光晕
    ctx.globalCompositeOperation = 'lighter';
    var halo = ctx.createRadialGradient(0, -h * 0.35, 2, 0, -h * 0.3, w * 2.2);
    halo.addColorStop(0, rgba(this.hue, 0.14 * A));
    halo.addColorStop(0.5, rgba(this.hue, 0.05 * A));
    halo.addColorStop(1, rgba(this.hue, 0));
    ctx.fillStyle = halo;
    ctx.fillRect(-w * 2.4, -h * 2.6, w * 4.8, h * 4.6);
    ctx.globalCompositeOperation = 'source-over';

    this.drawTentacles(w, h, p, t, A);
    this.drawArms(w, h, p, t, A);

    var gm = bellGeom(w, h, p, t, this.seed);
    this.drawBellFill(gm, w, h, p, t, A);
    this.drawOrgans(w, h, p, t, A);
    this.drawRim(gm, w, h, p, t, A);

    ctx.restore();
  };

  /* ---------------- 场景 ---------------- */

  var main = new Jelly({
    nx: 0.45, ny: 0.42, scale: 1.55, alpha: 1.0, depth: 0.75,
    seed: 1.7, period: 3.1, off: 0.0, tent: 22,
    hue: [140, 240, 255], organ: [185, 160, 255]
  });
  var mid = new Jelly({
    nx: 0.78, ny: 0.34, scale: 0.72, alpha: 0.75, depth: 0.40,
    seed: 4.2, period: 2.7, off: 0.4, tent: 16,
    hue: [165, 205, 255], organ: [165, 170, 255]
  });
  var far = new Jelly({
    nx: 0.15, ny: 0.66, scale: 0.46, alpha: 0.5, depth: 0.25,
    seed: 7.9, period: 3.6, off: 0.7, tent: 12,
    hue: [150, 195, 250], organ: [155, 165, 245]
  });
  var jellies = [far, mid, main];

  // 海雪 / 气泡 / 前景散景
  var snow = [], bubbles = [], bokeh = [];
  var snowSprite, bokehSprite;

  function makeSprite(size, stops) {
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var g2 = c.getContext('2d');
    var gr = g2.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    for (var i = 0; i < stops.length; i++) gr.addColorStop(stops[i][0], stops[i][1]);
    g2.fillStyle = gr;
    g2.fillRect(0, 0, size, size);
    return c;
  }

  function initField() {
    if (!snowSprite) {
      snowSprite = makeSprite(20, [
        [0, 'rgba(230,248,255,1)'],
        [0.35, 'rgba(210,240,255,0.75)'],
        [1, 'rgba(200,235,255,0)']
      ]);
      bokehSprite = makeSprite(64, [
        [0, 'rgba(175,225,255,1)'],
        [0.55, 'rgba(175,225,255,0.75)'],
        [0.85, 'rgba(165,215,255,0.28)'],
        [1, 'rgba(165,215,255,0)']
      ]);
    }
    var i;
    snow = [];
    for (i = 0; i < 150; i++) {
      snow.push({
        x: Math.random() * W, y: Math.random() * H,
        r: 0.5 + Math.random() * 1.4,
        v: 3 + Math.random() * 9,
        ph: Math.random() * TAU,
        a: 0.10 + Math.random() * 0.35
      });
    }
    bubbles = [];
    for (i = 0; i < 16; i++) {
      bubbles.push({
        x: Math.random() * W, y: Math.random() * H,
        r: 1.6 + Math.random() * 3.4,
        v: 22 + Math.random() * 36,
        ph: Math.random() * TAU,
        a: 0.16 + Math.random() * 0.2,
        amp: 6 + Math.random() * 10
      });
    }
    bokeh = [];
    for (i = 0; i < 7; i++) {
      bokeh.push({
        x: Math.random() * W, y: Math.random() * H,
        r: 26 + Math.random() * 50,
        v: 5 + Math.random() * 7,
        ph: Math.random() * TAU,
        a: 0.035 + Math.random() * 0.04
      });
    }
  }

  function drawBase() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0b3350');
    g.addColorStop(0.35, '#082540');
    g.addColorStop(0.7, '#041526');
    g.addColorStop(1, '#01080f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // 水面透光
    ctx.globalCompositeOperation = 'lighter';
    var rg = ctx.createRadialGradient(W * 0.5, -H * 0.25, 10, W * 0.5, -H * 0.2, H * 0.9);
    rg.addColorStop(0, 'rgba(90,180,235,0.50)');
    rg.addColorStop(1, 'rgba(90,180,235,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawRays(t, cam) {
    ctx.save();
    ctx.translate(cam.x * 0.18, cam.y * 0.18);
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < 6; i++) {
      var cx = W * (0.08 + i * 0.17) + Math.sin(t * 0.11 + i * 1.7) * W * 0.045;
      var topW = 26 + (i % 3) * 18;
      var sway = Math.sin(t * 0.13 + i * 2.1);
      var bx = cx + sway * W * 0.10;
      var bw = topW * 7;
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, 'rgba(170,230,255,0.10)');
      g.addColorStop(0.5, 'rgba(140,210,255,0.045)');
      g.addColorStop(1, 'rgba(120,190,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(cx - topW, -40);
      ctx.lineTo(cx + topW, -40);
      ctx.lineTo(bx + bw, H + 40);
      ctx.lineTo(bx - bw, H + 40);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawSnow(t, dt, cam) {
    ctx.save();
    ctx.translate(cam.x * 1.1, cam.y * 1.1);
    for (var i = 0; i < snow.length; i++) {
      var s = snow[i];
      s.y += s.v * dt;
      s.x += Math.sin(t * 0.6 + s.ph) * 6 * dt;
      if (s.y > H + 6) { s.y = -6; s.x = Math.random() * W; }
      if (s.x < -10) s.x = W + 10;
      if (s.x > W + 10) s.x = -10;
      var tw = 0.7 + 0.3 * Math.sin(t * 1.5 + s.ph);
      var sz = s.r * 5.5;
      ctx.globalAlpha = Math.min(1, s.a * tw);
      ctx.drawImage(snowSprite, s.x - sz / 2, s.y - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawBubbles(t, dt, cam) {
    ctx.save();
    ctx.translate(cam.x, cam.y);
    ctx.lineWidth = 1;
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.y -= b.v * dt;
      if (b.y < -12) { b.y = H + 12; b.x = Math.random() * W; }
      var bx = b.x + Math.sin(t * 1.2 + b.ph) * b.amp;
      ctx.strokeStyle = 'rgba(185,232,255,' + b.a + ')';
      ctx.beginPath();
      ctx.arc(bx, b.y, b.r, 0, TAU);
      ctx.stroke();
      ctx.fillStyle = 'rgba(235,250,255,' + (b.a * 0.9) + ')';
      ctx.beginPath();
      ctx.arc(bx - b.r * 0.32, b.y - b.r * 0.32, b.r * 0.26, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawBokeh(t, dt, cam) {
    ctx.save();
    ctx.translate(cam.x * 1.3, cam.y * 1.3);
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < bokeh.length; i++) {
      var b = bokeh[i];
      b.y -= b.v * dt;
      if (b.y < -b.r * 2) { b.y = H + b.r * 2; b.x = Math.random() * W; }
      ctx.globalAlpha = Math.min(1, b.a);
      ctx.drawImage(bokehSprite, b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawVignette() {
    var g = ctx.createRadialGradient(
      W / 2, H * 0.45, Math.min(W, H) * 0.32,
      W / 2, H / 2, Math.sqrt(W * W + H * H) * 0.62
    );
    g.addColorStop(0, 'rgba(1,6,14,0)');
    g.addColorStop(1, 'rgba(1,5,12,0.66)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  /* ---------------- 主循环 ---------------- */

  var last = performance.now();
  function frame(now) {
    var t = now / 1000;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var cam = {
      x: Math.sin(t * 0.06) * 15,
      y: Math.sin(t * 0.047 + 2.1) * 11
    };

    drawBase();
    drawRays(t, cam);
    far.draw(t, cam);
    mid.draw(t, cam);

    // 大气雾化:把远处的水母压进水体
    ctx.save();
    ctx.globalAlpha = 0.30;
    drawBase();
    ctx.restore();

    main.draw(t, cam);
    drawSnow(t, dt, cam);
    drawBubbles(t, dt, cam);
    drawBokeh(t, dt, cam);
    drawVignette();

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
