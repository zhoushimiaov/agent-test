<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jellyfish Drift</title>
  <style>
    :root {
      --deep-1: #031b35;
      --deep-2: #062a4d;
      --deep-3: #0a4d72;
      --glow: #a9f8ff;
      --ink: rgba(209, 247, 255, 0.86);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #021326; }
    body { font-family: Georgia, 'Times New Roman', serif; }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 70% 16%, rgba(107, 237, 255, 0.12), transparent 30%),
        radial-gradient(circle at 30% 28%, rgba(56, 133, 184, 0.12), transparent 35%),
        linear-gradient(180deg, var(--deep-3) 0%, var(--deep-2) 48%, var(--deep-1) 100%);
    }

    .scene::before {
      content: '';
      position: absolute;
      inset: -10% -10% 0;
      background:
        linear-gradient(115deg, transparent 0 38%, rgba(177, 243, 255, 0.07) 45%, transparent 58%),
        linear-gradient(78deg, transparent 0 52%, rgba(115, 218, 250, 0.08) 58%, transparent 68%);
      filter: blur(14px);
      transform: translate3d(0,0,0);
      animation: lightShift 18s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    .caustics {
      position: absolute;
      inset: 0;
      opacity: 0.22;
      mix-blend-mode: screen;
      background:
        radial-gradient(ellipse at 28% 10%, transparent 0 16%, rgba(188, 255, 255, 0.18) 16.4% 16.8%, transparent 17.2%),
        radial-gradient(ellipse at 54% 0%, transparent 0 24%, rgba(160, 240, 255, 0.15) 24.3% 24.7%, transparent 25%),
        radial-gradient(ellipse at 78% 22%, transparent 0 19%, rgba(173, 248, 255, 0.12) 19.3% 19.6%, transparent 19.9%);
      filter: blur(2px);
      animation: causticDrift 22s linear infinite;
      z-index: 1;
    }

    .specks, .bubbles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .specks span {
      position: absolute;
      width: var(--s);
      height: var(--s);
      left: var(--x);
      top: var(--y);
      border-radius: 50%;
      background: rgba(186, 242, 255, 0.78);
      box-shadow: 0 0 10px rgba(126, 237, 255, 0.68);
      opacity: var(--o);
      animation: floatDust var(--d) ease-in-out var(--delay) infinite alternate;
    }

    .bubbles i {
      position: absolute;
      left: var(--x);
      bottom: -8vh;
      width: var(--s);
      height: var(--s);
      border: 1px solid rgba(188, 244, 255, 0.42);
      border-radius: 50%;
      box-shadow: inset -2px -2px 5px rgba(66, 186, 229, 0.22), 0 0 8px rgba(130, 237, 255, 0.16);
      opacity: 0.48;
      animation: rise var(--d) linear var(--delay) infinite;
    }

    .stage {
      position: absolute;
      left: 50%;
      top: 48%;
      width: min(520px, 74vw);
      height: min(520px, 74vw);
      transform: translate(-50%, -50%);
      animation: cameraFloat 13s ease-in-out infinite;
      z-index: 4;
    }

    .halo {
      position: absolute;
      left: 50%;
      top: 42%;
      width: 80%;
      height: 62%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(103, 245, 255, 0.16) 0%, rgba(64, 204, 244, 0.08) 36%, transparent 72%);
      filter: blur(18px);
      animation: breathe 5.5s ease-in-out infinite;
    }

    .jellyfish {
      position: absolute;
      left: 50%;
      top: 46%;
      width: 68%;
      height: 78%;
      transform: translate(-50%, -50%);
      animation: bob 6.8s ease-in-out infinite;
    }

    .bell {
      position: absolute;
      left: 50%;
      top: 14%;
      width: 74%;
      height: 38%;
      transform: translateX(-50%);
      border-radius: 52% 52% 42% 42% / 68% 68% 36% 36%;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(244, 255, 255, 0.9) 0 5%, rgba(157, 247, 255, 0.55) 23%, transparent 55%),
        linear-gradient(180deg, rgba(173, 253, 255, 0.88) 0%, rgba(78, 221, 244, 0.74) 48%, rgba(50, 138, 218, 0.46) 100%);
      border: 1px solid rgba(206, 255, 255, 0.72);
      box-shadow:
        inset 0 -12px 18px rgba(13, 117, 205, 0.34),
        inset 0 6px 10px rgba(255, 255, 255, 0.34),
        0 0 30px rgba(97, 237, 255, 0.62),
        0 0 72px rgba(57, 191, 255, 0.28);
      animation: bellPulse 6.8s ease-in-out infinite;
    }

    .bell::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 10%;
      width: 58%;
      height: 38%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(221, 255, 255, 0.88), rgba(127, 236, 255, 0.24) 52%, transparent 72%);
      filter: blur(2px);
      opacity: 0.84;
    }

    .bell::after {
      content: '';
      position: absolute;
      left: 7%;
      right: 7%;
      bottom: -3%;
      height: 12%;
      border-radius: 0 0 50% 50%;
      background: linear-gradient(180deg, rgba(97, 231, 255, 0.48), rgba(34, 133, 219, 0.7));
      filter: blur(1px);
    }

    .core {
      position: absolute;
      left: 50%;
      top: 40%;
      width: 36%;
      height: 27%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 50% 42%, rgba(230, 255, 255, 0.92) 0 9%, rgba(114, 239, 255, 0.86) 40%, rgba(75, 190, 237, 0.18) 72%, transparent 73%);
      filter: blur(1px);
      box-shadow: 0 0 24px rgba(125, 247, 255, 0.84);
      animation: corePulse 3.8s ease-in-out infinite;
    }

    .tentacles {
      position: absolute;
      left: 50%;
      top: 40%;
      width: 84%;
      height: 58%;
      transform: translateX(-50%);
      filter: drop-shadow(0 0 7px rgba(85, 227, 255, 0.56));
    }

    .tentacle {
      position: absolute;
      top: 0;
      left: 50%;
      width: var(--w);
      height: var(--h);
      transform-origin: 50% 0;
      transform: translateX(-50%) rotate(var(--r));
      border-radius: 50%;
      background: linear-gradient(90deg, transparent 0 12%, rgba(164, 247, 255, 0.68) 42%, rgba(63, 194, 238, 0.34) 78%, transparent 100%);
      clip-path: polygon(0 0, 100% 0, 74% 21%, 100% 37%, 71% 54%, 97% 72%, 66% 100%, 42% 82%, 17% 100%, 30% 64%, 0 49%, 26% 28%);
      opacity: var(--op);
      animation: wave var(--speed) ease-in-out var(--delay) infinite alternate;
    }

    .tentacle::after {
      content: '';
      position: absolute;
      left: 40%;
      bottom: 1%;
      width: 20%;
      height: 10%;
      border-radius: 50%;
      background: rgba(196, 252, 255, 0.9);
      box-shadow: 0 0 8px rgba(196, 252, 255, 0.8);
    }

    .seafloor {
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -8%;
      height: 24%;
      background:
        radial-gradient(ellipse at 14% 24%, rgba(51, 188, 205, 0.22), transparent 20%),
        radial-gradient(ellipse at 72% 12%, rgba(41, 163, 202, 0.2), transparent 26%),
        linear-gradient(180deg, transparent 0%, rgba(4, 53, 78, 0.46) 28%, rgba(1, 20, 39, 0.94) 100%);
      filter: blur(2px);
      transform: rotate(-2deg);
      z-index: 3;
    }

    .seafloor::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 12%;
      height: 10%;
      background: repeating-linear-gradient(92deg, transparent 0 5%, rgba(77, 210, 217, 0.16) 5.4% 6.2%, transparent 6.8% 12%);
      opacity: 0.42;
      filter: blur(5px);
    }

    .caption {
      position: absolute;
      left: 50%;
      bottom: 5.8vh;
      transform: translateX(-50%);
      color: var(--ink);
      font-size: clamp(12px, 1.4vw, 17px);
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      text-transform: uppercase;
      opacity: 0.72;
      text-shadow: 0 0 16px rgba(112, 238, 255, 0.52);
      z-index: 5;
      white-space: nowrap;
    }

    @keyframes bob {
      0%, 100% { transform: translate(-50%, -50%) rotate(-2deg); }
      50% { transform: translate(-50%, -54%) rotate(2.5deg); }
    }

    @keyframes bellPulse {
      0%, 100% { transform: translateX(-50%) scaleX(1) scaleY(1); }
      50% { transform: translateX(-50%) scaleX(1.035) scaleY(0.965); }
    }

    @keyframes corePulse {
      0%, 100% { transform: translateX(-50%) scale(0.96); opacity: 0.78; }
      50% { transform: translateX(-50%) scale(1.08); opacity: 1; }
    }

    @keyframes wave {
      0% { margin-left: -1.8%; transform: translateX(-50%) rotate(var(--r)) skewX(-3deg); }
      100% { margin-left: 2.4%; transform: translateX(-50%) rotate(calc(var(--r) * -0.72)) skewX(5deg); }
    }

    @keyframes cameraFloat {
      0%, 100% { transform: translate(-50%, -50%) scale(0.98); }
      50% { transform: translate(-50%, -50%) scale(1.035); }
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.94); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    }

    @keyframes floatDust {
      0% { transform: translate3d(-6px, 3px, 0) scale(0.85); }
      100% { transform: translate3d(11px, -16px, 0) scale(1.16); }
    }

    @keyframes rise {
      0% { transform: translate3d(0, 0, 0) scale(0.7); opacity: 0; }
      10% { opacity: 0.45; }
      70% { opacity: 0.26; }
      100% { transform: translate3d(var(--drift), -118vh, 0) scale(1.18); opacity: 0; }
    }

    @keyframes lightShift {
      from { transform: translate3d(-2%, -1%, 0) rotate(-2deg) scale(1.02); }
      to { transform: translate3d(3%, 2%, 0) rotate(2deg) scale(1.08); }
    }

    @keyframes causticDrift {
      from { transform: translate3d(-3%, -1%, 0) rotate(-2deg) scale(1.05); }
      to { transform: translate3d(4%, 3%, 0) rotate(2deg) scale(1.15); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="一只水母在深海中漂浮的动画场景">
    <div class="caustics"></div>
    <div class="specks" aria-hidden="true"></div>
    <div class="bubbles" aria-hidden="true"></div>

    <section class="stage">
      <div class="halo"></div>
      <div class="jellyfish">
        <div class="bell"></div>
        <div class="core"></div>
        <div class="tentacles">
          <i class="tentacle" style="--w:15%;--h:84%;--r:-21deg;--op:.46;--speed:4.6s;--delay:-2.2s"></i>
          <i class="tentacle" style="--w:14%;--h:96%;--r:-14deg;--op:.72;--speed:5.2s;--delay:-1.1s"></i>
          <i class="tentacle" style="--w:13%;--h:104%;--r:-7deg;--op:.66;--speed:4.1s;--delay:-3.6s"></i>
          <i class="tentacle" style="--w:15%;--h:111%;--r:0deg;--op:.88;--speed:5.8s;--delay:-.8s"></i>
          <i class="tentacle" style="--w:14%;--h:102%;--r:7deg;--op:.72;--speed:4.8s;--delay:-2.8s"></i>
          <i class="tentacle" style="--w:13%;--h:95%;--r:14deg;--op:.66;--speed:5.4s;--delay:-1.9s"></i>
          <i class="tentacle" style="--w:15%;--h:86%;--r:21deg;--op:.5;--speed:4.4s;--delay:-3s"></i>
        </div>
      </div>
    </section>

    <div class="seafloor"></div>
    <div class="caption">soft current / deep blue</div>
  </main>

  <script>
    const specks = document.querySelector('.specks');
    const bubbles = document.querySelector('.bubbles');
    const dustSeed = [
      [8, 18, 3, 0.42, 6.4, -1.2], [17, 42, 2, 0.55, 8.2, -4.3], [26, 15, 2, 0.36, 5.6, -2.8],
      [39, 30, 3, 0.34, 7.8, -5.1], [53, 16, 2, 0.62, 6.1, -3.2], [67, 34, 2, 0.5, 9.1, -2.1],
      [78, 12, 3, 0.38, 7.4, -3.9], [91, 29, 2, 0.46, 5.9, -1.6], [13, 70, 2, 0.32, 6.8, -2.7],
      [31, 78, 3, 0.42, 8.7, -5.4], [58, 72, 2, 0.5, 6.3, -2.3], [84, 67, 3, 0.35, 7.2, -4.6]
    ];

    dustSeed.forEach(([x, y, s, o, d, delay]) => {
      const span = document.createElement('span');
      span.style.setProperty('--x', `${x}%`);
      span.style.setProperty('--y', `${y}%`);
      span.style.setProperty('--s', `${s}px`);
      span.style.setProperty('--o', o);
      span.style.setProperty('--d', `${d}s`);
      span.style.setProperty('--delay', `${delay}s`);
      specks.appendChild(span);
    });

    const bubbleSeed = [
      [11, 11, 9, 18, -5, 0], [23, 6, 14, 25, -9, -7], [34, 9, 7, 17, 3, -11],
      [46, 5, 11, 22, -7, -4], [61, 9, 8, 16, 6, -9], [73, 6, 13, 28, -3, -15], [88, 12, 6, 19, 8, -6]
    ];

    bubbleSeed.forEach(([x, s, d, delay, drift]) => {
      const bubble = document.createElement('i');
      bubble.style.setProperty('--x', `${x}%`);
      bubble.style.setProperty('--s', `${s}px`);
      bubble.style.setProperty('--d', `${d}s`);
      bubble.style.setProperty('--delay', `${delay}s`);
      bubble.style.setProperty('--drift', `${drift}vw`);
      bubbles.appendChild(bubble);
    });
  </script>

</body>
</html>
