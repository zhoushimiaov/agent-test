<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>鹈鹕骑车 · Pelican on a Bike</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(#8ecae6 0%, #bde0fe 55%, #ffd6a5 100%);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg { width: 100%; height: 100%; display: block; }
  .title {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: #023047;
    letter-spacing: 4px;
    font-weight: 700;
    font-size: 20px;
    text-shadow: 0 2px 0 rgba(255,255,255,.5);
    user-select: none;
  }
  .hint {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: #023047aa;
    font-size: 12px;
    letter-spacing: 2px;
    user-select: none;
  }

  /* --- 动画 --- */
  @keyframes wheelSpin { to { transform: rotate(360deg); } }
  @keyframes pedalSpin { to { transform: rotate(360deg); } }
  @keyframes legSwing1 {
    0%   { transform: rotate(0deg)   translateY(0); }
    25%  { transform: rotate(-18deg) translateY(-4px); }
    50%  { transform: rotate(0deg)   translateY(0); }
    75%  { transform: rotate(18deg)  translateY(4px); }
    100% { transform: rotate(0deg)   translateY(0); }
  }
  @keyframes legSwing2 {
    0%   { transform: rotate(0deg)   translateY(0); }
    25%  { transform: rotate(18deg)  translateY(4px); }
    50%  { transform: rotate(0deg)   translateY(0); }
    75%  { transform: rotate(-18deg) translateY(-4px); }
    100% { transform: rotate(0deg)   translateY(0); }
  }
  @keyframes bodyBob {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-3px); }
  }
  @keyframes headBob {
    0%,100% { transform: rotate(-2deg); }
    50%     { transform: rotate(3deg); }
  }
  @keyframes wingFlap {
    0%,100% { transform: rotate(-4deg); }
    50%     { transform: rotate(10deg); }
  }
  @keyframes groundScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-400px); }
  }
  @keyframes cloudDrift {
    from { transform: translateX(0); }
    to   { transform: translateX(-1600px); }
  }
  @keyframes sunPulse {
    0%,100% { r: 42; opacity: 1; }
    50%     { r: 46; opacity: .9; }
  }
  @keyframes hillScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-1200px); }
  }

  .wheel-spin   { animation: wheelSpin 1.2s linear infinite; transform-origin: center; transform-box: fill-box; }
  .pedal-spin   { animation: pedalSpin 1.2s linear infinite; transform-origin: center; transform-box: fill-box; }
  .leg-a        { animation: legSwing1 1.2s ease-in-out infinite; transform-origin: top center; transform-box: fill-box; }
  .leg-b        { animation: legSwing2 1.2s ease-in-out infinite; transform-origin: top center; transform-box: fill-box; }
  .body-bob     { animation: bodyBob 1.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  .head-bob     { animation: headBob 2.4s ease-in-out infinite; transform-origin: 20% 90%; transform-box: fill-box; }
  .wing-flap    { animation: wingFlap 1.2s ease-in-out infinite; transform-origin: 15% 20%; transform-box: fill-box; }
  .ground       { animation: groundScroll 1.5s linear infinite; }
  .clouds       { animation: cloudDrift 30s linear infinite; }
  .hills        { animation: hillScroll 18s linear infinite; }
  .sun-core     { animation: sunPulse 4s ease-in-out infinite; }
</style>
</head>
<body>
<div class="stage">
  <div class="title">鹈 鹕 骑 车 · PELICAN ON A BIKE</div>

  <svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-label="Pelican riding a bicycle">
    <defs>
      <!-- 天空渐变 -->
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#8ecae6"/>
        <stop offset="60%" stop-color="#cdeafd"/>
        <stop offset="100%" stop-color="#ffe8c9"/>
      </linearGradient>

      <!-- 太阳光晕 -->
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#fff3b0" stop-opacity=".95"/>
        <stop offset="60%"  stop-color="#ffd166" stop-opacity=".35"/>
        <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
      </radialGradient>

      <!-- 地面 -->
      <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#a3b18a"/>
        <stop offset="100%" stop-color="#588157"/>
      </linearGradient>

      <!-- 路面 -->
      <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#4a4e69"/>
        <stop offset="100%" stop-color="#22223b"/>
      </linearGradient>

      <!-- 鹈鹕身体 -->
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#ffffff"/>
        <stop offset="70%"  stop-color="#f6f1e6"/>
        <stop offset="100%" stop-color="#e6dcc6"/>
      </linearGradient>

      <!-- 喙 -->
      <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#ffb703"/>
        <stop offset="100%" stop-color="#fb8500"/>
      </linearGradient>

      <!-- 喉囊 -->
      <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#ffd8a8"/>
        <stop offset="100%" stop-color="#f4a261"/>
      </linearGradient>

      <!-- 车架 -->
      <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#e63946"/>
        <stop offset="100%" stop-color="#a4161a"/>
      </linearGradient>

      <!-- 车轮 -->
      <radialGradient id="tireGrad" cx="50%" cy="50%" r="50%">
        <stop offset="85%"  stop-color="#1d3557"/>
        <stop offset="100%" stop-color="#0b1a2c"/>
      </radialGradient>

      <!-- 山 -->
      <linearGradient id="hillGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#8fbf9f"/>
        <stop offset="100%" stop-color="#4a7c59"/>
      </linearGradient>

      <!-- 车轮辐条模板 -->
      <g id="spokes">
        <line x1="0" y1="-58" x2="0" y2="58"   stroke="#c9d1d9" stroke-width="2"/>
        <line x1="-58" y1="0" x2="58" y2="0"   stroke="#c9d1d9" stroke-width="2"/>
        <line x1="-41" y1="-41" x2="41" y2="41" stroke="#c9d1d9" stroke-width="2"/>
        <line x1="-41" y1="41"  x2="41" y2="-41" stroke="#c9d1d9" stroke-width="2"/>
      </g>
    </defs>

    <!-- 天空 -->
    <rect width="1200" height="700" fill="url(#sky)"/>

    <!-- 太阳 -->
    <g transform="translate(980,120)">
      <circle r="90" fill="url(#sunGlow)"/>
      <circle class="sun-core" r="42" fill="#ffd166"/>
    </g>

    <!-- 云 -->
    <g class="clouds" opacity=".9">
      <g fill="#ffffff">
        <g transform="translate(120,110)">
          <ellipse cx="0"  cy="0" rx="42" ry="20"/>
          <ellipse cx="34" cy="-8" rx="30" ry="18"/>
          <ellipse cx="-30" cy="4" rx="26" ry="14"/>
        </g>
        <g transform="translate(520,80)">
          <ellipse cx="0"  cy="0" rx="36" ry="18"/>
          <ellipse cx="28" cy="-6" rx="24" ry="14"/>
          <ellipse cx="-24" cy="4" rx="22" ry="12"/>
        </g>
        <g transform="translate(860,180)">
          <ellipse cx="0"  cy="0" rx="48" ry="20"/>
          <ellipse cx="36" cy="-8" rx="30" ry="16"/>
        </g>
        <!-- 重复一份用于无缝滚动 -->
        <g transform="translate(1720,110)">
          <ellipse cx="0"  cy="0" rx="42" ry="20"/>
          <ellipse cx="34" cy="-8" rx="30" ry="18"/>
          <ellipse cx="-30" cy="4" rx="26" ry="14"/>
        </g>
        <g transform="translate(2120,80)">
          <ellipse cx="0"  cy="0" rx="36" ry="18"/>
          <ellipse cx="28" cy="-6" rx="24" ry="14"/>
        </g>
        <g transform="translate(2460,180)">
          <ellipse cx="0"  cy="0" rx="48" ry="20"/>
          <ellipse cx="36" cy="-8" rx="30" ry="16"/>
        </g>
      </g>
    </g>

    <!-- 远山 -->
    <g class="hills">
      <path d="M0,520 L120,410 L220,480 L340,380 L460,500 L600,420 L720,490 L860,400 L1000,510 L1200,430 L1200,560 L0,560 Z"
            fill="url(#hillGrad)" opacity=".75"/>
      <path d="M1200,520 L1320,410 L1420,480 L1540,380 L1660,500 L1800,420 L1920,490 L2060,400 L2200,510 L2400,430 L2400,560 L1200,560 Z"
            fill="url(#hillGrad)" opacity=".75"/>
    </g>

    <!-- 地面草地 -->
    <rect x="0" y="540" width="1200" height="160" fill="url(#groundGrad)"/>

    <!-- 路面 -->
    <rect x="0" y="580" width="1200" height="70" fill="url(#roadGrad)"/>

    <!-- 路面虚线（滚动） -->
    <g class="ground">
      <g fill="#f1faee">
        <rect x="0"    y="612" width="60" height="6" rx="3"/>
        <rect x="120"  y="612" width="60" height="6" rx="3"/>
        <rect x="240"  y="612" width="60" height="6" rx="3"/>
        <rect x="360"  y="612" width="60" height="6" rx="3"/>
        <rect x="480"  y="612" width="60" height="6" rx="3"/>
        <rect x="600"  y="612" width="60" height="6" rx="3"/>
        <rect x="720"  y="612" width="60" height="6" rx="3"/>
        <rect x="840"  y="612" width="60" height="6" rx="3"/>
        <rect x="960"  y="612" width="60" height="6" rx="3"/>
        <rect x="1080" y="612" width="60" height="6" rx="3"/>
        <rect x="1200" y="612" width="60" height="6" rx="3"/>
        <rect x="1320" y="612" width="60" height="6" rx="3"/>
        <rect x="1440" y="612" width="60" height="6" rx="3"/>
        <rect x="1560" y="612" width="60" height="6" rx="3"/>
      </g>
    </g>

    <!-- 草丛装饰（滚动） -->
    <g class="ground" fill="#3a5a40">
      <g>
        <path d="M40,580 q4,-14 8,0 z"/>
        <path d="M180,580 q5,-16 10,0 z"/>
        <path d="M320,580 q4,-12 8,0 z"/>
        <path d="M520,580 q5,-16 10,0 z"/>
        <path d="M700,580 q4,-14 8,0 z"/>
        <path d="M880,580 q5,-16 10,0 z"/>
        <path d="M1050,580 q4,-14 8,0 z"/>
        <!-- 重复 -->
        <path d="M1240,580 q4,-14 8,0 z"/>
        <path d="M1380,580 q5,-16 10,0 z"/>
        <path d="M1520,580 q4,-12 8,0 z"/>
        <path d="M1720,580 q5,-16 10,0 z"/>
      </g>
    </g>

    <!-- ======= 鹈鹕 + 自行车 ======= -->
    <g transform="translate(600,470)">

      <!-- 阴影 -->
      <ellipse cx="0" cy="140" rx="150" ry="12" fill="#000" opacity=".22"/>

      <!-- 自行车 -->
      <g>
        <!-- 后轮 -->
        <g transform="translate(-95,90)">
          <circle r="60" fill="url(#tireGrad)"/>
          <circle r="48" fill="#f8f9fa"/>
          <g class="wheel-spin">
            <use href="#spokes"/>
            <circle r="6" fill="#6c757d"/>
          </g>
        </g>

        <!-- 前轮 -->
        <g transform="translate(95,90)">
          <circle r="60" fill="url(#tireGrad)"/>
          <circle r="48" fill="#f8f9fa"/>
          <g class="wheel-spin">
            <use href="#spokes"/>
            <circle r="6" fill="#6c757d"/>
          </g>
        </g>

        <!-- 车架 -->
        <g stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round" fill="none">
          <!-- 后三角 -->
          <line x1="-95" y1="90" x2="0"   y2="90"/>   <!-- 后下叉 -->
          <line x1="-95" y1="90" x2="-20" y2="20"/>   <!-- 后上叉 -->
          <!-- 座管 -->
          <line x1="0"   y1="90" x2="-20" y2="20"/>
          <!-- 下管 -->
          <line x1="0"   y1="90" x2="55"  y2="35"/>
          <!-- 上管 -->
          <line x1="-20" y1="20" x2="55"  y2="35"/>
          <!-- 前叉 -->
          <line x1="55"  y1="35" x2="95"  y2="90"/>
          <!-- 头管 -->
          <line x1="55"  y1="35" x2="60"  y2="10"/>
        </g>

        <!-- 车把 -->
        <g stroke="#2b2d42" stroke-width="6" stroke-linecap="round" fill="none">
          <path d="M60,10 Q78,-2 92,6"/>
          <path d="M60,10 Q42,-2 28,6"/>
        </g>
        <circle cx="92" cy="6" r="5" fill="#e63946"/>
        <circle cx="28" cy="6" r="5" fill="#e63946"/>

        <!-- 车座 -->
        <path d="M-34,14 Q-20,6 -6,14 Q-20,20 -34,14 Z" fill="#2b2d42"/>

        <!-- 中轴 + 曲柄 + 脚踏（旋转） -->
        <g transform="translate(0,90)">
          <circle r="10" fill="#6c757d"/>
          <g class="pedal-spin">
            <!-- 曲柄 -->
            <rect x="-4" y="-32" width="8" height="64" rx="3" fill="#adb5bd"/>
            <!-- 脚踏 A -->
            <g transform="translate(0,-32)">
              <rect x="-14" y="-4" width="28" height="8" rx="2" fill="#212529"/>
            </g>
            <!-- 脚踏 B -->
            <g transform="translate(0,32)">
              <rect x="-14" y="-4" width="28" height="8" rx="2" fill="#212529"/>
            </g>
          </g>
          <circle r="4" fill="#495057"/>
        </g>
      </g>

      <!-- 鹈鹕 -->
      <g class="body-bob">
        <!-- 后侧腿（远侧，暗一点） -->
        <g class="leg-b" transform="translate(-6,-6)">
          <path d="M0,0 Q6,30 0,60" stroke="#e76f51" stroke-width="9" fill="none" stroke-linecap="round" opacity=".75"/>
          <path d="M-2,60 L14,64 L-2,68 Z" fill="#e76f51" opacity=".75"/>
        </g>

        <!-- 尾羽 -->
        <path d="M-70,-30 Q-100,-42 -108,-20 Q-92,-16 -70,-14 Z" fill="#e6dcc6" stroke="#c9bda1" stroke-width="2"/>

        <!-- 身体 -->
        <ellipse cx="-20" cy="-30" rx="70" ry="46" fill="url(#bodyGrad)" stroke="#c9bda1" stroke-width="2"/>

        <!-- 翅膀（扇动） -->
        <g class="wing-flap" transform="translate(-20,-40)">
          <path d="M0,0 Q-30,-24 -60,-6 Q-46,20 -6,18 Z"
                fill="#f1e9d2" stroke="#c9bda1" stroke-width="2"/>
          <path d="M-14,2 Q-34,4 -50,10" stroke="#c9bda1" stroke-width="1.6" fill="none"/>
          <path d="M-10,10 Q-30,12 -46,16" stroke="#c9bda1" stroke-width="1.6" fill="none"/>
        </g>

        <!-- 脖子 -->
        <path d="M20,-56 Q40,-88 62,-92" stroke="#f6f1e6" stroke-width="26" fill="none" stroke-linecap="round"/>
        <path d="M20,-56 Q40,-88 62,-92" stroke="#c9bda1" stroke-width="1.6" fill="none" opacity=".5"/>

        <!-- 头 -->
        <g class="head-bob" transform="translate(64,-96)">
          <!-- 头本体 -->
          <ellipse cx="0" cy="0" rx="26" ry="22" fill="url(#bodyGrad)" stroke="#c9bda1" stroke-width="2"/>
          <!-- 头顶羽冠 -->
          <path d="M-6,-20 Q0,-30 8,-20" stroke="#c9bda1" stroke-width="2" fill="#f6f1e6"/>
          <!-- 眼睛 -->
          <circle cx="8" cy="-4" r="4.5" fill="#ffffff"/>
          <circle cx="9" cy="-4" r="2.6" fill="#1d3557"/>
          <circle cx="10" cy="-5" r="0.9" fill="#ffffff"/>
          <!-- 大喙（上） -->
          <path d="M20,-2 Q70,-8 78,4 Q60,10 20,8 Z" fill="url(#beakGrad)" stroke="#c97b00" stroke-width="1.6"/>
          <!-- 喉囊（下） -->
          <path d="M20,6 Q56,10 76,6 Q60,34 24,20 Z" fill="url(#pouchGrad)" stroke="#c97b00" stroke-width="1.6"/>
          <!-- 喙尖 -->
          <path d="M76,2 Q82,4 76,8 Z" fill="#c97b00"/>
          <!-- 鼻孔 -->
          <circle cx="34" cy="0" r="1.4" fill="#8b4513" opacity=".6"/>
        </g>

        <!-- 前侧腿（近侧）——踩踏板 -->
        <g class="leg-a" transform="translate(-6,-6)">
          <path d="M0,0 Q10,32 4,62" stroke="#f4a261" stroke-width="10" fill="none" stroke-linecap="round"/>
          <!-- 蹼足 -->
          <path d="M-4,62 L18,66 L-2,72 Z" fill="#f4a261" stroke="#c97b00" stroke-width="1.2"/>
        </g>
      </g>
    </g>

    <!-- 前景速度线 -->
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".55">
      <line x1="220" y1="440" x2="300" y2="440">
        <animate attributeName="x1" values="260;180;260" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="340;260;340" dur="1s" repeatCount="indefinite"/>
      </line>
      <line x1="200" y1="470" x2="290" y2="470">
        <animate attributeName="x1" values="240;150;240" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="330;240;330" dur="1.3s" repeatCount="indefinite"/>
      </line>
      <line x1="230" y1="500" x2="310" y2="500">
        <animate attributeName="x1" values="270;190;270" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="350;270;350" dur="1.1s" repeatCount="indefinite"/>
      </line>
    </g>
  </svg>

  <div class="hint">纯 SVG + CSS 动画 · 一只快乐的鹈鹕正在骑行</div>
</div>

</body>
</html>
