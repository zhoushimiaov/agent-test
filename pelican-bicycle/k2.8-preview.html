<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelican ride · 鹈鹕骑车动画</title>
<style>
  :root {
    --ink: #54708a;
    --ink-soft: #7d93a8;
    --line: #d8e2ea;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    background: #f7f7f4;
    font-family: Montserrat, "Source Han Sans SC", "Noto Sans SC", sans-serif;
    color: var(--ink);
    padding: 40px 20px;
  }
  .stage {
    width: min(680px, 92vw);
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
  }
  .stage svg {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 8px;
  }
  .controls {
    width: min(680px, 92vw);
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .controls label {
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--ink-soft);
  }
  input[type="range"] {
    width: 180px;
    accent-color: var(--ink);
  }
  button {
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--ink);
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 20px;
    cursor: pointer;
    transition: border-color .2s, color .2s;
  }
  button:hover { border-color: var(--ink); }
  .caption {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <title>鹈鹕骑车</title>
  <desc>鹈鹕蹬着脚踏车前进,车轮和双腿同步转动,云和路面反向滚动形成前进感。</desc>
  <style>
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes dash{to{stroke-dashoffset:-76}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes cloudMove{to{transform:translateX(-860px)}}
    @keyframes pouch{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-2.5deg)}}
    @keyframes wingF{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
    @keyframes blink{0%,90%,100%{transform:scaleY(1)}93%,95%{transform:scaleY(.08)}}
    #spokes1{transform-origin:235px 315px;animation:spin var(--t-wheel,1.1s) linear infinite}
    #spokes2{transform-origin:425px 315px;animation:spin var(--t-wheel,1.1s) linear infinite}
    #crank{transform-origin:330px 315px;animation:spin var(--t-crank,1.2s) linear infinite}
    #leg1{transform-origin:302px 224px;animation:spin var(--t-crank,1.2s) linear infinite}
    #leg2{transform-origin:300px 222px;animation:spin var(--t-crank,1.2s) linear infinite;animation-delay:-.6s}
    #biker{animation:bob var(--t-bob,.6s) ease-in-out infinite}
    #dashline{animation:dash var(--t-dash,.9s) linear infinite}
    .c1{animation:cloudMove 26s linear infinite}
    .c2{animation:cloudMove 34s linear infinite}
    .c3{animation:cloudMove 20s linear infinite}
    #pouch{transform-origin:400px 120px;animation:pouch var(--t-crank,1.2s) ease-in-out infinite}
    #wing{transform-origin:255px 165px;animation:wingF var(--t-crank,1.2s) ease-in-out infinite}
    #eye{transform-origin:378px 110px;animation:blink 4.2s infinite}
    #sunrays{transform-origin:590px 70px;animation:spin 40s linear infinite}
  </style>

      <ellipse cx="332" cy="342" rx="8" ry="5" fill="#f4a340" stroke="none"/>

    <circle cx="368" cy="118" r="33" fill="#ffffff" stroke="#b9cdd9" stroke-width="2.5"/>

</div>

<div class="controls">
  <label for="speed">速度</label>
  <input type="range" id="speed" min="0.2" max="2.5" step="0.05" value="1">
  <button id="toggle">暂停</button>
</div>
<div class="caption">PELICAN RIDE · SVG + CSS KEYFRAMES · 自包含单文件</div>

<script>
(function () {
  var svg = document.querySelector('#stage svg');
  var speed = document.getElementById('speed');
  var toggle = document.getElementById('toggle');
  var base = {
    '--t-wheel': 1.1,
    '--t-crank': 1.2,
    '--t-bob': 0.6,
    '--t-dash': 0.9
  };
  var paused = false;

  function apply() {
    var k = parseFloat(speed.value);
    Object.keys(base).forEach(function (name) {
      svg.style.setProperty(name, (base[name] / k).toFixed(3) + 's');
    });
  }

  speed.addEventListener('input', apply);
  apply();

  toggle.addEventListener('click', function () {
    paused = !paused;
    svg.style.animationPlayState = paused ? 'paused' : 'running';
    svg.querySelectorAll('*').forEach(function (el) {
      el.style.animationPlayState = paused ? 'paused' : '';
    });
    toggle.textContent = paused ? '播放' : '暂停';
  });
})();
</script>
