  <script>
    const svg = document.getElementById('pelican-bike-svg');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const speedBtn = document.getElementById('speedBtn');
    let paused = false;
    let speed = 1;
    playBtn.addEventListener('click', () => {
      paused = false;
      playBtn.classList.add('active');
      pauseBtn.classList.remove('active');
    });
    pauseBtn.addEventListener('click', () => {
      paused = true;
      pauseBtn.classList.add('active');
      playBtn.classList.remove('active');
    });
    speedBtn.addEventListener('click', () => {
      speed *= 1.5;
      if (speed > 3) speed = 0.3;
      const animElements = svg.querySelectorAll('animate, animateTransform, animateMotion, circle, rect');
      animElements.forEach(el => {
        const dur = el.getAttribute('dur');
        if (dur) {
          const newDur = parseFloat(dur) / speed;
          el.setAttribute('dur', newDur + 's');
        }
      });
    });
  </script>
</body>
</html>
