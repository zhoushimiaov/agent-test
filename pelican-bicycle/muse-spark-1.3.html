<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑车 · SVG 动画</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: linear-gradient(180deg, #e0f2fe, #f0f9ff 60%, #ffffff);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 24px 12px;
  }
  h1 { margin: 0; font-size: 22px; color: #0c4a6e; font-weight: 700; }
  .sub { margin: 0; font-size: 13px; color: #64748b; }
  .stage {
    width: min(1100px, 100%); border-radius: 18px; overflow: hidden;
    box-shadow: 0 18px 50px rgba(12, 74, 110, .18);
    border: 1px solid #bae6fd; background: #dff3ff;
  }
  svg { display: block; width: 100%; height: auto; }
  .controls {
    display: flex; align-items: center; gap: 14px; background: #fff;
    border: 1px solid #e2e8f0; padding: 10px 18px; border-radius: 999px;
    box-shadow: 0 6px 18px rgba(15, 23, 42, .08);
  }
  button {
    border: 0; background: #0284c7; color: #fff; font-size: 15px;
    padding: 8px 18px; border-radius: 999px; cursor: pointer;
  }
  button:hover { background: #0369a1; }
  label { font-size: 13px; color: #475569; display: flex; align-items: center; gap: 8px; }
  input[type=range] { width: 140px; accent-color: #0284c7; }
  #speedLabel { min-width: 46px; text-align: right; font-variant-numeric: tabular-nums; color: #0284c7; font-weight: 600; }
  .hint { font-size: 12px; color: #94a3b8; margin: 0; }
</style>
</head>
<body>
<h1>🦤 鹈鹕的晨间骑行</h1>
<p class="sub">纯 SVG 手绘 · 车轮 / 牙盘 / 腿部联动 · 多层视差营造景深</p>

<div class="stage">
<svg viewBox="0 0 1200 600" role="img" aria-label="一只鹈鹕骑自行车的动画">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ec1f5"/><stop offset="1" stop-color="#dff3ff"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe873"/><stop offset="1" stop-color="#ffb703"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe4ee"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ede63"/><stop offset="1" stop-color="#5fb53f"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a929c"/><stop offset="1" stop-color="#5b616b"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="1200" height="400" fill="url(#skyGrad)"/>

  <!-- 太阳 -->
  <g>
    <circle cx="180" cy="110" r="72" fill="#ffdf6b" opacity=".35"/>
    <g id="sunRays" stroke="#ffd93b" stroke-width="6" stroke-linecap="round" opacity=".8"></g>
    <circle cx="180" cy="110" r="46" fill="url(#sunGrad)"/>
  </g>

  <!-- 远处飞鸟 -->
  <g id="birds" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round">
    <path id="bird1" d="M0,0 Q9,-9 18,0 Q27,-9 36,0"/>
    <path id="bird2" d="M0,0 Q9,-9 18,0 Q27,-9 36,0"/>
  </g>

  <!-- 远云（慢） -->
  <g id="lyrCF"><g id="patCF"></g></g>
  <!-- 山丘 -->
  <g id="lyrHills"><g id="patHills">
    <path d="M0,400 L0,338 Q150,248 300,338 Q450,258 600,348 Q750,268 900,348 Q1050,278 1200,338 L1200,400 Z" fill="#a9d6a5"/>
    <path d="M0,400 L0,378 Q200,318 400,378 Q600,308 800,378 Q1000,318 1200,378 L1200,400 Z" fill="#8fce7f"/>
  </g></g>
  <!-- 近云（中速） -->
  <g id="lyrCN"><g id="patCN"></g></g>

  <!-- 草地 -->
  <rect x="0" y="395" width="1200" height="80" fill="url(#grassGrad)"/>

  <!-- 树木灌木（较快） -->
  <g id="lyrTrees"><g id="patTrees"></g></g>

  <!-- 马路（最快） -->
  <rect x="0" y="470" width="1200" height="130" fill="url(#roadGrad)"/>
  <rect x="0" y="470" width="1200" height="8" fill="#f1f5f9"/>
  <g id="lyrRoad"><g id="patRoad"></g></g>

  <!-- 地面阴影 -->
  <ellipse id="shadow" cx="620" cy="562" rx="205" ry="15" fill="#0f172a" opacity=".22"/>

  <!-- ===== 自行车 ===== -->
  <g id="bike">
    <!-- 链条 -->
    <path d="M620,492 L450,487 M620,508 L450,503" stroke="#64748b" stroke-width="4"/>
    <circle cx="620" cy="500" r="17" fill="none" stroke="#334155" stroke-width="6"/>
    <circle cx="620" cy="500" r="5" fill="#334155"/>

    <!-- 后轮 -->
    <circle cx="450" cy="495" r="62" fill="none" stroke="#1f2937" stroke-width="14"/>
    <circle cx="450" cy="495" r="46" fill="none" stroke="#cbd5e1" stroke-width="6"/>
    <g id="spokesR"></g>
    <circle cx="450" cy="495" r="9" fill="#475569"/>

    <!-- 前轮 -->
    <circle cx="790" cy="495" r="62" fill="none" stroke="#1f2937" stroke-width="14"/>
    <circle cx="790" cy="495" r="46" fill="none" stroke="#cbd5e1" stroke-width="6"/>
    <g id="spokesF"></g>
    <circle cx="790" cy="495" r="9" fill="#475569"/>

    <!-- 车架 -->
    <path d="M450,495 L620,500 M450,495 L552,385 M620,500 L552,385 M552,385 L742,377 M620,500 L742,377"
          fill="none" stroke="#ef4444" stroke-width="11" stroke-linecap="round"/>
    <path d="M736,371 L752,433" stroke="#b91c1c" stroke-width="14" stroke-linecap="round"/>
    <path d="M752,433 L790,495" fill="none" stroke="#ef4444" stroke-width="10" stroke-linecap="round"/>
    <path d="M552,385 L549,368" stroke="#9ca3af" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="546" cy="362" rx="32" ry="11" fill="#1f2937"/>
    <path d="M736,371 L730,337" stroke="#9ca3af" stroke-width="9" stroke-linecap="round"/>
    <path d="M730,337 C720,330 708,332 702,342" fill="none" stroke="#374151" stroke-width="9" stroke-linecap="round"/>
    <circle cx="702" cy="342" r="10" fill="#1f2937"/>

    <!-- 牙盘曲柄 + 脚踏（JS 驱动） -->
    <line id="crank1" x1="620" y1="500" x2="662" y2="500" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
    <line id="crank2" x1="620" y1="500" x2="578" y2="500" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
    <rect id="pedal1" x="647" y="495" width="30" height="9" rx="4.5" fill="#111827"/>
    <rect id="pedal2" x="563" y="495" width="30" height="9" rx="4.5" fill="#111827"/>

    <!-- 车筐 + 鱼 -->
    <g>
      <path d="M752,396 L746,432 M804,396 L800,432" stroke="#92400e" stroke-width="5" stroke-linecap="round"/>
      <path d="M746,392 L810,392 L800,444 L756,444 Z" fill="#d29a5b" stroke="#a06a2c" stroke-width="2"/>
      <path d="M749,406 L807,406 M751,420 L805,420" stroke="#a06a2c" stroke-width="2" opacity=".7"/>
      <path d="M766,394 L764,442 M784,394 L786,442" stroke="#a06a2c" stroke-width="2" opacity=".7"/>
      <g id="fishG">
        <ellipse cx="772" cy="380" rx="9" ry="15" fill="#7dd3fc" transform="rotate(18 772 380)"/>
        <path d="M772,366 l-8,-12 l16,0 z" fill="#38bdf8"/>
        <ellipse cx="793" cy="382" rx="7" ry="12" fill="#93c5fd" transform="rotate(-12 793 382)"/>
        <path d="M793,371 l-7,-10 l14,0 z" fill="#60a5fa"/>
      </g>
    </g>
  </g>

  <!-- ===== 鹈鹕 ===== -->
  <g id="pelican">
    <!-- 远侧腿（身体后） -->
    <polyline id="legFar" points="" fill="none" stroke="#d97706" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse id="footFar" cx="0" cy="0" rx="13" ry="7" fill="#d97706"/>

    <!-- 尾巴 -->
    <path d="M504,270 L446,248 L462,278 L438,282 L470,297 L450,312 L502,300 Z" fill="#e5e7eb"/>

    <!-- 身体 -->
    <ellipse cx="560" cy="285" rx="78" ry="60" fill="url(#bodyGrad)"/>
    <ellipse cx="562" cy="308" rx="54" ry="32" fill="#f1f5f9" opacity=".7"/>

    <!-- 头颈组 -->
    <g id="headG">
      <path d="M618,255 C636,238 650,220 664,200" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
      <path d="M656,164 q-14,-10 -26,-8 M661,157 q-12,-13 -26,-13 M666,151 q-9,-15 -22,-19"
            fill="none" stroke="#dbe4ee" stroke-width="6" stroke-linecap="round"/>
      <circle cx="678" cy="185" r="30" fill="#ffffff"/>
      <circle cx="690" cy="178" r="6" fill="#1f2937"/>
      <circle cx="692" cy="176" r="2" fill="#ffffff"/>
      <path d="M700,176 L860,208 L700,194 Z" fill="url(#beakGrad)"/>
      <path d="M700,185 L858,208" stroke="#d97706" stroke-width="3" opacity=".55" fill="none"/>
      <g id="pouchG">
        <path d="M706,194 C740,240 790,252 852,212 C810,232 748,228 706,194 Z"
              fill="#f9a8d4" stroke="#f472b6" stroke-width="2" opacity=".95"/>
      </g>
    </g>

    <!-- 围巾 -->
    <circle cx="650" cy="232" r="12" fill="#ef4444"/>
    <path id="scarfTail" d="M642,232" fill="none" stroke="#ef4444" stroke-width="14" stroke-linecap="round"/>
    <path id="scarfStripe" d="M642,232" fill="none" stroke="#ffffff" stroke-width="4"
          stroke-dasharray="2 16" stroke-linecap="round" opacity=".85"/>

    <!-- 近侧腿（身体前） -->
    <polyline id="legNear" points="" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse id="footNear" cx="0" cy="0" rx="13" ry="7" fill="#f59e0b"/>

    <!-- 翅膀（扶着车把） -->
    <g id="wingG">
      <path d="M605,280 C645,292 675,312 700,338 L708,346 C682,328 650,308 610,294 Z"
            fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M622,288 C650,298 672,314 690,334 M634,296 C654,306 668,320 680,336"
            fill="none" stroke="#cbd5e1" stroke-width="2"/>
    </g>
  </g>
</svg>
</div>

<div class="controls">
  <button id="playBtn">⏸ 暂停</button>
  <label>速度 <input id="speed" type="range" min="0.3" max="2.5" step="0.1" value="1"><span id="speedLabel">1.0×</span></label>
</div>
<p class="hint">空格键也可以暂停 / 继续 · 2D SVG + 视差景深（真 3D 得上 WebGL，这里先做"伪 3D"）</p>

<script>
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const S = { t: 0, speed: 1, playing: true, last: 0 };
const LAYER_W = 1200;
const layers = [['lyrCF',12],['lyrHills',30],['lyrCN',45],['lyrTrees',110],['lyrRoad',220]];

/* ---------- 搭建重复元素 ---------- */
function el(tag, attrs, parent){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  parent.appendChild(n); return n;
}
// 辐条
function buildSpokes(gid, cx, cy){
  const g = $(gid);
  for (let k = 0; k < 8; k++){
    const a = k * Math.PI / 4;
    el('line', {x1:cx, y1:cy, x2:(cx+46*Math.cos(a)).toFixed(1), y2:(cy+46*Math.sin(a)).toFixed(1),
                stroke:'#e2e8f0', 'stroke-width':3}, g);
  }
}
buildSpokes('spokesR', 450, 495);
buildSpokes('spokesF', 790, 495);
// 太阳光芒
(function(){
  const g = $('sunRays');
  for (let k = 0; k < 8; k++){
    const a = k * Math.PI / 4;
    el('line', {x1:180+58*Math.cos(a), y1:110+58*Math.sin(a),
                x2:180+80*Math.cos(a), y2:110+80*Math.sin(a)}, g);
  }
})();
// 云
function cloud(g, cx, cy, s, op){
  const e = (x,y,rx,ry) => el('ellipse',{cx:x, cy:y, rx:rx, ry:ry, fill:'#ffffff', opacity:op}, g);
  e(cx, cy, 46*s, 24*s); e(cx-36*s, cy+8*s, 28*s, 16*s); e(cx+36*s, cy+8*s, 30*s, 17*s);
}
(function(){
  const g = $('patCF');
  [[150,90,1],[620,140,.8],[1000,70,1.2]].forEach(c => cloud(g, c[0], c[1], c[2], .8));
})();
(function(){
  const g = $('patCN');
  [[300,205,1.4],[850,160,1.1],[1150,225,1.3]].forEach(c => cloud(g, c[0], c[1], c[2], .95));
})();
// 树 / 灌木 / 草丛
(function(){
  const g = $('patTrees');
  [120,420,720,1020].forEach((x,i)=>{
    el('rect',{x:x-7, y:352, width:14, height:48, rx:4, fill:'#8b5a2b'}, g);
    const c = i%2 ? '#57b25e' : '#3f9e4d';
    el('circle',{cx:x, cy:326, r:30, fill:c}, g);
    el('circle',{cx:x-22, cy:338, r:20, fill:c}, g);
    el('circle',{cx:x+22, cy:338, r:20, fill:c}, g);
  });
  [270,600,900,1150].forEach(x => el('ellipse',{cx:x, cy:392, rx:34, ry:18, fill:'#57b25e'}, g));
  [60,180,340,500,660,810,980,1120].forEach(x =>
    el('path',{d:`M${x},400 l6,-14 l6,14 z`, fill:'#4d9e4d'}, g));
})();
// 路面虚线 + 石子
(function(){
  const g = $('patRoad');
  for (let i = 0; i < 8; i++)
    el('rect',{x:40+i*150, y:536, width:80, height:12, rx:6, fill:'#f8fafc', opacity:.9}, g);
  [[200,560,5],[520,575,4],[760,556,6],[1010,572,4]].forEach(s =>
    el('ellipse',{cx:s[0], cy:s[1], rx:s[2], ry:s[2]*.6, fill:'#4b5158', opacity:.6}, g));
})();
// 每层复制一份，实现无缝循环
['patCF','patHills','patCN','patTrees','patRoad'].forEach(pid => {
  const u = el('use', {href:'#'+pid, x:LAYER_W}, $('lyr'+pid.slice(3)));
});

/* ---------- 动画 ---------- */
function setLine(id,x1,y1,x2,y2){
  const l = $(id);
  l.setAttribute('x1',x1); l.setAttribute('y1',y1);
  l.setAttribute('x2',x2.toFixed(1)); l.setAttribute('y2',y2.toFixed(1));
}
function legPts(hip, foot, fwd){
  const mx=(hip[0]+foot[0])/2, my=(hip[1]+foot[1])/2;
  let px=-(foot[1]-hip[1]), py=foot[0]-hip[0];
  const l=Math.hypot(px,py)||1; px/=l; py/=l;
  if (px<0){ px=-px; py=-py; }
  return `${hip[0]},${hip[1]} ${(mx+px*fwd).toFixed(1)},${(my+py*fwd).toFixed(1)} ${foot[0].toFixed(1)},${foot[1].toFixed(1)}`;
}

function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now - S.last)/1000, 0.05); S.last = now;
  if (S.playing) S.t += dt * S.speed;
  const t = S.t;

  // 背景视差
  for (const [id, sp] of layers)
    $(id).setAttribute('transform', `translate(${(-(t*sp % LAYER_W)).toFixed(1)},0)`);

  // 车轮（转速与路面速度匹配）
  const wdeg = (t*220/62*180/Math.PI).toFixed(1);
  $('spokesR').setAttribute('transform', `rotate(${wdeg} 450 495)`);
  $('spokesF').setAttribute('transform', `rotate(${wdeg} 790 495)`);

  // 牙盘 + 脚踏
  const th = t*2.4, cx = 620, cy = 500, cr = 42;
  const p1 = [cx+cr*Math.cos(th), cy+cr*Math.sin(th)];
  const p2 = [cx-cr*Math.cos(th), cy-cr*Math.sin(th)];
  setLine('crank1', cx, cy, p1[0], p1[1]);
  setLine('crank2', cx, cy, p2[0], p2[1]);
  const pd1 = $('pedal1'), pd2 = $('pedal2');
  pd1.setAttribute('x', (p1[0]-15).toFixed(1)); pd1.setAttribute('y', (p1[1]-4.5).toFixed(1));
  pd2.setAttribute('x', (p2[0]-15).toFixed(1)); pd2.setAttribute('y', (p2[1]-4.5).toFixed(1));

  // 腿：髋 -> 膝（前突） -> 脚（脚踏）
  $('legFar').setAttribute('points', legPts([548,335], p2, 34));
  $('legNear').setAttribute('points', legPts([578,335], p1, 34));
  $('footFar').setAttribute('cx', (p2[0]+8).toFixed(1)); $('footFar').setAttribute('cy', (p2[1]+2).toFixed(1));
  $('footNear').setAttribute('cx', (p1[0]+8).toFixed(1)); $('footNear').setAttribute('cy', (p1[1]+2).toFixed(1));

  // 身体起伏 + 阴影
  const bob = Math.sin(th*2)*4;
  $('pelican').setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
  $('shadow').setAttribute('rx', (205-bob*1.5).toFixed(1));
  $('shadow').setAttribute('opacity', (0.22-bob*0.004).toFixed(3));

  // 翅膀扶把微动、头部点动、喉囊晃动、鱼摆动
  $('wingG').setAttribute('transform', `rotate(${(Math.sin(t*2.4+1)*2.5).toFixed(2)} 605 280)`);
  $('headG').setAttribute('transform', `rotate(${(Math.sin(th*2+0.6)*2).toFixed(2)} 630 245)`);
  $('pouchG').setAttribute('transform', `rotate(${(Math.sin(th*2)*3).toFixed(2)} 715 200)`);
  $('fishG').setAttribute('transform', `rotate(${(Math.sin(t*7)*4).toFixed(2)} 782 400)`);

  // 围巾飘动
  const w1=Math.sin(t*9)*7, w2=Math.sin(t*9+1.2)*8, w3=Math.sin(t*9+2.4)*7;
  const d = `M642,232 C612,${(224+w1).toFixed(1)} 585,${(240+w2).toFixed(1)} 552,${(230+w3).toFixed(1)} ` +
            `C520,${(222+w2).toFixed(1)} 490,${(236+w1).toFixed(1)} 458,${(228+w3).toFixed(1)}`;
  $('scarfTail').setAttribute('d', d);
  $('scarfStripe').setAttribute('d', d);

  // 太阳旋转、飞鸟
  $('sunRays').setAttribute('transform', `rotate(${(t*4%360).toFixed(1)} 180 110)`);
  const bx = 1250-(t*25 % 1500), by = 150+10*Math.sin(t*1.3);
  $('birds').setAttribute('transform', `translate(${bx.toFixed(1)} ${by.toFixed(1)})`);
  const fl = 1+0.22*Math.sin(t*10);
  $('bird1').setAttribute('transform', `scale(1 ${fl.toFixed(3)})`);
  $('bird2').setAttribute('transform', `translate(64 26) scale(.7 ${(.7*fl).toFixed(3)})`);
}
requestAnimationFrame(n => { S.last = n; requestAnimationFrame(frame); });

/* ---------- 控制 ---------- */
const btn = $('playBtn');
function toggle(){
  S.playing = !S.playing;
  btn.textContent = S.playing ? '⏸ 暂停' : '▶ 播放';
}
btn.onclick = toggle;
addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); toggle(); }
});
$('speed').oninput = e => {
  S.speed = +e.target.value;
  $('speedLabel').textContent = S.speed.toFixed(1) + '×';
};
if (matchMedia('(prefers-reduced-motion: reduce)').matches && S.playing) toggle();
</script>

</body>
</html>
