<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>show_widget</title>
</head>
<body>
<style>
:root{--primary:#F3A04C;--accent:#E58522;--background:#F4F4F6;--panel-bg:#FEFDFC;--card-bg:#fff;--tooltip-bg:#454545;--success:#40B43E;--warning:#EBA400;--destructive:#E65C53;--destructive-hover:#D14B42;--primary-foreground:#fff;--text-primary:rgba(0,0,0,.8);--text-secondary:rgba(0,0,0,.5);--text-tertiary:rgba(0,0,0,.35);--intensity-0:rgba(0,0,0,0);--intensity-3:rgba(0,0,0,.03);--intensity-4:rgba(0,0,0,.04);--intensity-6:rgba(0,0,0,.06);--intensity-8:rgba(0,0,0,.08);--intensity-12:rgba(0,0,0,.12);--intensity-16:rgba(0,0,0,.16);--intensity-20:rgba(0,0,0,.2);--intensity-35:rgba(0,0,0,.35);--intensity-60:rgba(0,0,0,.6);--input-shadow:rgba(0,0,0,.08);--radius-sm:8px;--radius-md:10px;--radius-lg:14px;--radius-xl:18px;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--background:#232324;--panel-bg:#332D28;--card-bg:#2E2E2E;--tooltip-bg:#BABABA;--primary-foreground:#000;--text-primary:rgba(255,255,255,.8);--text-secondary:rgba(255,255,255,.5);--text-tertiary:rgba(255,255,255,.35);--intensity-0:rgba(255,255,255,0);--intensity-3:rgba(255,255,255,.03);--intensity-4:rgba(255,255,255,.04);--intensity-6:rgba(255,255,255,.06);--intensity-8:rgba(255,255,255,.08);--intensity-12:rgba(255,255,255,.12);--intensity-16:rgba(255,255,255,.16);--intensity-20:rgba(255,255,255,.2);--intensity-35:rgba(255,255,255,.35);--intensity-60:rgba(255,255,255,.6);--input-shadow:rgba(0,0,0,.28)}}
*{box-sizing:border-box}
button,a,[role=button],select,input[type=range]{cursor:pointer}
</style>
<div style="display:block;width:100%;color:var(--text-primary);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <div style="border:.5px solid var(--intensity-8);border-radius:14px;background:var(--intensity-4);padding:12px;">
  <svg id="scene" width="100%" viewBox="0 0 680 400" role="img" aria-label="骑自行车的鹈鹕动画" style="display:block">
    <defs>
      <clipPath id="bandClip"><rect x="0" y="330" width="680" height="70"/></clipPath>
      <g id="hillTile">
        <path d="M-20 330 C 40 276 130 276 200 330 Z" fill="rgba(134,193,102,.26)"/>
        <path d="M300 330 C 352 294 412 294 462 330 Z" fill="rgba(134,193,102,.18)"/>
        <path d="M520 330 C 580 286 652 286 700 330 Z" fill="rgba(134,193,102,.14)"/>
      </g>
      <g id="spokesR" stroke="var(--intensity-20)" stroke-width="2">
        <line x1="204" y1="296" x2="296" y2="296"/>
        <line x1="282.5" y1="263.5" x2="217.5" y2="328.5"/>
        <line x1="250" y1="250" x2="250" y2="342"/>
        <line x1="217.5" y1="263.5" x2="282.5" y2="328.5"/>
      </g>
      <g id="spokesF" stroke="var(--intensity-20)" stroke-width="2">
        <line x1="406" y1="296" x2="498" y2="296"/>
        <line x1="484.5" y1="263.5" x2="419.5" y2="328.5"/>
        <line x1="452" y1="250" x2="452" y2="342"/>
        <line x1="419.5" y1="263.5" x2="484.5" y2="328.5"/>
      </g>
    </defs>
    <g clip-path="url(#bandClip)">
      <g id="hillWrap">
        <use href="#hillTile"/>
        <use href="#hillTile" x="680"/>
        <use href="#hillTile" x="-680"/>
      </g>
    </g>
    <rect x="0" y="330" width="680" height="70" fill="var(--intensity-4)"/>
    <line x1="0" y1="330.5" x2="680" y2="330.5" stroke="var(--intensity-12)" stroke-width="1"/>
    <g clip-path="url(#bandClip)">
      <g id="roadWrap" fill="var(--intensity-16)">
        <rect x="-110" y="370" width="46" height="4" rx="2"/>
        <rect x="0" y="370" width="46" height="4" rx="2"/>
        <rect x="110" y="370" width="46" height="4" rx="2"/>
        <rect x="220" y="370" width="46" height="4" rx="2"/>
        <rect x="330" y="370" width="46" height="4" rx="2"/>
        <rect x="440" y="370" width="46" height="4" rx="2"/>
        <rect x="550" y="370" width="46" height="4" rx="2"/>
        <rect x="660" y="370" width="46" height="4" rx="2"/>
        <rect x="770" y="370" width="46" height="4" rx="2"/>
        <rect x="880" y="370" width="46" height="4" rx="2"/>
      </g>
    </g>
    <ellipse cx="351" cy="356" rx="152" ry="11" fill="rgba(0,0,0,.10)"/>
    <circle cx="250" cy="296" r="56" fill="none" stroke="#3A3A3A" stroke-width="9"/>
    <circle cx="250" cy="296" r="45" fill="none" stroke="#F3A04C" stroke-width="4"/>
    <g class="wheel" data-cx="250" data-cy="296"><use href="#spokesR"/></g>
    <circle cx="250" cy="296" r="6" fill="#3A3A3A"/>
    <circle cx="452" cy="296" r="56" fill="none" stroke="#3A3A3A" stroke-width="9"/>
    <circle cx="452" cy="296" r="45" fill="none" stroke="#F3A04C" stroke-width="4"/>
    <g class="wheel" data-cx="452" data-cy="296"><use href="#spokesF"/></g>
    <circle cx="452" cy="296" r="6" fill="#3A3A3A"/>
    <g id="crankFar" transform="rotate(180 350 308)">
      <line x1="350" y1="308" x2="350" y2="332" stroke="#C9771A" stroke-width="7" stroke-linecap="round"/>
      <rect x="341" y="326" width="18" height="8" rx="3" fill="#6E6E6E"/>
    </g>
    <line id="thighFar" x1="306" y1="200" x2="346" y2="250" stroke="#D9C6A6" stroke-width="11" stroke-linecap="round"/>
    <line id="shinFar" x1="346" y1="250" x2="350" y2="284" stroke="#D9C6A6" stroke-width="11" stroke-linecap="round"/>
    <ellipse id="footFar" cx="350" cy="280" rx="10" ry="5.5" fill="#E98B2A"/>
    <g fill="none" stroke="#F3A04C" stroke-width="7" stroke-linecap="round">
      <line x1="250" y1="296" x2="350" y2="308"/>
      <line x1="350" y1="308" x2="314" y2="204"/>
      <line x1="250" y1="296" x2="314" y2="204"/>
      <line x1="350" y1="308" x2="430" y2="214"/>
      <line x1="314" y1="204" x2="422" y2="192"/>
      <line x1="422" y1="192" x2="434" y2="218" stroke-width="9"/>
      <line x1="434" y1="218" x2="452" y2="296"/>
    </g>
    <circle cx="350" cy="308" r="15" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="3"/>
    <g fill="none" stroke="#E58522" stroke-width="6" stroke-linecap="round">
      <line x1="422" y1="194" x2="414" y2="180"/>
      <path d="M414 180 C 404 172 394 172 386 178"/>
    </g>
    <g id="crankNear" transform="rotate(0 350 308)">
      <line x1="350" y1="308" x2="350" y2="332" stroke="#E58522" stroke-width="8" stroke-linecap="round"/>
      <rect x="340" y="325" width="20" height="9" rx="4" fill="#3A3A3A"/>
    </g>
    <line id="thighNear" x1="314" y1="194" x2="355" y2="250" stroke="#FFF6E9" stroke-width="13" stroke-linecap="round"/>
    <line id="shinNear" x1="355" y1="250" x2="350" y2="332" stroke="#FFF6E9" stroke-width="13" stroke-linecap="round"/>
    <ellipse id="footNear" cx="350" cy="328" rx="10" ry="5.5" fill="#FFB11B"/>
    <path d="M290 202 C 302 194 328 194 340 202 C 328 210 300 210 290 202 Z" fill="#3A3A3A"/>
    <g id="torso">
      <path d="M258 136 C 226 126 200 136 186 156 C 210 152 234 160 254 170 Z" fill="#F3E7D2"/>
      <ellipse cx="303" cy="163" rx="58" ry="44" transform="rotate(-12 303 163)" fill="#EADCC3"/>
      <ellipse cx="298" cy="158" rx="58" ry="44" transform="rotate(-12 298 158)" fill="#FFF6E9"/>
      <line x1="338" y1="142" x2="386" y2="112" stroke="#FFF6E9" stroke-width="30" stroke-linecap="round"/>
      <path id="scarf" d="M366 110 C 332 96 300 92 268 104 L268 122 C 302 112 334 116 366 128 Z" fill="#58B2DC"/>
      <circle cx="366" cy="120" r="8" fill="#58B2DC"/>
      <circle cx="396" cy="107" r="22" fill="#EADCC3"/>
      <circle cx="394" cy="104" r="22" fill="#FFF6E9"/>
      <path d="M406 90 C 448 82 488 90 502 100 C 486 106 446 110 406 104 Z" fill="#FFB11B"/>
      <path d="M406 103 C 438 116 470 122 496 104 C 490 128 452 138 420 128 C 410 122 404 112 406 103 Z" fill="#E98B2A"/>
      <circle cx="401" cy="97" r="3.4" fill="#3A3A3A"/>
      <path d="M374 92 C 376 70 412 68 418 88 L 418 94 C 402 88 386 88 374 98 Z" fill="#E58522"/>
      <path d="M416 86 L 434 92 L 432 97 L 415 93 Z" fill="#E58522"/>
      <path d="M330 138 C 356 142 380 154 396 172 C 386 184 364 180 348 166 C 338 156 328 148 330 138 Z" fill="#F0E2CC"/>
      <circle cx="390" cy="176" r="6" fill="#3A3A3A"/>
    </g>
  </svg>
  </div>
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;">
    <button id="toggle" style="height:36px;padding:0 14px;border:0;border-radius:10px;background:var(--primary);color:var(--primary-foreground);font-size:12px;font-weight:500;">暂停</button>
    <label for="speed" style="font-size:12px;color:var(--text-secondary);">速度</label>
    <input id="speed" type="range" min="0.3" max="2" step="0.1" value="1" style="flex:1;min-width:140px;">
    <span id="speedOut" style="font-size:12px;font-weight:500;min-width:40px;text-align:right;">1.0×</span>
  </div>
</div>
<script>
(function(){
  var scene=document.getElementById('scene');
  if(!scene)return;
  var wheels=Array.prototype.slice.call(scene.querySelectorAll('.wheel')).map(function(el){
    return {el:el,cx:+el.getAttribute('data-cx'),cy:+el.getAttribute('data-cy')};
  });
  var crankNear=document.getElementById('crankNear'),crankFar=document.getElementById('crankFar');
  var roadWrap=document.getElementById('roadWrap'),hillWrap=document.getElementById('hillWrap');
  var torso=document.getElementById('torso'),scarf=document.getElementById('scarf');
  var footNear=document.getElementById('footNear'),footFar=document.getElementById('footFar');
  var tN=document.getElementById('thighNear'),sN=document.getElementById('shinNear');
  var tF=document.getElementById('thighFar'),sF=document.getElementById('shinFar');
  var toggle=document.getElementById('toggle'),speedEl=document.getElementById('speed'),speedOut=document.getElementById('speedOut');
  var C={x:350,y:308},R=24,L=74,HIP={x:314,y:194},HIPF={x:306,y:200};
  var playing=true,rate=1,t=0,last=null,roadOff=0,hillOff=0;
  var mq=window.matchMedia?window.matchMedia('(prefers-reduced-motion: reduce)'):null;
  if(mq&&mq.matches)playing=false;
  function rot(el,deg,cx,cy){el.setAttribute('transform','rotate('+deg.toFixed(2)+' '+cx+' '+cy+')');}
  function ik(hip,px,py){
    var dx=px-hip.x,dy=py-hip.y,d=Math.sqrt(dx*dx+dy*dy),maxD=2*L-1;
    if(d>maxD){var k=maxD/d;dx*=k;dy*=k;d=maxD;}
    var fx=hip.x+dx,fy=hip.y+dy,mx=(hip.x+fx)/2,my=(hip.y+fy)/2;
    var h=Math.sqrt(Math.max(0,L*L-(d*d)/4)),nx=dy/d,ny=-dx/d;
    return {kx:mx+nx*h,ky:my+ny*h,fx:fx,fy:fy};
  }
  function leg(a,b,hip,px,py){
    var r=ik(hip,px,py);
    a.setAttribute('x1',hip.x);a.setAttribute('y1',hip.y);
    a.setAttribute('x2',r.kx);a.setAttribute('y2',r.ky);
    b.setAttribute('x1',r.kx);b.setAttribute('y1',r.ky);
    b.setAttribute('x2',r.fx);b.setAttribute('y2',r.fy);
  }
  function draw(now){
    if(last===null)last=now;
    var dt=Math.min(0.05,(now-last)/1000);last=now;
    var step=playing?dt:0;
    t+=step;
    var ws=300*rate;
    var crank=t*3.6*rate;
    var wheelDeg=(ws*t/56)*180/Math.PI;
    var bob=1.8*Math.sin(crank*2);
    wheels.forEach(function(w){rot(w.el,wheelDeg,w.cx,w.cy);});
    rot(crankNear,crank*180/Math.PI,C.x,C.y);
    rot(crankFar,crank*180/Math.PI+180,C.x,C.y);
    var near={x:C.x-R*Math.sin(crank),y:C.y+R*Math.cos(crank)};
    var far={x:C.x-R*Math.sin(crank+Math.PI),y:C.y+R*Math.cos(crank+Math.PI)};
    leg(tF,sF,{x:HIPF.x,y:HIPF.y+bob},far.x,far.y);
    leg(tN,sN,{x:HIP.x,y:HIP.y+bob},near.x,near.y);
    footFar.setAttribute('cx',far.x.toFixed(1));footFar.setAttribute('cy',(far.y-4).toFixed(1));
    footNear.setAttribute('cx',near.x.toFixed(1));footNear.setAttribute('cy',(near.y-4).toFixed(1));
    torso.setAttribute('transform','translate(0,'+bob.toFixed(2)+')');
    var p=t*6*rate,k1=Math.sin(p),k2=Math.sin(p+1),k3=Math.sin(p+2);
    scarf.setAttribute('d','M366 110 C 332 '+(96+4*k1).toFixed(1)+' 300 '+(92+7*k2).toFixed(1)+' 268 '+(104+10*k3).toFixed(1)+' L268 '+(122+10*k3).toFixed(1)+' C 302 '+(112+7*k2).toFixed(1)+' 334 '+(116+4*k1).toFixed(1)+' 366 128 Z');
    roadOff=(roadOff+ws*step)%110;
    hillOff=(hillOff+ws*0.22*step)%680;
    roadWrap.setAttribute('transform','translate(-'+roadOff.toFixed(2)+',0)');
    hillWrap.setAttribute('transform','translate(-'+hillOff.toFixed(2)+',0)');
    requestAnimationFrame(draw);
  }
  toggle.addEventListener('click',function(){
    playing=!playing;
    toggle.textContent=playing?'暂停':'播放';
  });
  speedEl.addEventListener('input',function(){
    rate=+speedEl.value;
    speedOut.textContent=rate.toFixed(1)+'×';
  });
  speedOut.textContent=rate.toFixed(1)+'×';
  if(!playing)toggle.textContent='播放';
  requestAnimationFrame(draw);
})();
</script><script data-tabbit-widget-diagnostics="true">
(function(){
  if (window.__tabbitWidgetDiagnosticsInstalled) return;
  window.__tabbitWidgetDiagnosticsInstalled = true;
  window.__TABBIT_WIDGET_ERRORS__ = window.__TABBIT_WIDGET_ERRORS__ || [];
  function emit(level, args) {
    var payload = {
      type: "tabbit_widget_diagnostics",
      level: level,
      message: Array.prototype.slice.call(args || []).map(function(item) {
        if (item && item.stack) return item.stack;
        if (typeof item === "string") return item;
        try { return JSON.stringify(item); } catch (_) { return String(item); }
      }).join(" "),
      timestamp: Date.now()
    };
    window.__TABBIT_WIDGET_ERRORS__.push(payload);
    try { window.parent && window.parent.postMessage(payload, "*"); } catch (_) {}
  }
  var originalError = console.error;
  console.error = function() {
    emit("error", arguments);
    return originalError && originalError.apply(console, arguments);
  };
  window.addEventListener("error", function(event) {
    emit("error", [event.message || "Script error", event.filename || "", event.lineno || ""]);
  });
  window.addEventListener("unhandledrejection", function(event) {
    emit("unhandledrejection", [event.reason || "Unhandled promise rejection"]);
  });
})();
</script>
</body>
</html>
