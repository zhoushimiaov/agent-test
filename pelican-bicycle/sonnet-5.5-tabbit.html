<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>show_widget</title>
</head>
<body>
<style>
.wrap{width:100%;max-width:680px;margin:0 auto}
svg{width:100%;height:auto;display:block;background:linear-gradient(#bfe6ff,#f4fbff 70%)}
.wheel{animation:spin 1s linear infinite;transform-box:fill-box;transform-origin:center}
.crank{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.pedalL{animation:spinr 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob .6s ease-in-out infinite alternate}
.ground{animation:move 1s linear infinite}
.cloud{animation:cloud 14s linear infinite}
.pouch{animation:pouch .6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top}
.scarf{animation:wave .3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes bob{to{transform:translateY(-4px)}}
@keyframes move{to{transform:translateX(-80px)}}
@keyframes cloud{from{transform:translateX(700px)}to{transform:translateX(-200px)}}
@keyframes pouch{to{transform:scaleY(1.12)}}
@keyframes wave{to{transform:skewY(-12deg) scaleX(1.1)}}
</style>
