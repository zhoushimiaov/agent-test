<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>show_widget</title>
</head>
<body>
<div style="display:flex;justify-content:center;align-items:center;background:#eef6ff;border-radius:12px;padding:8px;">
<svg viewBox="0 0 600 380" width="100%" style="max-width:640px;" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed0ff"/>
      <stop offset="1" stop-color="#e3f5ff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#sky)"/>
  <circle cx="520" cy="60" r="30" fill="#ffd54a"/>

  <!-- 移动的云 -->
  <g>
    <g fill="#ffffff" opacity="0.9">
      <ellipse cx="100" cy="60" rx="40" ry="16"/><ellipse cx="125" cy="52" rx="28" ry="14"/>
      <ellipse cx="330" cy="40" rx="45" ry="15"/><ellipse cx="355" cy="32" rx="25" ry="13"/>
    </g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- 远处的山 -->
  <path d="M0 250 L80 190 L160 250 L240 200 L330 255 L420 205 L510 250 L600 210 L600 260 L0 260 Z" fill="#9bd39a"/>

  <!-- 地面 -->
  <rect x="0" y="330" width="600" height="50" fill="#6cbf6a"/>
  <g>
    <g stroke="#4f9e4e" stroke-width="4">
      <line x1="0" y1="345" x2="30" y2="345"/><line x1="90" y1="360" x2="130" y2="360"/>
      <line x1="180" y1="345" x2="210" y2="345"/><line x1="270" y1="360" x2="310" y2="360"/>
      <line x1="360" y1="345" x2="390" y2="345"/><line x1="450" y1="360" x2="490" y2="360"/>
      <line x1="540" y1="345" x2="570" y2="345"/><line x1="630" y1="360" x2="670" y2="360"/>
    </g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-90 0" dur="0.6s" repeatCount="indefinite"/>
  </g>

  <!-- 整体颠簸 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="0.3s" repeatCount="indefinite"/>

    <!-- 后轮 -->
    <g>
      <circle cx="180" cy="280" r="50" fill="none" stroke="#222" stroke-width="8"/>
      <g stroke="#999" stroke-width="2">
        <line x1="180" y1="230" x2="180" y2="330"/><line x1="130" y1="280" x2="230" y2="280"/>
        <line x1="145" y1="245" x2="215" y2="315"/><line x1="215" y1="245" x2="145" y2="315"/>
      </g>
      <circle cx="180" cy="280" r="5" fill="#444"/>
      <animateTransform attributeName="transform" type="rotate" values="0 180 280;360 180 280" dur="0.6s" repeatCount="indefinite"/>
    </g>

    <!-- 前轮 -->
    <g>
      <circle cx="400" cy="280" r="50" fill="none" stroke="#222" stroke-width="8"/>
      <g stroke="#999" stroke-width="2">
        <line x1="400" y1="230" x2="400" y2="330"/><line x1="350" y1="280" x2="450" y2="280"/>
        <line x1="365" y1="245" x2="435" y2="315"/><line x1="435" y1="245" x2="365" y2="315"/>
      </g>
      <circle cx="400" cy="280" r="5" fill="#444"/>
      <animateTransform attributeName="transform" type="rotate" values="0 400 280;360 400 280" dur="0.6s" repeatCount="indefinite"/>
    </g>

    <!-- 车架 -->
    <g stroke="#e0463c" stroke-width="8" stroke-linecap="round" fill="none">
      <line x1="180" y1="280" x2="290" y2="280"/>
      <line x1="290" y1="280" x2="370" y2="195"/>
      <line x1="370" y1="195" x2="255" y2="195"/>
      <line x1="290" y1="280" x2="255" y2="195"/>
      <line x1="255" y1="195" x2="180" y2="280"/>
      <line x1="370" y1="195" x2="400" y2="280"/>
      <path d="M370 195 L380 170 L394 166" stroke="#333" stroke-width="6"/>
    </g>
    <path d="M236 186 Q255 176 274 186 L270 192 L240 192 Z" fill="#333"/>

    <!-- 曲柄与脚踏（旋转） -->
    <g>
      <circle cx="290" cy="280" r="6" fill="#444"/>
      <line x1="290" y1="280" x2="290" y2="258" stroke="#555" stroke-width="5"/>
      <line x1="290" y1="280" x2="290" y2="302" stroke="#555" stroke-width="5"/>
      <rect x="276" y="254" width="28" height="6" rx="3" fill="#333"/>
      <rect x="276" y="300" width="28" height="6" rx="3" fill="#333"/>
      <animateTransform attributeName="transform" type="rotate" values="0 290 280;360 290 280" dur="0.6s" repeatCount="indefinite"/>
    </g>

    <!-- 鹈鹕（骑手） -->
    <g>
      <!-- 腿 -->
      <line x1="262" y1="172" x2="286" y2="256" stroke="#f08a1c" stroke-width="7" stroke-linecap="round">
        <animate attributeName="x2" values="286;300;286" dur="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="270" y1="172" x2="292" y2="300" stroke="#f08a1c" stroke-width="7" stroke-linecap="round" opacity="0.6"/>

      <!-- 尾巴 -->
      <path d="M212 146 L180 124 L190 150 L178 166 L214 160 Z" fill="#c9ccd1"/>

      <!-- 身体 -->
      <ellipse cx="265" cy="150" rx="62" ry="32" fill="#f4f6f8" stroke="#b8bec6" stroke-width="2" transform="rotate(-12 265 150)"/>

      <!-- 翅膀 -->
      <path d="M220 140 Q240 78 300 118 Q282 150 225 160 Z" fill="#d6dbe1" stroke="#9aa3ad" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" values="-10 260 140;14 260 140;-10 260 140" dur="0.6s" repeatCount="indefinite"/>
      </path>

      <!-- 脖子 -->
      <line x1="308" y1="140" x2="334" y2="104" stroke="#f4f6f8" stroke-width="22" stroke-linecap="round"/>
      <line x1="308" y1="140" x2="334" y2="104" stroke="#b8bec6" stroke-width="1" opacity="0"/>

      <!-- 头 -->
      <circle cx="338" cy="96" r="24" fill="#f4f6f8" stroke="#b8bec6" stroke-width="2"/>

      <!-- 喙 -->
      <path d="M352 88 Q396 92 428 110 Q398 116 352 112 Z" fill="#ffb13b" stroke="#e08a12" stroke-width="2"/>
      <!-- 喙下的袋 -->
      <path d="M352 112 Q392 116 380 142 Q368 134 352 130 Z" fill="#ff8c2b" stroke="#e08a12" stroke-width="2"/>

      <!-- 眼睛 -->
      <circle cx="346" cy="90" r="5" fill="#222"/>
      <circle cx="347.5" cy="88.5" r="1.6" fill="#fff"/>

      <!-- 头盔（小红帽） -->
      <path d="M318 78 Q338 52 358 76 Z" fill="#e0463c"/>

      <!-- 手臂 连到把手 -->
      <line x1="300" y1="134" x2="384" y2="170" stroke="#f08a1c" stroke-width="6" stroke-linecap="round"/>
    </g>

    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="0.3s" repeatCount="indefinite" additive="sum"/>
  </g>
</svg>
</div>
<script data-tabbit-widget-diagnostics="true">
(function(){
  if (window.__tabbitWidgetDiagnosticsInstalled) return;
  window.__tabbitWidgetDiagnosticsInstalled = true;
  window.__TABBIT_WIDGET_ERRORS__ = window.__TABBIT_WIDGET_ERRORS__ || [];
  function emit(level, args) {
    var payload = {
      type: "tabbit_widget_diagnostics",
      level: level,
      message: Array.prototype.slice.call(args || []).map(function(item) {
        if (item && item.stack) return item.stack;
        if (typeof item === "string") return item;
        try { return JSON.stringify(item); } catch (_) { return String(item); }
      }).join(" "),
      timestamp: Date.now()
    };
    window.__TABBIT_WIDGET_ERRORS__.push(payload);
    try { window.parent && window.parent.postMessage(payload, "*"); } catch (_) {}
  }
  var originalError = console.error;
  console.error = function() {
    emit("error", arguments);
    return originalError && originalError.apply(console, arguments);
  };
  window.addEventListener("error", function(event) {
    emit("error", [event.message || "Script error", event.filename || "", event.lineno || ""]);
  });
  window.addEventListener("unhandledrejection", function(event) {
    emit("unhandledrejection", [event.reason || "Unhandled promise rejection"]);
  });
})();
</script>
</body>
</html>
