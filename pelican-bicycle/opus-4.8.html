<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelican on a Bicycle</title>
<style>
  :root {
    --sky-top: #eaf4ff;
    --sky-bottom: #fdf6ec;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #fafafa;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  header {
    text-align: center;
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  header p {
    margin-top: 4px;
    font-size: 13px;
    color: #666;
  }
  .stage {
    width: min(92vw, 880px);
    aspect-ratio: 16 / 9;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 40px rgba(0,0,0,.10);
    border: 1px solid rgba(0,0,0,.06);
    background: #fff;
  }
  svg { display: block; width: 100%; height: 100%; }
  footer { font-size: 12px; color: #999; }
</style>
</head>
<body>
  <header>
    <h1>Pelican on a Bicycle</h1>
    <p>Animated SVG &middot; claude-opus-4-8</p>
  </header>

  <div class="stage">
    <svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A pelican riding a bicycle through a sunny landscape">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#eaf4ff"/>
          <stop offset="1" stop-color="#fdf6ec"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#dddddd"/>
          <stop offset="1" stop-color="#c7c7c7"/>
        </linearGradient>
        <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#ffe8a3"/>
          <stop offset="0.7" stop-color="#ffd45e"/>
          <stop offset="1" stop-color="#ffd45e" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="1" stop-color="#eef1f5"/>
        </linearGradient>
        <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffb347"/>
          <stop offset="1" stop-color="#ff8c1a"/>
        </linearGradient>
      </defs>

      <!-- Sky -->
      <rect width="800" height="450" fill="url(#sky)"/>

      <!-- Sun -->
      <circle cx="120" cy="100" r="90" fill="url(#sun)"/>
      <circle cx="120" cy="100" r="42" fill="#ffd45e"/>

      <!-- Clouds (drifting) -->
      <g fill="#ffffff" opacity="0.9">
        <g>
          <animateTransform attributeName="transform" type="translate" from="900 0" to="-250 0" dur="22s" repeatCount="indefinite"/>
          <ellipse cx="0" cy="90" rx="46" ry="22"/>
          <ellipse cx="38" cy="78" rx="34" ry="24"/>
          <ellipse cx="-34" cy="80" rx="30" ry="20"/>
        </g>
        <g opacity="0.75">
          <animateTransform attributeName="transform" type="translate" from="1100 0" to="-250 0" dur="30s" repeatCount="indefinite"/>
          <ellipse cx="0" cy="150" rx="40" ry="18"/>
          <ellipse cx="30" cy="140" rx="28" ry="20"/>
          <ellipse cx="-28" cy="142" rx="24" ry="16"/>
        </g>
      </g>

      <!-- Rolling hills -->
      <path d="M0,330 Q200,280 400,320 T800,310 L800,450 L0,450 Z" fill="#cfe8c2"/>
      <path d="M0,360 Q250,320 500,355 T800,350 L800,450 L0,450 Z" fill="#b6dca3"/>

      <!-- Scrolling background trees -->
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-200 0" dur="4s" repeatCount="indefinite"/>
        <g transform="translate(0,0)">
          <rect x="60" y="310" width="8" height="40" fill="#9c6b3f"/>
          <circle cx="64" cy="300" r="22" fill="#8fcf72"/>
          <rect x="260" y="315" width="7" height="35" fill="#9c6b3f"/>
          <circle cx="263" cy="306" r="18" fill="#7cc563"/>
        </g>
        <g transform="translate(400,0)">
          <rect x="60" y="310" width="8" height="40" fill="#9c6b3f"/>
          <circle cx="64" cy="300" r="22" fill="#8fcf72"/>
          <rect x="260" y="315" width="7" height="35" fill="#9c6b3f"/>
          <circle cx="263" cy="306" r="18" fill="#7cc563"/>
        </g>
      </g>

      <!-- Road -->
      <rect x="0" y="375" width="800" height="75" fill="url(#road)"/>
      <!-- Dashed road markings (scrolling) -->
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="0.6s" repeatCount="indefinite"/>
        <g fill="#ffffff" opacity="0.85">
          <rect x="0" y="408" width="60" height="7" rx="3"/>
          <rect x="120" y="408" width="60" height="7" rx="3"/>
          <rect x="240" y="408" width="60" height="7" rx="3"/>
          <rect x="360" y="408" width="60" height="7" rx="3"/>
          <rect x="480" y="408" width="60" height="7" rx="3"/>
          <rect x="600" y="408" width="60" height="7" rx="3"/>
          <rect x="720" y="408" width="60" height="7" rx="3"/>
          <rect x="840" y="408" width="60" height="7" rx="3"/>
        </g>
      </g>

      <!-- ============ PELICAN + BICYCLE ============ -->
      <!-- Whole rig gets a gentle bob -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="400 0; 400 -5; 400 0" dur="0.6s" repeatCount="indefinite" additive="sum"/>
        <g transform="translate(-400,0)">

        <!-- Bicycle -->
        <g stroke="#222" stroke-width="5" fill="none" stroke-linecap="round">
          <!-- Rear wheel -->
          <g transform="translate(330,350)">
            <circle r="46" stroke="#333" stroke-width="6" fill="#f4f4f4"/>
            <circle r="46" stroke="#222" stroke-width="3" fill="none"/>
            <g stroke="#9a9a9a" stroke-width="2">
              <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
              <line x1="-46" y1="0" x2="46" y2="0"/>
              <line x1="0" y1="-46" x2="0" y2="46"/>
              <line x1="-33" y1="-33" x2="33" y2="33"/>
              <line x1="-33" y1="33" x2="33" y2="-33"/>
            </g>
            <circle r="6" fill="#444" stroke="none"/>
          </g>
          <!-- Front wheel -->
          <g transform="translate(490,350)">
            <circle r="46" stroke="#333" stroke-width="6" fill="#f4f4f4"/>
            <circle r="46" stroke="#222" stroke-width="3" fill="none"/>
            <g stroke="#9a9a9a" stroke-width="2">
              <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
              <line x1="-46" y1="0" x2="46" y2="0"/>
              <line x1="0" y1="-46" x2="0" y2="46"/>
              <line x1="-33" y1="-33" x2="33" y2="33"/>
              <line x1="-33" y1="33" x2="33" y2="-33"/>
            </g>
            <circle r="6" fill="#444" stroke="none"/>
          </g>

          <!-- Frame -->
          <!-- rear wheel hub (330,350) -> bottom bracket (410,350) -->
          <line x1="330" y1="350" x2="410" y2="350"/>
          <!-- bottom bracket -> seat tube top (378,286) -->
          <line x1="410" y1="350" x2="378" y2="286"/>
          <!-- rear hub -> seat tube top -->
          <line x1="330" y1="350" x2="378" y2="286"/>
          <!-- top tube: seat top -> head tube top (470,286) -->
          <line x1="378" y1="286" x2="470" y2="286"/>
          <!-- down tube: bottom bracket -> head tube top -->
          <line x1="410" y1="350" x2="470" y2="286"/>
          <!-- head tube/fork -> front wheel -->
          <line x1="470" y1="286" x2="490" y2="350"/>
          <!-- seat post + saddle -->
          <line x1="378" y1="286" x2="372" y2="268"/>
          <line x1="356" y1="266" x2="392" y2="268" stroke-width="7" stroke="#333"/>
          <!-- handlebar stem + bars -->
          <line x1="470" y1="286" x2="474" y2="262"/>
          <line x1="458" y1="258" x2="492" y2="266" stroke-width="6" stroke="#333"/>
        </g>

        <!-- Pedals + cranks (rotating around bottom bracket 410,350) -->
        <g transform="translate(410,350)">
          <circle r="10" fill="#444" stroke="#222" stroke-width="2"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
            <!-- crank arm 1 -->
            <line x1="0" y1="0" x2="0" y2="26" stroke="#222" stroke-width="5" stroke-linecap="round"/>
            <rect x="-9" y="24" width="18" height="7" rx="3" fill="#333">
              <!-- counter-rotate pedal to stay level -->
              <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="0.6s" repeatCount="indefinite"/>
            </rect>
            <!-- crank arm 2 -->
            <line x1="0" y1="0" x2="0" y2="-26" stroke="#222" stroke-width="5" stroke-linecap="round"/>
            <rect x="-9" y="-31" width="18" height="7" rx="3" fill="#333">
              <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="0.6s" repeatCount="indefinite"/>
            </rect>
          </g>
        </g>

        <!-- ===== Pelican ===== -->
        <!-- Right leg (far) pedaling: thigh fixed at hip (378,250), foot follows pedal path -->
        <g stroke="#ff8c1a" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.85">
          <polyline points="378,250 400,300 410,376">
            <animate attributeName="points"
              values="378,250 400,300 410,376;
                      378,250 420,296 436,350;
                      378,250 408,302 410,324;
                      378,250 392,300 384,350;
                      378,250 400,300 410,376"
              dur="0.6s" repeatCount="indefinite"/>
          </polyline>
        </g>

        <!-- Pelican body -->
        <g>
          <!-- Tail -->
          <path d="M300,250 Q278,246 268,262 Q288,266 304,262 Z" fill="#dfe4ea" stroke="#cfd6de" stroke-width="1"/>
          <!-- Body/belly -->
          <path d="M300,252
                   Q312,210 356,206
                   Q408,202 430,232
                   Q446,254 430,276
                   Q400,300 352,300
                   Q312,298 300,276 Z"
                fill="url(#body)" stroke="#d6dbe2" stroke-width="2"/>

          <!-- Wing (flapping slightly) -->
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-4 360 240; 2 360 240; -4 360 240" dur="0.6s" repeatCount="indefinite"/>
            <path d="M352,236
                     Q392,224 418,244
                     Q396,266 360,264
                     Q344,256 352,236 Z"
                  fill="#e7ebf0" stroke="#cfd6de" stroke-width="2"/>
            <path d="M360,250 Q384,246 404,252" stroke="#c3cad3" stroke-width="2" fill="none"/>
          </g>

          <!-- Neck + head -->
          <path d="M418,232
                   Q436,196 452,172
                   Q462,158 478,156
                   Q470,176 466,196
                   Q458,222 436,246 Z"
                fill="url(#body)" stroke="#d6dbe2" stroke-width="2"/>
          <!-- Head -->
          <circle cx="482" cy="158" r="26" fill="url(#body)" stroke="#d6dbe2" stroke-width="2"/>

          <!-- Eye -->
          <circle cx="492" cy="152" r="6.5" fill="#fff" stroke="#cfd6de" stroke-width="1"/>
          <circle cx="494" cy="152" r="3.4" fill="#222">
            <animate attributeName="r" values="3.4;3.4;0.6;3.4" keyTimes="0;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
          </circle>

          <!-- Upper beak -->
          <path d="M506,150 Q560,144 584,152 Q560,160 508,162 Z" fill="url(#beak)" stroke="#e07b12" stroke-width="1.5"/>
          <!-- Lower beak / pouch -->
          <path d="M508,162 Q546,176 578,160 Q560,186 520,182 Q508,176 508,162 Z" fill="#ffc46b" stroke="#e07b12" stroke-width="1.5"/>

          <!-- Little crest feathers -->
          <path d="M470,138 Q476,124 486,120 Q482,132 484,140 Z" fill="#e7ebf0" stroke="#cfd6de" stroke-width="1"/>
          <path d="M478,136 Q488,124 500,124 Q490,134 492,142 Z" fill="#e7ebf0" stroke="#cfd6de" stroke-width="1"/>

          <!-- scarf for a little flair, flapping -->
          <path d="M460,186 Q452,196 440,196 Q452,204 462,200 Z" fill="#ff5a5f" stroke="#e04a4f" stroke-width="1">
            <animateTransform attributeName="transform" type="rotate" values="0 460 186; 10 460 186; 0 460 186" dur="0.6s" repeatCount="indefinite"/>
          </path>
          <path d="M300,250 Q286,258 272,256 Q286,266 300,260 Z" fill="#ff5a5f" stroke="#e04a4f" stroke-width="1">
            <animateTransform attributeName="transform" type="rotate" values="0 300 252; -12 300 252; 0 300 252" dur="0.5s" repeatCount="indefinite"/>
          </path>
        </g>

        <!-- Left leg (near) pedaling: opposite phase -->
        <g stroke="#ff9f2e" stroke-width="10" stroke-linecap="round" fill="none">
          <polyline points="378,252 392,300 384,350">
            <animate attributeName="points"
              values="378,252 392,300 384,350;
                      378,252 400,300 410,376;
                      378,252 420,296 436,350;
                      378,252 408,302 410,324;
                      378,252 392,300 384,350"
              dur="0.6s" repeatCount="indefinite"/>
          </polyline>
          <!-- webbed foot hint at the pedal -->
        </g>

        <!-- Wing/arm reaching to handlebar -->
        <g>
          <path d="M430,250 Q458,250 478,262" stroke="#e7ebf0" stroke-width="11" fill="none" stroke-linecap="round"/>
          <path d="M430,250 Q458,250 478,262" stroke="#cfd6de" stroke-width="2" fill="none"/>
        </g>

        </g>
      </g>

      <!-- Motion speed lines -->
      <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.0">
        <line x1="60" y1="150" x2="140" y2="150">
          <animate attributeName="opacity" values="0;0.7;0" dur="0.5s" repeatCount="indefinite"/>
          <animate attributeName="x1" values="140;40" dur="0.5s" repeatCount="indefinite"/>
          <animate attributeName="x2" values="220;120" dur="0.5s" repeatCount="indefinite"/>
        </line>
        <line x1="80" y1="200" x2="160" y2="200">
          <animate attributeName="opacity" values="0;0.6;0" dur="0.5s" begin="0.15s" repeatCount="indefinite"/>
          <animate attributeName="x1" values="160;60" dur="0.5s" begin="0.15s" repeatCount="indefinite"/>
          <animate attributeName="x2" values="240;140" dur="0.5s" begin="0.15s" repeatCount="indefinite"/>
        </line>
      </g>
    </svg>
  </div>

  <footer>Pure SVG + SMIL animation — no scripts. Open in any modern browser.</footer>

</body>
</html>
