<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG + 逆运动学动画</title>
<style>
  :root{
    --bg:#0e1116; --card:#151a22; --ink:#e6edf3; --dim:#8b98a5;
    --accent:#f2a516; --line:#232b36;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:radial-gradient(1200px 600px at 70% -10%, #1b2431, var(--bg));
    color:var(--ink); font:14px/1.5 ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    display:flex; flex-direction:column; align-items:center; padding:28px 16px 40px;
  }
  h1{font-size:16px; letter-spacing:.5px; margin:0 0 4px; font-weight:600}
  h1 span{color:var(--accent)}
  .sub{color:var(--dim); font-size:12px; margin-bottom:16px}
  .frame{
    width:min(960px,100%); background:var(--card); border:1px solid var(--line);
    border-radius:14px; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  svg{display:block; width:100%; height:auto; background:#cfe8f3}
  .bar{
    display:flex; flex-wrap:wrap; gap:14px; align-items:center;
    padding:12px 16px; border-top:1px solid var(--line); background:#111620;
  }
  .bar label{display:flex; gap:8px; align-items:center; color:var(--dim); font-size:12px}
  input[type=range]{width:130px; accent-color:var(--accent)}
  input[type=checkbox]{accent-color:var(--accent)}
  button{
    background:#1d2532; color:var(--ink); border:1px solid #2c3a4c; border-radius:8px;
    padding:6px 14px; font:inherit; font-size:12px; cursor:pointer;
  }
  button:hover{border-color:var(--accent); color:var(--accent)}
  .hud{display:flex; gap:18px; margin-left:auto; font-size:12px; color:var(--dim)}
  .hud b{color:var(--ink); font-weight:600}
  kbd{background:#1d2532; border:1px solid #2c3a4c; border-radius:4px; padding:0 5px; font-size:11px}
</style>
</head>
<body>
  <h1>pelican_on_bicycle <span>.html</span></h1>
  <div class="sub">单文件 · 零外部依赖 · SVG 骨架 + 曲柄驱动的双腿 2-bone IK · 蹬踏/链条/视差全部由同一相位推导</div>

  <div class="frame">
    <!-- ===================== 场景 ===================== -->
    <svg id="scene" viewBox="0 0 800 500" role="img" aria-label="一只鹈鹕骑着自行车在公路上前进">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8ecff0"/>
          <stop offset="0.62" stop-color="#cfe8f3"/>
          <stop offset="1" stop-color="#eaf3e9"/>
        </linearGradient>
        <radialGradient id="sunGlow">
          <stop offset="0" stop-color="#ffe89a" stop-opacity=".95"/>
          <stop offset="1" stop-color="#ffe89a" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f6b53f"/>
          <stop offset="1" stop-color="#e8843c"/>
        </linearGradient>
        <!-- 可平铺的山丘（首尾 y 相同，保证无缝循环） -->
        <path id="hill" d="M0 402 L0 352 Q60 318 130 344 Q190 366 250 330 Q320 288 400 336
                           Q455 368 520 330 Q590 290 660 340 Q720 368 800 352 L800 402 Z"/>
        <path id="grass" d="M0 402 L0 386 Q80 372 160 386 Q240 400 320 382 Q420 362 500 386
                            Q580 404 660 384 Q740 366 800 386 L800 402 Z"/>
        <g id="cloud">
          <ellipse cx="0" cy="0" rx="34" ry="17" fill="#fff" opacity=".92"/>
          <ellipse cx="26" cy="-8" rx="24" ry="15" fill="#fff" opacity=".92"/>
          <ellipse cx="-24" cy="-4" rx="20" ry="13" fill="#fff" opacity=".92"/>
        </g>
      </defs>

      <!-- ---------- 背景层 ---------- -->
      <rect width="800" height="500" fill="url(#sky)"/>
      <circle cx="688" cy="96" r="70" fill="url(#sunGlow)"/>
      <circle cx="688" cy="96" r="30" fill="#ffd75e"/>

      <g id="hills" fill="#93bf8e">

      <!-- ---------- 路面 ---------- -->
      <rect x="0" y="402" width="800" height="98" fill="#5c616a"/>
      <rect x="0" y="402" width="800" height="4" fill="#6d737d"/>

            stroke-dasharray="48 34" stroke-linecap="round"/>

      <!-- ---------- 风速线 ---------- -->
      <g id="wind" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0">
        <line x1="640" y1="180" x2="720" y2="180"/>
        <line x1="600" y1="212" x2="690" y2="212"/>
        <line x1="660" y1="300" x2="740" y2="300"/>
        <line x1="120" y1="150" x2="200" y2="150"/>
        <line x1="90"  y1="330" x2="170" y2="330"/>
      </g>

      <!-- ================= 自行车 + 鹈鹕 ================= -->
      <!-- 远侧曲柄 + 踏板 + 腿（在整车之后，暗色） -->
      <g id="crankFar"><line x1="378" y1="362" x2="404" y2="362" stroke="#3a4450" stroke-width="6" stroke-linecap="round"/></g>
      <g id="pedalFar"><rect x="-11" y="-3" width="22" height="6" rx="1.5" fill="#2a3138"/></g>
      <g id="legFar">
        <path id="thighFar" stroke="#c8802f" stroke-width="15" stroke-linecap="round" fill="none"/>
        <path id="shinFar"  stroke="#c8802f" stroke-width="10" stroke-linecap="round" fill="none"/>
        <g id="footFar" fill="#c8802f">
          <path d="M-4 -3 h20 q6 1 6 5 t-6 4 h-20 z"/>
          <path d="M2 6 l10 0 4 5 -14 0 z"/>
        </g>
      </g>

      <!-- 后轮 -->
      <g id="wheelR">
        <circle cx="272" cy="344" r="58" fill="none" stroke="#20242a" stroke-width="8"/>
        <circle cx="272" cy="344" r="50" fill="none" stroke="#cdd5db" stroke-width="3"/>
        <g id="spokesR" stroke="#aeb8c0" stroke-width="1.6"></g>
        <circle cx="272" cy="344" r="6" fill="#8b939b"/>
        <circle cx="272" cy="298" r="3.2" fill="#f2a516"/>
      </g>
      <!-- 前轮 -->
      <g id="wheelF">
        <circle cx="476" cy="344" r="58" fill="none" stroke="#20242a" stroke-width="8"/>
        <circle cx="476" cy="344" r="50" fill="none" stroke="#cdd5db" stroke-width="3"/>
        <g id="spokesF" stroke="#aeb8c0" stroke-width="1.6"></g>
        <circle cx="476" cy="344" r="6" fill="#8b939b"/>
        <circle cx="476" cy="298" r="3.2" fill="#f2a516"/>
      </g>

      <!-- 车架 -->
      <g id="frame" stroke="#1f7a8c" stroke-width="7" stroke-linecap="round" fill="none">
        <line x1="378" y1="362" x2="352" y2="262"/>  <!-- 立管 -->
        <line x1="352" y1="266" x2="446" y2="272"/>  <!-- 上管 -->
        <line x1="378" y1="362" x2="450" y2="284"/>  <!-- 下管 -->
        <line x1="352" y1="268" x2="272" y2="344"/>  <!-- 后上叉 -->
        <line x1="378" y1="362" x2="272" y2="344"/>  <!-- 后下叉 -->
        <line x1="444" y1="258" x2="456" y2="296"/>  <!-- 头管 -->
        <path d="M456 292 Q476 312 476 344"/>        <!-- 前叉 -->
      </g>
      <circle cx="378" cy="362" r="10" fill="#2b3540"/>
      <!-- 车座 -->
      <path d="M318 258 Q350 244 380 256 Q350 270 318 262 Z" fill="#2b3540"/>
      <!-- 车把 -->
      <path d="M444 258 L446 238 Q454 230 470 235 Q478 240 476 250"
            fill="none" stroke="#2b3540" stroke-width="5" stroke-linecap="round"/>

      <!-- 传动：链条 + 牙盘 + 飞轮 -->
      <path id="chain" fill="none" stroke="#40484f" stroke-width="4.5"
            stroke-dasharray="7 5"
            d="M273.8 333.2 L382 338.3 A24 24 0 0 1 374.1 385.7 L270.1 354.9 A11 11 0 0 1 273.8 333.2 Z"/>
      <circle id="cog" cx="272" cy="344" r="11" fill="none" stroke="#9aa4ad" stroke-width="4"
              stroke-dasharray="2.6 5.1"/>
      <g id="ringG">
        <circle cx="378" cy="362" r="24" fill="none" stroke="#b9c2c9" stroke-width="4.5"
                stroke-dasharray="3 4.5"/>
        <circle cx="378" cy="362" r="16" fill="none" stroke="#8f9aa3" stroke-width="2"/>
        <g id="spider" stroke="#8f9aa3" stroke-width="3">
          <line x1="378" y1="362" x2="378" y2="342"/>
          <line x1="378" y1="362" x2="395" y2="372"/>
          <line x1="378" y1="362" x2="361" y2="372"/>
        </g>
      </g>

      <!-- ================= 鹈鹕 ================= -->
      <g id="riderShift" transform="translate(10 8)">
      <g id="rider">
        <path id="tail" d="M292 236 C244 226 228 236 214 252 C240 260 270 254 292 248 Z" fill="#eef1ec"/>
        <g id="wingFar" fill="none" stroke="#d9dedd" stroke-width="13" stroke-linecap="round">
          <path d="M358 214 C396 216 432 226 464 240"/>
        </g>
        <ellipse cx="326" cy="222" rx="62" ry="46" fill="#f7f8f4" transform="rotate(-14 326 222)"/>
        <ellipse cx="322" cy="226" rx="52" ry="34" fill="#eaf0ee" transform="rotate(-14 322 226)" opacity=".8"/>
        <g id="wingNear">
          <path d="M358 206 C322 194 286 206 264 232 C300 244 342 236 364 220 Z" fill="#b7c1c7"/>
          <g stroke="#98a5ad" stroke-width="2" fill="none" stroke-linecap="round">
            <path d="M282 230 q14 -10 34 -14"/>
            <path d="M276 222 q18 -10 40 -14"/>
            <path d="M288 236 q14 -8 30 -10"/>
          </g>
        </g>
        <path id="neck" d="M352 202 C366 168 396 148 428 152" fill="none" stroke="#f7f8f4"
              stroke-width="21" stroke-linecap="round"/>
        <g id="headGroup">
          <ellipse cx="436" cy="152" rx="23" ry="20" fill="#f7f8f4"/>
          <path d="M418 134 q-10 -10 0 -16 q6 8 12 10" fill="#f7f8f4"/>
          <path d="M424 130 q-6 -12 4 -16 q6 10 8 14" fill="#eef1ec"/>
          <!-- 上喙 -->
          <path d="M450 140 Q502 142 556 166 Q548 174 500 168 Q466 162 450 154 Z" fill="#f2a516"/>
          <!-- 喉囊（会随相位鼓动） -->
          <path id="pouchPath" d="M452 154 Q470 198 512 180 Q538 172 552 167 Q502 172 458 162 Z"
                fill="url(#pouch)"/>
          <!-- 眼 -->
          <circle cx="446" cy="148" r="5.2" fill="#fff"/>
          <circle cx="447" cy="148" r="3.2" fill="#1a1d21"/>
          <circle cx="448.2" cy="146.6" r="1" fill="#fff"/>
          <rect id="lid" x="440" y="128" width="13" height="12" fill="#f7f8f4"/>
        </g>
      </g>
      </g>

      <!-- 近侧曲柄 + 踏板 + 腿（最前层） -->
      <g id="crankNear">
        <line x1="378" y1="362" x2="404" y2="362" stroke="#20242a" stroke-width="7" stroke-linecap="round"/>
      </g>
      <g id="pedalNear"><rect x="-11" y="-3" width="22" height="6" rx="1.5" fill="#1b1f24"/></g>
      <g id="legNear">
        <path id="thighNear" stroke="#f2a63f" stroke-width="16" stroke-linecap="round" fill="none"/>
        <path id="shinNear"  stroke="#f2a63f" stroke-width="11" stroke-linecap="round" fill="none"/>
        <g id="footNear" fill="#f2a63f">
          <path d="M-4 -3 h20 q6 1 6 5 t-6 4 h-20 z"/>
          <path d="M2 6 l10 0 4 5 -14 0 z"/>
        </g>
      </g>
      <ellipse id="hipTuft" cx="362" cy="246" rx="21" ry="15" fill="#eef1ec" transform="rotate(-14 362 246)"/>

      <!-- ---------- IK 调试层 ---------- -->
      <g id="debug" opacity="0" font-family="ui-monospace,monospace" font-size="11">
        <line id="dbgLine" stroke="#ff4d6d" stroke-width="1.5" stroke-dasharray="4 4"/>
        <circle id="dbgHip" r="4" fill="#ff4d6d"/>
        <circle id="dbgKnee" r="4" fill="#ffd60a"/>
        <circle id="dbgAnkle" r="4" fill="#4cc9f0"/>
        <text id="dbgTxt" fill="#ff4d6d"></text>
      </g>
    </svg>

    <!-- ===================== 控制条 ===================== -->
    <div class="bar">
      <button id="btn">⏸ 暂停</button>
      <button id="reset">↺ 归零</button>
      <label>踏频 <input id="speed" type="range" min="0.2" max="2.5" step="0.05" value="1"></label>
      <label><input id="dbg" type="checkbox"> IK 骨架</label>
      <label><input id="parallax" type="checkbox" checked> 背景视差</label>
      <div class="hud">
        <span>踏频 <b id="hCad">—</b> rpm</span>
        <span>时速 <b id="hKmh">—</b> km/h</span>
        <span>里程 <b id="hKm">0.00</b> km</span>
      </div>
    </div>
  </div>

  <div class="sub" style="margin-top:12px">
    快捷键 <kbd>空格</kbd> 播放/暂停 · <kbd>R</kbd> 归零 · <kbd>D</kbd> 调试骨架 &nbsp;|&nbsp;
    齿轮比 = 牙盘24T / 飞轮11T ≈ 2.18，轮速与链条位移由曲柄相位严格推导
  </div>

<script>
(() => {
  'use strict';

  /* ============================================================
     几何常量（与 SVG 中的坐标一一对应）
     曲柄绕 BB 转 -> 踏板位置解析求出 -> 髋关节固定，用两圆相交解膝盖
     ============================================================ */
  const BB   = { x: 378, y: 362 };   // 五通（曲柄旋转中心）
  const CRANK = 26;                  // 曲柄长 px
  const HIP  = { x: 362, y: 250 };   // 鹈鹕髋关节（riderShift 已含静态偏移，这里是世界坐标）
  const L1 = 75, L2 = 70;            // 大腿 / 小腿：下死点接近伸直(≈141°)，上死点≈76° 折叠
  const R_WHEEL = 58, R_RING = 24;
  const GEAR = 24 / 11;              // 齿轮比
  const M_PER_PX = 2.1 / (2 * Math.PI * R_WHEEL); // 700c 轮周长 2.1m 的像素换算
  const OMEGA0 = 2 * Math.PI * 0.9;  // speed=1 时曲柄角速度 (rad/s) ≈ 54 rpm

  const svg = document.getElementById('scene');
  const $ = id => document.getElementById(id);
  const set = (el, k, v) => el.setAttribute(k, v);

  /* ---------- 生成辐条 / 路面碎屑 / 云 ---------- */
  function spokes(g, cx, cy, n) {
    let s = '';
    for (let i = 0; i < n; i++) {
      const a = i * 2 * Math.PI / n;
      s += `<line x1="${cx}" y1="${cy}" x2="${(cx + 49 * Math.cos(a)).toFixed(1)}" y2="${(cy + 49 * Math.sin(a)).toFixed(1)}"/>`;
    }
    g.innerHTML = s;
  }
  spokes($('spokesR'), 272, 344, 16);
  spokes($('spokesF'), 476, 344, 16);

  $('grit').innerHTML = (() => {
    const s = Array.from({ length: 26 }, (_, i) => {
      const x = i * 30 + (i % 3) * 6, y = 414 + (i * 37) % 78;
      return `<line x1="${x}" y1="${y}" x2="${x + 9}" y2="${y}"/>`;
    }).join('');
    return `<g>${s}</g><g transform="translate(800 0)">${s}</g>`;   // 双份实现无缝平铺
  })();

  const clouds = [
    { el: null, x: 120, y: 82,  s: 1.00, k: 0.05 },
    { el: null, x: 380, y: 132, s: 0.72, k: 0.07 },
    { el: null, x: 620, y: 64,  s: 1.22, k: 0.035 },
  ];
  $('clouds').innerHTML = clouds.map((c, i) =>
    `<g id="cloud${i}"><use href="#cloud" transform="scale(${c.s})"/></g>`).join('');
  clouds.forEach((c, i) => { c.el = $('cloud' + i); c.base = c.x; });

  /* ---------- 状态 ---------- */
  let phase = 0, dist = 0, last = performance.now();
  let playing = true, speed = 1, parallax = true, showDbg = false;
  let blinkAt = 2.5, t = 0;

  /* ---------- 两圆相交求膝盖：取 x 更大的解（膝盖朝前，符合骑行姿态） ---------- */
  function knee(H, F) {
    let dx = F.x - H.x, dy = F.y - H.y, d = Math.hypot(dx, dy);
    const maxR = L1 + L2 - 0.5, minR = Math.abs(L1 - L2) + 0.5;
    if (d > maxR) { d = maxR; }                      // 超限则沿方向夹紧，避免 sqrt 负数
    if (d < minR) { d = minR; }
    const ux = dx / d, uy = dy / d;
    const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    const px = H.x + a * ux, py = H.y + a * uy;
    const c1 = { x: px - h * uy, y: py + h * ux };   // 垂直方向两个解
    const c2 = { x: px + h * uy, y: py - h * ux };
    return (c1.x > c2.x ? c1 : c2);
  }

  function drawLeg(parts, H, F) {
    const K = knee(H, F);
    set(parts.thigh, 'd', `M${H.x.toFixed(1)} ${H.y.toFixed(1)} L${K.x.toFixed(1)} ${K.y.toFixed(1)}`);
    set(parts.shin,  'd', `M${K.x.toFixed(1)} ${K.y.toFixed(1)} L${F.x.toFixed(1)} ${F.y.toFixed(1)}`);
    // 踏板保持水平，蹼足随小腿倾角小幅转动，并落在踏板上方
    const ang = Math.max(-26, Math.min(26, (Math.atan2(F.y - K.y, F.x - K.x) * 180 / Math.PI + 90) * 0.35));
    parts.foot.setAttribute('transform',
      `translate(${F.x.toFixed(1)} ${(F.y - 4).toFixed(1)}) rotate(${ang.toFixed(1)})`);
    return K;
  }

  const LEGS = {
    near: { thigh: $('thighNear'), shin: $('shinNear'), foot: $('footNear') },
    far:  { thigh: $('thighFar'),  shin: $('shinFar'),  foot: $('footFar')  },
  };

  /* ---------- 每帧更新 ---------- */
  function update() {
    const bob = -2.6 * Math.cos(2 * phase);                 // 蹬踏带来的身体起伏
    const wheelDeg = (phase * GEAR * 180 / Math.PI);
    set($('wheelR'), 'transform', `rotate(${wheelDeg.toFixed(2)} 272 344)`);
    set($('wheelF'), 'transform', `rotate(${wheelDeg.toFixed(2)} 476 344)`);
    set($('ringG'),  'transform', `rotate(${(phase * 180 / Math.PI).toFixed(2)} 378 362)`);
    set($('cog'),    'transform', `rotate(${wheelDeg.toFixed(2)} 272 344)`);
    // 链条线速度 = 曲柄角速度 × 牙盘半径
    $('chain').style.strokeDashoffset = (-(phase * R_RING) % 1000).toFixed(1);

    // 曲柄 & 踏板（近侧 phase，远侧 +π）
    const P1 = { x: BB.x + CRANK * Math.cos(phase), y: BB.y + CRANK * Math.sin(phase) };
    const P2 = { x: BB.x - CRANK * Math.cos(phase), y: BB.y - CRANK * Math.sin(phase) };
    const cdeg = (phase * 180 / Math.PI).toFixed(2);
    set($('crankNear'), 'transform', `rotate(${cdeg} 378 362)`);
    set($('crankFar'),  'transform', `rotate(${(+cdeg + 180).toFixed(2)} 378 362)`);
    $('pedalNear').setAttribute('transform', `translate(${P1.x.toFixed(1)} ${P1.y.toFixed(1)})`);
    $('pedalFar').setAttribute('transform', `translate(${P2.x.toFixed(1)} ${P2.y.toFixed(1)})`);

    const H = { x: HIP.x, y: HIP.y + bob };
    const K1 = drawLeg(LEGS.near, H, P1);
    drawLeg(LEGS.far, H, P2);

    $('rider').setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
    $('headGroup').setAttribute('transform', `translate(0 ${(bob * 0.45).toFixed(2)})`);
    $('hipTuft').setAttribute('transform', `translate(0 ${bob.toFixed(2)}) rotate(-14 362 246)`);

    // 翅膀轻扇 + 喉囊鼓动
    $('wingNear').setAttribute('transform',
      `rotate(${(4.5 * Math.sin(phase * 0.5)).toFixed(2)} 358 206)`);
    $('wingFar').setAttribute('transform',
      `rotate(${(-3 * Math.sin(phase * 0.5 + 1)).toFixed(2)} 358 214)`);
    const ps = 1 + 0.06 * Math.sin(phase * 2);
    $('pouchPath').setAttribute('transform', `translate(0 ${((1 - ps) * 158).toFixed(2)}) scale(1 ${ps.toFixed(3)})`);

    // 眨眼
    const lidY = (t > blinkAt && t < blinkAt + 0.14) ? 132 : 128;
    set($('lid'), 'y', lidY);
    if (t > blinkAt) blinkAt = t + 2.2 + Math.random() * 3.2;

    // 背景视差（远慢近快）
    if (parallax) {
      set($('hills'),  'transform', `translate(${(-(dist * 0.10) % 800).toFixed(1)} 0)`);
      set($('hills2'), 'transform', `translate(${(-(dist * 0.17) % 800).toFixed(1)} 0)`);
      set($('grasslayer'), 'transform', `translate(${(-(dist * 0.42) % 800).toFixed(1)} 0)`);
      $('dashes').style.strokeDashoffset = (-dist % 82).toFixed(1);
      set($('grit'), 'transform', `translate(${(-(dist * 0.85) % 800).toFixed(1)} 0)`);
      clouds.forEach(c => {
        let x = (c.base - dist * c.k) % 900; if (x < -80) x += 900;
        c.el.setAttribute('transform', `translate(${x.toFixed(1)} ${c.y}) scale(${c.s})`);
      });
    }
    $('wind').style.opacity = Math.max(0, Math.min(0.5, (speed - 1.1) * 0.4)).toFixed(2);

    // HUD
    const cad = OMEGA0 * speed * 60 / (2 * Math.PI);
    const kmh = cad / 60 * GEAR * 2.1 * 3.6;
    $('hCad').textContent = cad.toFixed(0);
    $('hKmh').textContent = kmh.toFixed(1);
    $('hKm').textContent = (dist * M_PER_PX / 1000).toFixed(2);

    if (showDbg) {
      set($('dbgHip'), 'cx', H.x); set($('dbgHip'), 'cy', H.y);
      set($('dbgKnee'), 'cx', K1.x.toFixed(1)); set($('dbgKnee'), 'cy', K1.y.toFixed(1));
      set($('dbgAnkle'), 'cx', P1.x.toFixed(1)); set($('dbgAnkle'), 'cy', P1.y.toFixed(1));
      set($('dbgLine'), 'x1', H.x); set($('dbgLine'), 'y1', H.y);
      set($('dbgLine'), 'x2', P1.x.toFixed(1)); set($('dbgLine'), 'y2', P1.y.toFixed(1));
      $('dbgTxt').textContent = `L1=${L1} L2=${L2}  d=${Math.hypot(P1.x - H.x, P1.y - H.y).toFixed(0)}`;
      set($('dbgTxt'), 'x', H.x + 12); set($('dbgTxt'), 'y', H.y - 10);
    }
  }

  /* ---------- 主循环 ---------- */
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (playing) {
      t += dt;
      phase += OMEGA0 * speed * dt;
      dist += OMEGA0 * speed * GEAR * R_WHEEL * dt;   // 纯滚动：线速度 = ω_轮 × R
    }
    update();
    requestAnimationFrame(frame);
  }

  /* ---------- 控件 ---------- */
  const btn = $('btn');
  function toggle() {
    playing = !playing;
    btn.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  }
  btn.onclick = toggle;
  $('reset').onclick = () => { phase = 0; dist = 0; t = 0; update(); };
  $('speed').oninput = e => speed = parseFloat(e.target.value);
  $('dbg').onchange = e => { showDbg = e.target.checked; $('debug').style.opacity = showDbg ? 1 : 0; update(); };
  $('parallax').onchange = e => parallax = e.target.checked;
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.key === 'r' || e.key === 'R') $('reset').click();
    if (e.key === 'd' || e.key === 'D') { $('dbg').checked = !$('dbg').checked; $('dbg').dispatchEvent(new Event('change')); }
  });
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { playing = false; btn.textContent = '▶ 播放'; }

  update();
  requestAnimationFrame(frame);
})();
</script>
