<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑车 · Agent Test</title>
<style>
  :root{
    --bg:#0b1020; --panel:#141b32; --panel2:#1b2444;
    --text:#e8ecf7; --muted:#9aa6c7; --accent:#5b8cff; --accent2:#7cf0d2;
    --border:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%,#1a2550 0%,transparent 55%),
               radial-gradient(1000px 500px at 100% 0%,#143040 0%,transparent 50%),
               var(--bg);
    color:var(--text);min-height:100vh;line-height:1.6;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:48px 24px 80px}
  .back{display:inline-block;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:28px}
  .back:hover{color:var(--accent)}
  .eyebrow{color:var(--accent2);font-size:14px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
  h1{font-size:clamp(30px,5vw,46px);font-weight:800;margin:10px 0 14px}
  .sub{color:var(--muted);font-size:16px;max-width:640px;margin-bottom:40px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
  .card{
    display:block;text-decoration:none;color:inherit;
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--border);border-radius:18px;padding:26px;
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .card:hover{transform:translateY(-4px);border-color:rgba(91,140,255,.5);box-shadow:0 18px 40px -20px rgba(91,140,255,.6)}
  .vendor{font-size:13px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
  .card h3{font-size:22px;margin:8px 0 6px;font-weight:700}
  .card p{color:var(--muted);font-size:14.5px}
  .meta{margin-top:18px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--accent)}
  .pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;
        background:rgba(124,240,210,.14);color:var(--accent2);border:1px solid rgba(124,240,210,.25)}
  footer{margin-top:56px;color:var(--muted);font-size:13px;border-top:1px solid var(--border);padding-top:22px}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← 返回首页</a>
  <div class="eyebrow">栏目 · Category</div>
  <h1>🦩🚲 鹈鹕骑车</h1>
  <p class="sub">经典的大模型创意基准：让模型实现「一只骑自行车的鹈鹕」。下面按模型版本归档，点击卡片查看各自的在线效果。</p>

  <div class="grid">
    <a class="card" href="gemini-3.8-flash.html">
      <div class="vendor">Google · Gemini</div>
      <h3>Gemini 3.8 Flash</h3>
      <p>海岸鹈鹕飞车之旅 · Coastal Pelican Cruiser。玻璃拟态 UI + 交互动画实现。</p>
      <div class="meta"><span class="pill">在线效果</span><span>打开 →</span></div>
    </a>
  </div>

  <footer>
    托管于 GitHub Pages · <a href="https://github.com/zhoushimiaov/agent-test">源码仓库</a>
  </footer>
</div>
</body>
</html>
