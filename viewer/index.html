<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>模型作品 · Agent Test</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#fff;overflow:hidden}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;display:block}
.viewer-back{position:fixed;top:16px;left:16px;z-index:2147483647;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;
  font:500 13px/1.1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;color:#111;
  background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid rgba(0,0,0,.08);border-radius:999px;text-decoration:none;box-shadow:0 2px 12px rgba(0,0,0,.2);
  transition:background .2s ease,transform .2s ease,box-shadow .2s ease}
.viewer-back:hover{background:#fff;transform:translateY(-1px);box-shadow:0 4px 18px rgba(0,0,0,.26)}
.viewer-back[hidden]{display:none}
.viewer-error{position:fixed;inset:0;margin:0;display:flex;align-items:center;justify-content:center;
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;color:#666}
</style>
</head>
<body>
<iframe id="frame" title="模型作品预览" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
<a class="viewer-back" id="back" href="../" hidden>← 返回栏目</a>
<script>
"use strict";
const q = new URLSearchParams(location.search);
const category = q.get("category") || "";
const model = q.get("model") || "";
const valid = (s) => /^[a-z0-9](?:[a-z0-9.-]{0,79})$/.test(s) && !s.includes("..");
const categories = new Set([
  "pelican-bicycle", "jellyfish-float", "penguin-ski-jump", "whale-over-city",
  "elephant-tightrope", "octopus-drummer", "rhino-orbit", "lion-fire-hoop",
]);
const frame = document.getElementById("frame");
const back = document.getElementById("back");
if (!categories.has(category) || !valid(model)) {
  frame.remove();
  const message = document.createElement("p");
  message.className = "viewer-error";
  message.textContent = "无效的作品地址。";
  document.body.appendChild(message);
} else {
  back.href = "../" + category + "/";
  back.hidden = false;
  document.title = category + " / " + model + " · Agent Test";
  frame.src = "../" + category + "/" + model + ".html?embed=1";
}
</script>
</body>
</html>
