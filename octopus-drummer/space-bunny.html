function envNoise(t, dur, type, freq, q, vol, sweepTo){
  const src = AC.createBufferSource(); src.buffer = NOISE; src.loop = true;
  const f = AC.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(freq,t); f.Q.value=q||1;

  src.connect(f); f.connect(g); g.connect(MASTER);

}

function fire(e, t){
  if(e.kind==='bass'){ if(AC&&AC.state==='running') SND.bass(e.f, e.dur, e.vel); return; }
  const a = e.arm;
  a.hitT = t - S.loopOffset;
  const jitter = (a.drum==='kick') ? 0 : (Math.random()-0.5)*10;
  a.tgt = { x: a.at.x + jitter*(a.drum==='rim'?1.4:1), y: a.at.y + Math.abs(jitter)*0.2 };
  const d = e.arm.drum;
  if(AC && AC.state==='running'){    if(d==='kick')  SND.kick(e.vel);
    if(d==='snare') SND.snare(e.vel);
    if(d==='rim')   SND.rim(e.vel);
    if(d==='hat')   SND.hat(e.vel, (Math.round((e.t/S16)%8)===7));
    if(d==='tom1')  SND.tom(300, e.vel);
    if(d==='tom2')  SND.tom(196, e.vel);
    if(d==='crash') SND.crash(e.vel);
  }
  if(e.kind==='bass'){ if(AC&&AC.state==='running') SND.bass(e.f, e.dur, e.vel); }
  impact(d, e.vel, t);
}

function grad(x0,y0,x1,y1,stops){
  const g=ctx.createLinearGradient(x0,y0,x1,y1);
  stops.forEach(s=>g.addColorStop(s[0],s[1]));
  return g;
}
function rg(x,y,r0,r1,stops){
  const g=ctx.createRadialGradient(x,y,r0,x,y,r1);
  stops.forEach(s=>g.addColorStop(s[0],s[1]));
  return g;
}
function blobPath(cx,cy,rx,ry,t,wob,seed){
  const N=52, pts=[];
  for(let i=0;i<N;i++){
    const a=i/N*TAU;
    const k = 1 + wob*Math.sin(a*3+t*1.6+seed) + wob*0.55*Math.sin(a*5-t*2.2+seed*1.7);
    pts.push({x:cx+Math.cos(a)*rx*k, y:cy+Math.sin(a)*ry*k});
  }
  ctx.beginPath();
  ctx.moveTo((pts[0].x+pts[N-1].x)/2,(pts[0].y+pts[N-1].y)/2);
  for(let i=0;i<N;i++){
    const p0=pts[(i-1+N)%N],p1=pts[i],p2=pts[(i+1)%N],p3=pts[(i+2)%N];
    ctx.bezierCurveTo(p1.x+(p2.x-p0.x)/6, p1.y+(p2.y-p0.y)/6,
                      p2.x-(p3.x-p1.x)/6, p2.y-(p3.y-p1.y)/6, p2.x, p2.y);
  }
  ctx.closePath();
}
function ellipse(x,y,rx,ry,rot){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot||0,0,TAU); }
function cubicPt(a,b,c,d,t){ const u=1-t;
  return {x:u*u*u*a.x+3*u*u*t*b.x+3*u*t*t*c.x+t*t*t*d.x,
          y:u*u*u*a.y+3*u*u*t*b.y+3*u*t*t*c.y+t*t*t*d.y}; }
function cubicD(a,b,c,d,t){ const u=1-t;
  return {x:3*u*u*(b.x-a.x)+6*u*t*(c.x-b.x)+3*t*t*(d.x-c.x),
          y:3*u*u*(b.y-a.y)+6*u*t*(c.y-b.y)+3*t*t*(d.y-c.y)}; }
function glow(x,y,r,col,a){
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=a;
  ctx.fillStyle = rg(x,y,0,r,[[0,`rgba(${col},1)`],[0.45,`rgba(${col},0.35)`],[1,`rgba(${col},0)`]]);
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); ctx.restore();
}
function chrome(x0,y0,x1,y1,w){
  ctx.strokeStyle = grad(x0,y0,x1,y1,[[0,C.metalD],[0.35,C.metal],[0.6,'#f2f6ff'],[1,C.metalD]]);
  ctx.lineWidth=w; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
}
function tripod(x, topY, spread, baseY, w){
  chrome(x,topY, x-spread, baseY, w);
  chrome(x,topY, x+spread, baseY, w);
  chrome(x,topY, x+spread*0.15, baseY+6, w);
}

function drumShell(x,y,rx,ry,h,tilt,vib,flash,headCol){
  ctx.save(); ctx.translate(x,y); ctx.rotate(tilt||0);
  // 鼓身
  ctx.beginPath();
  ctx.moveTo(-rx,0);
  ctx.lineTo(-rx*0.98,h);
  ctx.ellipse(0,h,rx*0.98,rx*0.30,0,Math.PI,0,true);
  ctx.lineTo(rx,0);
  ctx.closePath();
  ctx.fillStyle = grad(0,0,0,h,[[0,C.wood0],[0.45,C.wood1],[1,C.wood2]]);
  ctx.fill();
  ctx.strokeStyle='rgba(90,52,18,0.55)'; ctx.lineWidth=2; ctx.stroke();
  // 鼓腔阴影
  ctx.globalAlpha=0.22; ctx.fillStyle='#3a1d08';
  ctx.beginPath(); ctx.ellipse(-rx*0.62,h*0.5,rx*0.26,h*0.42,0,0,TAU); ctx.fill();
  ctx.globalAlpha=1;
  // 鼓耳
  const lugs=8;
  for(let i=0;i<lugs;i++){
    const a=Math.PI*(0.08+0.84*i/(lugs-1));
    const lx=Math.cos(a)*rx*0.99, ly=Math.sin(a)*h*0.6 + h*0.12;
    ctx.fillStyle='#d9dfea'; ctx.beginPath(); ctx.roundRect(lx-4,ly-9,8,18,3); ctx.fill();
    ctx.strokeStyle='rgba(60,70,86,.6)'; ctx.lineWidth=1; ctx.stroke();
  }
  // 鼓皮
  const sq = 1 - vib*0.12;
  ctx.save();
  ellipse(0,0,rx*1.02,ry*1.5,0);
  ctx.fillStyle='#b9bec9'; ctx.fill();
  ellipse(0,0,rx,ry,0);
  ctx.fillStyle = grad(0,-ry,0,ry,[[0,'#fffdf6'],[1,headCol||C.headD]]);
  ctx.fill();
  if(flash>0){ ctx.globalAlpha=flash*0.55; ctx.fillStyle='#fff'; ctx.fill(); ctx.globalAlpha=1; }
  // 鼓皮涟漪
  if(vib>0){
    for(let k=0;k<3;k++){
      const rr = ((vib*3.2 - k*0.33)%1+1)%1;
      ctx.globalAlpha = vib*0.5*(1-rr);
      ctx.strokeStyle='#ffffff'; ctx.lineWidth=2;
      ellipse(0,0,rx*rr*0.92,ry*rr*0.92,0); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();
  ctx.restore();
}

function cymbal(x,y,rx,ry,tilt,wob,t){

  ctx.save(); ctx.rotate(a); ctx.scale(1, ry/rx*1.5);
  ctx.beginPath(); ctx.arc(0,0,rx,0,TAU);
  ctx.fillStyle = rg(-rx*0.25,-rx*0.3,rx*0.06,rx*1.05,
    [[0,C.gold0],[0.35,C.gold1],[0.78,'#c08f24'],[1,C.gold2]]);
  ctx.fill();
  // 同心车纹
  for(let i=1;i<=8;i++){
    ctx.strokeStyle = `rgba(255,244,200,${0.20 - i*0.017})`;

}

//============================ 13. 腕 ======================================
function solveArm(a, S0, tip){
  let dx=tip.x-S0.x, dy=tip.y-S0.y;
  let d=Math.hypot(dx,dy);
  const minD=Math.abs(a.L1-a.L2)+2, maxD=(a.L1+a.L2)*0.995;
  d=clamp(d,minD,maxD);
  const ang=Math.atan2(dy,dx);
  const al=Math.acos(clamp((a.L1*a.L1+d*d-a.L2*a.L2)/(2*a.L1*d),-1,1));
  const sign = (a.local.x<0) ? 1 : -1;
  const b = ang + sign*al;
  return { x:S0.x+Math.cos(b)*a.L1, y:S0.y+Math.sin(b)*a.L1 };
}

function drawTentacle(a, S0, tip, alpha){
  const E = solveArm(a, S0, tip);
  const P0=S0, P1=E, P2={x:tip.x+(tip.x-E.x)*0.5, y:tip.y+(tip.y-E.y)*0.5}, P3=tip;
  const N=26, L=[], Rr=[], Ctr=[];
  for(let i=0;i<=N;i++){
    const t=i/N;
    const p=cubicPt(P0,P1,P2,P3,t), d=cubicD(P0,P1,P2,P3,t);
    let nx=-d.y, ny=d.x; const len=Math.hypot(nx,ny)||1; nx/=len; ny/=len;
    const w=lerp(a.w0,a.w1,Math.pow(t,0.72));
    L.push({x:p.x+nx*w,y:p.y+ny*w});
    Rr.push({x:p.x-nx*w,y:p.y-ny*w});
    Ctr.push({p,n:{x:nx,y:ny},w,t});
  }
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.moveTo(L[0].x,L[0].y);
  for(let i=1;i<=N;i++) ctx.lineTo(L[i].x,L[i].y);
  for(let i=N;i>=0;i--) ctx.lineTo(Rr[i].x,Rr[i].y);
  ctx.closePath();
  ctx.fillStyle = grad(S0.x,S0.y,tip.x,tip.y,[[0,C.skin2],[0.45,C.skin1],[1,C.skin0]]);
  ctx.fill();
  ctx.strokeStyle='rgba(140,26,62,.42)'; ctx.lineWidth=1.4; ctx.stroke();
  // 吸盘
  for(let i=3;i<N-1;i+=2){
    const c=Ctr[i];
    const sx=c.p.x-c.n.x*c.w*0.42, sy=c.p.y-c.n.y*c.w*0.42;
    const rr=c.w*0.24;
    ctx.beginPath(); ctx.ellipse(sx,sy,rr,rr*0.82,0,0,TAU);
    ctx.fillStyle=`rgba(255,227,234,${0.9-i/N*0.35})`; ctx.fill();
    ctx.strokeStyle='rgba(190,80,110,.35)'; ctx.lineWidth=1; ctx.stroke();
  }
  // 高光
  ctx.beginPath();
  for(let i=1;i<=N;i++){ const c=Ctr[i];
    ctx.lineTo(c.p.x-c.n.x*c.w*0.35, c.p.y-c.n.y*c.w*0.35); }
  ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=2.2; ctx.stroke();
  ctx.restore();
  return E;
}

function stickDir(a, tip, S0){
  let dx=a.tgt.x-tip.x, dy=a.tgt.y-tip.y;
  if(Math.hypot(dx,dy) < 12){ dx=a.tgt.x-S0.x; dy=a.tgt.y-S0.y; }
  const l=Math.hypot(dx,dy)||1; return {x:dx/l,y:dy/l};
}

function drawStick(a, S0, tip){
  const d = stickDir(a, tip, S0);
  const LEN = a.kind==='foot'?0:78;
  const gx = tip.x - d.x*LEN, gy = tip.y - d.y*LEN;
  // 鼓棒
  ctx.save();
  ctx.lineCap='round';
  ctx.strokeStyle = grad(gx,gy,tip.x,tip.y,[[0,'#b9832f'],[0.5,'#f0d39a'],[1,'#fff3d0']]);
  ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(tip.x,tip.y); ctx.stroke();
  ctx.strokeStyle='rgba(120,80,20,.35)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(gx-2,gy-2); ctx.lineTo(tip.x-1.5,tip.y-2); ctx.stroke();
  // 棒头
  ctx.beginPath(); ctx.arc(tip.x,tip.y,6.2,0,TAU);
  ctx.fillStyle = rg(tip.x-2,tip.y-2,0.5,7,[[0,'#ffffff'],[0.5,'#ffe9b8'],[1,'#c79a4a']]);
  ctx.fill();
  ctx.strokeStyle='rgba(120,80,20,.5)'; ctx.lineWidth=1; ctx.stroke();
  // 手（握持处）
  ctx.beginPath(); ctx.arc(gx,gy,a.w1*0.92,0,TAU);
  ctx.fillStyle = rg(gx-4,gy-5,1,a.w1*1.1,[[0,C.skin0],[1,C.skin2]]); ctx.fill();
  ctx.strokeStyle='rgba(150,40,72,.4)'; ctx.lineWidth=1.2; ctx.stroke();
  ctx.restore();
  return {gx,gy};
}

function drawFoot(a, tip){
  const d=a.dir, ang=Math.atan2(d.y,d.x)-Math.PI/2;

      ctx.moveTo(sx,sy-16);
      ctx.quadraticCurveTo(sx+13,sy+6,sx,sy+13);
      ctx.quadraticCurveTo(sx-13,sy+6,sx,sy-16);
      ctx.fillStyle='#bfe6ff'; ctx.fill();
      ctx.strokeStyle='rgba(90,160,210,.6)'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.restore();
    } else if(dt2>=1.4) S.sweat=-1;
  }
}

//============================ 15. 背景 =====================================
function drawBackground(T){
  // 天空/场馆
  ctx.fillStyle = grad(0,0,0,H,[[0,C.bg0],[0.45,C.bg1],[0.78,'#1a0f2b'],[1,'#0a0714']]);
  ctx.fillRect(0,0,W,H);

  // LED 墙
  const bw = W/LED.length;
  for(let i=0;i<LED.length;i++){
    const x=i*bw;
    const e = 0.16 + 0.30*S.kickEnv + 0.16*S.snareEnv + 0.12*S.hatEnv + 0.10*Math.abs(Math.sin(T*2.1+i*0.7))*0.6;
    LED[i].v = lerp(LED[i].v, clamp(e*(0.55+0.65*Math.abs(Math.sin(i*1.31+LED[i].seed))),0,1), 0.22);
    const h = 24 + LED[i].v*170;
    const c = lerp(60,255, LED[i].v);
    ctx.fillStyle = `rgba(${Math.round(c*0.45)},${Math.round(c*0.25)},${Math.round(c)},0.30)`;
    ctx.fillRect(x+2, 600-h, bw-4, h);
    ctx.fillStyle = `rgba(${Math.round(c)},${Math.round(c*0.6)},${Math.round(c)},0.55)`;
    ctx.fillRect(x+2, 600-h, bw-4, 3);
  }
  // 背光圆
  const pul = 0.5+0.5*Math.sin(T*(TAU/SPB)*0.5);
  glow(W/2, 250, 520, '150,90,220', 0.16+0.10*S.kickEnv+0.05*pul);

  // 灯光柱
  const beams=[[300,0.32,-0.28],[800,0.22,0.05],[1320,0.32,0.30]];
  ctx.save(); ctx.globalCompositeOperation='lighter';
  beams.forEach(([bx,inten,rot],i)=>{
    const sw = Math.sin(T*0.55+i*1.7)*0.13;
    ctx.save();
    ctx.translate(bx,-60); ctx.rotate(rot+sw);
    const g = ctx.createLinearGradient(0,0,0,900);
    g.addColorStop(0,`rgba(${i===1?'255,215,170':'180,205,255'},${0.20*inten*(0.7+0.5*S.kickEnv)})`);
    g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.moveTo(-26,0); ctx.lineTo(26,0); ctx.lineTo(250,900); ctx.lineTo(-250,900);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  });
  ctx.restore();

  // 空气气泡
  BUBBLES.forEach(b=>{
    if(b.front) return;
    const y = ((b.y - T*b.sp) % (H+120) + H+120) % (H+120) - 60;
    const x = b.x + Math.sin(T*0.9+b.ph)*16;
    ctx.beginPath(); ctx.arc(x,y,b.r,0,TAU);
    ctx.strokeStyle='rgba(180,220,255,.20)'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.fillStyle='rgba(200,230,255,.07)'; ctx.fill();
    ctx.beginPath(); ctx.arc(x-b.r*0.32,y-b.r*0.34,b.r*0.24,0,TAU);
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fill();
  });

  // 地面
  ctx.fillStyle = grad(0,FLOOR,0,H,[[0,'#1a1226'],[0.3,'#120c1c'],[1,'#07050c']]);
  ctx.fillRect(0,FLOOR,W,H-FLOOR);
  ctx.strokeStyle='rgba(255,220,180,.10)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,FLOOR); ctx.lineTo(W,FLOOR); ctx.stroke();
  // 地面光池
  glow(KICK.x,FLOOR+6,320,'255,170,110',0.13+0.10*S.kickEnv);
  glow(HAT.x, FLOOR+4,180,'120,200,255',0.08+0.06*S.hatEnv);
  glow(CRASH.x,FLOOR+4,200,'255,215,150',0.08+0.08*S.crashEnv);
  // 地砖
  ctx.strokeStyle='rgba(255,255,255,.035)'; ctx.lineWidth=1;
  for(let i=0;i<14;i++){
    const y=FLOOR+14+i*i*1.9;
    if(y>H) break;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
}

//============================ 16. FX =======================================
function drawFX(dt, T){
  // 地面阴影
  ctx.save();
  ctx.globalAlpha=0.35; ctx.fillStyle='#000';
  ellipse(BODYC.x+30, FLOOR+16, 190, 24, 0); ctx.fill();
  ellipse(KICK.x, FLOOR+10, 118, 17, 0); ctx.fill();
  ctx.restore();

  // 光环
  for(let i=S.rings.length-1;i>=0;i--){
    const r=S.rings[i];
    r.life+=dt;
    const p=r.life/r.ttl;
    if(p>=1||!(p>=0)){ S.rings.splice(i,1); continue; }
    const rr=lerp(r.r,r.rm,easeOutCubic(p));
    ctx.save();
    ctx.globalAlpha=(1-p)*0.7*r.v;
    ctx.strokeStyle=`rgba(${r.c},1)`; ctx.lineWidth=(1-p)*6+1;
    ctx.beginPath();
    if(r.flat) ctx.ellipse(r.x,r.y,rr,rr*0.22,0,0,TAU);
    else ctx.arc(r.x,r.y,rr,0,TAU);
    ctx.stroke(); ctx.restore();
  }
  // 粒子
  for(let i=S.sparks.length-1;i>=0;i--){
    const s=S.sparks[i];
    s.life+=dt;
    const p=s.life/s.ttl;
    if(p>=1||!(p>=0)){ S.sparks.splice(i,1); continue; }
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=(s.ray?60:900)*dt;
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=(1-p)*(s.soft?0.35:0.9);
    ctx.fillStyle=`rgba(${s.col},1)`;
    if(s.ray){
      ctx.strokeStyle=`rgba(${s.col},1)`; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(s.x,s.y);
      ctx.lineTo(s.x-s.vx*0.035, s.y-s.vy*0.035); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(s.x,s.y,s.size*(1-p*0.5),0,TAU); ctx.fill();
    }
    ctx.restore();
  }
  // 音符
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=S.notes.length-1;i>=0;i--){
    const n=S.notes[i];
    n.life+=dt;
    const p=n.life/n.ttl;
    if(p>=1||!(p>=0)){ S.notes.splice(i,1); continue; }
    n.y+=n.vy*dt; n.x+=Math.sin(n.life*3+n.ph)*30*dt;
    ctx.globalAlpha=(1-p*p)*0.9;
    ctx.font=`700 ${n.s}px "Segoe UI Symbol","Segoe UI",serif`;
    ctx.fillStyle=`rgba(${n.col},1)`;
    ctx.fillText(n.glyph, n.x, n.y);
  }
  ctx.restore();

  // 前景气泡
  BUBBLES.forEach(b=>{
    if(!b.front) return;
    const y = ((b.y - T*b.sp*1.4) % (H+120) + H+120) % (H+120) - 60;
    const x = b.x + Math.sin(T*1.1+b.ph)*22;
    ctx.beginPath(); ctx.arc(x,y,b.r*1.3,0,TAU);
    ctx.strokeStyle='rgba(200,230,255,.28)'; ctx.lineWidth=1.4; ctx.stroke();
    ctx.beginPath(); ctx.arc(x-b.r*0.3,y-b.r*0.35,b.r*0.3,0,TAU);
    ctx.fillStyle='rgba(255,255,255,.45)'; ctx.fill();
  });

  // 暗角
  ctx.save();
  ctx.fillStyle = rg(W/2,H/2, H*0.45, H*1.15,
    [[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,0.72)']]);
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}

//============================ 17. 主循环 ==================================
let prev = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-prev)/1000);
  prev = now;
  let T = loopT();

  // ---- 音序器（切后台回来时直接跳到当前拍，不补触发）
  if(T < S.lastSong - 0.2){
    S.loopOffset += LOOP; T = loopT();
    S.cursor = 0;
    while(S.cursor<EVENTS.length && EVENTS[S.cursor].t<=T) S.cursor++;
  }
  S.lastSong = T;
  let fired=0;
  while(S.cursor<EVENTS.length && EVENTS[S.cursor].t<=T){
    const e=EVENTS[S.cursor];
    if(fired<14) fire(e, T);
    else if(e.kind==='drum') e.arm.hitT = e.t;
    S.cursor++; fired++;
  }
  if(S.cursor>=EVENTS.length){ S.cursor=0; S.loopOffset+=LOOP; }

  // ---- 能量衰减
  const dec=(v,k)=>v*Math.exp(-k*dt);
  S.kickEnv  = dec(S.kickEnv, 7.5);
  S.snareEnv = dec(S.snareEnv, 9);
  S.hatEnv   = dec(S.hatEnv, 13);
  S.crashEnv = dec(S.crashEnv, 2.2);
  S.tomEnv   = dec(S.tomEnv, 8);
  S.rimHit   = dec(S.rimHit, 14);
  S.shake    = dec(S.shake, 6.5);

  // ---- 表情
  S.mouthT = Math.max(0, S.mouthT - dt*1.6);
  const fill = T > LOOP-S16*6 || (T>BAR*6 && T<BAR*7);
  const targetMouth = Math.max(S.mouthT, fill?0.55:0, clamp(S.crashEnv*0.9,0,0.85));
  S.mouth = lerp(S.mouth, targetMouth, 1-Math.exp(-14*dt));
  S.brow  = lerp(S.brow, 0, 1-Math.exp(-3.2*dt));
  S.nextBlink -= dt;
  if(S.nextBlink<=0){ S.blink = 1; S.nextBlink = 2.2+R()*3.4; }
  if(S.blink>0) S.blink = Math.max(0, S.blink - dt*7);
  S.eye.x = lerp(S.eye.x, S.eye.tx, 1-Math.exp(-9*dt));
  S.eye.y = lerp(S.eye.y, S.eye.ty, 1-Math.exp(-9*dt));

  // ---- 身体律动
  const beatPhase = (T/SPB)%1;
  const bob = Math.sin(T*(TAU/SPB)*0.5)*5 - S.kickEnv*9;
  const sway= Math.sin(T*(TAU/SPB)*0.25)*3;
  S.body.x = BODYC.x + sway*0.6;
  S.body.y = BODYC.y + bob;
  S.body.sx = 1 + S.kickEnv*0.055 + beatPhase*0.012;
  S.body.sy = 1 - S.kickEnv*0.06;
  S.body.rot = Math.sin(T*1.1)*0.018 - S.kickEnv*0.03;

  // ---- 相机
  const zoom = 1.045 + 0.028*Math.sin(T*(TAU/LOOP)) + S.kickEnv*0.012 + (fill?0.02:0);
  const sh = S.shake;
  const ox = Math.sin(now*0.06)*sh*0.9 + Math.sin(now*0.031)*2.2;
  const oy = Math.cos(now*0.077)*sh*0.7 + Math.sin(now*0.023)*1.6;

  ctx.save();
  ctx.translate(W/2+ox, H/2+oy);
  ctx.scale(zoom,zoom);
  ctx.translate(-W/2,-H/2);

  // ---- 绘制
  drawBackground(T);

  // 身体后方腕（腿 + 吊镲）
  ARMS.filter(a=>a.layer===0).forEach(a=>updateArm(a,T));
  ARMS.filter(a=>a.layer===0).forEach(drawArmFor);

  drawOctopus(T);

  // 鼓组
  drawKit(T);
  drawPedals();

  // 身体前方腕
  ARMS.filter(a=>a.layer===1).forEach(a=>updateArm(a,T));
  ARMS.filter(a=>a.layer===1).forEach(drawArmFor);

  // 打击闪光
  ARMS.forEach(a=>{
    const dtH = T - a.hitT;
    if(dtH>=0 && dtH<0.09 && a.kind==='stick'){
      ctx.save(); ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=(1-dtH/0.09)*0.5;
      ctx.fillStyle=rg(a.tgt.x,a.tgt.y,0,42,[[0,'rgba(255,245,225,.9)'],[1,'rgba(255,220,180,0)']]);
      ctx.beginPath(); ctx.arc(a.tgt.x,a.tgt.y,42,0,TAU); ctx.fill();
      ctx.restore();
    }
  });

  drawFX(dt, T);
  ctx.restore();
  requestAnimationFrame(frame);
}

// 腕的运动求解
const _sh = {x:0,y:0};
function armTip(a, T){
  const u = (T - a.hitT)/a.dur;          // 0 = 命中时刻
  const rest = a.rest;
  // 待击（提前上抬 / 蓄力）
  if(u < 0){
    const preEnd = -a.pre/a.dur;
    if(u < preEnd) return {...rest, rest:true};
    const p = clamp((u-preEnd)/(0-preEnd),0,1);
    const k = easeOutCubic(p);
    return { x: lerp(rest.x, rest.x+(rest.x-a.at.x)*0.42, k),
             y: lerp(rest.y, rest.y+(rest.y-a.at.y)*0.42, k) };
  }
  if(u>=1) return rest;
  if(u < 0.30){
    const p = u/0.30;
    return { x: lerp(rest.x, a.tgt.x, smooth(p)),
             y: lerp(rest.y, a.tgt.y, smooth(p)) };
  }
  const p=(u-0.30)/0.70;
  const k=easeOutCubic(p);
  const nx = rest.x - a.tgt.x, ny = rest.y - a.tgt.y;
  const nl = Math.hypot(nx,ny)||1;
  const wob = Math.sin(p*Math.PI*3.2)*(1-p)*0.30;
  return { x: lerp(a.tgt.x,rest.x,k) + nx/nl*nl*wob*0.9,
           y: lerp(a.tgt.y,rest.y,k) + ny/nl*nl*wob*0.9 };
}
function updateArm(a, T){
  const tip = armTip(a, T);
  // 待机轻微律动
  const idle = Math.sin(T*3.1 + a.rest.x*0.01)*2.2;
  a.tip = { x: tip.x + (tip.rest?idle:0), y: tip.y + (tip.rest?Math.abs(idle)*0.5:0) };
  // 肩（随身体变换）
  const b=S.body, c=Math.cos(b.rot), s=Math.sin(b.rot);
  const lx=a.local.x*b.sx, ly=a.local.y*b.sy;
  a.sh = { x: b.x + lx*c - ly*s, y: b.y + lx*s + ly*c };
  a.hand = null;
}
function drawArmFor(a){
  const S0=a.sh, tip=a.tip;
  const back = (a.id==='legL'||a.id==='legR') ? 0.55 : 1;
  drawTentacle(a, S0, tip, back*0.92);
  if(a.kind==='stick') drawStick(a, S0, tip);
  else drawFoot(a, tip);
}

// 启动
requestAnimationFrame(frame);
})();
</script>
